                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (e) => {
                    const data = new Uint8Array(e.target.result);
                    // [수정] cellDates: false로 설정하여 날짜를 숫자(Serial)나 문자열 그대로 읽음 (자동 변환 끔)
                    const workbook = XLSX.read(data, { type: 'array', cellDates: false });
                    const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                    
                    if (confirm(`총 ${json.length}건의 데이터를 읽었습니다.\n\n[업로드 규칙]\n- 날짜와 대상자명이 모두 동일한 경우: 하나의 일지로 자동 병합\n- 그 외의 경우: 개별 일지로 등록\n\n업로드하시겠습니까?`)) {
                        state.isBatching = true; // [일괄작업] 렌더링 중지
                        let logsToSave = []; // 저장할 데이터 미리 준비

                        // [수정] 날짜 포맷팅 헬퍼 함수 (엑셀 숫자 코드 -> YYYY-MM-DD 변환)
                        const formatExcelDate = (val) => {
                            if (!val) return new Date().toISOString().split('T')[0];
                            
                            // 1. 숫자인 경우 (엑셀 날짜 코드) -> 수학적 계산으로 날짜 추출 (가장 정확함)
                            if (typeof val === 'number') {
                                // 엑셀 기준일(1899-12-30)과 JS 기준일(1970-01-01) 차이: 25569일
                                // 하루는 86400초 * 1000밀리초
                                const dateObj = new Date(Math.round((val - 25569) * 86400 * 1000));
                                const y = dateObj.getUTCFullYear();
                                const m = String(dateObj.getUTCMonth() + 1).padStart(2, '0');
                                const d = String(dateObj.getUTCDate()).padStart(2, '0');
                                return `${y}-${m}-${d}`;
                            } 
                            
                            // 2. 문자열인 경우 (2026.09.01, 2026/9/1, 2026-09-01 등)
                            if (typeof val === 'string') {
                                const str = val.trim();
                                // 다양한 구분자(., /, -)와 공백 처리
                                // 정규식으로 숫자만 추출해서 YYYY-MM-DD로 재조립
                                const match = str.match(/^(\d{4})[\.\-/년\s]+(\d{1,2})[\.\-/월\s]+(\d{1,2})/);
                                if (match) {
                                    const y = match[1];
                                    const m = String(match[2]).padStart(2, '0');
                                    const d = String(match[3]).padStart(2, '0');
                                    return `${y}-${m}-${d}`;
                                }
                                // 정규식 매칭 안되면 기본 변환 시도
                                const trimmed = str.replace(/[\.\/]/g, '-');
                                if (/^\d{4}-\d{2}-\d{2}$/.test(trimmed)) return trimmed;
                            }

                            // 3. 그 외 (Date 객체 등) - 안전장치
                            try {
                                const d = new Date(val);
                                const offset = d.getTimezoneOffset() * 60000;
                                const localDate = new Date(d.getTime() - offset);
                                return localDate.toISOString().split('T')[0];
                            } catch (e) {
                                return new Date().toISOString().split('T')[0];
                            }
                        };

                        const groupedLogs = {}; // 날짜_대상자이름을 키로 사용하여 데이터 그룹화

                        // 1. 데이터 그룹화 (병합 로직)
                        for (const row of json) {
                            let date = formatExcelDate(row['날짜']);
                            const clientName = row['대상자'] || row['이름'];
                            if (!clientName) continue; 

                            const key = `${date}_${clientName}`;

                            if (!groupedLogs[key]) {
                                groupedLogs[key] = {
                                    date: date,
                                    clientName: clientName,
                                    provideMethod: row['제공방법'],
                                    provider: row['제공자'],
                                    content: (row['내용'] || row['진행내용']) || '', 
                                    serviceItems: []
                                };

                                const defaultSvcName = '정서지원서비스(안전안부확인)';
                                const excelServiceName = row['서비스명'] || row['서비스 상세내용'] || '';
                                
                                if (excelServiceName !== defaultSvcName) {
                                    groupedLogs[key].serviceItems.push({ 
                                        id: Date.now() + Math.random(),
                                        category: '노인상담 및 정보제공', 
                                        serviceName: defaultSvcName, 
                                        detailNote: '' 
                                    });
                                }
                            } else {
                                const rowContent = row['내용'] || row['진행내용'] || '';
                                if (rowContent && !groupedLogs[key].content.includes(rowContent)) {
                                    groupedLogs[key].content += (groupedLogs[key].content ? '\n' : '') + rowContent;
                                }
                            }

                            const excelServiceName = row['서비스명'] || row['서비스 상세내용'];
                            if (excelServiceName) {
                                groupedLogs[key].serviceItems.push({ 
                                    id: Date.now() + Math.random(),
                                    category: row['서비스분류'] || row['서비스'], 
                                    serviceName: excelServiceName, 
                                    detailNote: (row['메모'] || row['서비스 메모']) || '' 
                                });
                            }
                        }

                        logsToSave = Object.values(groupedLogs);
                        
                        app.showProgress('일지 데이터 업로드 중...', logsToSave.length);
                        
                        let processedCount = 0;
                        let success = 0;

                        // 비동기 루프로 저장 실행
                        (async () => {
                            try {
                                for (const logData of logsToSave) {
                                    const matchedClient = state.clients.find(c => c.name === logData.clientName);
                                    if (matchedClient) {
                                        logData.clientId = matchedClient.id;
                                    }

                                    try {
                                        await addDoc(collection(db, "logs"), {
                                            ...logData,
                                            serviceName: logData.serviceItems.map(i => i.serviceName).join(', '), 
                                            createdAt: new Date().toISOString()
                                        });
                                        success++;
                                    } catch(e) { console.error(e); }
                                    
                                    processedCount++;
                                    app.updateProgress(processedCount);
                                }
                            } finally {
                                state.isBatching = false; // [일괄작업 완료] 렌더링 재개
                                app.hideProgress();
                                setTimeout(() => {
                                    alert(`총 ${success}건의 일지로 정리되어 업로드 완료했습니다.`);
                                    render(); // 최종 1회 렌더링
                                }, 500);
                            }
                        })();
                    }
                    input.value = '';
                };
                reader.readAsArrayBuffer(file);
            },

            // [신규] 대상자 엑셀 업로드 함수 추가 (진행률 표시 포함)
            uploadExcel: (input) => {

                    if (confirm(`총 ${json.length}명의 대상자 데이터를 업로드하시겠습니까?`)) {

                        app.showProgress("대상자 업로드 중...", json.length);

            // [신규] 통계 엑셀 다운로드 기능 구현
            downloadStatsExcel: () => {
                const { start, end, type, region, name } = state.filters.stats;
                const sYear = start.split('-')[0];
                const eYear = end.split('-')[0];
                const fullYearStart = `${sYear}-01-01`;
                const fullYearEnd = `${eYear}-12-31`;

                // 1. 대상자 필터링
                const targetClients = state.clients.filter(c => {
                    const matchBasic = (region.length === 0 || region.includes(c.region)) && (!name || c.name.includes(name));
                    if (!matchBasic) return false;
                    const cS = c.serviceStartDate || '0000-01-01';
                    const cE = c.endDate || '9999-12-31';
                    return cS <= fullYearEnd && cE >= fullYearStart;
                });

                // 2. 헤더 구성
                let serviceHeaders = [];
                if (type === 'category') {
                    serviceHeaders = [...new Set(state.services.map(s => s.category))].filter(Boolean);
                } else {
                    const headerGroups = {};
                    const orderedCategories = [...new Set(state.services.map(s => s.category || '기타'))];
                    state.services.forEach(s => {
                        const cat = s.category || '기타';
                        if (!headerGroups[cat]) headerGroups[cat] = [];
                        if (!headerGroups[cat].includes(s.name)) headerGroups[cat].push(s.name);
                    });
                    serviceHeaders = orderedCategories.flatMap(cat => headerGroups[cat]);
                }

                // 3. 데이터 집계
                const dataMap = {};
                targetClients.forEach(c => {
                    dataMap[c.id] = { 
                        name: c.name, 
                        birthDate: c.birthDate || '-', 
                        careLevel: c.careLevel || '-', 
                        region: (c.region || '-').replace(/동$/, ''), 
                        total: 0, 
                        counts: {} 
                    };
                    serviceHeaders.forEach(k => dataMap[c.id].counts[k] = 0);
                });

                state.logs.forEach(l => {
                    if (l.date < start || l.date > end) return;
                    let cid = l.clientId;
                    if (!dataMap[cid] && l.clientName) { 
                        const found = targetClients.find(c => c.name === l.clientName); 
                        if (found) cid = found.id; 
                    }
                    if (dataMap[cid]) {
                        const items = l.serviceItems || [{ serviceName: l.serviceName, category: l.serviceCategory }];
                        items.forEach(item => {
                            let key = type === 'category' ? item.category : item.serviceName;
                            if (!key && item.serviceName && type === 'category') { 
                                const s = state.services.find(svc => svc.name === item.serviceName); 
                                if(s) key = s.category; 
                            }
                            if (key && dataMap[cid].counts[key] !== undefined) { 
                                dataMap[cid].counts[key]++; 
                                dataMap[cid].total++; 
                            }
                        });
                    }
                });

                // 4. 엑셀 데이터 변환
                const rows = Object.values(dataMap).filter(r => r.total >= 0).sort((a, b) => {
                    const levelPriority = { '중점': 1, '일반': 2 };
                    const pA = levelPriority[a.careLevel] || 3;
                    const pB = levelPriority[b.careLevel] || 3;
                    if (pA !== pB) return pA - pB;
                    return a.name.localeCompare(b.name);
                });

                const sheetData = rows.map((r, idx) => {
                    const row = {
                        'No': idx + 1,
                        '대상자': r.name,
                        '생년월일': r.birthDate,
                        '등급': r.careLevel,
                        '행정동': r.region,
                        '합계': r.total
                    };
                    serviceHeaders.forEach(h => {
                        row[h] = r.counts[h] || 0;
                    });
                    return row;
                });

                if (sheetData.length === 0) {
                    alert("다운로드할 데이터가 없습니다.");
                    return;
                }

                const wb = XLSX.utils.book_new();
                const ws = XLSX.utils.json_to_sheet(sheetData);
                
                // 컬럼 너비 자동 설정
                const colWidths = [{ wch: 5 }, { wch: 10 }, { wch: 12 }, { wch: 8 }, { wch: 8 }, { wch: 8 }];
                serviceHeaders.forEach(h => colWidths.push({ wch: Math.max(h.length * 1.5, 5) }));
                ws['!cols'] = colWidths;

                XLSX.utils.book_append_sheet(wb, ws, "통계");
                XLSX.writeFile(wb, `서비스제공통계(${type === 'category' ? '분류별' : '상세별'})_${start}~${end}.xlsx`);
            },

            // [추가] 대상자 명부 엑셀 다운로드 (HTML에 버튼은 있으나 함수 부재)
            downloadClientListExcel: () => {
                const data = state.clients.map(c => ({
                    '이름': c.name,
                    '생년월일': c.birthDate,
                    '성별': c.gender,
                    '연락처': c.phone,
                    '주소': c.address,
                    '등급': c.careLevel,
                    '경제상황': c.economicStatus,
                    '행정동': c.region,
                    '상태': c.status,
                    '시작일': c.serviceStartDate,
                    '종결일': c.endDate
                }));
                
                if (data.length === 0) return alert("데이터가 없습니다.");
                
                const wb = XLSX.utils.book_new();
                const ws = XLSX.utils.json_to_sheet(data);
                XLSX.utils.book_append_sheet(wb, ws, "대상자명부");
                XLSX.writeFile(wb, `대상자명부_${new Date().toISOString().slice(0,10)}.xlsx`);
            },

            // [추가] 실적 엑셀 다운로드 (HTML에 버튼은 있으나 함수 부재)
            downloadPerformanceExcel: () => {
                const { year, months } = state.filters.performance;
                const selectedMonths = (months && months.length > 0) ? months.sort((a, b) => a - b) : [];
                
                if (selectedMonths.length === 0) return alert("선택된 월이 없습니다.");

                const targetLogs = state.logs.filter(l => l.date.startsWith(year));
                const stats = {};
                
                // 초기화
                state.services.forEach(s => {
                    const key = `${s.category}|${s.name}`;
                    stats[key] = { category: s.category, serviceName: s.name, counts: Array(12).fill(0) };
                });

                // 집계
                targetLogs.forEach(l => {
                    const month = parseInt(l.date.split('-')[1]) - 1;
                    if (month < 0 || month > 11) return;
                    (l.serviceItems || []).forEach(item => {
                        const key = `${item.category}|${item.serviceName}`;
                        if (stats[key]) stats[key].counts[month]++;
                    });
                });

                // 데이터 변환
                const rows = Object.values(stats).sort((a, b) => {
                    if (a.category !== b.category) return a.category.localeCompare(b.category);
                    return a.serviceName.localeCompare(b.serviceName);
                });

                const sheetData = rows.map(r => {
                    const row = {
                        '분류': r.category,
                        '서비스명': r.serviceName
                    };
                    let total = 0;
                    selectedMonths.forEach(m => {
                        const count = r.counts[m - 1];
                        row[`${m}월`] = count;
                        total += count;
                    });
                    row['합계'] = total;
                    return row;
                });

                const wb = XLSX.utils.book_new();
                const ws = XLSX.utils.json_to_sheet(sheetData);
                XLSX.utils.book_append_sheet(wb, ws, "월별실적");
                XLSX.writeFile(wb, `월별서비스실적_${year}년.xlsx`);
            }
        };

        document.addEventListener('click', (e) => {
            const menu = document.getElementById('mobile-menu');
            const btn = document.getElementById('mobile-menu-btn');
            if (state.isMobileMenuOpen && menu && !menu.contains(e.target) && !btn.contains(e.target)) { app.closeMobileMenu(); }
        });

        window.addEventListener('popstate', (event) => {
            const modal = document.getElementById('modal-container');
            const dialog = document.getElementById('dialog-container');
            if (modal && !modal.classList.contains('hidden')) app.closeModal();
            if (dialog && !dialog.classList.contains('hidden')) app.closeDialog();
            const tab = event.state && event.state.tab ? event.state.tab : 'dashboard';
            app.setTab(tab, false); 
        });

        window.addEventListener('load', () => {
            const hash = window.location.hash.replace('#', '');
            const initialTab = (hash && TAB_NAMES[hash]) ? hash : 'dashboard';
            window.history.replaceState({ tab: initialTab }, '', `#${initialTab}`);
            if (initialTab !== 'dashboard') app.setTab(initialTab, false);
        });

        function showModal(html, allowOverlayClose = false, targetId = 'modal-container') { 
            const m = document.getElementById(targetId); 
            m.innerHTML = html; 
            m.classList.remove('hidden'); 
            state.ui.allowOverlayClose = allowOverlayClose;
        }

        function closeModal() { 
            const sub = document.getElementById('sub-modal-container');
            if (sub && !sub.classList.contains('hidden')) {
                sub.classList.add('hidden');
                sub.innerHTML = ''; 
            } else {
                document.getElementById('modal-container').classList.add('hidden'); 
            }
        }
        
        function showDialog(html) { const d = document.getElementById('dialog-container'); d.innerHTML = html; d.classList.remove('hidden'); }
        function closeDialog() { document.getElementById('dialog-container').classList.add('hidden'); }
        
        function renderSvcRow(item) {
            const cats = [...new Set(state.services.map(s => s.category))];
            const div = document.createElement('div');
            div.className = "svc-row flex flex-col sm:flex-row gap-2 mb-2 p-2 border rounded bg-white sm:bg-transparent sm:border-0";
            div.id = `row-${item.id || Date.now()}`;
            div.innerHTML = `
                <select class="cat-sel input-field w-full sm:w-1/4" onchange="app.updateOpts(this)"><option value="">분류</option>${cats.map(c=>`<option value="${c}" ${item.category===c?'selected':''}>${c}</option>`).join('')}</select>
                <select class="svc-sel input-field w-full sm:w-1/3"><option value="${item.serviceName}">${item.serviceName||'선택'}</option></select>
                <div class="flex w-full sm:flex-1 gap-2"><input class="det-inp input-field flex-1" placeholder="메모" value="${item.detailNote||''}"><button type="button" onclick="app.removeSvcRow('${div.id.split('-')[1]}')" class="text-red-400 p-1"><i data-lucide="minus-circle"></i></button></div>
            `;
            document.getElementById('svc-container').appendChild(div);
            if(item.category) { const sel = div.querySelector('.svc-sel'); const svcs = state.services.filter(s => s.category === item.category); sel.innerHTML = svcs.map(s => `<option value="${s.name}" ${s.name===item.serviceName?'selected':''}>${s.name}</option>`).join(''); }
            if(window.lucide) lucide.createIcons();
        }

        function render() {
            const activeEl = document.activeElement;
            const focusedId = activeEl ? activeEl.id : null;
            const cursorStart = activeEl ? activeEl.selectionStart : null;
            const cursorEnd = activeEl ? activeEl.selectionEnd : null;

            if (state.viewMode === 'single') {
                const loader = document.getElementById('initial-loader');
                if (loader) loader.remove();
                updateTabContent(state.activeTab);
                app.updateTabVisibility(); 
                return;
            }
            let main = document.getElementById('main-view-container'); 
            if (!main) return;
            app.renderTabBar(state.activeTab);
            main.className = "fixed inset-0 top-14 bg-slate-100 z-0 overflow-hidden"; 
            main.innerHTML = ""; 

            const createWindow = (paneId) => {
                const winState = state.windows[paneId];
                const tabKey = state.paneTabs[paneId];
                const isActive = state.focusedPane === paneId;
                
                const winDiv = document.createElement('div');
                winDiv.id = `window-${paneId}`;
                winDiv.className = `window-pane ${isActive ? 'active' : ''}`;
                winDiv.style.left = `${winState.x}px`;
                winDiv.style.top = `${winState.y}px`;
                winDiv.style.width = `${winState.w}px`;
                winDiv.style.height = `${winState.h}px`;
                winDiv.style.zIndex = winState.z;
                winDiv.onmousedown = () => app.setFocusedPane(paneId);

                const handles = ['n', 's', 'e', 'w', 'ne', 'nw', 'se', 'sw'].map(dir => 
                    `<div class="resizer resizer-${dir}" onmousedown="app.startResize(event, '${paneId}', '${dir}')"></div>`
                ).join('');

                winDiv.innerHTML = `
                    <div class="window-header" onmousedown="app.startDrag(event, '${paneId}')">
                        <div class="window-title">
                            <i data-lucide="${isActive ? 'app-window' : 'minus-square'}" size="16"></i>
                            <span>${TAB_NAMES[tabKey] || tabKey}</span>
                        </div>
                        <div class="window-controls">
                            <div class="window-control-btn btn-close" onclick="app.toggleSplitView()" title="창 닫기 (분할 모드 종료)"></div>
                        </div>
                    </div>
                    <div class="window-content p-4 overflow-y-auto h-full flex-1">
                        ${getTabHTML(tabKey)}
                    </div>
                    ${handles}
                `;
                return winDiv;
            };

            main.appendChild(createWindow('left'));
            main.appendChild(createWindow('right'));
            if(window.lucide) lucide.createIcons();

            if (focusedId) {
                const newEl = document.getElementById(focusedId);
                if (newEl) {
                    newEl.focus();
                    if (cursorStart !== null && cursorEnd !== null) {
                        try { newEl.setSelectionRange(cursorStart, cursorEnd); } catch(e) {}
                    }
                }
            }
        }

        initDataSync();
    </script>
</body>
</html>
