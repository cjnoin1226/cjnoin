            // [신규] 특정 구역 초기화 함수 (만족도조사 서비스 목표/실행내용 부분 초기화 포함)
            resetInputs: (sectionId) => {
                if (!confirm('해당 영역을 초기화하시겠습니까? (저장하지 않은 내용은 사라집니다)')) return;

                const container = document.getElementById(sectionId);
                if (!container) return;

                if (sectionId === 'sec-sat-1') {
                    // 1) 만족도 조사 1. 서비스 만족도 조사 영역 특별 처리
                    // (이용자 만족도, 담당자 평가는 유지하고 목표와 실행내용만 일지 기반으로 재생성)
                    const formEl = document.getElementById('client-form');
                    const clientId = formEl ? formEl.dataset.id : null;
                    const c = state.clients.find(x => x.id === clientId);
                    if (!c) return;

                    const targetYear = state.ui.cmYear;
                    const providedLogs = state.logs.filter(l => l.clientId === c.id && l.date.startsWith(String(targetYear)));

                    const normalize = (str) => (str || '').replace(/\s+/g, '');
                    const providedCategoriesMap = new Map();
                    
                    providedLogs.forEach(l => {
                        if (l.serviceItems) {
                            l.serviceItems.forEach(item => {
                                if (item.category) {
                                    const key = normalize(item.category);
                                    if (!providedCategoriesMap.has(key)) {
                                        providedCategoriesMap.set(key, item.category.trim());
                                    }
                                }
                            });
                        }
                    });

                    const serviceOrderList = [...new Set(state.services.map(s => s.category))];
                    const allGoals = Array.from(providedCategoriesMap.values()).sort((a, b) => {
                        const normA = normalize(a);
                        const normB = normalize(b);
                        const idxA = serviceOrderList.findIndex(cat => normalize(cat) === normA);
                        const idxB = serviceOrderList.findIndex(cat => normalize(cat) === normB);

                        if (idxA !== -1 && idxB !== -1) return idxA - idxB;
                        if (idxA !== -1) return -1;
                        if (idxB !== -1) return 1;
                        return a.localeCompare(b);
                    });

                    const goalInputs = container.querySelectorAll('textarea[id^="sat-goal-"]');
                    
                    goalInputs.forEach((goalEl, i) => {
                        const actionEl = document.getElementById(`sat-action-${i}`);
                        const displayGoal = allGoals[i] || '';
                        
                        let autoAction = '';
                        if (displayGoal) {
                            const normalizedDisplayGoal = normalize(displayGoal);
                            const actionMap = new Map();
                            providedLogs.forEach(log => {
                                if (log.serviceItems) {
                                    log.serviceItems.forEach(item => {
                                        if (item.category && normalize(item.category) === normalizedDisplayGoal) {
                                            if (!actionMap.has(item.serviceName)) actionMap.set(item.serviceName, new Set());
                                            if (item.detailNote && item.detailNote.trim() !== '') actionMap.get(item.serviceName).add(item.detailNote.trim());
                                        }
                                    });
                                }
                            });
                            const actions = [];
                            actionMap.forEach((notesSet, serviceName) => {
                                let itemText = serviceName;
                                if (notesSet.size > 0) {
                                    const notes = [...notesSet].map(note => ` • ${note}`).join('\n');
                                    itemText += `\n${notes}`;
                                }
                                actions.push(itemText);
                            });
                            autoAction = actions.join('\n\n');
                        }

                        goalEl.value = displayGoal;
                        if (actionEl) actionEl.value = autoAction;
                        
                        // 높이 리사이징
                        goalEl.style.height = 'auto'; goalEl.style.height = (goalEl.scrollHeight) + 'px';
                        if (actionEl) { actionEl.style.height = 'auto'; actionEl.style.height = (actionEl.scrollHeight) + 'px'; }
                    });
                    app.showToast('서비스 목표 및 실행 내용이 기본값으로 초기화되었습니다.');

                } else {
                    // 2) 그 외 영역들은 전체 값 비우기 (일반 초기화)
                    const inputs = container.querySelectorAll('input, select, textarea');
                    inputs.forEach(el => {
                        if (el.type === 'checkbox' || el.type === 'radio') {
                            el.checked = false;
                        } else {
                            el.value = '';
                        }
                    });
                    app.showToast('해당 영역이 초기화되었습니다.');
                }
            },

    // [스마트 감지] 폼 변경 여부 확인 함수
    hasFormChanged: () => {
        return !!state.ui.isDirty; // 사용자가 진짜로 건드렸을 때만 true
    },
    // [신규] 현재 폼의 모든 입력값을 하나의 문자열로 캡처하는 핵심 함수
    captureFormState: () => {
        // [수정] 여러 창이 겹쳐있을 때 엉뚱한 폼을 검사하지 않도록 현재 눈에 보이는 폼만 정확히 잡아냅니다.
        let form = document.querySelector('#sub-modal-container form');
        if (!form || document.getElementById('sub-modal-container').classList.contains('hidden')) {
            form = document.querySelector('#modal-container form');
        }
        if (!form || document.getElementById('modal-container').classList.contains('hidden')) {
            form = document.querySelector('form');
        }
        if (!form) return '';

        let stateString = '';
        const inputs = form.querySelectorAll('input, select, textarea');
        
        inputs.forEach(input => {
            // 이름이 없는 항목들도 헷갈리지 않게 고유 아이디표를 붙여줍니다.
            const key = input.name || input.id || 'unnamed';
            
            if (input.type === 'checkbox' || input.type === 'radio') {
                stateString += `${key}=${input.checked}|`;
            } else {
                // [완벽수정] 모든 입력칸(텍스트, 선택박스 등)의 눈에 안 보이는 공백/오차를 100% 무시합니다.
                let val = input.value || '';
                if (typeof val === 'string') {
                    val = val.replace(/\r\n/g, '\n').trim();
                }
                stateString += `${key}=${val}|`;
            }
        });
        
        return stateString;
    },
    
            // [신규] 과거 재사정 기록 복사 함수
// [신규] 연도 선택 팝업을 띄우는 함수
          openReassessHistorySelector: (clientId) => {
              const client = state.clients.find(c => c.id === clientId);
              if (!client) return alert('대상자를 찾을 수 없습니다.');

              const cm = client.caseManagement;
              if (!cm || !cm.history) return alert('불러올 재사정 기록이 없습니다.');

              const currentYear = state.ui.cmYear;

              // 현재 보고 있는 연도(currentYear)를 제외하고, 재사정 기록이 존재하는 모든 연도를 찾습니다.
              const availableYears = Object.keys(cm.history)
                  .map(Number)
                  .filter(y => y !== currentYear && cm.history[y].reAssessment && Object.keys(cm.history[y].reAssessment).length > 0)
                  .sort((a, b) => b - a); // 최신 연도순 정렬

              if (availableYears.length === 0) return alert('불러올 다른 연도의 재사정 기록이 없습니다.');

              // 팝업창에 들어갈 버튼 목록 생성
              const buttonsHtml = availableYears.map(y => `
                  <button onclick="app.executeCopyReassessment('${clientId}', ${y})" class="w-full text-left px-4 py-3 bg-slate-50 hover:bg-blue-50 border border-slate-200 rounded-lg font-bold text-slate-700 transition-colors mb-2 shadow-sm">
                      ${y}년 재사정 기록 불러오기
                  </button>
              `).join('');

              const html = `
                  <div class="bg-white w-full max-w-sm p-6 rounded-xl shadow-2xl mx-4">
                      <div class="flex items-center gap-2 mb-4 pb-2 border-b border-slate-100">
                          <div class="p-2 bg-blue-50 text-blue-600 rounded-full"><i data-lucide="history" size="20"></i></div>
                          <div>
                              <h3 class="font-bold text-lg text-slate-900">재사정 기록 불러오기</h3>
                              <p class="text-xs text-slate-500">현재 화면(${currentYear}년)에 덮어씌울 연도를 선택하세요.</p>
                          </div>
                      </div>
                      <div class="max-h-[300px] overflow-y-auto custom-scrollbar mb-4">
                          ${buttonsHtml}
                      </div>
                      <div class="text-right">
                          <button onclick="app.closeDialog()" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-lg font-medium hover:bg-slate-200 transition-colors">취소</button>
                      </div>
                  </div>
              `;
              showDialog(html);
              if(window.lucide) lucide.createIcons();
          },

          // [신규] 선택한 연도의 데이터를 실제로 덮어씌우는 함수
          executeCopyReassessment: (clientId, targetYear) => {
              const client = state.clients.find(c => c.id === clientId);
              if (!client) return;

              const pastData = client.caseManagement.history[targetYear].reAssessment;

              if (!confirm(`${targetYear}년 재사정 기록을 현재 화면(${state.ui.cmYear}년)에 덮어씌우시겠습니까?`)) return;

              // 헬퍼 함수
              const setVal = (id, val) => { const el = document.getElementById(id); if (el) el.value = val || ''; };
              const setCheckboxes = (name, valuesArray) => {
                  if (!Array.isArray(valuesArray)) valuesArray = valuesArray ? [valuesArray] : [];
                  document.querySelectorAll(`input[name="${name}"]`).forEach(cb => {
                      cb.checked = valuesArray.includes(cb.value);
                  });
              };

              // 1. 주소, 전화번호
              setVal('cm-re-address', pastData.address);
              setVal('cm-re-phone', pastData.phone);

              // 2. 경제상황
              setCheckboxes('cm-re-eco', pastData.economic);
              setVal('cm-re-eco-cond', pastData.economicDetail?.conditional);
              setVal('cm-re-eco-other', pastData.economicDetail?.other);

              const ecoCondWrapper = document.getElementById('cm-re-eco-cond');
              if (ecoCondWrapper) ecoCondWrapper.classList.toggle('hidden', !(pastData.economic || []).some(e => e.includes('조건부')));

              const ecoOtherWrapper = document.getElementById('cm-re-eco-other');
              if (ecoOtherWrapper) ecoOtherWrapper.classList.toggle('hidden', !(pastData.economic || []).includes('기타'));

              // 3. 세대유형
              setCheckboxes('cm-re-house', pastData.household);

              // 4. 재사정유형
              const typeSelect = document.getElementById('cm-re-type-select');
              const typeDetail = document.getElementById('cm-re-type-detail');
              if (typeSelect && typeDetail) {
                  const rOpts = ["새로운 욕구가 발생", "긴급한 상황이 발생"];
                  if (rOpts.includes(pastData.type)) {
                      typeSelect.value = pastData.type;
                      typeDetail.classList.add('hidden');
                      typeDetail.value = '';
                  } else if (pastData.type) {
                      typeSelect.value = '기타';
                      typeDetail.classList.remove('hidden');
                      typeDetail.value = pastData.type;
                  } else {
                      typeSelect.value = '';
                      typeDetail.classList.add('hidden');
                      typeDetail.value = '';
                  }
              }

              // 5. 텍스트 입력 영역
              setVal('cm-re-factor', pastData.factor);
              setVal('cm-re-ct-needs', pastData.ctNeeds);
              setVal('cm-re-service-issue', pastData.serviceIssue);
              setVal('cm-re-worker-opinion', pastData.workerOpinion);
              setVal('cm-re-plan', pastData.plan);

              // 6. 결과 체크박스
              setCheckboxes('cm-re-result-chk', pastData.result);
              setVal('cm-re-result', pastData.result);

              // 7. 가족사항 테이블
              const famTbody = document.getElementById('cm-re-family-tbody');
              if (famTbody) {
                  let famData = [];
                  try { famData = JSON.parse(pastData.family); if (!Array.isArray(famData)) famData = []; } 
                  catch(e) { if (pastData.family) famData = [{ note: pastData.family }]; }

                  while (famData.length < 3) famData.push({});

                  const updateScript = "const tbody=this.closest('tbody'); const rows=Array.from(tbody.querySelectorAll('tr')); const data=rows.map(tr=>({rel:tr.querySelector('.r-rel').value, name:tr.querySelector('.r-name').value, birth:tr.querySelector('.r-birth').value, job:tr.querySelector('.r-job').value, relg:tr.querySelector('.r-relg').value, co:tr.querySelector('.r-co').value, note:tr.querySelector('.r-note').value})); document.getElementById('cm-re-family').value=JSON.stringify(data);";

                  const rowsHtml = famData.map(f => `
                      <tr class="hover:bg-slate-50 transition-colors">
                          <td class="p-0 border-r border-b border-slate-200 last:border-b-0"><input type="text" class="r-rel w-full p-1.5 text-center outline-none bg-transparent focus:bg-white transition-colors" value="${f.rel || ''}" oninput="${updateScript}"></td>
                          <td class="p-0 border-r border-b border-slate-200 last:border-b-0"><input type="text" class="r-name w-full p-1.5 text-center outline-none bg-transparent focus:bg-white transition-colors" value="${f.name || ''}" oninput="${updateScript}"></td>
                          <td class="p-0 border-r border-b border-slate-200 last:border-b-0"><input type="text" class="r-birth w-full p-1.5 text-center outline-none bg-transparent focus:bg-white transition-colors" value="${f.birth || ''}" placeholder="YYYY-MM-DD" oninput="${updateScript}"></td>
                          <td class="p-0 border-r border-b border-slate-200 last:border-b-0"><input type="text" class="r-job w-full p-1.5 text-center outline-none bg-transparent focus:bg-white transition-colors" value="${f.job || ''}" oninput="${updateScript}"></td>
                          <td class="p-0 border-r border-b border-slate-200 last:border-b-0"><input type="text" class="r-relg w-full p-1.5 text-center outline-none bg-transparent focus:bg-white transition-colors" value="${f.relg || ''}" oninput="${updateScript}"></td>
                          <td class="p-0 border-r border-b border-slate-200 last:border-b-0">
                              <select class="r-co w-full p-1.5 text-center outline-none bg-transparent focus:bg-white cursor-pointer transition-colors" onchange="${updateScript}">
                                  <option value=""></option>
                                  <option value="O" ${f.co === 'O' ? 'selected' : ''}>O</option>
                                  <option value="X" ${f.co === 'X' ? 'selected' : ''}>X</option>
                              </select>
                          </td>
                          <td class="p-0 border-b border-slate-200 last:border-b-0"><input type="text" class="r-note w-full p-1.5 text-center outline-none bg-transparent focus:bg-white transition-colors" value="${f.note || ''}" oninput="${updateScript}"></td>
                      </tr>
                  `).join('');

                  const famVal = JSON.stringify(famData).replace(/'/g, "&#39;");
                  famTbody.innerHTML = rowsHtml + `<input type="hidden" id="cm-re-family" value='${famVal}'>`;
              }

              app.closeDialog();
              app.showToast(`${targetYear}년 재사정 기록을 성공적으로 불러왔습니다.`);
          },

        // [신규] 확인 버튼을 누르지 않아도 2초 뒤 자동으로 사라지는 팝업 알림 (토스트)
        showToast: (msg) => {
                const t = document.createElement('div');
                t.className = 'fixed top-6 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-5 py-3 rounded-xl shadow-2xl z-[150] font-bold text-sm flex items-center gap-2 transition-all duration-300 opacity-0 -translate-y-2 pointer-events-none';
                t.innerHTML = `<i data-lucide="check-circle" class="text-emerald-400" size="18"></i> <span>${msg}</span>`;
                document.body.appendChild(t);
                if(window.lucide) lucide.createIcons();
                
                // 스르륵 나타나는 애니메이션
                requestAnimationFrame(() => t.classList.remove('opacity-0', '-translate-y-2'));
                
                // 2초 뒤 사라짐
                setTimeout(() => { 
                    t.classList.add('opacity-0', '-translate-y-2'); 
                    setTimeout(() => t.remove(), 300); 
                }, 2000);
            },
            setTab: (t, updateHistory = true) => { 
                // [신규] 탭 전환 전, 현재 탭의 스크롤 위치 저장
                if (state.viewMode === 'single') {
                    const currentTab = state.activeTab;
                    // 1. 윈도우 스크롤 저장
                    const winScroll = window.scrollY;
                    
                    // 2. 내부 컨테이너 스크롤 저장 (각 탭별 주요 스크롤 영역)
                    let containerScroll = 0;
                    const scrollMap = {
                        'clients': 'client-list-container',
                        'logs': 'log-list-container',
                        'meeting': 'meeting-list-container',
                        'statistics': 'stats-list-container',
                        'performance': 'perf-table-container'
                    };
                    const containerId = scrollMap[currentTab];
                    if (containerId) {
                        const el = document.getElementById(containerId);
                        if (el) containerScroll = el.scrollTop;
                    }

                    // 상태에 저장
                    state.tabScrolls[currentTab] = { window: winScroll, container: containerScroll };
                }

                if (!state.openedTabs.includes(t)) { state.openedTabs.push(t); }
                if (state.viewMode === 'single') {
                    state.activeTab = t; 
                    if (updateHistory) window.history.pushState({ tab: t }, '', `#${t}`);
                } else {
                    state.paneTabs[state.focusedPane] = t;
                }
                app.closeMobileMenu();
                app.updateTabVisibility(); 
                
                // [신규] 탭 전환 후, 새 탭의 스크롤 위치 복구
                if (state.viewMode === 'single') {
                    const saved = state.tabScrolls[t] || { window: 0, container: 0 };
                    
                    // 약간의 지연을 주어 DOM 렌더링 후 스크롤 적용
                    setTimeout(() => {
                        // 1. 윈도우 스크롤 복구
                        window.scrollTo(0, saved.window);

                        // 2. 내부 컨테이너 스크롤 복구
                        const scrollMap = {
                            'clients': 'client-list-container',
                            'logs': 'log-list-container',
                            'meeting': 'meeting-list-container',
                            'statistics': 'stats-list-container',
                            'performance': 'perf-table-container'
                        };
                        const containerId = scrollMap[t];
                        if (containerId) {
                            const el = document.getElementById(containerId);
                            if (el) el.scrollTop = saved.container;
                        }
                    }, 0);
                }
            },
            
            updateTabVisibility: () => {
                const currentTab = state.viewMode === 'single' ? state.activeTab : state.paneTabs[state.focusedPane];
                app.renderTabBar(currentTab);
                
                document.querySelectorAll('.nav-link').forEach(b => { 
                    const tabKey = b.dataset.tab || b.dataset.tabMobile;
                    if(tabKey === currentTab) b.classList.add('active'); 
                    else b.classList.remove('active'); 
                });

                if (state.viewMode === 'single') {
                    const mainContainer = document.getElementById('main-view-container');
                    if(mainContainer) {
                        if (mainContainer.classList.contains('fixed') || (mainContainer.firstChild && mainContainer.firstChild.classList && mainContainer.firstChild.classList.contains('window-pane'))) {
                            mainContainer.className = "flex-1 w-full relative overflow-hidden flex flex-col"; 
                            mainContainer.style.backgroundColor = ""; 
                            mainContainer.innerHTML = ""; 
                            state.renderedTabs.clear();
                        }
                        const loader = document.getElementById('initial-loader');
                        if (loader) loader.remove();

                        state.openedTabs.forEach(t => {
                            let view = document.getElementById(`tab-view-${t}`);
                            if (t === state.activeTab) {
                                if (!view) { updateTabContent(t); view = document.getElementById(`tab-view-${t}`); }
                                if (view) view.classList.add('active');
                            } else {
                                if (view) view.classList.remove('active');
                            }
                        });
                    }
                } else {
                    // [수정] 스플릿 뷰일 때 전체 render() 대신 현재 포커스된 페인만 부분 업데이트
                    // 이렇게 하면 반대쪽 창은 리렌더링되지 않아 새로고침 현상이 사라집니다.
                    const paneId = state.focusedPane;
                    const tabKey = state.paneTabs[paneId];
                    const winEl = document.getElementById(`window-${paneId}`);
                    
                    if (winEl) {
                        // 1. 윈도우 제목 업데이트
                        const titleEl = winEl.querySelector('.window-title span');
                        if (titleEl) titleEl.textContent = TAB_NAMES[tabKey] || tabKey;
                        
                        // 2. 윈도우 내용물(HTML)만 교체
                        const contentEl = winEl.querySelector('.window-content');
                        if (contentEl) {
                            contentEl.innerHTML = getTabHTML(tabKey);
                            // 아이콘 다시 렌더링
                            if(window.lucide) lucide.createIcons();
                        }
                    } else {
                        // 윈도우 DOM이 아예 없는 예외적인 경우에만 전체 렌더링
                        render();
                    }
                }
            },

            renderTabBar: (currentTab) => {
                const tabBar = document.getElementById('top-tab-bar');
                if (tabBar) {
                    tabBar.innerHTML = state.openedTabs.map((t, index) => {
                        const isActive = t === currentTab;
                        return `
                        <div class="main-tab ${isActive ? 'active' : ''}" 
                             onclick="app.setTab('${t}')"
                             draggable="true"
                             ondragstart="app.handleTabDragStart(event, ${index})"
                             ondragover="app.handleTabDragOver(event)"
                             ondrop="app.handleTabDrop(event, ${index})"
                             ondragend="app.handleTabDragEnd(event)">
                            <span>${TAB_NAMES[t] || t}</span>
                            <button onclick="app.closeTab('${t}', event)" class="tab-close-btn" title="탭 닫기">
                                <i data-lucide="x" size="8"></i>
                            </button>
                        </div>`;
                    }).join('');
                    if(window.lucide) lucide.createIcons();
                }
            },

            handleTabDragStart: (e, index) => {
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', index);
                e.target.style.opacity = '0.4';
            },
            handleTabDragOver: (e) => {
                e.preventDefault(); 
                e.dataTransfer.dropEffect = 'move';
                return false;
            },
            handleTabDrop: (e, targetIndex) => {
                e.preventDefault();
                e.stopPropagation();
                const sourceIndex = parseInt(e.dataTransfer.getData('text/plain'));
                
                if (sourceIndex !== targetIndex && !isNaN(sourceIndex) && sourceIndex >= 0 && sourceIndex < state.openedTabs.length) {
                    const tabs = [...state.openedTabs];
                    const [movedTab] = tabs.splice(sourceIndex, 1);
                    tabs.splice(targetIndex, 0, movedTab);
                    state.openedTabs = tabs;
                    
                    const currentTab = state.viewMode === 'single' ? state.activeTab : state.paneTabs[state.focusedPane];
                    app.renderTabBar(currentTab);
                }
                return false;
            },
            handleTabDragEnd: (e) => {
                e.target.style.opacity = '';
            },

            closeTab: (t, e) => {
                if (e) e.stopPropagation();
                
                // [신규] 탭을 닫을 때 해당 탭의 상태(스크롤, 필터 등)를 초기화하여 "첫 화면" 상태로 만듦
                if (state.tabScrolls && state.tabScrolls[t]) {
                    delete state.tabScrolls[t];
                }

                // 탭별 필터 및 UI 상태 초기화 (렌더링 없이 값만 리셋)
                if (t === 'clients') {
                    state.filters.client = { status: '이용', level: '', economicStatus: '', duplicateService: '', ictStatus: '', region: [], gender: '', search: '', searchPhone: '', targetYear: '', targetMonth: '' };
                    state.ui.selectedClientIds.clear();
                } else if (t === 'logs') {
                    state.filters.log = { start: '', end: '', search: '', contentSearch: '', provider: '', category: '', service: '', detailNote: '', region: [] };
                    state.ui.logPage = 1;
                    state.ui.selectedLogIds.clear();
                } else if (t === 'meeting') {
                    const d = new Date();
                    state.filters.meeting = { start: `${d.getFullYear()}-01-01`, end: `${d.getFullYear()}-12-31`, search: '', type: '', clientName: '', writer: '' };
                    state.ui.meetingTargetMonth = new Date().getMonth() + 1;
                    state.ui.meetingCandidateType = 'regular';
                    state.ui.selectedMeetingIds.clear();
                } else if (t === 'performance') {
                    state.filters.performance = { year: new Date().getFullYear(), months: Array.from({length: 12}, (_, i) => i + 1), viewMode: 'monthRows' };
                } else if (t === 'statistics') {
                    const d = new Date(); 
                    const s = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-01`; 
                    const l = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); 
                    const end = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${l}`;
                    state.filters.stats = { start: s, end: end, type: 'detail', region: [], name: '' };
                }

                state.openedTabs = state.openedTabs.filter(tab => tab !== t);
                
                const view = document.getElementById(`tab-view-${t}`);
                if (view) view.remove();
                state.renderedTabs.delete(t);

                if (state.openedTabs.length === 0) state.openedTabs.push('dashboard');

                const fallbackTab = state.openedTabs[state.openedTabs.length - 1]; 
                
                if (state.viewMode === 'single') {
                    if (state.activeTab === t) {
                        state.activeTab = fallbackTab;
                        app.updateTabVisibility(); 
                        window.history.replaceState({ tab: fallbackTab }, '', `#${fallbackTab}`);
                    } else {
                        app.renderTabBar(state.activeTab); 
                    }
                } else {
                    if (state.paneTabs.left === t) state.paneTabs.left = fallbackTab;
                    if (state.paneTabs.right === t) state.paneTabs.right = fallbackTab;
                    render();
                }
            },
            toggleSplitView: () => {
                app.closeMobileMenu(); 
                if (state.viewMode === 'single') {
                    state.viewMode = 'split';
                    state.paneTabs.left = state.activeTab;
                    state.paneTabs.right = (state.activeTab === 'logs' ? 'clients' : 'logs');
                    if (!state.openedTabs.includes(state.paneTabs.right)) state.openedTabs.push(state.paneTabs.right);
                    state.focusedPane = 'left';
                    document.getElementById('split-status-text').textContent = 'ON';
                    document.getElementById('btn-split-toggle').classList.add('bg-slate-700', 'text-emerald-400', 'border-emerald-500');
                    document.body.style.overflow = 'hidden';
                    document.body.style.height = '100vh';

                    const container = document.getElementById('main-content');
                    const w = container ? container.clientWidth : window.innerWidth;
                    const h = container ? container.clientHeight : window.innerHeight;
                    const winW = Math.min(600, w / 2 - 20);
                    const winH = h - 100;
                    
                    state.windows.left = { x: 20, y: 20, w: winW, h: winH, z: 10 };
                    state.windows.right = { x: winW + 40, y: 20, w: winW, h: winH, z: 9 };
                    render();
                } else {
                    state.viewMode = 'single';
                    state.activeTab = state.paneTabs.left;
                    document.getElementById('split-status-text').textContent = 'OFF';
                    document.getElementById('btn-split-toggle').classList.remove('bg-slate-700', 'text-emerald-400', 'border-emerald-500');
                    document.body.style.overflow = '';
                    document.body.style.height = '';

                    const mainContainer = document.getElementById('main-view-container');
                    if(mainContainer) {
                        mainContainer.innerHTML = ''; 
                        state.renderedTabs.clear(); 
                    }
                    app.updateTabVisibility();
                }
            },
            
            startDrag: (e, paneId) => {
                e.preventDefault();
                app.setFocusedPane(paneId);
                const winState = state.windows[paneId];
                const el = document.getElementById(`window-${paneId}`);
                if (!el) return;

                const startX = e.clientX;
                const startY = e.clientY;
                const initialLeft = winState.x;
                const initialTop = winState.y;

                el.classList.add('dragging');
                document.body.style.userSelect = 'none';
                document.body.style.cursor = 'grabbing';

                let currentX = startX;
                let currentY = startY;
                let rafId = null;

                const updatePosition = () => {
                    const dx = currentX - startX;
                    const dy = currentY - startY;
                    winState.x = initialLeft + dx;
                    winState.y = initialTop + dy;
                    el.style.left = `${winState.x}px`;
                    el.style.top = `${winState.y}px`;
                    rafId = null;
                };

                const onMove = (moveEvent) => {
                    currentX = moveEvent.clientX;
                    currentY = moveEvent.clientY;
                    if (!rafId) rafId = requestAnimationFrame(updatePosition);
                };

                const onUp = () => {
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onUp);
                    if (rafId) cancelAnimationFrame(rafId);
                    el.classList.remove('dragging');
                    document.body.style.userSelect = '';
                    document.body.style.cursor = '';
                };
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
            },

            startResize: (e, paneId, direction) => {
                e.preventDefault();
                e.stopPropagation();
                app.setFocusedPane(paneId);
                const winState = state.windows[paneId];
                const el = document.getElementById(`window-${paneId}`);
                if (!el) return;

                const startX = e.clientX;
                const startY = e.clientY;
                const initialX = winState.x;
                const initialY = winState.y;
                const initialW = winState.w;
                const initialH = winState.h;

                el.classList.add('dragging'); 
                document.body.style.userSelect = 'none';
                const cursorMap = { 'n': 'n-resize', 's': 's-resize', 'e': 'e-resize', 'w': 'w-resize', 'ne': 'ne-resize', 'nw': 'nw-resize', 'se': 'se-resize', 'sw': 'sw-resize' };
                document.body.style.cursor = cursorMap[direction];

                let currentX = startX;
                let currentY = startY;
                let rafId = null;

                const updateSize = () => {
                    const dx = currentX - startX;
                    const dy = currentY - startY;
                    let newW = initialW, newH = initialH, newX = initialX, newY = initialY;

                    if (direction.includes('e')) newW = Math.max(300, initialW + dx);
                    if (direction.includes('w')) { const proposedW = initialW - dx; newW = Math.max(300, proposedW); newX = initialX + (initialW - newW); }
                    if (direction.includes('s')) newH = Math.max(200, initialH + dy);
                    if (direction.includes('n')) { const proposedH = initialH - dy; newH = Math.max(200, proposedH); newY = initialY + (initialH - newH); }

                    winState.x = newX; winState.y = newY; winState.w = newW; winState.h = newH;
                    el.style.width = `${newW}px`; el.style.height = `${newH}px`; el.style.left = `${newX}px`; el.style.top = `${newY}px`;
                    rafId = null;
                };

                const onMove = (moveEvent) => {
                    currentX = moveEvent.clientX;
                    currentY = moveEvent.clientY;
                    if (!rafId) rafId = requestAnimationFrame(updateSize);
                };

                const onUp = () => {
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onUp);
                    if (rafId) cancelAnimationFrame(rafId);
                    el.classList.remove('dragging');
                    document.body.style.userSelect = '';
                    document.body.style.cursor = '';
                };
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
            },

            toggleMobileMenu: () => { state.isMobileMenuOpen = !state.isMobileMenuOpen; app.renderMobileMenuState(); },
            closeMobileMenu: () => { state.isMobileMenuOpen = false; app.renderMobileMenuState(); },
            renderMobileMenuState: () => {
                const menu = document.getElementById('mobile-menu');
                if (state.isMobileMenuOpen) menu.classList.remove('-translate-y-[150%]'); else menu.classList.add('-translate-y-[150%]');
            },

                state.windows.left.z = pane === 'left' ? 10 : 1;
                state.windows.right.z = pane === 'right' ? 10 : 1;
                const leftEl = document.getElementById('window-left');
                const rightEl = document.getElementById('window-right');
                if (leftEl) { leftEl.style.zIndex = state.windows.left.z; if (pane === 'left') leftEl.classList.add('active'); else leftEl.classList.remove('active'); }
                if (rightEl) { rightEl.style.zIndex = state.windows.right.z; if (pane === 'right') rightEl.classList.add('active'); else rightEl.classList.remove('active'); }

            },
            setFilter: (s, k, v, doRender = true) => { 
                state.filters[s][k] = v; 
                // [신규] 일지 필터 변경 시 페이지 초기화
                if (s === 'log') state.ui.logPage = 1;

            },

            // [신규] 일지 정렬 기준 리셋 함수
            setLogSort: () => {
                state.filters.log.sortArray = []; // 아무것도 선택 안 된 상태로 싹 비웁니다!
                state.ui.logPage = 1;
                if(state.viewMode === 'single') updateTabContent('logs'); else render();
            },

            // [수정] 일지 다중 정렬 토글 함수 (가로 버튼용)
            toggleLogSort: (key) => {
                let sortArr = state.filters.log.sortArray || [];
                const existIdx = sortArr.findIndex(item => item.key === key);

                if (existIdx > -1) {
                    // 처음 누른 상태(기본 방향)이면 반대로 뒤집고, 이미 뒤집혔다면 끕니다(제거)
                    const initialOrder = key === 'date' ? 'desc' : 'asc';
                    if (sortArr[existIdx].order === initialOrder) {
                        sortArr[existIdx].order = initialOrder === 'desc' ? 'asc' : 'desc';
                    } else {
                        sortArr.splice(existIdx, 1); 
                    }
                } else {
                    // 날짜는 최신순(desc)이 기본, 나머지는 가나다순(asc)이 기본
                    sortArr.push({ key: key, order: key === 'date' ? 'desc' : 'asc' });
                }
                
                // 모두 제거해서 기준이 비어버렸다면 텅 빈 상태로 둡니다 (그래야 화면에 불이 다 꺼짐)
                if (sortArr.length === 0) sortArr = [];

                state.filters.log.sortArray = sortArr;
                state.ui.logPage = 1; 
                if(state.viewMode === 'single') updateTabContent('logs'); else render();
            },

            // [수정] 일지 연도 필터 간편 설정 함수 (데이터 재로딩 로직 개선)
            setLogYear: async (year) => {
                const currentYear = new Date().getFullYear();

                if (year === 'all') {
                    // [신규] 전체 연도 선택 시: 로드되지 않았거나 데이터가 없는 연도에 대해 재검증 시도
                    // 사용자 요청: "불러와지지 않은 데이터만 다시한번 불러와지게" -> 데이터가 없는 연도를 재확인
                    const yearsToLoad = [];
                    // [수정] 과거 데이터 범위 2010년으로 확장
                    for (let y = 2010; y <= currentYear + 1; y++) {
                        const yStr = String(y);
                        // 해당 연도의 데이터가 실제로 메모리에 있는지 확인
                        const hasData = state.logs.some(l => l.date.startsWith(yStr));
                        
                        // 로드 기록이 없거나, 로드 기록은 있는데 데이터가 0건인 경우 재시도 대상에 포함
                        // force=true를 사용하기 위해 식별
                        if (!state.loadedYears.has(y) || !hasData) {
                            yearsToLoad.push(y);
                        }
                    }

                    if (yearsToLoad.length > 0) {
                        app.showProgress('전체 기간 데이터 확인 중...', yearsToLoad.length);
                        try {
                            // 순차적으로 로드
                            for (let i = 0; i < yearsToLoad.length; i++) {
                                // [신규] 취소 플래그 확인
                                if (state.loadingCancelled) {
                                    console.log("로딩이 사용자에 의해 취소되었습니다.");
                                    break;
                                }
                                // force=true 옵션을 사용하여 서버에서 강제 조회 (데이터가 없어도 다시 확인)
                                await app.loadLogsByYear(yearsToLoad[i], false, true);
                                app.updateProgress(i + 1);
                            }
                        } catch (e) {
                            console.error("전체 로딩 중 오류:", e);
                        } finally {
                            app.hideProgress();
                        }
                    }

                    // [신규] 전체 연도 선택 시: 범위를 넓게 잡아 모든 데이터가 보이도록 설정
                    state.filters.log.start = '2000-01-01';
                    state.filters.log.end = '9999-12-31';
                } else if (year) {
                    const targetYear = parseInt(year);
                    const yStr = String(targetYear);
                    // 선택된 연도 데이터가 로드되었는지, 그리고 실제 데이터가 있는지 확인
                    const hasData = state.logs.some(l => l.date.startsWith(yStr));

                    // [수정] 로드된 적이 없거나, 로드됐어도 데이터가 안 보이면 강제 로딩 (force=true)
                    // "가끔... 아무데이터가 안보일때가 있거든? 그래서 다시 해당연도로 필터링하면..." 상황 해결
                    if (!state.loadedYears.has(targetYear) || !hasData) {
                        await app.loadLogsByYear(targetYear, true, true);
                    }
                    
                    state.filters.log.start = `${targetYear}-01-01`;
                    state.filters.log.end = `${targetYear}-12-31`;
                } else {
                    // 기본값 선택 시 필터 해제
                    state.filters.log.start = '';
                    state.filters.log.end = '';
                }
                state.ui.logPage = 1; 
                if (state.viewMode === 'single') updateTabContent('logs'); else render();
            },
            
            // [수정] 날짜 범위 조회 함수 (SWR 패턴 적용: 즉시 렌더링 후 백그라운드 갱신)
            searchLogsByDateRange: async () => {
                const startVal = document.getElementById('log-filter-start').value;
                const endVal = document.getElementById('log-filter-end').value;
                
                // 1. 필터 상태 즉시 업데이트 (UI 즉시 반영)
                state.filters.log.start = startVal;
                state.filters.log.end = endVal;
                state.ui.logPage = 1;
                state.loadingCancelled = false; // 플래그 초기화

                // 2. 캐시된 데이터로 즉시 화면 렌더링 (Optimistic UI)
                // 로딩 창 없이 가지고 있는 데이터 먼저 보여줌
                if (state.viewMode === 'single') updateTabContent('logs'); else render();

                // 3. 백그라운드 데이터 동기화 (SWR: Stale-While-Revalidate)
                const yearsToLoad = [];
                
                if (startVal && endVal) {
                    const startY = parseInt(startVal.split('-')[0]);
                    const endY = parseInt(endVal.split('-')[0]);
                    for (let y = Math.min(startY, endY); y <= Math.max(startY, endY); y++) {
                        yearsToLoad.push(y);
                    }
                } else {
                    // 시작일 또는 종료일만 있는 경우
                    if (startVal) yearsToLoad.push(parseInt(startVal.split('-')[0]));
                    if (endVal) yearsToLoad.push(parseInt(endVal.split('-')[0]));
                }

                // 중복 제거
                const uniqueYears = [...new Set(yearsToLoad)];

                if (uniqueYears.length > 0) {
                    // 비동기 실행 (await 하지 않음으로써 UI 블로킹 방지)
                    (async () => {
                        for (const year of uniqueYears) {
                            if (state.loadingCancelled) break;
                            try {
                                // showUI=false: 로딩 모달 없이 조용히 실행
                                // force=true: 캐시가 있어도 서버에서 최신 데이터 가져옴
                                await app.loadLogsByYear(year, false, true);
                                
                                // 데이터 갱신 성공 시 화면 리프레시 (사용자가 보고 있는 경우)
                                if (state.viewMode === 'single') {
                                    if (state.activeTab === 'logs') updateTabContent('logs');
                                } else {
                                    render();
                                }
                            } catch(e) { 
                                console.error(`Background sync failed for ${year}:`, e); 
                            }
                        }
                    })();
                }
            },

            // [신규] 특정 연도 로그 데이터 로딩 함수 (On-Demand)
            // [수정] showUI 파라미터 추가하여 일괄 로딩 시 개별 알림 제어, force 파라미터 추가
            loadLogsByYear: async (year, showUI = true, force = false) => {
                // [수정] 순서 변경: 단건 로딩 시 showProgress가 먼저 호출되어야 loadingCancelled가 false로 리셋됨.
                if (showUI) app.showProgress(`${year}년 데이터 불러오는 중...`, 100); 

                // [신규] 취소 상태면 즉시 리턴
                if (state.loadingCancelled) {
                    if (showUI) app.hideProgress();
                    return;
                }
                
                // [수정] force가 true면 이미 로드된 연도라도 다시 불러옴
                if (!force && state.loadedYears.has(year)) {
                    if (showUI) app.hideProgress();
                    return;
                }
                
                try {
                    // [수정] 인덱스 오류 방지를 위해 orderBy 제거 (클라이언트 측에서 정렬)
                    const q = query(
                        collection(db, "logs"), 
                        where("date", ">=", `${year}-01-01`), 
                        where("date", "<=", `${year}-12-31`)
                    );
                    const snap = await getDocs(q);
                    const newLogs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    
                    // [수정] mergeLogs 사용 (안전한 병합)
                    if (newLogs.length > 0) {
                        mergeLogs(newLogs);
                    }
                    
                    state.loadedYears.add(year);
                } catch (e) {
                    console.error("과거 데이터 로딩 실패:", e);
                    if (showUI) alert(`${year}년 데이터를 불러오는 중 오류가 발생했습니다.`);
                } finally {
                    if (showUI) app.hideProgress();
                }
            },

            // [신규] 일지 페이지 변경 함수
            setLogPage: (page) => {
                state.ui.logPage = page;
                if(state.viewMode==='single') updateTabContent('logs'); else render();
            },
            
            // [신규] 통계 날짜 범위 조회 및 강제 데이터 로딩 함수
            searchStatsByDateRange: async () => {
                const startVal = document.getElementById('stats-start').value;
                const endVal = document.getElementById('stats-end').value;
                
                // 필터 상태 업데이트
                state.filters.stats.start = startVal;
                state.filters.stats.end = endVal;

                // 날짜가 설정되어 있다면 해당 연도 데이터 강제 로딩 시도
                if (startVal || endVal) {
                    const yearsToLoad = [];
                    const sYear = startVal ? parseInt(startVal.split('-')[0]) : null;
                    const eYear = endVal ? parseInt(endVal.split('-')[0]) : null;

                    if (sYear && eYear) {
                        // [수정] 변수명 오타 수정 (eY -> eYear) 및 중복 제거 로직 강화
                        for (let y = Math.min(sYear, eYear); y <= Math.max(sYear, eYear); y++) yearsToLoad.push(y);
                    } else if (sYear) {
                        yearsToLoad.push(sYear);
                    } else if (eYear) {
                        yearsToLoad.push(eYear);
                    }
                    
                    // 중복 제거
                    const uniqueYears = [...new Set(yearsToLoad)];

                    if (uniqueYears.length > 0) {
                        app.showProgress('통계 데이터 갱신 중...', uniqueYears.length);
                        try {
                            for (let i = 0; i < uniqueYears.length; i++) {
                                if (state.loadingCancelled) break;
                                // force=true 옵션을 사용하여 이미 로드된 연도라도 다시 서버에서 가져옴
                                await app.loadLogsByYear(uniqueYears[i], false, true);
                                app.updateProgress(i + 1);
                            }
                        } catch(e) { 
                            console.error(e); 
                        } finally { 
                            app.hideProgress(); 
                        }
                    }
                }
                
                if (state.viewMode === 'single') updateTabContent('statistics'); else render();
            },

            // [신규] 실적 관리 연도 변경 함수 (데이터 로딩 지원)
            setPerformanceYear: async (year) => {
                const targetYear = parseInt(year);
                state.filters.performance.year = targetYear;
                
                // 선택된 연도의 데이터가 로드되지 않았다면 서버에서 가져옴
                if (targetYear && !state.loadedYears.has(targetYear)) {
                    await app.loadLogsByYear(targetYear);
                }
                
                if (state.viewMode === 'single') updateTabContent('performance'); else render();
            },

            // [신규] 통계 연도 필터 간편 설정 함수
            setStatsYear: (year) => {
                state.filters.stats.targetYear = year; // [신규] 선택한 연도 기억하기
                if (year) {
                    const m = state.filters.stats.months;
                    if (m && m.length > 0) {
                        const minM = m[0];
                        const maxM = m[m.length - 1];
                        state.filters.stats.start = `${year}-${String(minM).padStart(2, '0')}-01`;
                        const lastDay = new Date(year, maxM, 0).getDate();
                        state.filters.stats.end = `${year}-${String(maxM).padStart(2, '0')}-${lastDay}`;
                    } else {
                        state.filters.stats.start = `${year}-01-01`;
                        state.filters.stats.end = `${year}-12-31`;
                    }
                } else {
                    // 연도를 '선택 안함'으로 바꿨을 때
                    const m = state.filters.stats.months;
                    if (m && m.length > 0) {
                        let y = new Date().getFullYear();
                        const minM = m[0];
                        const maxM = m[m.length - 1];
                        state.filters.stats.start = `${y}-${String(minM).padStart(2, '0')}-01`;
                        const lastDay = new Date(y, maxM, 0).getDate();
                        state.filters.stats.end = `${y}-${String(maxM).padStart(2, '0')}-${lastDay}`;
                    } else {
                        // 아무것도 없으면 당해연도 당해월(초기화)
                        const d = new Date(); 
                        state.filters.stats.start = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-01`; 
                        const l = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); 
                        state.filters.stats.end = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${l}`;
                    }
                }
                // [추가] 통계에서도 연도 선택 시 데이터 로딩 체크
                if (year && !state.loadedYears.has(parseInt(year))) {
                    app.loadLogsByYear(parseInt(year)).then(() => {
                        if (state.viewMode === 'single') updateTabContent('statistics'); else render();
                    });
                } else {
                    if (state.viewMode === 'single') updateTabContent('statistics'); else render();
                }
            },

            render: () => render(), 
            toggleRegionDropdown: () => { 
                state.ui.regionDropdownOpen = !state.ui.regionDropdownOpen; 
                if(state.viewMode==='single') updateTabContent('clients'); 
                else render(); 
                
                // [추가] 드롭다운이 짤리지 않도록 버튼 위치를 계산하여 fixed 위치 설정
                if (state.ui.regionDropdownOpen) {
                    setTimeout(() => {
                        const btn = document.getElementById('btn-region-filter');

                            menu.style.top = (rect.bottom + 4) + 'px';

                    }, 0);
                }
            },
            toggleRegionFilter: (val) => { const r = state.filters.client.region; const idx = r.indexOf(val); if (idx > -1) r.splice(idx, 1); else r.push(val); if(state.viewMode==='single') updateTabContent('clients'); else render(); },
            toggleLogRegionDropdown: () => { state.ui.logRegionDropdownOpen = !state.ui.logRegionDropdownOpen; if(state.viewMode==='single') updateTabContent('logs'); else render(); },
            toggleLogRegionFilter: (val) => { const r = state.filters.log.region; const idx = r.indexOf(val); if (idx > -1) r.splice(idx, 1); else r.push(val); if(state.viewMode==='single') updateTabContent('logs'); else render(); },
            toggleStatsRegionDropdown: () => { state.ui.statsRegionDropdownOpen = !state.ui.statsRegionDropdownOpen; if(state.viewMode==='single') updateTabContent('statistics'); else render(); },
            toggleStatsRegionFilter: (val) => { const r = state.filters.stats.region; const idx = r.indexOf(val); if (idx > -1) r.splice(idx, 1); else r.push(val); if(state.viewMode==='single') updateTabContent('statistics'); else render(); },
            toggleStatsMonthDropdown: () => { state.ui.statsMonthDropdownOpen = !state.ui.statsMonthDropdownOpen; if(state.viewMode==='single') updateTabContent('statistics'); else render(); },
            toggleStatsMonthFilter: (month) => {
                const m = state.filters.stats.months;
                const idx = m.indexOf(month);
                if (idx > -1) m.splice(idx, 1);
                else m.push(month);
                m.sort((a,b) => a-b);

                // [추가] 월 선택에 따라 시작/종료일 자동 변경
                let year = state.filters.stats.targetYear || new Date().getFullYear(); // [수정] 고정된 연도가 있으면 그걸 사용
                
                if (m.length > 0) {
                    const minM = m[0];
                    const maxM = m[m.length - 1];
                    state.filters.stats.start = `${year}-${String(minM).padStart(2, '0')}-01`;
                    const lastDay = new Date(year, maxM, 0).getDate();
                    state.filters.stats.end = `${year}-${String(maxM).padStart(2, '0')}-${lastDay}`;
                } else {
                    // [핵심] 월을 다 해제했을 때 연도 선택 여부에 따라 분기

                                        <label class="flex items-center gap-1 cursor-pointer hover:bg-white px-2 py-0.5 rounded transition-colors border border-transparent hover:border-slate-200">
                                            <input type="checkbox" name="serviceDecision" value="서비스 종결" class="w-4 h-4 text-red-600 focus:ring-red-500 rounded border-slate-300 cursor-pointer" ${m.serviceDecision === '서비스 종결' ? 'checked' : ''} onclick="app.handleDecisionCheckbox(this)">

                            <div><label class="block text-sm font-bold text-slate-700 mb-1">작성자</label><input name="writer" class="input-field" placeholder="작성자 성명" value="${m.writer || ''}" required></div>

                        </form>

                showModal(html, false, targetContainerId);

            // [신규] 회의록 결정사항 체크박스 제어 (상호 배타적 동작)
            handleDecisionCheckbox: (el) => {
                if (el.checked) {

                    checkboxes.forEach(cb => {
                        if (cb !== el) cb.checked = false;
                    });
                }
            },
            
            // [신규] 회의록 결정사항 표시 토글 함수
            toggleMeetingDecisionVisibility: (type) => {
                const wrapper = document.getElementById('meeting-decision-wrapper');
                if (!wrapper) return;
                
                // 수시, 기타일 경우 숨김 처리

                    wrapper.classList.add('hidden');

                    wrapper.classList.remove('hidden');
                }

            // [신규] 이전 회의록 불러오기 다이얼로그
            openMeetingHistorySelector: () => {
                const clientNameInput = document.getElementById('mt-client-name');
                const clientName = clientNameInput ? clientNameInput.value.trim() : '';
                
                if (!clientName) {
                    alert("이전 기록을 찾기 위해 먼저 대상자 이름을 입력해주세요.");
                    return;
                }

                const history = state.meetings.filter(m => 
                    (m.clientName === clientName) || 
                    (state.clients.find(c => c.name === clientName && c.id === m.clientId))
                ).sort((a, b) => b.date.localeCompare(a.date));

                if (history.length === 0) {
                    alert(`${clientName}님의 이전 회의록이 없습니다.`);
                    return;
                }

                const html = `
                    <div class="bg-white w-full max-w-xl p-6 rounded-xl shadow-2xl mx-4">

                                <p class="text-xs text-slate-500">불러올 회의록을 선택하세요. (날짜 제외하고 덮어씌워집니다)</p>
                            </div>

                        <div class="max-h-[300px] overflow-y-auto custom-scrollbar border border-slate-200 rounded-lg mb-4">

                                        <!-- [수정] 일자 너비 확대 및 줄바꿈 방지 -->
                                        <th class="p-3 border-b border-slate-200 w-28 text-center whitespace-nowrap">일자</th>
                                        <th class="p-3 border-b border-slate-200 w-20 text-center whitespace-nowrap">구분</th>
                                        <th class="p-3 border-b border-slate-200">안건</th>
                                        <th class="p-3 border-b border-slate-200 w-20 text-center whitespace-nowrap">선택</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    ${history.map(m => `
                                        <tr class="hover:bg-slate-50 transition-colors">
                                            <!-- [수정] 데이터 셀에도 줄바꿈 방지 적용 -->
                                            <td class="p-3 text-center text-slate-600 font-medium whitespace-nowrap">${m.date}</td>
                                            <td class="p-3 text-center"><span class="px-2 py-0.5 rounded bg-white border border-slate-200 text-xs font-bold text-slate-500 whitespace-nowrap">${m.type}</span></td>

                                            <td class="p-3 text-center">
                                                <button onclick="app.applyMeetingData('${m.id}')" class="px-3 py-1.5 bg-emerald-100 text-emerald-700 rounded text-xs font-bold hover:bg-emerald-200 transition-colors shadow-sm whitespace-nowrap">선택</button>
                                            </td>
                                        </tr>
                                    `).join('')}

                        </div>
                        <div class="text-right">

                `;
                showDialog(html);
                if(window.lucide) lucide.createIcons();
            },

            // [수정] 선택한 회의록 데이터 적용 함수 (폼 요소 접근 방식 개선)
            applyMeetingData: (id) => {
                const m = state.meetings.find(x => x.id === id);
                if (!m) return;
                
                // [수정] confirm 확인창 제거 (즉시 적용)
                // if (!confirm(`${m.date} 회의록 내용을 불러오시겠습니까?\n현재 작성 중인 내용은 덮어씌워집니다.`)) return;

                const form = document.getElementById('meeting-form');
                if (form) {
                    // form.elements를 사용하여 안전하게 접근
                    if (form.elements['type']) form.elements['type'].value = m.type || '수시';
                    if (form.elements['attendees']) form.elements['attendees'].value = m.attendees || '';
                    if (form.elements['topic']) form.elements['topic'].value = m.topic || '';
                    if (form.elements['content']) form.elements['content'].value = m.content || '';
                    if (form.elements['decision']) form.elements['decision'].value = m.decision || '';
                    if (form.elements['writer']) form.elements['writer'].value = m.writer || '';
                } else {
                    console.error("작성 폼을 찾을 수 없습니다.");
                }
                
                closeDialog();
            },

            // [신규] 회의록 대상자 정보 자동입력
            fillMeetingClientInfo: (input) => {
                const c = state.clients.find(x => x.name === input.value);
                if (c) {
                    document.getElementById('mt-client-birth').value = c.birthDate || '';
                    document.getElementById('mt-client-level').value = c.careLevel || '';
                    // [추가] 서비스 시작일 자동 입력
                    const startDateEl = document.getElementById('mt-client-start-date');
                    if (startDateEl) startDateEl.value = c.serviceStartDate || '';
                } else {
                    document.getElementById('mt-client-birth').value = '';
                    document.getElementById('mt-client-level').value = '';
                    // [추가] 서비스 시작일 초기화
                    const startDateEl = document.getElementById('mt-client-start-date');
                    if (startDateEl) startDateEl.value = '';
                }
            },
                    // [신규] 회의록 저장 로직
                 saveMeeting: async (e, id) => {
                     e.preventDefault();
                     if (state.isSaving) return; // [방어 1] 마우스 두 번 클릭(따닥) 방지

                     const fd = new FormData(e.target);
                     const data = Object.fromEntries(fd.entries());
                
                    // 대상자 ID 매핑
                     const client = state.clients.find(c => c.name === data.clientName);
                     data.clientId = client ? client.id : '';

                     state.isSaving = true; // 저장 시작 플래그 켜기

                    try {
                        if (id) {
                            await updateDoc(doc(db, "meetings", id), data);
                            // 화면 즉시 갱신
                            const idx = state.meetings.findIndex(m => m.id === id);
                            if (idx > -1) state.meetings[idx] = { ...state.meetings[idx], ...data };
                            app.showToast("회의록이 수정되었습니다.");
                       } else {
                          data.createdAt = new Date().toISOString();
                          const docRef = await addDoc(collection(db, "meetings"), data);
                          // [방어 2] 서버에서 이미 가져온 데이터인지 확인 후, 없을 때만 화면에 즉시 띄움 (쌍둥이 생성 방지)
                          if (!state.meetings.some(m => m.id === docRef.id)) {
                              state.meetings.push({ id: docRef.id, ...data });
                          }
                          app.showToast("회의록이 등록되었습니다.");
                      }
                    
                          app.closeModal(); // 회의록 작성 모달 닫기
                    
                    // 밑에 깔려있는 대상자관리 모달이 켜져있다면, 방금 쓴 회의록이 보이도록 대상자 모달도 새로고침!
                    const clientForm = document.getElementById('client-form');
                    if (clientForm && clientForm.dataset.id) {
                        app.openClientModal(clientForm.dataset.id);
                    }
                    
                    if (state.viewMode === 'single') updateTabContent('meeting'); else render();
                } catch (err) {
                    alert("저장 실패: " + err.message);
                } finally {
                    state.isSaving = false; // 저장이 완전히 끝나면 방어막 해제
                }
            },
            // [신규] 회의록 인쇄/PDF 기능
            printMeeting: (id) => {
                const m = state.meetings.find(x => x.id === id);
                if (!m) return alert("데이터를 찾을 수 없습니다.");
                app.printMeetingsData([m]);
            },
            
            // [삭제됨] 회의록 엑셀 양식 다운로드 및 업로드 함수 제거

            // [신규] 선택된 회의록 일괄 인쇄 기능
            printSelectedMeetings: () => {
                const selectedIds = Array.from(state.ui.selectedMeetingIds);

                }

            // [신규] 다중 선택 서류 일괄 인쇄 실행
            executePrintCaseDocuments: async () => {
                const docType = document.getElementById('print-doc-type').value;
                const year = parseInt(document.getElementById('print-doc-year').value);
                const clientIds = Array.from(state.ui.selectedClientIds);
                
                app.closeDialog();

                if (clientIds.length === 0) return;

                const loadingId = 'print-loading';
                const loadingHtml = `<div id="${loadingId}" class="fixed inset-0 z-[80] flex flex-col items-center justify-center bg-black/50 text-white backdrop-blur-sm">
                    <div class="animate-spin mb-4"><i data-lucide="loader-2" size="48"></i></div>
                    <div class="text-lg font-bold">인쇄용 문서 생성 중...</div>
                    <div class="text-sm text-slate-300 mt-2" id="${loadingId}-progress">0 / ${clientIds.length}</div>
                </div>`;
                document.body.insertAdjacentHTML('beforeend', loadingHtml);
                if(window.lucide) lucide.createIcons();

                try {
                    let combinedHtml = '';
                    let commonCss = '';
                    let completed = 0;
                    const progressEl = document.getElementById(`${loadingId}-progress`);

                    for (const cid of clientIds) {
                        // 각 대상자의 HTML 조각만 가져오기
                        const result = await app.printCaseManagement(cid, 'html', docType, year);
                        
                        if (result && result.html) {
                            if (!commonCss) commonCss = result.css; // CSS는 한 번만 적용
                            
                            // 각 대상자 문서 사이에 페이지 나눔 태그 추가 (page-break-after: always)
                            combinedHtml += `<div style="page-break-after: always; padding: 20px;">${result.html}</div>`;
                        }
                        
                        completed++;
                        if(progressEl) progressEl.innerText = `${completed} / ${clientIds.length}`;
                    }

                    if (!combinedHtml) {
                        alert("출력할 문서 내용이 없습니다.");
                        return;
                    }

                    // 모든 대상자의 HTML을 하나로 합쳐서 새 창을 열고 인쇄 실행
                    const win = window.open('', '_blank');
                    win.document.write(`<html><head><title>사례관리 서류 일괄 인쇄</title>${commonCss}</head><body>${combinedHtml}</body></html>`);
                    win.document.close();
                    win.focus();
                    
                    // 이미지가 렌더링될 약간의 시간을 준 뒤 인쇄 창 호출
                    setTimeout(() => win.print(), 800);

                } catch (e) {
                    console.error(e);
                    alert("인쇄 준비 중 오류가 발생했습니다: " + e.message);

                }

                    } else {

                            return cm.history[currentYear][section].date;
                        }
