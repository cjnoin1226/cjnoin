        }

        function renderPerformance() {
            // [수정] region 제거, months 필터 사용
            const { year, months, viewMode = 'monthRows' } = state.filters.performance;
            // 월 필터가 비어있으면 데이터가 없는 것으로 처리하거나 전체를 보여줄지 결정 (여기선 전체 선택 유도하지만 로직상 빈 배열 가능)
            const selectedMonths = (months && months.length > 0) ? months.sort((a, b) => a - b) : [];
            
            // [수정] region 필터링 제거 (행정동 필터 삭제 요청 반영)
            const targetLogs = state.logs.filter(l => l.date.startsWith(year));
            
            const stats = {};
            state.services.forEach(s => {
                const key = `${s.category}|${s.name}`;
                if (!stats[key]) {
                    stats[key] = { category: s.category, serviceName: s.name, counts: Array(12).fill(0), total: 0 };
                }
            });
            
            targetLogs.forEach(l => {
                const month = parseInt(l.date.split('-')[1]) - 1; 
                if (month < 0 || month > 11) return;
                if (l.serviceItems && l.serviceItems.length > 0) {
                    l.serviceItems.forEach(item => {
                        const key = `${item.category}|${item.serviceName}`;
                        if (stats[key]) { stats[key].counts[month]++; /* 전체 total은 일단 계산하지만, 표시할 때 재계산함 */ }
                    });
                }
            });

            const serviceOrderMap = new Map();
            state.services.forEach((s, idx) => { serviceOrderMap.set(`${s.category}|${s.name}`, idx); });

            const rows = Object.values(stats).sort((a, b) => {
                const indexA = serviceOrderMap.get(`${a.category}|${a.serviceName}`);
                const indexB = serviceOrderMap.get(`${b.category}|${b.serviceName}`);
                if (indexA !== undefined && indexB !== undefined) return indexA - indexB;
                if (indexA !== undefined) return -1;
                if (indexB !== undefined) return 1;
                if (a.category !== b.category) return a.category.localeCompare(b.category);
                return a.serviceName.localeCompare(b.serviceName);
            });

            // [수정] 선택된 월에 대해서만 합계 재계산
            const monthlyTotals = Array(12).fill(0);
            let grandTotal = 0;
            
            rows.forEach(r => {
                let rowSum = 0;
                selectedMonths.forEach(m => {
                    const monthIdx = m - 1;
                    const val = r.counts[monthIdx];
                    rowSum += val;
                    monthlyTotals[monthIdx] += val;
                });
                r.displayTotal = rowSum; // 화면 표시용 합계 저장
                grandTotal += rowSum;
            });

            const yearOptions = [];
            const currentYear = new Date().getFullYear();
            for (let y = 2020; y <= currentYear + 1; y++) {
                yearOptions.push(`<option value="${y}" ${parseInt(year) === y ? 'selected' : ''}>${y}년</option>`);
            }
            yearOptions.reverse();

            const stickColStyle = (left, z) => `position: sticky; left: ${left}px; z-index: ${z};`;
            let tableHTML = '';

            // [조건문] 보기 모드에 따른 테이블 생성
            if (viewMode === 'monthRows') {
                // --- 월별 보기 (세로: 월, 가로: 서비스) ---
                const headerGroups = {};
                const orderedCategories = [];
                rows.forEach(r => {
                    if (!headerGroups[r.category]) { headerGroups[r.category] = []; orderedCategories.push(r.category); }
                    headerGroups[r.category].push(r);
                });

                let headerRow1 = `<th class="py-2 px-4 border-b border-r bg-slate-50 text-center font-bold min-w-[60px] whitespace-nowrap" rowspan="2" style="${stickColStyle(0, 30)}">월</th>`;
                let headerRow2 = '';

                orderedCategories.forEach(cat => {
                    const services = headerGroups[cat];
                    headerRow1 += `<th class="py-2 px-2 border-b border-r bg-slate-100 text-center font-bold text-slate-700 whitespace-nowrap" colspan="${services.length}">${cat}</th>`;
                    services.forEach(s => {
                        const displayName = s.serviceName === '정서지원서비스(안전안부확인)' ? '안전안부확인' : s.serviceName;
                        headerRow2 += `<th class="py-2 px-2 border-b border-r bg-slate-50 text-center text-xs font-medium text-slate-600 min-w-[60px] max-w-[120px] whitespace-nowrap overflow-hidden text-ellipsis cursor-help" title="${s.serviceName}">${displayName}</th>`;
                    });
                });
                headerRow1 += `<th class="py-2 px-4 border-b bg-emerald-50 text-emerald-800 text-center font-bold min-w-[60px] whitespace-nowrap" rowspan="2">합계</th>`;

                let bodyRows = '';
                // [수정] selectedMonths만 순회하여 행 생성
                if (selectedMonths.length === 0) {
                    bodyRows = `<tr><td colspan="${rows.length + 2}" class="py-8 text-center text-slate-400">선택된 월이 없습니다.</td></tr>`;
                } else {
                    selectedMonths.forEach(m => {
                        const monthIdx = m - 1;
                        let rowHTML = `<td class="py-2 px-4 border-r font-bold text-slate-600 bg-white text-center sticky left-0 z-20">${m}월</td>`;
                        rows.forEach(r => {
                            const count = r.counts[monthIdx];
                            rowHTML += `<td class="py-2 px-1 border-r text-center ${count > 0 ? 'text-blue-600 font-bold bg-blue-50/30' : 'text-slate-300'}">${count || '-'}</td>`;
                        });
                        rowHTML += `<td class="py-2 px-4 text-center font-bold text-emerald-600 bg-emerald-50/50">${monthlyTotals[monthIdx]}</td>`;
                        bodyRows += `<tr class="hover:bg-slate-50 group border-b border-slate-100">${rowHTML}</tr>`;
                    });
                }

                let footerRow = `<td class="py-3 px-4 border-r text-center bg-slate-100 font-bold sticky left-0 z-20">총계</td>`;
                rows.forEach(r => { footerRow += `<td class="py-3 px-1 border-r text-center text-slate-800 font-bold bg-slate-50">${r.displayTotal}</td>`; });
                footerRow += `<td class="py-3 px-4 text-center text-emerald-700 bg-emerald-100 font-bold">${grandTotal}</td>`;

                tableHTML = `<thead class="sticky top-0 z-30 shadow-sm"><tr>${headerRow1}</tr><tr>${headerRow2}</tr></thead><tbody class="divide-y divide-slate-100">${bodyRows}<tr class="bg-slate-100 font-bold shadow-sm border-t-2 border-slate-300">${footerRow}</tr></tbody>`;
            } else {
                // --- 서비스별 보기 (세로: 서비스, 가로: 월) ---
                const wCat = 90;
                const wSvc = 150;
                
                // [수정] selectedMonths에 따라 동적으로 컬럼 생성
                const monthHeaders = selectedMonths.map(m => `<th class="py-3 px-2 border-b border-r min-w-[40px] text-center bg-slate-50">${m}월</th>`).join('');
                
                tableHTML = `
                    <thead class="sticky-header bg-slate-50 text-slate-600 font-semibold z-20 shadow-sm">
                        <tr>
                            <th class="py-3 px-2 border-b border-r min-w-[${wCat}px] bg-slate-50 text-center font-bold" style="${stickColStyle(0, 30)}">분류</th>
                            <th class="py-3 px-2 border-b border-r min-w-[${wSvc}px] bg-slate-50 text-center font-bold" style="${stickColStyle(wCat, 30)}">서비스명</th>
                            ${monthHeaders}
                            <th class="py-3 px-2 border-b bg-emerald-50 text-emerald-800 text-center font-bold min-w-[60px]">합계</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                        ${rows.length === 0 ? `<tr><td colspan="${selectedMonths.length + 3}" class="text-center py-4">데이터 없음</td></tr>` : rows.map(r => {
                            const displayName = r.serviceName === '정서지원서비스(안전안부확인)' ? '안전안부확인' : r.serviceName;
                            // 선택된 월 데이터만 렌더링
                            const cells = selectedMonths.map(m => {
                                const count = r.counts[m - 1];
                                return `<td class="py-2 px-2 border-r text-center ${count > 0 ? 'text-blue-600 font-bold bg-blue-50/30' : 'text-slate-300'}">${count || '-'}</td>`;
                            }).join('');
                            
                            return `
                            <tr class="hover:bg-slate-50 group">
                                <td class="py-2 px-2 border-r font-medium text-slate-600 bg-white text-center text-xs whitespace-nowrap" style="${stickColStyle(0, 20)}">${r.category}</td>
                                <td class="py-2 px-2 border-r text-slate-800 bg-white text-sm whitespace-nowrap text-ellipsis overflow-hidden max-w-[${wSvc}px]" title="${r.serviceName}" style="${stickColStyle(wCat, 20)}">${displayName}</td>
                                ${cells}
                                <td class="py-2 px-2 text-center font-bold text-emerald-600 bg-emerald-50/50">${r.displayTotal}</td>
                            </tr>
                        `;}).join('')}
                        <tr class="bg-slate-100 font-bold shadow-sm border-t-2 border-slate-300">
                            <td class="py-3 px-2 border-r text-center bg-slate-100" style="${stickColStyle(0, 20)}">총계</td>
                            <td class="py-3 px-2 border-r bg-slate-100" style="${stickColStyle(wCat, 20)}"></td>
                            ${selectedMonths.map(m => `<td class="py-3 px-2 border-r text-center text-slate-800">${monthlyTotals[m - 1]}</td>`).join('')}
                            <td class="py-3 px-2 text-center text-emerald-700 bg-emerald-100">${grandTotal}</td>
                        </tr>
                    </tbody>
                `;
            }

            return `
                <div class="space-y-6 animate-fade-in p-1">
                    <h2 class="text-2xl font-bold text-slate-800">월별 서비스 실적</h2>
                    <div class="sticky top-0 z-50 bg-slate-50 pt-2 pb-2 shadow-sm -mx-1 px-1">
                        <div class="flex flex-col sm:flex-row flex-wrap gap-2 items-center bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                             <div class="flex items-center bg-slate-100 rounded-lg p-1 mr-4">
                                <button onclick="app.setFilter('performance', 'viewMode', 'monthRows')" class="px-3 py-1.5 rounded-md text-sm font-bold transition-all ${viewMode === 'monthRows' ? 'bg-white text-emerald-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}">월별 보기 (기본)</button>
                                <button onclick="app.setFilter('performance', 'viewMode', 'serviceRows')" class="px-3 py-1.5 rounded-md text-sm font-bold transition-all ${viewMode === 'serviceRows' ? 'bg-white text-emerald-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}">서비스별 보기</button>
                             </div>
                             <div class="flex items-center gap-2">
                                <label class="text-sm font-bold text-slate-700">연도</label>
                                <select class="input-field py-1 px-3 w-32 font-bold" onchange="app.setFilter('performance', 'year', this.value)">
                                    ${yearOptions.join('')}
                                </select>
                             </div>
                             
                             <!-- [신규] 월 선택 드롭다운 (다중 선택) -->
                             <div class="flex items-center gap-2 ml-0 sm:ml-4 relative">
                                <label class="text-sm font-bold text-slate-700">월 선택</label>
                                <button onclick="app.togglePerfMonthDropdown()" class="input-field py-1 px-3 w-40 text-left flex justify-between items-center text-sm font-medium cursor-pointer">
                                    <span class="truncate">${selectedMonths.length === 12 ? '전체 월' : (selectedMonths.length === 0 ? '선택 없음' : `${selectedMonths.length}개 선택됨`)}</span>
                                    <i data-lucide="chevron-down" size="14" class="text-slate-400"></i>
                                </button>
                                ${state.ui.perfMonthDropdownOpen ? `
                                    <div class="fixed inset-0 z-40" onclick="app.togglePerfMonthDropdown()"></div>
                                    <div class="absolute top-full left-0 mt-1 w-48 bg-white border border-slate-200 rounded-lg shadow-xl z-50 p-2 animate-fade-in">
                                        <div class="flex justify-between items-center px-2 pb-2 mb-2 border-b border-slate-100">
                                            <span class="text-xs font-bold text-slate-500">다중 선택 가능</span>
                                            <button onclick="app.toggleAllPerfMonths()" class="text-xs text-blue-600 hover:text-blue-800 font-medium">전체선택/해제</button>
                                        </div>
                                        <div class="grid grid-cols-2 gap-1 max-h-60 overflow-y-auto">
                                            ${Array.from({length: 12}, (_, i) => i + 1).map(m => `
                                                <label class="flex items-center gap-2 text-sm p-2 hover:bg-slate-50 rounded cursor-pointer select-none">
                                                    <input type="checkbox" class="rounded text-emerald-600 focus:ring-emerald-500 w-4 h-4 border-slate-300" 
                                                        ${selectedMonths.includes(m) ? 'checked' : ''} 
                                                        onchange="app.togglePerfMonth(${m})">
                                                    <span class="text-slate-700 font-medium">${m}월</span>
                                                </label>
                                            `).join('')}
                                        </div>
                                    </div>
                                ` : ''}
                             </div>

                             <div class="flex-1"></div>
                             <button onclick="app.downloadPerformanceExcel()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg flex items-center gap-2 hover:bg-emerald-700 transition-colors shadow-sm">
                                <i data-lucide="download" size="18"></i> 엑셀 다운로드
                             </button>
                        </div>
                    </div>

                    <div id="perf-table-container" class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-auto max-h-[600px]">
                        <table class="w-full text-sm text-left border-collapse whitespace-nowrap">
                            ${tableHTML}
                        </table>
                    </div>
                </div>
            `;
        }
        
        function renderStatistics() {
             const { start, end, type, region, name } = state.filters.stats;
            const sYear = start.split('-')[0];
            const eYear = end.split('-')[0];
            const fullYearStart = `${sYear}-01-01`;
            const fullYearEnd = `${eYear}-12-31`;
            const targetClients = state.clients.filter(c => {
                const matchBasic = (region.length === 0 || region.includes(c.region)) && (!name || c.name.includes(name));
                if (!matchBasic) return false;
                const cS = c.serviceStartDate || '0000-01-01';
                const cE = c.endDate || '9999-12-31';
                return cS <= fullYearEnd && cE >= fullYearStart;
            });
            let serviceHeaders = [];
            let headerGroups = {};
            let orderedCategories = [];
            if (type === 'category') {
                serviceHeaders = [...new Set(state.services.map(s => s.category))].filter(Boolean);
            } else {
                orderedCategories = [...new Set(state.services.map(s => s.category || '기타'))];
                state.services.forEach(s => {
                    const cat = s.category || '기타';
                    if (!headerGroups[cat]) headerGroups[cat] = [];
                    if (!headerGroups[cat].includes(s.name)) headerGroups[cat].push(s.name);
                });
                serviceHeaders = orderedCategories.flatMap(cat => headerGroups[cat]);
            }
            const dataMap = {}; 
            targetClients.forEach(c => {
                dataMap[c.id] = { id: c.id, name: c.name, birthDate: c.birthDate || '-', careLevel: c.careLevel || '-', region: (c.region || '-').replace(/동$/, ''), endDate: c.endDate || '9999-12-31', total: 0, emotionalCount: 0, counts: {} };
                serviceHeaders.forEach(k => dataMap[c.id].counts[k] = 0);
            });
            state.logs.forEach(l => {
                if (l.date < start || l.date > end) return;
                let cid = l.clientId;
                if (!dataMap[cid] && l.clientName) { const found = targetClients.find(c => c.name === l.clientName); if(found) cid = found.id; }
                if (dataMap[cid]) {
                    const items = l.serviceItems || [{ serviceName: l.serviceName, category: l.serviceCategory }];
                    items.forEach(item => {
                        let key = type === 'category' ? item.category : item.serviceName;
                        if (!key && item.serviceName && type === 'category') { const s = state.services.find(svc => svc.name === item.serviceName); if(s) key = s.category; }
                        if (item.serviceName && item.serviceName.includes('정서지원')) dataMap[cid].emotionalCount++;
                        if (key && dataMap[cid].counts[key] !== undefined) { dataMap[cid].counts[key]++; dataMap[cid].total++; }
                    });
                }
            });
            const rows = Object.values(dataMap).filter(r => r.total >= 0).sort((a, b) => {
                const levelPriority = { '중점': 1, '일반': 2 };
                const pA = levelPriority[a.careLevel] || 3;
                const pB = levelPriority[b.careLevel] || 3;
                if (pA !== pB) return pA - pB;
                return a.name.localeCompare(b.name);
            });
            const colTotals = {};
            serviceHeaders.forEach(k => colTotals[k] = rows.reduce((sum, r) => sum + (r.counts[k]||0), 0));
            const grandTotal = rows.reduce((sum, r) => sum + r.total, 0);
            const W_No = 30, W_Name = 60, W_Birth = 75, W_Level = 35, W_Region = 35, W_Total = 40;
            const L_No = 0, L1 = W_No, L2 = L1 + W_Name, L3 = L2 + W_Birth, L4 = L3 + W_Level, L5 = L4 + W_Region;
            const stickColStyle = (left, z) => `position: sticky; left: ${left}px; z-index: ${z};`;
            let theadHTML = '';
            const totalRowHTML = `<tr class="bg-slate-100 font-bold shadow-sm border-b border-slate-200"><td class="py-2 px-1 border-r bg-slate-100" style="${stickColStyle(L_No, 50)}"></td><td class="py-2 px-1 border-r text-center text-slate-700 bg-slate-100" style="${stickColStyle(L1, 50)}">총계</td><td class="py-2 px-1 border-r bg-slate-100" style="${stickColStyle(L2, 50)}"></td><td class="py-2 px-1 border-r bg-slate-100" style="${stickColStyle(L3, 50)}"></td><td class="py-2 px-1 border-r bg-slate-100" style="${stickColStyle(L4, 50)}"></td><td class="py-2 px-1 text-center border-r bg-emerald-100 text-emerald-700" style="${stickColStyle(L5, 50)}">${grandTotal}</td>${serviceHeaders.map(k => `<td class="py-2 px-2 text-center border-r text-slate-700">${colTotals[k]}</td>`).join('')}</tr>`;
            if (type === 'category') {
                theadHTML = `<tr><th class="py-2 px-1 border-b border-r min-w-[${W_No}px] bg-slate-50 text-xs text-center font-bold text-slate-500" style="${stickColStyle(L_No, 50)}">No</th><th class="py-2 px-1 border-b border-r min-w-[${W_Name}px] bg-slate-50 text-xs text-center font-bold text-slate-700" style="${stickColStyle(L1, 50)}">대상자</th><th class="py-2 px-1 border-b border-r min-w-[${W_Birth}px] bg-slate-50 text-xs text-center font-bold text-slate-600" style="${stickColStyle(L2, 50)}">생년월일</th><th class="py-2 px-1 border-b border-r min-w-[${W_Level}px] bg-slate-50 text-xs text-center font-bold text-slate-600" style="${stickColStyle(L3, 50)}">등급</th><th class="py-2 px-1 border-b border-r min-w-[${W_Region}px] bg-slate-50 text-xs text-center font-bold text-slate-600" style="${stickColStyle(L4, 50)}">행정동</th><th class="py-2 px-1 bg-emerald-50 text-emerald-700 border-b border-r min-w-[${W_Total}px] text-xs text-center font-bold" style="${stickColStyle(L5, 50)}">합계</th>${serviceHeaders.map(k => `<th class="py-2 px-2 border-b border-r text-xs text-center text-slate-600 bg-slate-50 whitespace-nowrap">${k}</th>`).join('')}</tr>${totalRowHTML}`;
            } else {
                theadHTML = `<tr><th rowspan="2" class="py-2 px-1 border-b border-r min-w-[${W_No}px] bg-slate-50 z-30 text-xs text-center font-bold text-slate-500" style="${stickColStyle(L_No, 50)}">No</th><th rowspan="2" class="py-2 px-1 border-b border-r min-w-[${W_Name}px] bg-slate-50 z-30 text-xs text-center font-bold text-slate-700" style="${stickColStyle(L1, 50)}">대상자</th><th rowspan="2" class="py-2 px-1 border-b border-r min-w-[${W_Birth}px] bg-slate-50 z-30 text-xs text-center font-bold text-slate-600" style="${stickColStyle(L2, 50)}">생년월일</th><th rowspan="2" class="py-2 px-1 border-b border-r min-w-[${W_Level}px] bg-slate-50 z-30 text-xs text-center font-bold text-slate-600" style="${stickColStyle(L3, 50)}">등급</th><th rowspan="2" class="py-2 px-1 border-b border-r min-w-[${W_Region}px] bg-slate-50 z-30 text-xs text-center font-bold text-slate-600" style="${stickColStyle(L4, 50)}">행정동</th><th rowspan="2" class="py-2 px-1 bg-emerald-50 text-emerald-700 border-b border-r min-w-[${W_Total}px] z-30 text-xs text-center font-bold" style="${stickColStyle(L5, 50)}">합계</th>${orderedCategories.map(cat => `<th colspan="${headerGroups[cat].length}" class="py-1 border-b border-r bg-slate-100 text-center text-xs text-center font-semibold text-slate-600 whitespace-nowrap">${cat}</th>`).join('')}</tr><tr>${orderedCategories.map(cat => headerGroups[cat].map(svc => `<th class="py-1.5 px-2 border-b border-r font-normal text-xs text-center text-slate-500 bg-slate-50 whitespace-nowrap">${svc === '정서지원서비스(안전안부확인)' ? '안전안부확인' : svc}</th>`).join('')).join('')}</tr>${totalRowHTML}`;
            }

            return `
                <div class="space-y-6 animate-fade-in p-1">
                    <h2 class="text-2xl font-bold text-slate-800">서비스 제공 통계</h2>
                    <div class="sticky top-0 z-50 bg-slate-50 pt-2 pb-2 shadow-sm -mx-1 px-1">
                        <div class="flex flex-col sm:flex-row flex-wrap gap-2 items-center bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                            <div class="flex bg-slate-100 p-1 rounded w-full sm:w-auto justify-center">
                                <button onclick="app.setFilter('stats','type','category')" class="px-3 py-1 rounded text-sm flex-1 sm:flex-none ${type==='category'?'bg-white shadow':''}">분류별</button>
                                <button onclick="app.setFilter('stats','type','detail')" class="px-3 py-1 rounded text-sm flex-1 sm:flex-none ${type==='detail'?'bg-white shadow':''}">상세별</button>
                            </div>
                            
                            <!-- [수정] 날짜 필터 자동 갱신 방지(false) 및 조회 버튼 추가 -->
                            <div class="flex items-center gap-2 p-1 bg-slate-50 rounded-lg border border-slate-200 w-full sm:w-auto">
                                <input id="stats-start" type="date" class="bg-transparent border-0 text-sm focus:ring-0 px-1 py-1 w-[110px]" value="${start}" onchange="app.setFilter('stats','start',this.value, false)" max="9999-12-31">
                                <span class="text-slate-400">~</span>
                                <input id="stats-end" type="date" class="bg-transparent border-0 text-sm focus:ring-0 px-1 py-1 w-[110px]" value="${end}" onchange="app.setFilter('stats','end',this.value, false)" max="9999-12-31">
                                <button onclick="app.render()" class="bg-slate-800 text-white px-3 py-1 rounded-md text-sm font-medium hover:bg-slate-700 transition-colors whitespace-nowrap ml-1">조회</button>
                            </div>

                            <div class="flex w-full sm:w-auto gap-2 flex-1">
                                <input id="stats-search-name" class="input-field w-full sm:w-24 py-1 text-sm" placeholder="이름 (Enter)" value="${name}" onkeydown="if(event.key === 'Enter') app.setFilter('stats','name',this.value)" oninput="if(this.value === '') app.setFilter('stats','name','')">
                                <div class="relative z-30 w-full sm:w-auto">
                                    <button onclick="app.toggleStatsRegionDropdown()" class="input-field py-1.5 px-2 text-sm flex items-center justify-between min-w-[100px] bg-white cursor-pointer text-left h-[30px] w-full sm:w-24"><span class="truncate max-w-[80px] text-slate-700">${region.length > 0 ? (region.length === CONSTANTS.DONG_LIST.length ? '전체 동' : region.join(',')) : '전체 동'}</span><i data-lucide="chevron-down" size="14" class="text-slate-400 ml-2"></i></button>
                                    ${state.ui.statsRegionDropdownOpen ? `<div class="fixed inset-0 z-40" onclick="app.toggleStatsRegionDropdown()"></div><div class="absolute top-full left-0 mt-1 w-40 bg-white border border-slate-200 rounded-lg shadow-xl z-50 p-2 max-h-60 overflow-y-auto animate-fade-in">${CONSTANTS.DONG_LIST.map(d => `<label class="flex items-center gap-2 text-sm p-2 hover:bg-slate-50 rounded cursor-pointer select-none"><input type="checkbox" class="rounded text-emerald-600 focus:ring-emerald-500 w-4 h-4 border-slate-300" ${region.includes(d) ? 'checked' : ''} onchange="app.toggleStatsRegionFilter('${d}')"><span class="text-slate-700">${d}</span></label>`).join('')}</div>` : ''}
                                </div>
                            </div>
                            <button onclick="app.resetFilters('stats')" class="w-full sm:w-auto text-slate-400 hover:text-slate-600 p-2 rounded hover:bg-slate-100 transition-colors flex justify-center items-center flex-shrink-0" title="필터 초기화"><i data-lucide="refresh-cw" size="20"></i></button>
                            <button onclick="app.downloadStatsExcel()" class="w-full sm:w-auto bg-emerald-600 text-white p-2 rounded flex justify-center items-center flex-shrink-0"><i data-lucide="download" size="20"></i></button>
                        </div>
                    </div>
                    <div id="stats-list-container" class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-auto max-h-[600px]">
                        <table class="w-auto text-sm text-left border-collapse whitespace-nowrap">
                            <thead class="sticky-header bg-slate-50 text-slate-600 font-semibold z-20 shadow-sm" style="position: sticky; top: 0; z-index: 40;">${theadHTML}</thead>
                            <tbody class="divide-y divide-slate-100">
                                ${rows.map((r, index) => {
                                    const careLevelClass = r.careLevel === '중점' ? 'text-pink-600 font-bold' : (r.careLevel === '일반' ? 'text-blue-600 font-bold' : 'text-slate-500');
                                    const isTerminatedInPeriod = r.endDate <= fullYearEnd; 
                                    let isDeficient = false;
                                    if (!isTerminatedInPeriod) {
                                        if (r.careLevel === '중점' && r.emotionalCount < 4) isDeficient = true;
                                        else if (r.careLevel === '일반' && r.emotionalCount < 1) isDeficient = true;
                                    }
                                    return `
                                    <tr class="hover:bg-slate-50 group">
                                        <td class="py-1.5 px-1 border-r text-center text-slate-400 text-xs bg-white" style="${stickColStyle(L_No, 30)}">${index + 1}</td>
                                        <td class="py-1.5 px-1 border-r group-hover:bg-slate-50 text-center font-medium text-slate-800 bg-white cursor-pointer hover:text-blue-600" style="${stickColStyle(L1, 30)}" onclick="app.showClientStatsDetail('${r.id}', '${r.name}')" title="상세 내역 보기">${r.name}</td>
                                        <td class="py-1.5 px-1 text-center border-r text-slate-500 text-xs bg-white" style="${stickColStyle(L2, 30)}">${r.birthDate}</td>
                                        <td class="py-1.5 px-1 text-center border-r text-xs bg-white ${careLevelClass}" style="${stickColStyle(L3, 30)}">${r.careLevel}</td>
                                        <td class="py-1.5 px-1 text-center border-r text-slate-500 text-xs bg-white" style="${stickColStyle(L4, 30)}">${r.region}</td>
                                        <td class="p-1.5 text-center font-bold border-r text-emerald-600 bg-emerald-50" style="${stickColStyle(L5, 30)}">${r.total}</td>
                                        ${serviceHeaders.map(k => {
                                            const isTargetCell = isDeficient && k.includes('정서지원');
                                            let cellClass = "p-1.5 px-2 text-center border-r";
                                            if (isTargetCell) { cellClass += " text-red-600 font-bold bg-red-50"; } else { if (r.counts[k] > 0) { cellClass += " bg-blue-50 font-medium text-blue-600"; } else { cellClass += " text-slate-300"; } }
                                            return `<td class="${cellClass}">${r.counts[k]||'-'}</td>`;
                                        }).join('')}
                                    </tr>
                                `;}).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function renderServiceManager() {
            const isEditing = !!state.editingServiceId;
            const editData = isEditing ? state.services.find(s => s.id === state.editingServiceId) : {};
            
            return `
                <div class="space-y-6 animate-fade-in p-1">
                    <h2 class="text-2xl font-bold text-slate-800">서비스 목록 설정</h2>
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                        <form onsubmit="app.addService(event)" class="flex flex-col sm:flex-row flex-wrap gap-4 items-end">
                            <div class="w-full sm:flex-1 min-w-[140px]"><label class="block text-sm font-medium text-slate-700 mb-1">서비스 대분류</label><input name="majorCategory" class="input-field" placeholder="예: 위기관리" value="${editData.majorCategory || ''}" list="list-major" autocomplete="off"><datalist id="list-major">${[...new Set(state.services.map(s=>s.majorCategory).filter(Boolean))].sort().map(v=>`<option value="${v}">`).join('')}</datalist></div>
                            <div class="w-full sm:flex-1 min-w-[140px]"><label class="block text-sm font-medium text-slate-700 mb-1">서비스</label><input name="category" class="input-field" placeholder="예: 사례관리" required value="${editData.category || ''}" list="list-cat" autocomplete="off"><datalist id="list-cat">${[...new Set(state.services.map(s=>s.category).filter(Boolean))].sort().map(v=>`<option value="${v}">`).join('')}</datalist></div>
                            <div class="w-full sm:flex-1 min-w-[140px]"><label class="block text-sm font-medium text-slate-700 mb-1">서비스 상세내용</label><input name="name" class="input-field" placeholder="예: 초기상담" required value="${editData.name || ''}" list="list-name" autocomplete="off"><datalist id="list-name">${[...new Set(state.services.map(s=>s.name).filter(Boolean))].sort().map(v=>`<option value="${v}">`).join('')}</datalist></div>
                            <div class="w-full sm:flex-1 min-w-[140px]"><label class="block text-sm font-medium text-slate-700 mb-1">예시</label><input name="example" class="input-field" placeholder="예: 가정방문" value="${editData.example || ''}"></div>
                            <div class="w-full sm:w-auto flex gap-2">
                                ${isEditing ? `<button type="button" onclick="app.cancelEditService()" class="flex-1 sm:flex-none bg-slate-200 text-slate-600 px-4 py-2 rounded-lg hover:bg-slate-300 h-[42px] whitespace-nowrap">취소</button>` : ''}
                                <button type="submit" class="flex-1 sm:flex-none bg-slate-800 text-white px-6 py-2 rounded-lg hover:bg-slate-700 h-[42px] whitespace-nowrap">${isEditing ? '수정' : '추가'}</button>
                            </div>
                        </form>
                    </div>
                    <div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-auto max-h-[600px]">
                        <table class="w-full text-left min-w-[800px]">
                            <thead class="bg-slate-50 sticky top-0 z-10 shadow-sm">
                                <tr>
                                    <th class="p-4 font-semibold text-slate-600 whitespace-nowrap w-[20%]">서비스 대분류</th>
                                    <th class="p-4 font-semibold text-slate-600 whitespace-nowrap w-[20%]">서비스</th>
                                    <th class="p-4 font-semibold text-slate-600 whitespace-nowrap w-[25%]">서비스 상세내용</th>
                                    <th class="p-4 font-semibold text-slate-600 whitespace-nowrap w-[25%]">예시</th>
                                    <th class="p-4 font-semibold text-slate-600 text-right whitespace-nowrap w-[10%]">관리</th>
                                </tr>
                            </thead>
                            <tbody>${state.services.map(s => `
                                <tr class="border-t border-slate-100 hover:bg-slate-50 ${state.editingServiceId === s.id ? 'bg-slate-100' : ''}">
                                    <td class="p-4 text-slate-800">${s.majorCategory || '-'}</td>
                                    <td class="p-4 text-slate-500"><span class="bg-slate-100 px-2 py-1 rounded text-xs">${s.category}</span></td>
                                    <td class="p-4 text-slate-800 font-medium">${s.name}</td>
                                    <td class="p-4 text-slate-600 text-sm">${s.example || '-'}</td>
                                    <td class="p-4 text-right flex justify-end gap-1">
                                        <button onclick="app.editService('${s.id}')" class="text-slate-400 hover:text-blue-500 p-1"><i data-lucide="edit" size="18"></i></button>
                                        <button onclick="app.deleteData('services','${s.id}')" class="text-slate-400 hover:text-red-600 p-1"><i data-lucide="trash-2" size="18"></i></button>
                                    </td>
                                </tr>`).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        window.app = {
            setTab: (t, updateHistory = true) => { 
                if (!state.openedTabs.includes(t)) { state.openedTabs.push(t); }
                if (state.viewMode === 'single') {
                    state.activeTab = t; 
                    if (updateHistory) window.history.pushState({ tab: t }, '', `#${t}`);
                } else {
                    state.paneTabs[state.focusedPane] = t;
                }
                app.closeMobileMenu();
                app.updateTabVisibility(); 
            },
            
            updateTabVisibility: () => {
                const currentTab = state.viewMode === 'single' ? state.activeTab : state.paneTabs[state.focusedPane];
                app.renderTabBar(currentTab);
                
                document.querySelectorAll('.nav-link').forEach(b => { 
                    const tabKey = b.dataset.tab || b.dataset.tabMobile;
                    if(tabKey === currentTab) b.classList.add('active'); 
                    else b.classList.remove('active'); 
                });

                if (state.viewMode === 'single') {
                    const mainContainer = document.getElementById('main-view-container');
                    if(mainContainer) {
                        if (mainContainer.classList.contains('fixed') || (mainContainer.firstChild && mainContainer.firstChild.classList && mainContainer.firstChild.classList.contains('window-pane'))) {
                            mainContainer.className = "flex-1 w-full relative overflow-hidden flex flex-col"; 
                            mainContainer.style.backgroundColor = ""; 
                            mainContainer.innerHTML = ""; 
                            state.renderedTabs.clear();
                        }
                        const loader = document.getElementById('initial-loader');
                        if (loader) loader.remove();

                        state.openedTabs.forEach(t => {
                            let view = document.getElementById(`tab-view-${t}`);
                            if (t === state.activeTab) {
                                if (!view) { updateTabContent(t); view = document.getElementById(`tab-view-${t}`); }
                                if (view) view.classList.add('active');
                            } else {
                                if (view) view.classList.remove('active');
                            }
                        });
                    }
                } else {
                    render(); 
                }
            },

            renderTabBar: (currentTab) => {
                const tabBar = document.getElementById('top-tab-bar');
                if (tabBar) {
                    tabBar.innerHTML = state.openedTabs.map((t, index) => {
                        const isActive = t === currentTab;
                        return `
                        <div class="main-tab ${isActive ? 'active' : ''}" 
                             onclick="app.setTab('${t}')"
                             draggable="true"
                             ondragstart="app.handleTabDragStart(event, ${index})"
                             ondragover="app.handleTabDragOver(event)"
                             ondrop="app.handleTabDrop(event, ${index})"
                             ondragend="app.handleTabDragEnd(event)">
                            <span>${TAB_NAMES[t] || t}</span>
                            <button onclick="app.closeTab('${t}', event)" class="tab-close-btn" title="탭 닫기">
                                <i data-lucide="x" size="8"></i>
                            </button>
                        </div>`;
                    }).join('');
                    if(window.lucide) lucide.createIcons();
                }
            },

            handleTabDragStart: (e, index) => {
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', index);
                e.target.style.opacity = '0.4';
            },
            handleTabDragOver: (e) => {
                e.preventDefault(); 
                e.dataTransfer.dropEffect = 'move';
                return false;
            },
            handleTabDrop: (e, targetIndex) => {
                e.preventDefault();
                e.stopPropagation();
                const sourceIndex = parseInt(e.dataTransfer.getData('text/plain'));
                
                if (sourceIndex !== targetIndex && !isNaN(sourceIndex) && sourceIndex >= 0 && sourceIndex < state.openedTabs.length) {
                    const tabs = [...state.openedTabs];
                    const [movedTab] = tabs.splice(sourceIndex, 1);
                    tabs.splice(targetIndex, 0, movedTab);
                    state.openedTabs = tabs;
                    
                    const currentTab = state.viewMode === 'single' ? state.activeTab : state.paneTabs[state.focusedPane];
                    app.renderTabBar(currentTab);
                }
                return false;
            },
            handleTabDragEnd: (e) => {
                e.target.style.opacity = '';
            },

            closeTab: (t, e) => {
                if (e) e.stopPropagation();
                state.openedTabs = state.openedTabs.filter(tab => tab !== t);
                
                const view = document.getElementById(`tab-view-${t}`);
                if (view) view.remove();
                state.renderedTabs.delete(t);

                if (state.openedTabs.length === 0) state.openedTabs.push('dashboard');

                const fallbackTab = state.openedTabs[state.openedTabs.length - 1]; 
                
                if (state.viewMode === 'single') {
                    if (state.activeTab === t) {
                        state.activeTab = fallbackTab;
                        app.updateTabVisibility(); 
                        window.history.replaceState({ tab: fallbackTab }, '', `#${fallbackTab}`);
                    } else {
                        app.renderTabBar(state.activeTab); 
                    }
                } else {
                    if (state.paneTabs.left === t) state.paneTabs.left = fallbackTab;
                    if (state.paneTabs.right === t) state.paneTabs.right = fallbackTab;
                    render();
                }
            },
            toggleSplitView: () => {
                app.closeMobileMenu(); 
                if (state.viewMode === 'single') {
                    state.viewMode = 'split';
                    state.paneTabs.left = state.activeTab;
                    state.paneTabs.right = (state.activeTab === 'logs' ? 'clients' : 'logs');
                    if (!state.openedTabs.includes(state.paneTabs.right)) state.openedTabs.push(state.paneTabs.right);
                    state.focusedPane = 'left';
                    document.getElementById('split-status-text').textContent = 'ON';
                    document.getElementById('btn-split-toggle').classList.add('bg-slate-700', 'text-emerald-400', 'border-emerald-500');
                    document.body.style.overflow = 'hidden';
                    document.body.style.height = '100vh';

                    const container = document.getElementById('main-content');
                    const w = container ? container.clientWidth : window.innerWidth;
                    const h = container ? container.clientHeight : window.innerHeight;
                    const winW = Math.min(600, w / 2 - 20);
                    const winH = h - 100;
                    
                    state.windows.left = { x: 20, y: 20, w: winW, h: winH, z: 10 };
                    state.windows.right = { x: winW + 40, y: 20, w: winW, h: winH, z: 9 };
                    render();
                } else {
                    state.viewMode = 'single';
                    state.activeTab = state.paneTabs.left;
                    document.getElementById('split-status-text').textContent = 'OFF';
                    document.getElementById('btn-split-toggle').classList.remove('bg-slate-700', 'text-emerald-400', 'border-emerald-500');
                    document.body.style.overflow = '';
                    document.body.style.height = '';

                    const mainContainer = document.getElementById('main-view-container');
                    if(mainContainer) {
                        mainContainer.innerHTML = ''; 
                        state.renderedTabs.clear(); 
                    }
                    app.updateTabVisibility();
                }
            },
            
            startDrag: (e, paneId) => {
                e.preventDefault();
                app.setFocusedPane(paneId);
                const winState = state.windows[paneId];
                const el = document.getElementById(`window-${paneId}`);
                if (!el) return;

                const startX = e.clientX;
                const startY = e.clientY;
                const initialLeft = winState.x;
                const initialTop = winState.y;

                el.classList.add('dragging');
                document.body.style.userSelect = 'none';
                document.body.style.cursor = 'grabbing';

                let currentX = startX;
                let currentY = startY;
                let rafId = null;

                const updatePosition = () => {
                    const dx = currentX - startX;
                    const dy = currentY - startY;
                    winState.x = initialLeft + dx;
                    winState.y = initialTop + dy;
                    el.style.left = `${winState.x}px`;

                };

                const onMove = (moveEvent) => {

                };

                const onUp = () => {
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onUp);
                    if (rafId) cancelAnimationFrame(rafId);
                    el.classList.remove('dragging');
                    document.body.style.userSelect = '';
                    document.body.style.cursor = '';
                };
                document.addEventListener('mousemove', onMove);

            startResize: (e, paneId, direction) => {
                e.preventDefault();
                e.stopPropagation();
                app.setFocusedPane(paneId);
                const winState = state.windows[paneId];
                const el = document.getElementById(`window-${paneId}`);
                if (!el) return;

                const startX = e.clientX;
                const startY = e.clientY;
                const initialX = winState.x;
                const initialY = winState.y;
                const initialW = winState.w;
                const initialH = winState.h;

                el.classList.add('dragging'); 
                document.body.style.userSelect = 'none';
                const cursorMap = { 'n': 'n-resize', 's': 's-resize', 'e': 'e-resize', 'w': 'w-resize', 'ne': 'ne-resize', 'nw': 'nw-resize', 'se': 'se-resize', 'sw': 'sw-resize' };
                document.body.style.cursor = cursorMap[direction];

                let currentX = startX;
                let currentY = startY;
                let rafId = null;

                const updateSize = () => {
                    const dx = currentX - startX;
                    const dy = currentY - startY;
                    let newW = initialW, newH = initialH, newX = initialX, newY = initialY;

                    if (direction.includes('e')) newW = Math.max(300, initialW + dx);
                    if (direction.includes('w')) { const proposedW = initialW - dx; newW = Math.max(300, proposedW); newX = initialX + (initialW - newW); }
                    if (direction.includes('s')) newH = Math.max(200, initialH + dy);
                    if (direction.includes('n')) { const proposedH = initialH - dy; newH = Math.max(200, proposedH); newY = initialY + (initialH - newH); }

                    winState.x = newX; winState.y = newY; winState.w = newW; winState.h = newH;
                    el.style.width = `${newW}px`; el.style.height = `${newH}px`; el.style.left = `${newX}px`; el.style.top = `${newY}px`;
                    rafId = null;
                };

                const onMove = (moveEvent) => {
                    currentX = moveEvent.clientX;
                    currentY = moveEvent.clientY;
                    if (!rafId) rafId = requestAnimationFrame(updateSize);
                };

                const onUp = () => {
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onUp);
                    if (rafId) cancelAnimationFrame(rafId);
                    el.classList.remove('dragging');
                    document.body.style.userSelect = '';
                    document.body.style.cursor = '';
                };
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
            },

            executeDownloadCasePdf: async () => {
                const docType = document.getElementById('pdf-doc-type').value;
                const year = parseInt(document.getElementById('pdf-doc-year').value);
                const clientIds = Array.from(state.ui.selectedClientIds);
                
                app.closeDialog();

                if (clientIds.length === 0) return;

                if (clientIds.length === 1) {
                    // 단일 파일 다운로드
                    app.printCaseManagement(clientIds[0], 'pdf', docType, year);
                } else {
                    // 다중 파일 ZIP 다운로드
                    const loadingId = 'pdf-zip-loading';
                    const loadingHtml = `<div id="${loadingId}" class="fixed inset-0 z-[80] flex flex-col items-center justify-center bg-black/50 text-white backdrop-blur-sm">
                        <div class="animate-spin mb-4"><i data-lucide="loader-2" size="48"></i></div>
                        <div class="text-lg font-bold">PDF 생성 및 압축 중...</div>
                        <div class="text-sm text-slate-300 mt-2" id="${loadingId}-progress">0 / ${clientIds.length}</div>
                    </div>`;
                    document.body.insertAdjacentHTML('beforeend', loadingHtml);
                    if(window.lucide) lucide.createIcons();

                    try {
                        const zip = new JSZip();
                        let completed = 0;
                        const progressEl = document.getElementById(`${loadingId}-progress`);
                        
                        // 문서 이름 매핑
                        const docNames = {
                            initial: '초기면접지',
                            assessment: '사정기록지',
                            reassess: '재사정기록지',
                            satisfaction: '만족도조사',
                            evaluation: '사례평가서'
                        };
                        const docName = docNames[docType] || docType;

                        for (const cid of clientIds) {
                            // Blob 모드로 PDF 데이터 가져오기
                            const blob = await app.printCaseManagement(cid, 'blob', docType, year);
                            if (blob) {
                                const client = state.clients.find(c => c.id === cid);
                                const safeName = (client ? client.name : 'Unknown').replace(/[/\\?%*:|"<>]/g, '-');
                                const filename = `${safeName}_${docName}_${year}.pdf`;
                                zip.file(filename, blob);
                            }
                            
                            completed++;
                            if(progressEl) progressEl.innerText = `${completed} / ${clientIds.length}`;
                        }

                        const content = await zip.generateAsync({type:"blob"});
                        
                        // 다운로드 링크 생성 및 클릭
                        const link = document.createElement('a');
                        link.href = URL.createObjectURL(content);
                        link.download = `사례관리서류_모음(${docName}_${year})_${new Date().toISOString().slice(0,10)}.zip`;
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);

                    } catch (e) {
                        console.error(e);
                        alert("PDF 생성 중 오류가 발생했습니다: " + e.message);
                    } finally {
                        document.getElementById(loadingId)?.remove();
                    }
                }
            },

nter flex-shrink-0"><h4 class="font-bold text-slate-700 flex items-center gap-2"><i data-lucide="user-minus" size="18"></i> 종결 (${endClients.length}명)</h4></div><div class="overflow-y-auto p-2 flex-1"><table class="w-full text-sm text-left border-separate border-spacing-y-1"><thead class="text-xs text-slate-600 font-bold sticky top-0 bg-slate-100 z-10"><tr><th class="px-3 py-2">이름</th><th class="px-3 py-2">종결일</th><th class="px-3 py-2">사유/상태</th></tr></thead><tbody>${endClients.length ? endClients.map(c => `<tr class="hover:bg-white hover:shadow-sm transition-all cursor-pointer rounded-lg" onclick="app.openClientModal('${c.id}')"><td class="px-3 py-2 font-bold text-slate-700 bg-transparent rounded-l-lg">${c.name}</td><td class="px-3 py-2 text-slate-600 bg-transparent">${c.endDate}</td><td class="px-3 py-2 text-slate-500 text-xs bg-transparent rounded-r-lg">${c.status}</td></tr>`).join('') : '<tr><td colspan="3" class="text-center py-8 text-slate-400">데이터가 없습니다.</td></tr>'}</tbody></table></div></div></div><div class="mt-4 text-right flex-shrink-0 pt-2 border-t border-slate-100"><button onclick="app.closeModal()" class="px-5 py-2 bg-slate-800 text-white rounded-lg hover:bg-slate-700 text-sm font-medium transition-colors shadow-sm">닫기</button></div></div>`;

            openClientModal: (id) => {
                const c = id ? state.clients.find(x => x.id === id) : {};
                const modalId = id || '';
                // [수정] 장기부재 기간 로딩 로직 개선
                let absStart = c.absStart || '', absEnd = c.absEnd || '';
                if (!absStart && c.absencePeriod && c.absencePeriod.includes('~')) { 
                    const parts = c.absencePeriod.split('~'); 
                    if(parts.length === 2) { absStart = parts[0].trim(); absEnd = parts[1].trim(); } 
                }
                const initialAge = c.birthDate ? `만 ${calculateAge(c.birthDate)}세` : '';
                const cm = c.caseManagement || {};
                
                // [신규] 데이터 가져오기 헬퍼 함수 (연도별 데이터 + 구버전 데이터 호환)
                const targetYear = state.ui.cmYear;
                const getVal = (obj, path) => {
                    // path: "initial.date", "reAssessment.date" 등
                    const parts = path.split('.');
                    const section = parts[0];
                    const fieldPath = parts.slice(1).join('.');
                    
                    // 1. 초기면접(initial), 사정(assessment)은 연도 구분 없이 기존 위치 사용 (1회성 성격)
                    if (section === 'initial' || section === 'assessment') {
                        return path.split('.').reduce((o, i) => (o ? o[i] : undefined), obj) || '';
                    }

                    // 2. 재사정, 만족도, 평가서는 연도별 데이터 우선 확인
                    // 구조: cm.history[2024].reAssessment...
                    let val = undefined;
                    if (obj.history && obj.history[targetYear] && obj.history[targetYear][section]) {
                        val = fieldPath.split('.').reduce((o, i) => (o ? o[i] : undefined), obj.history[targetYear][section]);
                    }

                    // 3. 연도별 데이터가 없으면? -> 기존(구버전) 데이터 확인
                    // 단, 기존 데이터의 날짜가 현재 선택된 연도와 같을 때만 매핑하여 보여줌 (자동 마이그레이션 효과)
                    if ((val === undefined || val === null || val === '') && obj[section]) {
                        const oldDate = obj[section].date;
                        if (oldDate && oldDate.startsWith(String(targetYear))) {
                            val = fieldPath.split('.').reduce((o, i) => (o ? o[i] : undefined), obj[section]);
                        }
                    }

                    return (val === undefined || val === null) ? '' : val;
                };
                
                // 탭 상태 유지 로직 (처음 열 때만 초기화)
                const mainModal = document.getElementById('modal-container');

                const openMainForm = !mainModal.classList.contains('hidden') ? mainModal.querySelector('#client-form') : null;
                const openSubForm = !subModal.classList.contains('hidden') ? subModal.querySelector('#client-form') : null;
                const isRefreshing = (openMainForm && openMainForm.dataset.id === id) || (openSubForm && openSubForm.dataset.id === id);

                if (isRefreshing) {
                    // 이미 열려있고 같은 ID면 탭 유지 (state.ui.clientModalTab 값 사용)
                } else {
                    state.ui.clientModalTab = 'basic'; 
                    state.ui.caseSubTab = 'initial';
                    // 연도 초기화 (데이터가 있는 가장 최근 연도 또는 올해)
                    state.ui.cmYear = new Date().getFullYear();
                }

                // [유지] 서비스 내역 탭 - 연도 선택 및 데이터 로드 기능 준비
                const currentYear = new Date().getFullYear();
                let yearOptionsHTML = '';
                for (let y = 2020; y <= currentYear + 1; y++) {
                    yearOptionsHTML = `<option value="${y}" ${y === currentYear ? 'selected' : ''}>${y}년</option>` + yearOptionsHTML;
                }

                // [신규] 사례관리 관리 연도 옵션 생성
                let cmYearOptionsHTML = '';
                for (let y = 2020; y <= currentYear + 1; y++) {
                    cmYearOptionsHTML = `<option value="${y}" ${y === state.ui.cmYear ? 'selected' : ''}>${y}년</option>` + cmYearOptionsHTML;
                }
                
                // [추가] 현재 활성 탭이 연도 선택이 필요한 탭인지 확인
                const showYearSelect = ['reassess', 'satisfaction', 'evaluation'].includes(state.ui.caseSubTab);
                
                // [신규] 섹션별 초기화 버튼 생성 헬퍼
                const getSectionResetBtn = (targetId) => `
                    <button type="button" onclick="app.resetInputs('${targetId}')" class="text-xs bg-slate-100 text-slate-500 px-2 py-1 rounded hover:bg-red-50 hover:text-red-600 transition-colors flex items-center gap-1 ml-2" title="이 항목의 선택값 초기화">
                        <i data-lucide="rotate-ccw" size="12"></i> 초기화
                    </button>
                `;

                // [수정] 해당 대상자가 금년도(currentYear)에 이용한 서비스 카테고리 자동 추출
                const providedLogs = state.logs.filter(l => l.clientId === c.id && l.date.startsWith(String(currentYear)));
                const providedCategoriesSet = new Set();
                providedLogs.forEach(l => {
                    if (l.serviceItems) {
                        l.serviceItems.forEach(item => {
                            if (item.category) providedCategoriesSet.add(item.category);
                        });
                    }
                });
                const providedCategories = [...providedCategoriesSet].sort();

                let rowCount = Math.max(providedCategories.length, savedGoalsLen, 2); 

                let serviceGoalRowsHTML = '';
                for (let i = 0; i < rowCount; i++) {

                    const savedWorkerEval = getVal(cm, `satisfaction.serviceGoals.${i}.workerEval`);

                                    if (item.category === displayGoal) {
                                        if (!actionMap.has(item.serviceName)) actionMap.set(item.serviceName, new Set());
                                        if (item.detailNote && item.detailNote.trim() !== '') actionMap.get(item.serviceName).add(item.detailNote.trim());
                                    }
                                });
                            }
                        });
                        const actions = [];
                        actionMap.forEach((notesSet, serviceName) => {
                            let itemText = serviceName;

                        autoAction = actions.join('\n\n');
                    }
                    const displayAction = savedAction !== '' ? savedAction : autoAction;

                    const renderSatisfactionOptions = (rowIndex, selectedValue) => {

                }

                // [유지] 초기 데이터(현재 연도) 생성
                let historyRows = '';
                if (c.id) {
                    const clientLogs = state.logs.filter(l => l.clientId === c.id && l.date.startsWith(String(currentYear))).sort((a,b) => b.date.localeCompare(a.date));
                    historyRows = app.generateHistoryRows(clientLogs);
                } else {
                    historyRows = `<tr><td colspan="6" class="px-4 py-8 text-center text-slate-400">대상자 등록 후 확인할 수 있습니다.</td></tr>`;
                }

                const isChecked = (q, val) => getVal(cm, `satisfaction.${q}`) === val ? 'checked' : '';

                // [신규] 사례관리 내역 데이터 생성
                const caseHistory = [];
                // 기존 루트 데이터 체크
                if (cm.initial?.date) caseHistory.push({ type: '초기면접지', date: cm.initial.date, writer: cm.initial.interviewer, summary: '초기 상태 및 욕구 파악' });
                if (cm.assessment?.date) caseHistory.push({ type: '사정기록지', date: cm.assessment.date, writer: cm.assessment.writer, summary: '위기도 평가 및 개입 계획' });
                
                // 연도별 히스토리 데이터 체크
                if (cm.history) {
                    Object.keys(cm.history).forEach(year => {

                                                                            <!-- [신규] 월소득 및 주소득원 입력란 -->

                                                                                    return ['자가', '전세', '월세', '영구임대', '무상거주', '시설', '기타'].map(housing => {
                                                                                        const isChecked = savedHousings.includes(housing) ? 'checked' : '';

                                                                                            return `

                                                                                                    <span class="text-xs text-slate-600">${housing}</span>

                                                                                                </div>

                                                            </td>
                                                        </tr>

                                                                    <!-- 3) 장애여부 (UI 변경: radio -> checkbox) -->

                                                                        <div class="flex-1 flex flex-wrap items-center gap-4">
                                                                            ${(() => {
                                                                                const oldDisability = getVal(cm, 'initial.physical.disability') || getVal(cm, 'initial.health.disability');
                                                                                const newStatus = getVal(cm, 'initial.physical.disabilityStatus');
                                                                                const newType = getVal(cm, 'initial.physical.disabilityType');
                                                                                
                                                                                let status = newStatus;
                                                                                let typeValue = newType;

                                                                                        status = '무';

                                                                                        status = '유';
                                                                                        typeValue = oldDisability;
                                                                                    }
                                                                                }

                                                                                return `
                                                                                    <div class="flex items-center gap-1 transition-all">

                                                        // [수정] 재사정 데이터가 없으면 초기면접지 데이터 불러오기 (자동 체크)
                                                        let household = getVal(cm, 'reAssessment.household');
                                                        
                                                        const isHouseEmpty = !household || (Array.isArray(household) && household.length === 0);
                                                        if (isHouseEmpty) {
                                                            household = getVal(cm, 'initial.living.household') || [];

                                                        if (!Array.isArray(household)) household = [household].filter(Boolean);

                const getVal = (obj, path) => {

                    const section = parts[0];

                    }
                    
                    // 연도별 히스토리 우선 확인
                    let val = undefined;
                    if (obj.history && obj.history[year] && obj.history[year][section]) {
                        val = fieldPath.split('.').reduce((o, i) => (o ? o[i] : undefined), obj.history[year][section]);
                    }
                    
                    // 구버전 데이터 호환 (날짜 일치 시)
                    if ((val === undefined || val === null || val === '') && obj[section]) {
                        const oldDate = obj[section].date;
                        if (oldDate && oldDate.startsWith(String(year))) {
                            val = fieldPath.split('.').reduce((o, i) => (o ? o[i] : undefined), obj[section]);

                        margin: 10,

            generateHistoryRows: (logs) => {

                });

                    return historyItems.map(h => `
                        <tr class="hover:bg-slate-50 transition-colors cursor-pointer" onclick="app.openLogModal('${h.logId}')" title="클릭하여 일지 상세보기">

                        </tr>
                    `).join('');
                } else {
                    return `<tr><td colspan="6" class="px-4 py-8 text-center text-slate-400">해당 연도에 서비스 이력이 없습니다.</td></tr>`;
                }
            },
            updateClientHistory: (clientId, year) => {
                if (!clientId) return;
                const clientLogs = state.logs.filter(l => l.clientId === clientId && l.date.startsWith(year)).sort((a,b) => b.date.localeCompare(a.date));
                const rows = app.generateHistoryRows(clientLogs);
                const container = document.getElementById('client-history-list');
                if (container) container.innerHTML = rows;
            },
            fillClientInfo: (input) => {
                const c = state.clients.find(x => x.name === input.value);
                if(c) { document.getElementById('d-birth').value = c.birthDate || ''; document.getElementById('d-region').value = c.region || ''; document.getElementById('d-level').value = c.careLevel || ''; } 
                else { document.getElementById('d-birth').value = ''; document.getElementById('d-region').value = ''; document.getElementById('d-level').value = ''; }
            },
            addClientToSelection: () => {
                const input = document.getElementById('client-input');
                const name = input.value.trim();

                const isValid = state.clients.some(c => c.name === name);
                if(!isValid) { alert("등록된 대상자가 아닙니다."); return; }
                if(!window.tempSelectedClients.includes(name)) { window.tempSelectedClients.push(name); app.renderSelectedClients(); }
                input.value = ''; document.getElementById('d-birth').value = ''; document.getElementById('d-region').value = ''; document.getElementById('d-level').value = '';
            },

                const container = document.getElementById('selected-clients-area');

            handleSubModalOverlayClick: () => { if (state.ui.allowOverlayClose) closeModal(); },

            // [신규] 진행 상태 모달 제어 함수
            showProgress: (title, total) => {
                const modal = document.getElementById('progress-modal');
                const titleEl = document.getElementById('progress-title');
                const totalEl = document.getElementById('progress-total');
                const currentEl = document.getElementById('progress-current');
                const barEl = document.getElementById('progress-bar');
                const percentEl = document.getElementById('progress-percent');

                if (modal && titleEl && totalEl && currentEl && barEl) {
                    titleEl.textContent = title;
                    totalEl.textContent = total;
                    currentEl.textContent = '0';
                    barEl.style.width = '0%';
                    percentEl.textContent = '0%';
                    modal.classList.remove('hidden');
                }
            },
            updateProgress: (current) => {
                const totalEl = document.getElementById('progress-total');
                const currentEl = document.getElementById('progress-current');
                const barEl = document.getElementById('progress-bar');
                const percentEl = document.getElementById('progress-percent');

                if (totalEl && currentEl && barEl) {
                    const total = parseInt(totalEl.textContent) || 1;
                    const percent = Math.min(100, Math.round((current / total) * 100));
                    
                    currentEl.textContent = current;
                    barEl.style.width = `${percent}%`;
                    percentEl.textContent = `${percent}%`;
                }
            },
            hideProgress: () => {
                const modal = document.getElementById('progress-modal');
                if (modal) {
                    // 약간의 지연을 주어 100% 완료 상태를 사용자가 인지할 수 있게 함
                    setTimeout(() => {
                        modal.classList.add('hidden');
                    }, 500);
                }
            },

                                <div>
                                    <label class="block text-sm font-bold text-slate-700 mb-1">제공자</label>

                            <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
                                <label class="block text-sm font-bold text-slate-700 mb-2">대상자 선택 ${isEdit ? '<span class="text-xs font-normal text-red-500">(수정 모드에서는 변경 불가)</span>' : ''}</label>
                                ${!isEdit ? `

                                        <div class="flex-1 min-w-[60px]">

                                        <button type="button" onclick="app.addLogClient()" class="bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-slate-700 whitespace-nowrap h-[38px] mb-[1px] shadow-sm flex-none">추가</button>
                                    </div>
                                </div>
                                ` : ''}
                                <div id="log-selected-clients" class="flex flex-wrap gap-2 min-h-[38px] p-2 bg-white rounded border border-slate-200">

                                </div>
                            </div>

                const levelEl = document.getElementById('log-client-level');

                } else {
                    birthEl.value = '';
                    regionEl.value = '';
                    levelEl.value = '';
                }
            },
            addLogClient: () => {
                const input = document.getElementById('log-client-input');
                const name = input.value.trim();
                if(!name) return;
                
                // 유효성 검사 (등록된 대상자인지)
                const isValid = state.clients.some(c => c.name === name);
                if(!isValid) { alert("등록된 대상자가 아닙니다."); return; }
                
                if(!window.currentLogClients.includes(name)) {
                    window.currentLogClients.push(name);
                    app.renderLogClients(false);
                }
                
                // 입력 필드 초기화
                input.value = '';
                document.getElementById('log-client-birth').value = '';
                document.getElementById('log-client-region').value = '';
                document.getElementById('log-client-level').value = '';
                
                input.focus();
            },
            removeLogClient: (index) => {
                window.currentLogClients.splice(index, 1);
                app.renderLogClients(false);
            },

                if(!container) return;

                    container.innerHTML = '<span class="text-sm text-slate-400 self-center">대상자를 추가해주세요.</span>';

            saveLog: async (e, id) => {
                e.preventDefault();
                
                if (window.currentLogClients.length === 0) {
                    return alert("대상자를 최소 1명 이상 선택해주세요.");
                }

                const fd = new FormData(e.target);
                const commonData = Object.fromEntries(fd.entries());
                
                // 서비스 항목 수집
                const rows = document.querySelectorAll('.svc-row');
                const items = [];
                rows.forEach(row => {
                    const cat = row.querySelector('.cat-sel').value;
                    const svc = row.querySelector('.svc-sel').value;
                    const det = row.querySelector('.det-inp').value;
                    if(svc) items.push({ id: Date.now() + Math.random(), category: cat, serviceName: svc, detailNote: det });
                });
                if(items.length === 0) return alert("최소 1개의 서비스를 입력해주세요.");
                
                commonData.serviceItems = items;
                commonData.serviceCategory = items[0].category;
                commonData.serviceName = items.map(i => i.serviceName).join(', ');

                // 다중 생성(Batch)일 경우에만 플래그 설정
                const isBatchCreate = !id && window.currentLogClients.length > 1;
                if (isBatchCreate) state.isBatching = true;

                try {
                    if (id) {
                        // 수정 모드 (단일 건)
                        const clientName = window.currentLogClients[0]; // 수정 시에는 1명만 있음
                        const client = state.clients.find(c => c.name === clientName);
                        if (client) commonData.clientId = client.id;
                        commonData.clientName = clientName;

                        await updateDoc(doc(db, "logs", id), commonData);
                        alert("일지가 수정되었습니다.");
                    } else {
                        // 작성 모드 (다중 건 생성 가능)
                        const batchPromises = window.currentLogClients.map(async (clientName) => {
                            const data = { ...commonData, clientName };
                            const client = state.clients.find(c => c.name === clientName);
                            if (client) data.clientId = client.id;
                            data.createdAt = new Date().toISOString();
                            return addDoc(collection(db, "logs"), data);
                        });
                        
                        await Promise.all(batchPromises);
                        alert(`${window.currentLogClients.length}건의 일지가 저장되었습니다.`);
                    }
                    
                    app.closeModal();
                } catch (err) { 
                    console.error(err);
                    alert("저장 실패: " + err.message);

                    if (isBatchCreate) {
                        state.isBatching = false;
                        if(state.viewMode==='single') updateTabContent('logs'); else render();
                    }
                }

            },
            downloadLogsExcel: () => {

            uploadLogExcel: (input) => {
