                                                                    IADL
                                                                </button>
                                                            </div>
                                                        </th>
                                                        <td class="p-0">
                                                            <textarea id="cm-assess-env" class="input-field w-full min-h-[80px] border-0 focus:ring-0 rounded-none p-3 resize-none overflow-hidden leading-relaxed" placeholder="식사 해결, 가사 활동 수행 능력, 기타 특이사항" oninput="this.style.height = 'auto'; this.style.height = (this.scrollHeight) + 'px'">${getVal(cm, 'assessment.environment')}</textarea>
                                                        </td>
                                                    </tr>
                                                </tbody>
                                            </table>
                                        </div>

                                        <!-- 3. 종합 사정 -->
                                        <div class="border border-slate-200 rounded-lg overflow-hidden bg-white shadow-sm">
                                            <div class="bg-slate-100 p-2.5 border-b border-slate-200 flex items-center gap-2">
                                                <div class="w-1.5 h-4 bg-blue-500 rounded-full"></div>
                                                <span class="font-bold text-slate-700 text-sm">3. 종합 소견 (General Opinion)</span>
                                            </div>
                                            <div class="p-0">
                                                <textarea id="cm-assess-general" class="input-field w-full h-32 border-0 focus:ring-0 rounded-none p-3 resize-none leading-relaxed" placeholder="위기 요인(Problem), 강점(Strength), 자원 등을 종합하여 클라이언트의 주요 욕구 및 문제 정의">${getVal(cm, 'assessment.general')}</textarea>
                                            </div>
                                        </div>

                                        <!-- 4. 개입 계획 -->
                                        <div class="border border-slate-200 rounded-lg overflow-hidden bg-white shadow-sm">
                                            <div class="bg-slate-100 p-2.5 border-b border-slate-200 flex items-center gap-2">
                                                <div class="w-1.5 h-4 bg-emerald-500 rounded-full"></div>
                                                <span class="font-bold text-slate-700 text-sm">4. 개입 계획 (Service Plan)</span>
                                            </div>
                                            <div class="divide-y divide-slate-100">
                                                <div class="flex">
                                                    <div class="w-[18%] bg-slate-50 p-3 font-bold text-slate-700 border-r border-slate-200 text-sm flex items-center justify-center">개입 목표</div>
                                                    <div class="flex-1 p-0">
                                                        <textarea id="cm-assess-goal" class="input-field w-full h-20 border-0 focus:ring-0 rounded-none p-3 resize-none leading-relaxed" placeholder="장기 목표 및 단기 목표 설정">${getVal(cm, 'assessment.goal')}</textarea>
                                                    </div>
                                                </div>
                                                <div class="flex">
                                                    <div class="w-[18%] bg-slate-50 p-3 font-bold text-slate-700 border-r border-slate-200 text-sm flex items-center justify-center">세부 계획</div>
                                                    <div class="flex-1 p-0">
                                                        <textarea id="cm-assess-plan" class="input-field w-full h-32 border-0 focus:ring-0 rounded-none p-3 resize-none leading-relaxed" placeholder="제공할 서비스 내용, 연계 자원, 개입 방법 및 빈도 등 구체적 계획 수립">${getVal(cm, 'assessment.plan')}</textarea>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div id="sub-tab-reassess" class="sub-tab-content ${state.ui.caseSubTab === 'reassess' ? 'active' : ''} space-y-4">
                                        <!-- [수정] 재사정 탭 구성 변경: 일자, 분류(2줄 상세), 주소+전화번호, 가족사항, 유형+요인 -->
                                        <div class="flex justify-between items-end">
                                            <div>
                                                <label class="text-sm block mb-1 font-bold">재사정일자</label>
                                                <input type="text" id="cm-re-date" class="input-field w-40" value="${getVal(cm, 'reAssessment.date')}" placeholder="YYYY-MM-DD">
                                            </div>
                                            <!-- [신규] 버튼들을 나란히 묶는 div 추가 -->
                                            <div class="flex items-center gap-2 mb-1">
                                                <button type="button" onclick="app.openMeetingModal(null, { clientName: '${c.name}', clientBirth: '${c.birthDate}', clientLevel: '${c.careLevel}', type: '재사정' })" class="text-xs bg-emerald-50 text-emerald-600 border border-emerald-200 px-3 py-1.5 rounded hover:bg-emerald-100 transition-colors flex items-center gap-1 font-bold shadow-sm" title="이 대상자의 재사정 회의록을 작성합니다.">
                                                    <i data-lucide="plus" size="14"></i> 사례회의록 작성
                                                </button>
                                                <button type="button" onclick="app.openReassessHistorySelector('${c.id}')" class="text-xs bg-white text-blue-600 border border-blue-200 px-3 py-1.5 rounded hover:bg-blue-50 transition-colors flex items-center gap-1 font-bold shadow-sm" title="원하는 연도의 재사정 기록을 선택하여 덮어씌웁니다.">
                                                    <i data-lucide="history" size="14"></i> 기록 불러오기
                                                </button>
                                            </div>
                                        </div>

                                        <!-- [신규] 대상자 기본정보 섹션 (일자 바로 아래 배치) - 한 줄 배치로 수정 -->
                                        <div class="bg-white border border-slate-200 rounded-xl p-3 shadow-sm">
                                            <div class="text-sm font-bold text-slate-700 mb-2">대상자 기본정보</div>
                                            <div class="flex flex-wrap items-end gap-2">
                                                <div class="w-20">
                                                    <label class="text-[10px] text-slate-500 block mb-0.5">이름</label>
                                                    <input class="input-field py-1 px-2 text-xs bg-slate-50 text-slate-700 text-center" value="${c.name}" readonly tabindex="-1">
                                                </div>
                                                <div class="w-[80px]">
                                                    <label class="text-[10px] text-slate-500 block mb-0.5">등급</label>
                                                    <select id="cm-re-level" class="input-field py-1 px-2 text-xs cursor-pointer">
                                                        ${(() => {
                                                            const savedLevel = getVal(cm, 'reAssessment.careLevel') || c.careLevel;
                                                            return CONSTANTS.CARE_LEVEL_LIST.map(v => `<option value="${v}" ${savedLevel === v ? 'selected' : ''}>${v}</option>`).join('');
                                                        })()}
                                                    </select>
                                                </div>
                                                <div class="w-24">
                                                    <label class="text-[10px] text-slate-500 block mb-0.5">생년월일</label>
                                                    <input class="input-field py-1 px-2 text-xs bg-slate-50 text-slate-700 text-center" value="${c.birthDate}" readonly tabindex="-1">
                                                </div>
                                                <div class="flex-1 min-w-[200px]">
                                                    <label class="text-[10px] text-slate-500 block mb-0.5">주소</label>
                                                    <input type="text" id="cm-re-address" class="input-field py-1 px-2 text-xs" placeholder="주소 입력" value="${getVal(cm, 'reAssessment.address') || c.address}">
                                                </div>
                                                <div class="w-32">
                                                    <label class="text-[10px] text-slate-500 block mb-0.5">전화번호</label>
                                                    <input type="text" id="cm-re-phone" class="input-field py-1 px-2 text-xs" placeholder="연락처" value="${getVal(cm, 'reAssessment.phone') || c.phone || ''}">
                                                </div>
                                            </div>
                                        </div>

                                        <div class="bg-slate-50 p-3 rounded border border-slate-200">
                                            <label class="text-sm block mb-2 font-bold text-slate-700">대상자분류</label>
                                            <div class="space-y-3">
                                                <!-- 1줄: 경제상황 -->
                                                <div class="flex flex-wrap items-center gap-x-4 gap-y-2">
                                                    <span class="text-xs font-bold text-slate-500 mr-1">[경제]</span>
                                                    ${(() => {
                                                        // [수정] 재사정 데이터가 없으면 초기면접지 데이터 불러오기 (자동 체크)
                                                        let eco = getVal(cm, 'reAssessment.economic');
                                                        let condDetail = getVal(cm, 'reAssessment.economicDetail.conditional');
                                                        let otherDetail = getVal(cm, 'reAssessment.economicDetail.other');
                                                        
                                                        // 재사정 경제 정보가 비어있으면(배열길이 0 또는 falsy) 초기면접지 정보 사용
                                                        const isEcoEmpty = !eco || (Array.isArray(eco) && eco.length === 0);
                                                        if (isEcoEmpty) {
                                                            eco = getVal(cm, 'initial.living.economic') || [];
                                                            // 상세 내용도 같이 가져옴
                                                            if (!condDetail) condDetail = getVal(cm, 'initial.living.economicDetail.conditional');
                                                            if (!otherDetail) otherDetail = getVal(cm, 'initial.living.economicDetail.other');
                                                        }
                                                        
                                                        // 배열 보장
                                                        if (!Array.isArray(eco)) eco = [eco].filter(Boolean);
                                                        
                                                        return `
                                                            <label class="flex items-center gap-1.5 cursor-pointer hover:bg-white px-1 py-0.5 rounded transition-colors">
                                                                <input type="checkbox" name="cm-re-eco" value="기초수급자" class="w-3.5 h-3.5 text-blue-600 rounded border-slate-300 focus:ring-blue-500" ${eco.includes('기초수급자') || eco.includes('기초수급(의료/생계/주거)') ? 'checked' : ''}>
                                                                <span class="text-sm text-slate-700">기초수급자(의료/생계/주거)</span>
                                                            </label>
                                                            <div class="flex items-center gap-1">
                                                                <label class="flex items-center gap-1.5 cursor-pointer hover:bg-white px-1 py-0.5 rounded transition-colors">
                                                                    <input type="checkbox" name="cm-re-eco" value="조건부수급자" class="w-3.5 h-3.5 text-blue-600 rounded border-slate-300 focus:ring-blue-500" ${eco.includes('조건부수급자') || eco.includes('조건부 수급') ? 'checked' : ''} onchange="app.toggleDisplay(this, 'cm-re-eco-cond')">
                                                                    <span class="text-sm text-slate-700">조건부수급자</span>
                                                                </label>
                                                                <input type="text" id="cm-re-eco-cond" class="input-field py-0.5 px-2 text-xs w-24 border-slate-300 ${eco.includes('조건부수급자') || eco.includes('조건부 수급') ? '' : 'hidden'}" placeholder="내용" value="${condDetail}">
                                                            </div>
                                                            <label class="flex items-center gap-1.5 cursor-pointer hover:bg-white px-1 py-0.5 rounded transition-colors">
                                                                <input type="checkbox" name="cm-re-eco" value="차상위" class="w-3.5 h-3.5 text-blue-600 rounded border-slate-300 focus:ring-blue-500" ${eco.includes('차상위') ? 'checked' : ''}>
                                                                <span class="text-sm text-slate-700">차상위</span>
                                                            </label>
                                                            <label class="flex items-center gap-1.5 cursor-pointer hover:bg-white px-1 py-0.5 rounded transition-colors">
                                                                <input type="checkbox" name="cm-re-eco" value="일반(저소득)" class="w-3.5 h-3.5 text-blue-600 rounded border-slate-300 focus:ring-blue-500" ${eco.includes('일반(저소득)') ? 'checked' : ''}>
                                                                <span class="text-sm text-slate-700">일반(저소득)</span>
                                                            </label>
                                                            <div class="flex items-center gap-1">
                                                                <label class="flex items-center gap-1.5 cursor-pointer hover:bg-white px-1 py-0.5 rounded transition-colors">
                                                                    <input type="checkbox" name="cm-re-eco" value="기타" class="w-3.5 h-3.5 text-blue-600 rounded border-slate-300 focus:ring-blue-500" ${eco.includes('기타') ? 'checked' : ''} onchange="app.toggleDisplay(this, 'cm-re-eco-other')">
                                                                    <span class="text-sm text-slate-700">기타</span>
                                                                </label>
                                                                <input type="text" id="cm-re-eco-other" class="input-field py-0.5 px-2 text-xs w-24 border-slate-300 ${eco.includes('기타') ? '' : 'hidden'}" placeholder="내용" value="${otherDetail}">
                                                            </div>
                                                        `;
                                                    })()}
                                                </div>
                                                
                                                <!-- 2줄: 세대유형 -->
                                                <div class="flex flex-wrap items-center gap-x-4 gap-y-2 border-t border-dashed border-slate-200 pt-2">
                                                    <span class="text-xs font-bold text-slate-500 mr-1">[세대]</span>
                                                    ${['독거', '부부세대', '동거', '자녀동거세대', '조손동거세대'].map(h => {
                                                        // [수정] 재사정 데이터가 없으면 초기면접지 데이터 불러오기 (자동 체크)
                                                        let household = getVal(cm, 'reAssessment.household');
                                                        
                                                        const isHouseEmpty = !household || (Array.isArray(household) && household.length === 0);
                                                        if (isHouseEmpty) {
                                                            household = getVal(cm, 'initial.living.household') || [];
                                                        }
                                                        
                                                        if (!Array.isArray(household)) household = [household].filter(Boolean);
                                                        
                                                        // 초기면접지의 '독거세대'와 재사정의 '독거' 호환 처리
                                                        const isChecked = household.includes(h) || (h === '독거' && household.includes('독거세대'));

                                                        return `
                                                        <label class="flex items-center gap-1.5 cursor-pointer hover:bg-white px-1 py-0.5 rounded transition-colors">
                                                            <input type="checkbox" name="cm-re-house" value="${h}" class="w-3.5 h-3.5 text-emerald-600 rounded border-slate-300 focus:ring-emerald-500" ${isChecked ? 'checked' : ''}>
                                                            <span class="text-sm text-slate-700">${h}</span>
                                                        </label>`;
                                                    }).join('')}
                                                </div>

                                                <!-- 3줄: 가족사항 (신규 추가) -->
                                                <div class="border-t border-dashed border-slate-200 pt-3 mt-1">
                                                    <div class="flex items-center gap-2 mb-2">
                                                        <span class="text-xs font-bold text-slate-500">[가족사항]</span>
                                                        <button type="button" onclick="app.addReassessFamilyRow()" class="w-5 h-5 flex items-center justify-center bg-white border border-slate-300 rounded hover:bg-blue-50 hover:text-blue-600 transition-all shadow-sm" title="가족 추가">
                                                            <i data-lucide="plus" size="12"></i>
                                                        </button>
                                                    </div>
                                                    <div class="overflow-x-auto border border-slate-200 rounded-lg bg-white">
                                                        <table class="w-full text-xs text-left border-collapse min-w-[600px]">
                                                            <thead class="bg-slate-50 text-slate-600 font-bold">
                                                                <tr>
                                                                    <th class="p-1.5 border-r border-b border-slate-200 text-center w-[12%]">관계</th>
                                                                    <th class="p-1.5 border-r border-b border-slate-200 text-center w-[15%]">성명</th>
                                                                    <th class="p-1.5 border-r border-b border-slate-200 text-center w-[18%]">생년월일</th>
                                                                    <th class="p-1.5 border-r border-b border-slate-200 text-center w-[15%]">직업</th>
                                                                    <th class="p-1.5 border-r border-b border-slate-200 text-center w-[12%]">종교</th>
                                                                    <th class="p-1.5 border-r border-b border-slate-200 text-center w-[10%]">동거여부</th>
                                                                    <th class="p-1.5 border-b border-slate-200 text-center w-[18%]">비고</th>
                                                                </tr>
                                                            </thead>
                                                            <tbody id="cm-re-family-tbody">
                                                                ${(() => {
                                                                    let famStr = getVal(cm, 'reAssessment.family');
                                                                    let famData = [];
                                                                    try { 
                                                                        famData = JSON.parse(famStr); 
                                                                        if (!Array.isArray(famData)) famData = [];
                                                                    } catch(e) { 
                                                                        // 이전 버전(단순 텍스트)과의 호환성 유지
                                                                        if (famStr) famData = [{ note: famStr }];
                                                                    }
                                                                    
                                                                    // 입력 칸 기본 3줄 보장
                                                                    while (famData.length < 3) famData.push({});
                                                                    
                                                                    const famVal = (famStr || '[]').replace(/'/g, "&#39;");
                                                                    
                                                                    // 입력값이 바뀔 때마다 전체 데이터를 JSON으로 변환하여 저장 필드에 실시간 동기화
                                                                    const updateScript = `const tbody=this.closest('tbody'); const rows=Array.from(tbody.querySelectorAll('tr')); const data=rows.map(tr=>({rel:tr.querySelector('.r-rel').value, name:tr.querySelector('.r-name').value, birth:tr.querySelector('.r-birth').value, job:tr.querySelector('.r-job').value, relg:tr.querySelector('.r-relg').value, co:tr.querySelector('.r-co').value, note:tr.querySelector('.r-note').value})); document.getElementById('cm-re-family').value=JSON.stringify(data);`;

                                                                    const rowsHtml = famData.map(f => `
                                                                        <tr class="hover:bg-slate-50 transition-colors">
                                                                            <td class="p-0 border-r border-b border-slate-200 last:border-b-0"><input type="text" class="r-rel w-full p-1.5 text-center outline-none bg-transparent focus:bg-white transition-colors" value="${f.rel || ''}" oninput="${updateScript}"></td>
                                                                            <td class="p-0 border-r border-b border-slate-200 last:border-b-0"><input type="text" class="r-name w-full p-1.5 text-center outline-none bg-transparent focus:bg-white transition-colors" value="${f.name || ''}" oninput="${updateScript}"></td>
                                                                            <td class="p-0 border-r border-b border-slate-200 last:border-b-0"><input type="text" class="r-birth w-full p-1.5 text-center outline-none bg-transparent focus:bg-white transition-colors" value="${f.birth || ''}" placeholder="YYYY-MM-DD" oninput="${updateScript}"></td>
                                                                            <td class="p-0 border-r border-b border-slate-200 last:border-b-0"><input type="text" class="r-job w-full p-1.5 text-center outline-none bg-transparent focus:bg-white transition-colors" value="${f.job || ''}" oninput="${updateScript}"></td>
                                                                            <td class="p-0 border-r border-b border-slate-200 last:border-b-0"><input type="text" class="r-relg w-full p-1.5 text-center outline-none bg-transparent focus:bg-white transition-colors" value="${f.relg || ''}" oninput="${updateScript}"></td>
                                                                            <td class="p-0 border-r border-b border-slate-200 last:border-b-0">
                                                                                <select class="r-co w-full p-1.5 text-center outline-none bg-transparent focus:bg-white cursor-pointer transition-colors" onchange="${updateScript}">
                                                                                    <option value=""></option>
                                                                                    <option value="O" ${f.co === 'O' ? 'selected' : ''}>O</option>
                                                                                    <option value="X" ${f.co === 'X' ? 'selected' : ''}>X</option>
                                                                                </select>
                                                                            </td>
                                                                            <td class="p-0 border-b border-slate-200 last:border-b-0"><input type="text" class="r-note w-full p-1.5 text-center outline-none bg-transparent focus:bg-white transition-colors" value="${f.note || ''}" oninput="${updateScript}"></td>
                                                                        </tr>
                                                                    `).join('');
                                                                    
                                                                    // 기존의 saveClient 함수가 값을 가져갈 수 있도록 동일한 ID(cm-re-family)의 hidden input 생성
                                                                    return rowsHtml + `<input type="hidden" id="cm-re-family" value='${famVal}'>`;
                                                                })()}
                                                            </tbody>
                                                        </table>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                        <!-- [수정] 재사정유형과 재사정 요인 나란히 배치 (주소, 전화번호는 위로 이동됨) -->
                                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                            <div>
                                                <label class="text-sm block mb-1 font-bold text-slate-700">재사정유형</label>
                                                ${(() => {
                                                    const rType = getVal(cm, 'reAssessment.type');
                                                    const rOpts = ["새로운 욕구가 발생", "긴급한 상황이 발생"];
                                                    let rSel = "";
                                                    let rInp = "";
                                                    let rHidden = "hidden";
                                                    
                                                    if (rType) {
                                                        if (rOpts.includes(rType)) {
                                                            rSel = rType;
                                                        } else {
                                                            rSel = "기타";
                                                            rInp = rType;
                                                            rHidden = "";
                                                        }

                const client = state.clients.find(c => c.id === clientId);

                const cm = client.caseManagement || {};

                }

                // 데이터 조회 헬퍼 (연도별 데이터 호환)
                const getVal = (obj, path) => {
                    const parts = path.split('.');
                    const section = parts[0];
                    const fieldPath = parts.slice(1).join('.');
                    
                    // 초기면접, 사정은 연도 무관 (루트 데이터 사용)
                    if (section === 'initial' || section === 'assessment') {
                        return path.split('.').reduce((o, i) => (o ? o[i] : undefined), obj) || '';
                    }
                    
                    // 연도별 히스토리 우선 확인
                    let val = undefined;
                    if (obj.history && obj.history[year] && obj.history[year][section]) {
                        val = fieldPath.split('.').reduce((o, i) => (o ? o[i] : undefined), obj.history[year][section]);
                    }
                    
                    // 구버전 데이터 호환 (날짜 일치 시)
                    if ((val === undefined || val === null || val === '') && obj[section]) {
                        const oldDate = obj[section].date;
                        if (oldDate && oldDate.startsWith(String(year))) {
                            val = fieldPath.split('.').reduce((o, i) => (o ? o[i] : undefined), obj[section]);
                        }
                    }
                    return (val === undefined || val === null) ? '' : val;

                    providedCategoriesMap.forEach((val, key) => {
                        if (!deletedGoals.includes(key)) {

                    // 4. 과거에 저장된 내역 병합 (삭제 안 된 것 또는 평가가 남겨진 것만 유지)

                                    <tr><th width="20%">변화된 욕구</th><td>${getVal(cm, 'satisfaction.monitor.needsChange')}</td></tr>
                                </tbody>
                            </table>

                        <div class="keep-together">
                            <h2>2. 서비스 종합계획</h2>
                            <table>
                                <tbody>
                                    <tr><th width="20%">모니터링 결과 반영</th><td>
                                        ${renderChk(getVal(cm, 'satisfaction.monitorResult.maintain'))} 서비스 유지 &nbsp;
                                        ${renderChk(getVal(cm, 'satisfaction.monitorResult.change'))} 서비스 계획 변경 &nbsp;

                                    </td></tr>
                                    <tr><th width="20%" height="80">종합평가 및 향후계획</th><td style="vertical-align: top;">${(getVal(cm, 'satisfaction.comprehensivePlan')||'').replace(/\n/g, '<br>')}</td></tr>
                                </tbody>
                            </table>
                        </div>
                    `;
                } else if (docType === 'evaluation') {
                    docTitle = `사례평가서(${year}년)`;
                    htmlContent = `
                        <!-- [수정] 제목과 결재란 겹침 방지: 좌측 여백을 줄여 자연스럽게 왼쪽으로 당김 -->
                        <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 10px; min-height: 90px;">
                            <div style="width: 40px; flex-shrink: 0;"></div> <!-- 좌측 여백 축소 -->

                            <div style="width: 180px; flex-shrink: 0;">
                                ${signBoxHtml}
                            </div>
                        </div>
                        <div class="clearfix"></div>

                        <table>
                            <tr><th>대상자명</th><td>${client.name}</td><th>평가일자</th><td>${getVal(cm, 'evaluation.date')}</td></tr>
                            <tr><th>작성자</th><td>${getVal(cm, 'evaluation.writer')}</td><th>생년월일</th><td>${client.birthDate}</td></tr>
                        </table>

                        <h2>1. 영역별 평가</h2>
                        <table>
                            <tr class="bg-gray"><th>구분</th><th>평가 점수 (5점 만점)</th></tr>
                            <tr><td>아웃리치 (초기면접 등)</td><td class="text-center">${getVal(cm, 'evaluation.ratings.outreach_0')} / ${getVal(cm, 'evaluation.ratings.outreach_1')}</td></tr>
                            <tr><td>사정 (욕구파악 등)</td><td class="text-center">${getVal(cm, 'evaluation.ratings.assessment_0')} / ${getVal(cm, 'evaluation.ratings.assessment_1')}</td></tr>
                            <tr><td>서비스 계획 및 제공</td><td class="text-center">${getVal(cm, 'evaluation.ratings.service_0')} / ${getVal(cm, 'evaluation.ratings.service_1')}</td></tr>
                            <tr><td>재사정 및 종결</td><td class="text-center">${getVal(cm, 'evaluation.ratings.reassessment_0')} / ${getVal(cm, 'evaluation.ratings.reassessment_1')}</td></tr>

                            <tr><th width="20%" height="80">부정적 영향</th><td style="vertical-align: top;">${(getVal(cm, 'evaluation.impact.negative')||'').replace(/\n/g, '<br>')}</td></tr>
                            <tr><th width="20%" height="80">변화된 욕구</th><td style="vertical-align: top;">${(getVal(cm, 'evaluation.impact.changedNeeds')||'').replace(/\n/g, '<br>')}</td></tr>
                        </table>

                        <h2>3. 종합 소견</h2>
                        <table>
                            <tr><th width="20%">향후 방향</th><td>${renderRadio(getVal(cm, 'evaluation.direction'), '계속지원')} &nbsp; ${renderRadio(getVal(cm, 'evaluation.direction'), '종결')}</td></tr>
                            <tr><th width="20%" height="120">종합 의견</th><td style="vertical-align: top;">${(getVal(cm, 'evaluation.generalOpinion')||'').replace(/\n/g, '<br>')}</td></tr>
                        </table>

                if (!htmlContent) return alert("문서 내용을 생성할 수 없습니다.");

                // HTML 출력 또는 PDF 생성
                if (mode === 'print') {
                    const win = window.open('', '_blank');
                    win.document.write(`<html><head><title>${client.name} - ${docTitle}</title>${commonCss}</head><body>${htmlContent}</body></html>`);
                    win.document.close();
                    win.focus();
                    setTimeout(() => win.print(), 500);
                } else if (mode === 'pdf' || mode === 'blob') {
                    const element = document.createElement('div');
                    element.innerHTML = `${commonCss}<div style="padding: 20px;">${htmlContent}</div>`;
                    
                    const opt = {
                        margin: 10,
                        filename: `${client.name}_${docTitle}.pdf`,
                        image: { type: 'jpeg', quality: 0.98 },
                        html2canvas: { scale: 2, useCORS: true },
                        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                    };

                    if (mode === 'blob') {
                        return html2pdf().set(opt).from(element).output('blob');
                    } else {
                        html2pdf().set(opt).from(element).save();
                    }
                } else if (mode === 'html') {
                    // [신규] 다중 인쇄를 위해 HTML과 CSS만 따로 반환
                    return { html: htmlContent, css: commonCss }; 
                }
            },

            generateHistoryRows: (logs) => {
                const historyItems = [];
                logs.forEach(l => {
                    if (l.serviceItems && l.serviceItems.length > 0) {
                        l.serviceItems.forEach(item => {
                            historyItems.push({
                                logId: l.id,
                                date: l.date,
                                provideMethod: l.provideMethod || '방문',
                                category: item.category,
                                serviceName: item.serviceName,
                                detailNote: item.detailNote,
                                provider: l.provider
                            });
                        });
                    }
                });

                if (historyItems.length > 0) {
                    return historyItems.map(h => `
                        <tr class="hover:bg-slate-50 transition-colors cursor-pointer" onclick="app.openLogModal('${h.logId}')" title="클릭하여 일지 상세보기">
                            <td class="pl-4 pr-3 py-3 text-slate-600 font-medium whitespace-nowrap">${h.date}</td>
                            <td class="pl-2 pr-4 py-3 text-slate-600 text-sm text-center whitespace-nowrap">${h.provideMethod}</td>
                            <td class="px-4 py-3 text-slate-500 text-xs whitespace-nowrap">${h.category}</td>
                            <td class="pl-4 pr-1 py-3 text-slate-800 font-bold whitespace-nowrap">${h.serviceName}</td>
                            <td class="pl-1 pr-4 py-3 text-slate-600 text-xs whitespace-nowrap">${h.detailNote || '-'}</td>
                            <td class="px-4 py-3 text-slate-500 text-xs text-center whitespace-nowrap">${h.provider || '-'}</td>
                        </tr>
                    `).join('');
                } else {
                    return `<tr><td colspan="6" class="px-4 py-8 text-center text-slate-400">해당 연도에 서비스 이력이 없습니다.</td></tr>`;
                }
            },
            updateClientHistory: async (clientId, year) => {
                if (!clientId) return;

                // [신규] 선택한 연도의 데이터가 로드되지 않았다면 서버에서 가져옴
                const targetYear = parseInt(year);
                if (!state.loadedYears.has(targetYear)) {
                    await app.loadLogsByYear(targetYear);
                }

                const clientLogs = state.logs.filter(l => l.clientId === clientId && l.date.startsWith(year)).sort((a,b) => b.date.localeCompare(a.date));
                const rows = app.generateHistoryRows(clientLogs);
                const container = document.getElementById('client-history-list');
                if (container) container.innerHTML = rows;
            },
            fillClientInfo: (input) => {
                const c = state.clients.find(x => x.name === input.value);
                if(c) { document.getElementById('d-birth').value = c.birthDate || ''; document.getElementById('d-region').value = c.region || ''; document.getElementById('d-level').value = c.careLevel || ''; } 
                else { document.getElementById('d-birth').value = ''; document.getElementById('d-region').value = ''; document.getElementById('d-level').value = ''; }
            },
            addClientToSelection: () => {
                const input = document.getElementById('client-input');
                const name = input.value.trim();
                if(!name) return;
                const isValid = state.clients.some(c => c.name === name);
                if(!isValid) { alert("등록된 대상자가 아닙니다."); return; }
                if(!window.tempSelectedClients.includes(name)) { window.tempSelectedClients.push(name); app.renderSelectedClients(); }
                input.value = ''; document.getElementById('d-birth').value = ''; document.getElementById('d-region').value = ''; document.getElementById('d-level').value = '';
            },
            removeClientFromSelection: (index) => { window.tempSelectedClients.splice(index, 1); app.renderSelectedClients(); },
            renderSelectedClients: (isEditMode = false) => {
                const container = document.getElementById('selected-clients-area');
                if(!container) return;
                container.innerHTML = window.tempSelectedClients.map((name, idx) => `<span class="bg-emerald-50 text-emerald-700 px-2 py-1 rounded text-sm flex items-center gap-1 border border-emerald-200">${name}${!isEditMode ? `<button type="button" onclick="app.removeClientFromSelection(${idx})" class="text-emerald-400 hover:text-red-500"><i data-lucide="x" size="14"></i></button>` : ''}</span>`).join('');
                if(window.lucide) lucide.createIcons();

            // [수정] 팝업 닫기 기능 연결 (변경사항 체크 로직 포함)
            closeModal: () => {
                if (app.hasFormChanged()) {
                    if (!confirm("수정된 내용이 있습니다. 저장하지 않고 닫으시겠습니까?")) return;
                }
                state.ui.initialFormState = null; // 초기화
                state.ui.cmStatsRegions = []; // <--- 이 줄을 추가하세요! (사례관리 통계 행정동 필터 초기화)
                closeModal(); // 실제 글로벌 닫기 함수 호출
            },
            closeDialog: () => closeDialog(),
            handleModalOverlayClick: () => { if (state.ui.allowOverlayClose) app.closeModal(); },
            handleSubModalOverlayClick: () => { if (state.ui.allowOverlayClose) app.closeModal(); },

            // [신규] 로딩 취소 함수
            cancelLoading: () => {
                state.loadingCancelled = true;
                app.hideProgress();
            },

            // [신규] 데이터 변경 시 해당 연도 데이터 재로딩 헬퍼 함수
            refreshYears: async (years) => {
                const uniqueYears = [...new Set(years)].filter(y => y);
                const currentYear = new Date().getFullYear();
                
                // 변경된 데이터의 연도가 이미 로드된 상태(loadedYears에 존재)라면,
                // 강제로 최신 데이터를 서버에서 가져와 덮어씌웁니다. (현재 연도는 onSnapshot이 처리하므로 제외)
                const promises = uniqueYears.map(y => {
                    const yearInt = parseInt(y);
                    if (yearInt !== currentYear && state.loadedYears.has(yearInt)) {
                        console.log(`Refreshing data for year: ${yearInt}`);
                        // force=true 옵션을 사용하여 강제 로딩
                        return app.loadLogsByYear(yearInt, false, true);
                    }
                    return Promise.resolve();
                });
                
                await Promise.all(promises);
            },

            // [신규] 진행 상태 모달 제어 함수
            showProgress: (title, total) => {
                state.loadingCancelled = false; // [신규] 로딩 시작 시 플래그 초기화
                const modal = document.getElementById('progress-modal');
                const titleEl = document.getElementById('progress-title');
                const totalEl = document.getElementById('progress-total');
                const currentEl = document.getElementById('progress-current');
                const barEl = document.getElementById('progress-bar');
                const percentEl = document.getElementById('progress-percent');

                if (modal && titleEl && totalEl && currentEl && barEl) {
                    titleEl.textContent = title;
                    totalEl.textContent = total;
                    currentEl.textContent = '0';
                    barEl.style.width = '0%';
                    percentEl.textContent = '0%';
                    modal.classList.remove('hidden');
                }
            },
            updateProgress: (current) => {
                const totalEl = document.getElementById('progress-total');
                const currentEl = document.getElementById('progress-current');
                const barEl = document.getElementById('progress-bar');
                const percentEl = document.getElementById('progress-percent');

                if (totalEl && currentEl && barEl) {
                    const total = parseInt(totalEl.textContent) || 1;
                    const percent = Math.min(100, Math.round((current / total) * 100));
                    
                    currentEl.textContent = current;
                    barEl.style.width = `${percent}%`;
                    percentEl.textContent = `${percent}%`;
                }
            },
            hideProgress: () => {
                const modal = document.getElementById('progress-modal');
                if (modal) {
                    // 약간의 지연을 주어 100% 완료 상태를 사용자가 인지할 수 있게 함
                    setTimeout(() => {
                        modal.classList.add('hidden');
                    }, 500);
                }
            },

                                        불러오기
                                    </button>
                                    <div class="w-px h-4 bg-slate-300 mx-1"></div>
                                ` : ''}

                                ${!isEdit ? `

                                    </div>
                                </div>
                                ` : ''}
                                <div id="log-selected-clients" class="flex flex-wrap gap-2 min-h-[38px] p-2 bg-white rounded border border-slate-200">
                                    <!-- 자바스크립트로 렌더링됨 -->
                                </div>
                            </div>
                            
                            <!-- 서비스 목록 -->
                            <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
                                <div class="flex justify-between items-center mb-2">
                                    <label class="block text-sm font-bold text-slate-700">제공 서비스</label>

                            <i data-lucide="trash-2" size="16"></i>
                        </button>

                `).join('');

                const dialogHtml = `
                    <div class="bg-white w-full max-w-md rounded-xl shadow-2xl overflow-hidden flex flex-col max-h-[80vh]">
                        <div class="p-4 border-b border-slate-100 bg-slate-50 flex justify-between items-center flex-shrink-0">
                            <h3 class="font-bold text-lg text-slate-800 flex items-center gap-2">
                                <i data-lucide="list" size="18" class="text-blue-500"></i> 임시 저장 목록
                            </h3>
                            <button onclick="app.closeDialog()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" size="20"></i></button>
                        </div>
                        <div class="overflow-y-auto custom-scrollbar flex-1 bg-white">
                            ${listHtml}
                        </div>
                        <div class="p-3 bg-slate-50 text-right text-xs text-slate-500 border-t border-slate-100 flex-shrink-0">
                            * 최대 10건까지 저장되며, 목록을 클릭하면 내용이 불러와집니다.
                        </div>
                    </div>
                `;
                
                showDialog(dialogHtml);
                if(window.lucide) lucide.createIcons();
            },

            // [신규] 임시 저장 데이터 적용
            applyTempLog: (idx) => {
                const list = JSON.parse(localStorage.getItem('cj_temp_log_list') || '[]');
                const data = list[idx];
                
                if (!data) return alert("데이터를 찾을 수 없습니다.");
                if (!confirm('선택한 내용을 불러오시겠습니까?\n현재 작성 중인 내용은 덮어씌워집니다.')) return;

                // 폼에 데이터 적용
                if (data.date) document.getElementById('log-date').value = data.date;
                if (data.provideMethod) document.getElementById('log-method').value = data.provideMethod;
                if (data.provider) document.getElementById('log-provider').value = data.provider;

                // 대상자 목록 복원
                if (data.clients && Array.isArray(data.clients)) {

                     // [수정] 임시저장 불러오기 시에도 데이터가 없으면 기본값에 메모 포함
                     renderSvcRow({ category: '노인상담 및 정보제공', serviceName: '정서지원서비스(안전안부확인)', detailNote: '안전안부확인' });

            // [신규] 일지 작성용 대상자 관리 함수들 (수정됨)
            previewLogClientInfo: (name) => {
                const birthEl = document.getElementById('log-client-birth');

                    levelEl.value = '';
                }
            },
            addLogClient: () => {
                const input = document.getElementById('log-client-input');
                const name = input.value.trim();
                if(!name) return;
                
                // 유효성 검사 (등록된 대상자인지)
                const isValid = state.clients.some(c => c.name === name);
                if(!isValid) { alert("등록된 대상자가 아닙니다."); return; }
                
                if(!window.currentLogClients.includes(name)) {
                    window.currentLogClients.push(name);

                }
                
                // 입력 필드 초기화
                input.value = '';
                document.getElementById('log-client-birth').value = '';
                document.getElementById('log-client-region').value = '';
                document.getElementById('log-client-level').value = '';
                
                input.focus();

            removeLogClient: (index) => {
                window.currentLogClients.splice(index, 1);
                app.renderLogClients(false);
            },
            renderLogClients: (isEdit) => {
                const container = document.getElementById('log-selected-clients');
                if(!container) return;
                
                if (window.currentLogClients.length === 0) {
                    container.innerHTML = '<span class="text-sm text-slate-400 self-center">대상자를 추가해주세요.</span>';
                    return;
                }

                container.innerHTML = window.currentLogClients.map((name, idx) => `
                    <span class="bg-emerald-50 text-emerald-700 px-2 py-1 rounded text-sm flex items-center gap-1 border border-emerald-200 font-bold">
                        ${name}
                        ${!isEdit ? `<button type="button" onclick="app.removeLogClient(${idx})" class="text-emerald-400 hover:text-red-500 ml-1"><i data-lucide="x" size="14"></i></button>` : ''}
                    </span>
                `).join('');
                if(window.lucide) lucide.createIcons();
            },

            addSvcRow: () => renderSvcRow({}),
            removeSvcRow: (id) => { const el = document.getElementById(`row-${id}`); if(el) el.remove(); },
            
            saveLog: async (e, id) => {
                e.preventDefault();
                
                // [수정] 중복 저장 방지
                if (state.isSaving) return;

                const fd = new FormData(e.target);
                const commonData = Object.fromEntries(fd.entries());
                
                // 서비스 항목 수집
                const rows = document.querySelectorAll('.svc-row');
                const items = [];
                rows.forEach(row => {
                    const cat = row.querySelector('.cat-sel').value;
                    const svc = row.querySelector('.svc-sel').value;
                    const det = row.querySelector('.det-inp').value;
                    if(svc) items.push({ id: Date.now() + Math.random(), category: cat, serviceName: svc, detailNote: det });
                });
                
                if(items.length === 0) return alert("최소 1개의 서비스를 입력해주세요.");
                
                commonData.serviceItems = items;
                commonData.serviceCategory = items[0].category;
                commonData.serviceName = items.map(i => i.serviceName).join(', ');

                // [신규] 중복 일지 체크: 수정이 아닌(신규 작성) 경우에만 확인
                if (!id) {
                    if (window.currentLogClients.length === 0) return alert("대상자를 최소 1명 이상 선택해주세요.");

                    const targetDate = commonData.date;
                    const duplicates = window.currentLogClients.filter(name => 
                        state.logs.some(l => l.date === targetDate && l.clientName === name)
                    );

                    if (duplicates.length > 0) {
                        const msg = `[중복 알림] 다음 대상자는 해당 날짜(${targetDate})에 이미 일지가 존재합니다.\n\n대상자: ${duplicates.join(', ')}\n\n그래도 계속 저장하시겠습니까?`;
                        if (!confirm(msg)) return; 
                    }
                }

                // [수정] 저장 시작 플래그 설정
                state.isSaving = true;

                const isBatchCreate = !id && window.currentLogClients.length > 1;
                if (isBatchCreate) state.isBatching = true;

                // [신규] 갱신 대상 연도 추적
                const affectedYears = new Set();
                const getYear = (dateStr) => dateStr ? parseInt(dateStr.split('-')[0]) : null;
                if (commonData.date) affectedYears.add(getYear(commonData.date));

                try {
                    const currentYear = new Date().getFullYear();

                    if (id) {
                        // [수정] 수정 모드 (단일 건)
                        
                        // 1. 대상자 이름 안전하게 가져오기 (누락 시 기존 로그에서 복구)
                        let clientName = window.currentLogClients[0];
                        if (!clientName) {
                            const original = state.logs.find(l => l.id === id);
                            if (original) clientName = original.clientName;
                        }
                        if (!clientName) throw new Error("대상자 정보를 찾을 수 없습니다.");

                        const client = state.clients.find(c => c.name === clientName);
                        if (client) commonData.clientId = client.id;
                        commonData.clientName = clientName;

                        // 2. 수정 전 원래 연도도 갱신 대상에 포함 (날짜 변경 대비)
                        const originalLog = state.logs.find(l => l.id === id);
                        if (originalLog && originalLog.date) affectedYears.add(getYear(originalLog.date));

                        // 3. 서버 저장
                        await updateDoc(doc(db, "logs", id), commonData);
                        
                        // 4. 로컬 상태 즉시 업데이트 (화면 반영용 - 낙관적 업데이트)
                        const existingIndex = state.logs.findIndex(l => l.id === id);
                        if (existingIndex !== -1) {
                            state.logs[existingIndex] = { ...state.logs[existingIndex], ...commonData };
                        }
                        
                        // 5. 서버 데이터 동기화 (비동기 전환 - await 제거)
                        // 사용자를 기다리게 하지 않고 백그라운드에서 처리합니다.
                        app.refreshYears(Array.from(affectedYears)).catch(e => console.error(e));

                        app.showToast("일지가 수정되었습니다.");
                    } else {
                        // 작성 모드 (다중 건 생성 가능)
                        const batchPromises = window.currentLogClients.map(async (clientName) => {
                            const data = { ...commonData, clientName };
                            const client = state.clients.find(c => c.name === clientName);
                            if (client) data.clientId = client.id;
                            data.createdAt = new Date().toISOString();
                            
                            const docRef = await addDoc(collection(db, "logs"), data);
                            
                            // 현재 연도가 아니면 수동으로 로컬 목록에 추가 (즉시 반영용)
                            const logYear = parseInt(data.date.split('-')[0]);
                            if (logYear !== currentYear) {
                                state.logs.push({ id: docRef.id, ...data });
                            }
                            
                            return docRef;
                        });
                        
                        await Promise.all(batchPromises);
                        
                        // 서버 데이터 동기화 (비동기 전환 - await 제거)
                        app.refreshYears(Array.from(affectedYears)).catch(e => console.error(e));
                        
                        app.showToast(`${window.currentLogClients.length}건의 일지가 저장되었습니다.`);
                    }
                    
                    // 6. 목록 재정렬 (날짜순) - 로컬 데이터 기반으로 즉시 정렬
                    state.logs.sort((a, b) => {
                        if (a.date !== b.date) return b.date.localeCompare(a.date);
                        const providerA = a.provider || '', providerB = b.provider || '';
                        if (providerA !== providerB) return providerA.localeCompare(providerB);
                        return (a.clientName || '').localeCompare(b.clientName || '');
                    });
                    
                    app.closeModal();

                } catch (err) { 
                    console.error(err);
                    alert("저장 실패: " + err.message); 
                } finally {
                    state.isSaving = false; // [수정] 저장 종료 플래그 해제
                    if (isBatchCreate) {
                        state.isBatching = false;
                    }
                    // [수정] 뷰 모드에 따라 적절한 갱신 수행 (화면 즉시 반영)
                    if(state.viewMode==='single') {
                        // 현재 보고 있는 탭이 로그나 클라이언트 상세라면 갱신
                        if(state.activeTab === 'logs') updateTabContent('logs');
                        else if(state.activeTab === 'clients') updateTabContent('clients'); // 상세 모달 내부 갱신용
                    } else {
                        render();
                    }
                }
            },
             // [신규] 사례회의록 복사 기능
             duplicateMeeting: (id) => {
                 const m = state.meetings.find(x => x.id === id);
                 if (!m) return;
                 
                 const data = { ...m };
                 delete data.id;
                 delete data.createdAt;
                 data.date = new Date().toISOString().split('T')[0]; // 오늘 날짜로 기본 설정
                
                 app.openMeetingModal(null, data);
             },

            duplicateLog: (id) => {
                const l = state.logs.find(x => x.id === id);
                if (!l) return;
                
                // 데이터를 복사하여 작성 팝업으로 전달 (ID 및 생성일시 제외)
                const data = { ...l };
                delete data.id;
                delete data.createdAt;
                data.date = new Date().toISOString().split('T')[0]; // 오늘 날짜로 기본 설정
                
                // 작성 팝업 열기
                app.openLogModal(null, data);
            },

            deleteData: (collectionName, id) => {
                const names = { 'logs': '일지', 'clients': '대상자', 'services': '서비스', 'meetings': '회의록' };
                const name = names[collectionName] || '데이터';

                        </tr>

                logs.forEach(l => {

                    const rowSpan = items.length > 1 ? ` rowspan="${items.length}"` : '';

                    items.forEach((item, idx) => {
                        html += '<tr>';
                        
                        // [수정] 같은 대상자 내 서비스 구분선 연하게 처리 (내부 경계선 스타일)
                        let borderStyle = "";
                        if (items.length > 1) {
                            // 마지막 항목이 아니면 아래쪽을 연하게
                            if (idx < items.length - 1) borderStyle += "border-bottom: 1px solid #ccc;";
                            // 첫 번째 항목이 아니면 위쪽을 연하게 (윗 행의 border-bottom과 충돌 방지 및 일치)
                            if (idx > 0) borderStyle += "border-top: 1px solid #ccc;";
                        }

                        if (idx === 0) {
                            html += `<td${rowSpan} class="text-center">${l.date}</td>`;
                            html += `<td${rowSpan} class="text-center" style="font-weight:bold;">${l.clientName}</td>`;
                            html += `<td${rowSpan} class="text-center">${l.provideMethod || ''}</td>`;
                        }
                        
                        /* [수정] borderStyle 적용 */
                        html += `<td class="text-center text-condensed" style="${borderStyle}">${item.category || ''}</td>`;
                        html += `<td class="text-center text-condensed" style="font-weight:bold; color:#444; ${borderStyle}">${item.serviceName || ''}${item.detailNote ? `<br><span style="font-weight:normal; font-size:9px; color:#666;">(${item.detailNote})</span>` : ''}</td>`;
                        
                        if (idx === 0) {
                            let content = (l.content || '').replace(/\n/g, '<br>');
                            html += `<td${rowSpan} class="text-left" style="vertical-align:top; padding: 8px; line-height: 1.5;">${content}</td>`;
                            html += `<td${rowSpan} class="text-center">${l.provider || ''}</td>`;
                        }
                        html += '</tr>';
                    });
                });

                html += `</tbody></table></body></html>`;

                const win = window.open('', '_blank', 'width=1100,height=800');
                if (win) {
                    win.document.write(html);
                    win.document.close();
                    win.focus();
                    setTimeout(() => win.print(), 500);
                } else {
                    alert("팝업 차단을 해제해주세요.");
                }
            },
            // [수정] 서비스 일지 엑셀 다운로드 (업로드 양식과 동일하게 상세 분리)
            downloadLogsExcel: () => {

                });

                const ws = XLSX.utils.json_to_sheet(data);
                
                // 컬럼 너비 설정 (가독성 향상)
                ws['!cols'] = [
                    { wch: 12 }, // 날짜

                    { wch: 8 },  // 제공방법

                const wb = XLSX.utils.book_new();

                XLSX.writeFile(wb, `서비스일지_${new Date().toISOString().slice(0,10)}.xlsx`);
            },
            downloadLogTemplate: () => {
                const ws = XLSX.utils.json_to_sheet([{
                    날짜: '2024-01-01', 
                    대상자: '홍길동',

            },
            uploadLogExcel: (input) => {
                const file = input.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (e) => {
                    const data = new Uint8Array(e.target.result);
                    // [수정] cellDates: false로 설정하여 날짜를 숫자(Serial)나 문자열 그대로 읽음 (자동 변환 끔)
                    const workbook = XLSX.read(data, { type: 'array', cellDates: false });
                    const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                    
                    if (confirm(`총 ${json.length}건의 데이터를 읽었습니다.\n\n[업로드 규칙]\n- 날짜와 대상자명이 모두 동일한 경우: 하나의 일지로 자동 병합\n- 그 외의 경우: 개별 일지로 등록\n\n업로드하시겠습니까?`)) {
                        state.isBatching = true; // [일괄작업] 렌더링 중지
                        let logsToSave = []; // 저장할 데이터 미리 준비
                        const affectedYears = new Set(); // [신규] 갱신할 연도 추적

                        // [수정] 날짜 포맷팅 헬퍼 함수 (엑셀 숫자 코드 -> YYYY-MM-DD 변환)
                        const formatExcelDate = (val) => {
                            if (!val) return new Date().toISOString().split('T')[0];
                            
                            // 1. 숫자인 경우 (엑셀 날짜 코드) -> 수학적 계산으로 날짜 추출 (가장 정확함)
                            if (typeof val === 'number') {
                                // 엑셀 기준일(1899-12-30)과 JS 기준일(1970-01-01) 차이: 25569일
                                // 하루는 86400초 * 1000밀리초
                                const dateObj = new Date(Math.round((val - 25569) * 86400 * 1000));
                                const y = dateObj.getUTCFullYear();
                                const m = String(dateObj.getUTCMonth() + 1).padStart(2, '0');
                                const d = String(dateObj.getUTCDate()).padStart(2, '0');
                                return `${y}-${m}-${d}`;
                            } 
                            
                            // 2. 문자열인 경우 (2026.09.01, 2026/9/1, 2026-09-01 등)
                            if (typeof val === 'string') {
                                const str = val.trim();
                                // 다양한 구분자(., /, -)와 공백 처리
                                // 정규식으로 숫자만 추출해서 YYYY-MM-DD로 재조립
                                const match = str.match(/^(\d{4})[\.\-/년\s]+(\d{1,2})[\.\-/월\s]+(\d{1,2})/);
                                if (match) {
                                    const y = match[1];
                                    const m = String(match[2]).padStart(2, '0');
                                    const d = String(match[3]).padStart(2, '0');
                                    return `${y}-${m}-${d}`;
                                }
                                // 정규식 매칭 안되면 기본 변환 시도
                                const trimmed = str.replace(/[\.\/]/g, '-');
                                if (/^\d{4}-\d{2}-\d{2}$/.test(trimmed)) return trimmed;
                            }

                            // 3. 그 외 (Date 객체 등) - 안전장치
                            try {
                                const d = new Date(val);
                                const offset = d.getTimezoneOffset() * 60000;
                                const localDate = new Date(d.getTime() - offset);
                                return localDate.toISOString().split('T')[0];
                            } catch (e) {
                                return new Date().toISOString().split('T')[0];
                            }
                        };

                        const groupedLogs = {}; // 날짜_대상자이름을 키로 사용하여 데이터 그룹화

                        // 1. 데이터 그룹화 (병합 로직)
                        for (const row of json) {
                            let date = formatExcelDate(row['날짜']);
                            const clientName = row['대상자'] || row['이름'];
                            if (!clientName) continue; 

                            const key = `${date}_${clientName}`;

                            if (!groupedLogs[key]) {
                                groupedLogs[key] = {
                                    date: date,
                                    clientName: clientName,
                                    provideMethod: row['제공방법'],
                                    provider: row['제공자'],
                                    content: (row['내용'] || row['진행내용']) || '', 
                                    serviceItems: []
                                };

                                const defaultSvcName = '정서지원서비스(안전안부확인)';
                                const excelServiceName = row['서비스명'] || row['서비스 상세내용'] || '';
                                
                                if (excelServiceName !== defaultSvcName) {
                                    groupedLogs[key].serviceItems.push({ 
                                        id: Date.now() + Math.random(),
                                        category: '노인상담 및 정보제공', 
                                        serviceName: defaultSvcName, 
                                        detailNote: '' 
                                    });
                                }
                            } else {
                                const rowContent = row['내용'] || row['진행내용'] || '';
                                if (rowContent && !groupedLogs[key].content.includes(rowContent)) {
                                    groupedLogs[key].content += (groupedLogs[key].content ? '\n' : '') + rowContent;
                                }
                            }

                            const excelServiceName = row['서비스명'] || row['서비스 상세내용'];
                            if (excelServiceName) {
                                groupedLogs[key].serviceItems.push({ 
                                    id: Date.now() + Math.random(),
                                    category: row['서비스분류'] || row['서비스'], 
                                    serviceName: excelServiceName, 
                                    detailNote: (row['메모'] || row['서비스 메모']) || '' 
                                });
                            }
                        }

                        logsToSave = Object.values(groupedLogs);
                        
                        app.showProgress('일지 데이터 업로드 중...', logsToSave.length);
                        
                        let processedCount = 0;
                        let success = 0;

                        // 비동기 루프로 저장 실행
                        (async () => {
                            try {
                                for (const logData of logsToSave) {
                                    const matchedClient = state.clients.find(c => c.name === logData.clientName);
                                    if (matchedClient) {
                                        logData.clientId = matchedClient.id;
                                    }

                                    try {
                                        await addDoc(collection(db, "logs"), {
                                            ...logData,
                                            serviceName: logData.serviceItems.map(i => i.serviceName).join(', '), 
                                            createdAt: new Date().toISOString()
                                        });
                                        success++;
                                        // [신규] 업로드된 데이터의 연도 수집
                                        if (logData.date) affectedYears.add(parseInt(logData.date.split('-')[0]));
                                    } catch(e) { console.error(e); }
                                    
                                    processedCount++;
                                    app.updateProgress(processedCount);
                                }
                            } finally {
                                state.isBatching = false; // [일괄작업 완료] 렌더링 재개
                                app.hideProgress();
                                
                                // [신규] 업로드된 연도 데이터 강제 재로딩 (화면 갱신)
                                if (affectedYears.size > 0) {
                                    await app.refreshYears(Array.from(affectedYears));
                                }

                                setTimeout(() => {
                                    alert(`총 ${success}건의 일지로 정리되어 업로드 완료했습니다.`);
                                    // [수정] 뷰 모드에 따라 적절한 갱신 수행
                                    if(state.viewMode==='single') {
                                        if(state.activeTab === 'logs') updateTabContent('logs');
                                    } else {
                                        render();
                                    }
                                }, 500);
                            }
                        })();
                    }
                    input.value = '';
                };
                reader.readAsArrayBuffer(file);
            },

            // [신규] 대상자 엑셀 업로드 함수 추가 (진행률 표시 포함)
            uploadExcel: (input) => {
                const file = input.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (e) => {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                    
                    if (confirm(`총 ${json.length}명의 대상자 데이터를 업로드하시겠습니까?`)) {
                        state.isBatching = true; // [일괄작업] 렌더링 중지
                        app.showProgress("대상자 업로드 중...", json.length);
                        let success = 0;
                        
                        (async () => {
                            try {
                                for (let i = 0; i < json.length; i++) {
                                    const row = json[i];
                                    const clientData = {
                                        name: row['이름'] || row['성명'] || '',
                                        birthDate: row['생년월일'] || '',
                                        gender: row['성별'] || '남성',
                                        phone: row['연락처'] || row['전화번호'] || '',
                                        address: row['주소'] || '',
                                        region: row['행정동'] || row['동'] || '대연동',

                                app.hideProgress();
                                setTimeout(() => {

                                    if(state.viewMode==='single') updateTabContent('clients'); else render(); // 최종 1회 렌더링
                                }, 500);
