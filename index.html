    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; }
        .input-field {
            width: 100%; padding: 0.5rem 0.75rem; border: 1px solid #e2e8f0; border-radius: 0.5rem; outline: none;
            transition: border-color 0.2s, box-shadow 0.2s; background-color: white; font-size: 0.875rem;
        }
        .input-field:focus { border-color: #10b981; box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.1); }
        .input-field:read-only { background-color: #f8fafc; color: #64748b; cursor: default; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
        .modal-overlay { background-color: rgba(0, 0, 0, 0.5); }
        
        .sticky-col { position: sticky; left: 0; background-color: white; z-index: 10; }
        .sticky-header { position: sticky; top: 0; z-index: 20; }

        .modal-tab-btn {
            padding: 0.75rem 1.25rem;
            border-bottom: 2px solid transparent;
            color: #64748b;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s;
            cursor: pointer;
            flex: 1;
            text-align: center;
        }
        .modal-tab-btn:hover { color: #10b981; background-color: #f0fdf4; }
        .modal-tab-btn.active {
            border-bottom-color: #10b981;
            color: #059669;
            font-weight: 800;
            background-color: #fff;
        }
        .modal-tab-content { display: none; }
        .modal-tab-content.active { display: block; animation: fadeIn 0.2s ease-out; }

        /* [추가] 서브 탭 스타일 (사례관리 탭 내부 버튼 활성화용) */
        .sub-tab-btn {
            padding: 0.3rem 0.6rem;
            border-radius: 0.375rem;
            font-size: 0.75rem;
            font-weight: 600;
            color: #64748b;
            background-color: transparent;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .sub-tab-btn:hover { background-color: #f1f5f9; color: #334155; }
        .sub-tab-btn.active {
            background-color: #e0f2fe;
            color: #0284c7;
            font-weight: 700;
        }
        .sub-tab-content { display: none; }
        .sub-tab-content.active { display: block; animation: fadeIn 0.2s ease-out; }

        .tab-content-wrapper {
            height: 100%;
            display: none;
            background-color: #f8fafc;
            position: relative;
            flex-direction: column;
            overflow: hidden; 
        }
        .tab-content-wrapper.active {
            display: flex; 
        }

        /* 윈도우 모드 스타일 */
        .window-pane {
            position: absolute;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid #cbd5e1;
            display: flex;
            flex-direction: column;
            min-width: 300px;
            min-height: 200px;
            will-change: left, top, width, height; 
        }
        
        .window-pane.active {
            z-index: 50 !important;
            border-color: #3b82f6;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05), 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        .window-pane.dragging {
            cursor: grabbing;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
        }

        .window-pane.dragging .window-content {
            pointer-events: none; 
        }

        .window-header {
            padding: 8px 12px;
            background-color: #f1f5f9;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: grab;
            user-select: none;
            flex-shrink: 0;
            border-radius: 8px 8px 0 0;
        }
        .window-header:active {
            cursor: grabbing;
            background-color: #e2e8f0;
        }

        .window-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .window-controls {
            display: flex;
            gap: 6px;
        }
        
        .window-control-btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid rgba(0,0,0,0.1);
            cursor: pointer;
        }
        .btn-minimize { background-color: #facc15; }
        .btn-maximize { background-color: #4ade80; }
        .btn-close { background-color: #f87171; }

        .window-content {
            flex: 1;
            overflow: hidden; 
            background-color: white;
            position: relative;
            border-radius: 0 0 8px 8px;
            display: flex;
            flex-direction: column;
        }

        .resizer { position: absolute; z-index: 100; }
        .resizer-n { top: -3px; left: 6px; right: 6px; height: 6px; cursor: n-resize; }
        .resizer-s { bottom: -3px; left: 6px; right: 6px; height: 6px; cursor: s-resize; }
        .resizer-e { top: 6px; right: -3px; bottom: 6px; width: 6px; cursor: e-resize; }
        .resizer-w { top: 6px; left: -3px; bottom: 6px; width: 6px; cursor: w-resize; }
        .resizer-ne { top: -3px; right: -3px; width: 12px; height: 12px; cursor: ne-resize; z-index: 101; }
        .resizer-nw { top: -3px; left: -3px; width: 12px; height: 12px; cursor: nw-resize; z-index: 101; }
        .resizer-se { bottom: -3px; right: -3px; width: 12px; height: 12px; cursor: se-resize; z-index: 101; }
        .resizer-sw { bottom: -3px; left: -3px; width: 12px; height: 12px; cursor: sw-resize; z-index: 101; }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .tab-bar-container {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            padding: 2px 8px 0;
            background-color: #f1f5f9;
            border-bottom: 1px solid #e2e8f0;
            overflow-x: auto;
            flex-shrink: 0;
            height: 28px;
        }
        .main-tab {
            display: flex;
            align-items: center;
            gap: 2px;
            padding: 0 8px;
            font-size: 0.75rem;
            font-weight: 500;
            color: #64748b;
            background-color: #e2e8f0;
            border-radius: 4px 4px 0 0;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
            border-bottom: none;
            white-space: nowrap;
            height: 100%;
        }
        .main-tab:hover {
            background-color: #e6eff5;
            color: #334155;
        }
        .main-tab.active {
            background-color: #ffffff;
            color: #059669;
            font-weight: 700;
            border-color: #e2e8f0;
            box-shadow: 0 -1px 2px rgba(0,0,0,0.02);
            position: relative;
            bottom: -1px;
            z-index: 10;
        }
        .tab-close-btn {
            padding: 0;
            border-radius: 2px;
            opacity: 0.5;
            margin-left: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 12px;
            height: 12px;
        }
        .tab-close-btn:hover { background-color: #cbd5e1; color: #ef4444; opacity: 1; }
        
        .nav-link {
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            font-weight: 500;
            font-size: 0.95rem;
            color: #cbd5e1;
            transition: all 0.2s;
            display: flex;
            align-items: center;
        }
        .nav-link:hover { color: #ffffff; background-color: rgba(255, 255, 255, 0.1); }
        .nav-link.active { color: #ffffff; background-color: #059669; font-weight: 700; }
    </style>
</head>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        // [수정] enableIndexedDbPersistence 추가 (오프라인 캐시 기능)
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy, limit, writeBatch, where, getDocs, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAx1EJ_7kawHTzsNS97ts5FjCaTJRqJTdM",
            authDomain: "cj-base.firebaseapp.com",
            projectId: "cj-base",
            storageBucket: "cj-base.firebasestorage.app",
            messagingSenderId: "518471894886",
            appId: "1:518471894886:web:9befd2e6d922b22edd6aa7"
        };

        let db, auth;
        try {
            const fbApp = initializeApp(firebaseConfig);
            db = getFirestore(fbApp);
            auth = getAuth(fbApp);

            // [신규] 오프라인 데이터 지속성 활성화 (앱 실행 시 캐시된 데이터 즉시 로딩)
            enableIndexedDbPersistence(db)
                .catch((err) => {
                    if (err.code == 'failed-precondition') {
                        // 다중 탭 오픈 등으로 실패 시 (보통 여러 탭을 열면 한 곳만 오프라인 모드 동작)

                    } else if (err.code == 'unimplemented') {
                        // 브라우저 미지원
                        console.warn('오프라인 지속성 미지원 브라우저입니다.');
                    }
                });

            signInAnonymously(auth).catch((error) => {
                console.error("익명 로그인 실패:", error);
                alert("로그인 실패: 인터넷 연결을 확인해주세요.");

            console.error("Firebase 초기화 실패:", e);

                cmStatsRegionDropdownOpen: false, // 사례관리 통계 드롭다운 열림 상태
                cmStatsRegions: [], // 사례관리 통계 선택된 행정동 
                // [수정] 페이지네이션 상태 추가 및 기존 visibleLogLimit 제거 대체
                logPage: 1,
                logsPerPage: 50,
                meetingTargetMonth: new Date().getMonth() + 1,
                meetingCandidateType: 'regular' // [신규] 회의 대상자 조회 타입 (regular, new, end)
            },
            pendingClientData: null,
            pendingLogData: null,
            pendingServiceData: null,
            filters: {
                client: { 
                    status: '이용', level: '', economicStatus: '', duplicateService: '', ictStatus: '', 
                    region: [], gender: '', search: '', searchPhone: '', targetYear: '', targetMonth: '' 
                },
                // [수정] log 필터에 contentSearch(내용 검색) 추가
                log: { start: '', end: '', search: '', contentSearch: '', provider: '', category: '', service: '', detailNote: '', region: [], sortKey: 'date', sortOrder: 'desc' },
                // [수정] 회의록 필터 확장 (구분, 대상자, 작성자 추가)
                meeting: {
                    start: (() => { const d = new Date(); return `${d.getFullYear()}-01-01`; })(),
                    end: (() => { const d = new Date(); return `${d.getFullYear()}-12-31`; })(),
                    search: '',
                    type: '',
                    clientName: '',
                    writer: ''
                },
                stats: { 
                    start: (() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-01`; })(),
                    end: (() => { const d = new Date(); const lastDay = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${lastDay}`; })(),
                    type: 'detail', region: [], name: '', months: [], targetYear: ''
                },
                performance: { year: new Date().getFullYear(), months: Array.from({length: 12}, (_, i) => i + 1), viewMode: 'monthRows' }
            }
        };

        function calculateAge(birthDate) {
            if (!birthDate) return 0;
            const today = new Date();
            // 입력된 글자에서 앞 4자리(연도)만 쏙 뽑아옵니다.
            const yearPart = String(birthDate).substring(0, 4);
            if (isNaN(yearPart) || yearPart.length < 4) return 0;
            
            let age = today.getFullYear() - parseInt(yearPart);
            return age;
        }

        // [수정] 로딩 표시 태그 생성 헬퍼 함수
        // Tailwind CDN이 동적 문자열 내의 새로운 클래스(amber)를 인식하지 못하는 문제를 해결하기 위해
        // 이미 문서 내에서 사용 중인 색상(blue)으로 변경하여 표시를 보장합니다.
        function getLoadingTag() {
            if (state.isFullLogLoaded) return '';
            return `<span class="ml-2 text-xs font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded-full border border-blue-100 flex items-center gap-1 shadow-sm transition-all"><span class="animate-spin"><i data-lucide="loader-2" size="12"></i></span><span>데이터 로딩 중...</span></span>`;
        }

        function getFilteredLogs() {
            // [수정] contentSearch 구조 분해 할당 추가
            const { start, end, search, contentSearch, provider, category, service, detailNote, region } = state.filters.log;
            
            // [수정] 사용자가 설정한 필터가 하나라도 있는지 확인 (contentSearch 포함)
            // start, end, search, contentSearch, provider, category, service는 문자열, region은 배열
            const hasActiveFilter = start || end || search || contentSearch || provider || category || service || detailNote || region.length > 0;
            const currentYearStr = String(new Date().getFullYear());

            const filtered = state.logs.filter(l => {
                const client = state.clients.find(c => c.id === l.clientId);
                const clientRegion = client ? client.region : '미지정';

                // [수정] 아무런 필터도 걸지 않았다면(기본 상태), 현재 연도의 데이터만 보여줌
                if (!hasActiveFilter) {
                    if (!l.date.startsWith(currentYearStr)) return false;
                }

                // [수정] contentSearch 필터링 조건 추가 (일지 내용에 검색어 포함 여부 확인)
                return (!start || l.date >= start) && 
                       (!end || l.date <= end) && 
                       (!search || l.clientName.includes(search)) && 
                       (!contentSearch || (l.content && l.content.includes(contentSearch))) &&
                       (!provider || (l.provider && l.provider.includes(provider))) && 
                       (!category || (l.serviceItems && l.serviceItems.some(i => i.category === category))) &&
                       (!service || (l.serviceItems && l.serviceItems.some(i => i.serviceName === service))) &&
                       (!detailNote || (l.serviceItems && l.serviceItems.some(i => i.detailNote && i.detailNote.includes(detailNote)))) &&
                       (region.length === 0 || region.includes(clientRegion));
            });
            return filtered.sort((a, b) => {
                const sortArr = state.filters.log.sortArray || [];
                
                // 등록된 다중 정렬 기준을 1순위, 2순위 순서대로 비교합니다.
                for (let i = 0; i < sortArr.length; i++) {
                    const { key, order } = sortArr[i];
                    let valA = a[key] || '';
                    let valB = b[key] || '';
                    
                    if (valA !== valB) {
                        return order === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
                    }
                }

                // 모든 정렬 기준이 동률이거나, 아무 불도 안 켜진(초기화) 상태일 때의 숨겨진 기본 정렬 (최신 날짜순)
                if (a.date !== b.date) return b.date.localeCompare(a.date); 
                const timeA = a.createdAt || ''; const timeB = b.createdAt || '';
                if (timeA !== timeB) return timeB.localeCompare(timeA);
                return (a.clientName || '').localeCompare(b.clientName || '');
            });
        }

        // [수정] 회의록 필터링 로직 강화 (구분, 대상자, 작성자 조건 추가)
        function getFilteredMeetings() {
            const { start, end, search, type, clientName, writer } = state.filters.meeting;
            return state.meetings.filter(m => {
                const matchDate = (!start || m.date >= start) && (!end || m.date <= end);
                
                // 기존 통합 검색은 안건(topic)과 참석자(attendees) 검색으로 활용
                const matchSearch = !search || 
                    (m.topic && m.topic.includes(search)) || 
                    (m.attendees && m.attendees.includes(search));
                
                // [추가] 상세 필터 조건
                const matchType = !type || m.type === type;
                const matchClient = !clientName || (m.clientName && m.clientName.includes(clientName));
                const matchWriter = !writer || (m.writer && m.writer.includes(writer));

                return matchDate && matchSearch && matchType && matchClient && matchWriter;
            }).sort((a, b) => b.date.localeCompare(a.date));
        }

        // [신규] 안전한 로그 데이터 병합 함수 (중복 제거 및 최신 데이터 반영)
        function mergeLogs(newLogs) {
            if (!Array.isArray(newLogs) || newLogs.length === 0) return;

            const logMap = new Map();
            // 1. 기존 데이터 맵핑
            if (Array.isArray(state.logs)) {
                state.logs.forEach(l => logMap.set(l.id, l));
            }
            // 2. 새 데이터로 덮어쓰기 (업데이트) 또는 추가
            newLogs.forEach(l => logMap.set(l.id, l));
            
            // 3. 배열로 변환 및 정렬 (날짜 내림차순 -> 생성시간 내림차순)
            state.logs = Array.from(logMap.values()).sort((a, b) => {
                if (a.date !== b.date) return b.date.localeCompare(a.date); // 1순위: 날짜
                // 2순위: 등록(생성)된 시간 순서 (최신 등록이 위로)
                const timeA = a.createdAt || '';
                const timeB = b.createdAt || '';
                if (timeA !== timeB) return timeB.localeCompare(timeA);
                // 3순위: 대상자 이름 (시간까지 완벽히 똑같을 경우)
                return (a.clientName || '').localeCompare(b.clientName || '');
            });
        }

        function initDataSync() {
            if (!db) return;
            const handleErr = (e) => { if(e.code === 'permission-denied') console.warn("권한 부족: 규칙을 확인하세요."); };

            // [수정] 모든 리스너에 (!state.isBatching) 조건 추가하여 일괄 작업 중 렌더링 방지

            // [최적화 1단계] 대상자: '이용' 및 '장기부재' 상태인 대상자만 우선 로딩
            let initialClientUnsub = onSnapshot(query(collection(db, "clients"), where("status", "in", ["이용", "장기부재"])), (snap) => {
                const activeClients = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                const clientMap = new Map(state.clients.map(c => [c.id, c]));
                activeClients.forEach(c => clientMap.set(c.id, c));
                state.clients = Array.from(clientMap.values()).sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
                if (!state.isBatching) render();
            }, handleErr);

            // [최적화 2단계] 3초 후 전체 대상자 백그라운드 로딩 (종결 대상자 검색 등 과거 기록 조회 대비)
            setTimeout(() => {
                onSnapshot(query(collection(db, "clients"), orderBy("createdAt", "desc")), (snap) => {
                    state.clients = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    if (initialClientUnsub) { initialClientUnsub(); initialClientUnsub = null; }
                    if (!state.isBatching) render();
                }, handleErr);
            }, 3000);
            
            // [최적화 1단계] 회의록: 작년 1월 1일 이후(최근 1년치) 데이터만 우선 로딩
            const lastYearStr = `${new Date().getFullYear() - 1}-01-01`;
            let initialMeetingUnsub = onSnapshot(query(collection(db, "meetings"), where("date", ">=", lastYearStr), orderBy("date", "desc")), (snap) => {
                const recentMeetings = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                const meetingMap = new Map(state.meetings.map(m => [m.id, m]));
                recentMeetings.forEach(m => meetingMap.set(m.id, m));
                state.meetings = Array.from(meetingMap.values()).sort((a, b) => b.date.localeCompare(a.date));
                if (!state.isBatching) render();
            }, handleErr);

            // [최적화 2단계] 4초 후 전체 회의록 백그라운드 로딩 (과거 회의록 검색 대비)
            setTimeout(() => {
                onSnapshot(query(collection(db, "meetings"), orderBy("date", "desc")), (snap) => {
                    state.meetings = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    if (initialMeetingUnsub) { initialMeetingUnsub(); initialMeetingUnsub = null; }
                    if (!state.isBatching) render();
                }, handleErr);
            }, 4000);

            // [복구] 서비스 목록 데이터 리스너 및 정렬 로직 (누락된 부분 복원)
            onSnapshot(collection(db, "services"), (snap) => {
                let loaded = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                const sortOrder = ['위기관리체계구축', '욕구기반 위기관리', '위기상황관리 및 긴급지원', '기타'];
                const caseManagementOrder = ['사례발굴', '초기상담', '사정 및 계획', '개입', '점검 및 모니터링', '종결 및 사후관리', '월 사례회의', '월사례회의'];
                const counselingOrder = ['정서지원서비스(안전안부확인)', '정서지원서비스', '노인일상생활관련 상담', '노인일상생활관련상담', '복지서비스 종합안내'];

                loaded.sort((a, b) => {
                    // [수정] 최우선 정렬: 위기관리체계구축 > 노인상담 및 정보제공 > 정서지원서비스
                    const isTopA = a.majorCategory === '위기관리체계구축' && a.category === '노인상담 및 정보제공' && (a.name === '정서지원서비스' || a.name === '정서지원서비스(안전안부확인)');
                    const isTopB = b.majorCategory === '위기관리체계구축' && b.category === '노인상담 및 정보제공' && (b.name === '정서지원서비스' || b.name === '정서지원서비스(안전안부확인)');
                    
                    if (isTopA && !isTopB) return -1;
                    if (!isTopA && isTopB) return 1;

                    const catA = (a.majorCategory || '').replace(/\s+/g, '');
                    const catB = (b.majorCategory || '').replace(/\s+/g, '');
                    const indexA = sortOrder.findIndex(k => k.replace(/\s+/g, '') === catA);
                    const indexB = sortOrder.findIndex(k => k.replace(/\s+/g, '') === catB);
                    if (indexA !== -1 && indexB === -1) return -1;
                    if (indexA === -1 && indexB !== -1) return 1;
                    if (indexA !== -1 && indexB !== -1) { if (indexA !== indexB) return indexA - indexB; } 
                    else {
                        const majorComp = (a.majorCategory || '').localeCompare(b.majorCategory || '');
                        if (majorComp !== 0) return majorComp;
                    }
                    const catComp = (a.category || '').localeCompare(b.category || '');
                    if (catComp !== 0) return catComp;
                    if (a.category === '사례관리' && b.category === '사례관리') {
                        const nameIndexA = caseManagementOrder.indexOf(a.name);
                        const nameIndexB = caseManagementOrder.indexOf(b.name);
                        if (nameIndexA !== -1 && nameIndexB !== -1) return nameIndexA - nameIndexB;
                    }
                    if (a.category === '노인상담 및 정보제공' && b.category === '노인상담 및 정보제공') {
                        const nameIndexA_C = counselingOrder.indexOf(a.name);
                        const nameIndexB_C = counselingOrder.indexOf(b.name);
                        if (nameIndexA_C !== -1 && nameIndexB_C !== -1) return nameIndexA_C - nameIndexB_C;
                        if (nameIndexA_C !== -1) return -1;
                        if (nameIndexB_C !== -1) return 1;
                    }
                    return (a.name || '').localeCompare(b.name || '');
                });
                state.services = loaded;
                if (!state.isBatching) render();
            }, handleErr);
            
            // [수정] 2단계 데이터 로딩 전략 적용 (현재 연도 데이터만 대상으로 변경)
            let initialLogUnsub = null;
            const currentYear = new Date().getFullYear();
            const startOfYear = `${currentYear}-01-01`;
            const endOfYear = `${currentYear}-12-31`;

            // 1단계: 현재 연도 최신 100건 우선 로딩 (빠른 화면 표시)
            // [수정] where 조건 추가하여 현재 연도 데이터만 가져옴
            const qInitial = query(
                collection(db, "logs"), 
                where("date", ">=", startOfYear), 
                where("date", "<=", endOfYear),
                orderBy("date", "desc"), 
                limit(100)
            );
            
            initialLogUnsub = onSnapshot(qInitial, (snap) => {
                // 이미 전체(현재 연도 전체) 데이터가 로드된 상태라면 이 리스너의 데이터는 무시
                if (state.isFullLogLoaded) return;

                const newLogs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                // [수정] mergeLogs 사용
                mergeLogs(newLogs);
                state.loadedYears.add(currentYear); 

                if (!state.isBatching) render();
            }, handleErr);

            // 2단계: 현재 연도 전체 데이터 백그라운드 로딩
            // [개선] 초기 로딩 시 최근 3년치(올해 포함) 데이터를 감시하도록 확장할 수도 있으나, 
            // 실시간 리스너 부하를 고려해 현재 연도만 유지하되 병합 로직으로 안전장치 마련
            setTimeout(() => {
                const qFull = query(
                    collection(db, "logs"), 
                    where("date", ">=", startOfYear), 
                    where("date", "<=", endOfYear),
                    orderBy("date", "desc")
                );
                
                onSnapshot(qFull, (snap) => {
                    const currentYearLogs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    
                    // [수정] mergeLogs를 사용하여 기존에 로드된 과거 데이터 보존하며 병합
                    mergeLogs(currentYearLogs);
                    
                    state.isFullLogLoaded = true; 
                    state.loadedYears.add(currentYear);

                    // 1단계 리스너 해제
                    if (initialLogUnsub) {
                        initialLogUnsub();
                        initialLogUnsub = null;
                    }

                    if (!state.isBatching) render();
                }, handleErr);
            }, 1500);
        }

        function getTabHTML(tabName) {
            if (tabName === 'dashboard') return renderDashboard();
            if (tabName === 'clients') return renderClientManager();
            if (tabName === 'logs') return renderLogManager();
            if (tabName === 'meeting') return renderMeetingManager(); // [신규] 회의록 화면 연결
            if (tabName === 'performance') return renderPerformance();
            if (tabName === 'statistics') return renderStatistics();
            if (tabName === 'services') return renderServiceManager();
            return '';
        }

        function updateTabContent(tabName) {
            // [포커스 유지 시작]
            const activeEl = document.activeElement;
            const focusedId = activeEl ? activeEl.id : null;
            const cursorStart = activeEl ? activeEl.selectionStart : null;
            const cursorEnd = activeEl ? activeEl.selectionEnd : null;
            // [포커스 유지 끝]

            // [스크롤 유지 시작] - 추가된 로직
            const scrollMap = {
                'clients': 'client-list-container',
                'logs': 'log-list-container',
                'meeting': 'meeting-list-container', // [신규] 회의록 스크롤 유지
                'statistics': 'stats-list-container',
                'performance': 'perf-table-container'
            };
            let lastScrollTop = 0;
            const scrollId = scrollMap[tabName];
            if (scrollId) {
                const el = document.getElementById(scrollId);
                if (el) lastScrollTop = el.scrollTop;
            }
            // [스크롤 유지 끝]

            const containerId = `tab-view-${tabName}`;
            let container = document.getElementById(containerId);
            if (!container) {
                const mainContainer = document.getElementById('main-view-container');
                if (!mainContainer) return; 
                container = document.createElement('div');
                container.id = containerId;
                container.className = 'tab-content-wrapper p-4 md:p-6'; 
                mainContainer.appendChild(container);
            }
            container.innerHTML = getTabHTML(tabName);
            state.renderedTabs.add(tabName);
            if(window.lucide) lucide.createIcons();

            // [스크롤 복구 시작] - 추가된 로직
            if (scrollId && lastScrollTop > 0) {
                const el = document.getElementById(scrollId);
                if (el) el.scrollTop = lastScrollTop;
            }
            // [스크롤 복구 끝]

            // [포커스 복구 시작]
            if (focusedId) {
                const newEl = document.getElementById(focusedId);
                if (newEl) {
                    newEl.focus();
                    if (cursorStart !== null && cursorEnd !== null) {
                        try { newEl.setSelectionRange(cursorStart, cursorEnd); } catch(e) {}
                    }
                }
            }
            // [포커스 복구 끝]
        }

        function renderDashboard() {
            const todayDate = new Date();
            const today = todayDate.toISOString().split('T')[0];
            const currentMonth = todayDate.getMonth() + 1;

            const todayLogs = state.logs.filter(l => l.date === today).length;
            const activeClients = state.clients.filter(c => {
                const isTerminated = c.status === '종결' || (c.endDate && c.endDate < today);
                const isNotStarted = c.serviceStartDate && c.serviceStartDate > today;
                // [수정] 이름이 '-'인 경우 통계에서 제외 (기타 사업 관리용)
                return (c.status === '이용' || c.status === '장기부재') && !isTerminated && !isNotStarted && c.name !== '-';
            });
            const totalActive = activeClients.length;
            const highFocus = activeClients.filter(c => c.careLevel === '중점').length;
            const general = activeClients.filter(c => c.careLevel === '일반').length;

            // [신규] 이번 달 사례회의 대상자 (정기/재사정 기준) 계산
            const meetingCandidates = state.clients.filter(c => {
                // [수정] 이름이 '-'인 경우 회의 대상 제외
                if (c.status === '종결' || !c.serviceStartDate || c.name === '-') return false;
                const startMonth = parseInt(c.serviceStartDate.split('-')[1]);
                return startMonth === currentMonth;
            }).length;

            return `
                <div class="space-y-6 animate-fade-in p-1">
                    <div class="flex justify-between items-center">
                        <!-- [수정] 제목 옆에 로딩 태그 추가 -->

                        <div class="text-xs md:text-sm text-emerald-600 flex items-center gap-1"><div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>공유 중</div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 md:gap-6">
                        <div onclick="app.setTab('clients')" class="bg-white p-4 md:p-6 rounded-xl shadow-sm border border-slate-100 flex items-center gap-4 cursor-pointer hover:bg-slate-50 transition-colors">
                            <div class="p-3 bg-blue-100 text-blue-600 rounded-lg"><i data-lucide="users"></i></div>
                            <div>
                                <p class="text-sm text-slate-500">총 대상자 <span class="text-xs text-slate-400">(이용/장기부재)</span></p>
                                <p class="text-2xl font-bold text-slate-800">${totalActive}<span class="text-sm font-normal text-slate-500">명</span></p>
                                <p class="text-xs text-slate-400 mt-1">(중점: <span class="text-pink-600 font-bold">${highFocus}</span> / 일반: <span class="text-blue-600 font-bold">${general}</span>)</p>
                            </div>
                        </div>
                        <div onclick="app.setTab('logs')" class="bg-white p-4 md:p-6 rounded-xl shadow-sm border border-slate-100 flex items-center gap-4 cursor-pointer hover:bg-slate-50 transition-colors">
                            <div class="p-3 bg-emerald-100 text-emerald-600 rounded-lg"><i data-lucide="file-text"></i></div>
                            <div><p class="text-sm text-slate-500">오늘 일지</p><p class="text-2xl font-bold text-slate-800">${todayLogs}<span class="text-sm font-normal text-slate-500">건</span></p></div>
                        </div>
                        <!-- [수정] 제공 서비스 박스 -> 월 사례회의 대상자 박스로 변경 -->
                        <div onclick="app.setTab('meeting')" class="bg-white p-4 md:p-6 rounded-xl shadow-sm border border-slate-100 flex items-center gap-4 cursor-pointer hover:bg-slate-50 transition-colors">
                            <div class="p-3 bg-purple-100 text-purple-600 rounded-lg"><i data-lucide="calendar-clock"></i></div>
                            <div><p class="text-sm text-slate-500">${currentMonth}월 사례회의 대상</p><p class="text-2xl font-bold text-slate-800">${meetingCandidates}<span class="text-sm font-normal text-slate-500">명</span></p></div>
                        </div>
                    </div>
                    <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-4 md:p-6">
                        <h3 class="text-lg font-bold text-slate-800 mb-4">최근 활동</h3>
                        <div class="space-y-3">
                        ${state.logs.length === 0 ? '<p class="text-center text-slate-400 py-4">데이터 없음</p>' : state.logs.slice(0,5).map(log => `
                            <div class="flex flex-col sm:flex-row sm:items-start gap-2 sm:gap-4 pb-3 border-b last:border-0 p-2 hover:bg-slate-50 rounded">
                                <div class="hidden sm:block mt-1 text-slate-500"><i data-lucide="check-circle" size="16"></i></div>
                                <div class="flex-1">
                                    <p class="font-medium text-slate-800 text-sm md:text-base">
                                        <span class="text-emerald-600 font-bold">${log.clientName}</span>님 
                                        <span class="text-xs text-slate-400 mx-1">|</span>
                                        ${log.serviceName}
                                    </p>
                                    <p class="text-xs md:text-sm text-slate-500 mt-1 line-clamp-2">${log.date} | ${log.content}</p>
                                </div>
                            </div>`).join('')}
                        </div>
                    </div>
                </div>`;
        }

        function renderClientManager() {
             const { search, searchPhone, status, level, economicStatus, duplicateService, ictStatus, region, gender, targetYear, targetMonth } = state.filters.client;
            let filterStart = '0000-01-01', filterEnd = '9999-12-31';
            if (targetYear) {
                if (targetMonth) {
                    const m = String(targetMonth).padStart(2, '0');
                    filterStart = `${targetYear}-${m}-01`;
                    const lastDay = new Date(targetYear, targetMonth, 0).getDate();
                    filterEnd = `${targetYear}-${m}-${lastDay}`;
                } else {
                    filterStart = `${targetYear}-01-01`;
                    filterEnd = `${targetYear}-12-31`;
                }
            }
            const filtered = state.clients.filter(c => {
                const matchEconomic = !economicStatus || (c.economicStatus && (
                    c.economicStatus === economicStatus || 
                    (economicStatus === '조건부 기초수급' && c.economicStatus === '조건부 수급자') ||
                    (economicStatus === '기초수급' && (c.economicStatus === '기초수급자' || c.economicStatus === '수급자'))
                ));

                const matchBasic = (!search || c.name.includes(search)) &&
                                   (!searchPhone || (c.phone && c.phone.includes(searchPhone))) && 
                                   (!status || c.status === status) &&
                                   (!level || c.careLevel === level) &&
                                   matchEconomic &&
                                   (!duplicateService || c.duplicateService === duplicateService) &&
                                   (!ictStatus || (c.ictStatus || '부') === ictStatus) &&
                                   (region.length === 0 || region.includes(c.region)) &&
                                   (!gender || c.gender === gender);
                if (!matchBasic) return false;
                const sDate = c.serviceStartDate || '0000-01-01'; 
                const eDate = c.endDate || '9999-12-31'; 
                if (sDate > filterEnd) return false;
                if (status && status !== '종결') { if (eDate < filterStart) return false; }
                return true;
            }).sort((a, b) => {
                // [수정] 이름이 '-'인 데이터(기타 사업)는 항상 맨 뒤로 정렬
                if (a.name === '-' && b.name !== '-') return 1;
                if (a.name !== '-' && b.name === '-') return -1;

                if (targetYear) {
                    const eDateA = a.endDate || '9999-12-31';
                    const activeA = eDateA >= filterStart;
                    const eDateB = b.endDate || '9999-12-31';
                    const activeB = eDateB >= filterStart;
                    if (activeA && !activeB) return -1;
                    if (!activeA && activeB) return 1;
                }
                return (a.serviceStartDate || '').localeCompare(b.serviceStartDate || '');
            });

            const currentYearStr = String(new Date().getFullYear());
            let activeStats = { total: 0, using: 0, absent: 0, highFocus: 0, general: 0, male: 0, female: 0 };
            let yearStats = { new: 0, end: 0 };
            const today = new Date().toISOString().split('T')[0];

            state.clients.forEach(c => {
                // [추가] 이름이 '-'인 데이터는 모든 통계 집계에서 강제 패스!
                if (c.name === '-') return; 

                const isTerminatedToday = c.status === '종결' || (c.endDate && c.endDate < today);
                const isNotStartedYet = c.serviceStartDate && c.serviceStartDate > today;
                if ((c.status === '이용' || c.status === '장기부재') && !isTerminatedToday && !isNotStartedYet) {
                    activeStats.total++;
                    if (c.status === '이용') activeStats.using++;
                    else if (c.status === '장기부재') activeStats.absent++;
                    if (c.careLevel === '중점') activeStats.highFocus++;
                    else if (c.careLevel === '일반') activeStats.general++;
                    if (c.gender === '남성') activeStats.male++;
                    else if (c.gender === '여성') activeStats.female++;
                }
                if (c.serviceStartDate && c.serviceStartDate.startsWith(currentYearStr)) yearStats.new++;
                if (c.endDate && c.endDate.startsWith(currentYearStr)) yearStats.end++;
            });

            const yearOptions = [`<option value="" ${!targetYear ? 'selected' : ''}>전체 기간</option>`];
            for (let y = 2010; y <= 2100; y++) yearOptions.push(`<option value="${y}" ${parseInt(targetYear) === y ? 'selected' : ''}>${y}년</option>`);
            const monthOptions = [`<option value="" ${!targetMonth ? 'selected' : ''}>전체 월</option>`];
            for (let m = 1; m <= 12; m++) monthOptions.push(`<option value="${m}" ${parseInt(targetMonth) === m ? 'selected' : ''}>${m}월</option>`);
            
            // [수정] 필터링 결과 집계 시 '-' 데이터 제외 (카운트에서만 제외)
            const realFiltered = filtered.filter(c => c.name !== '-');
            const filteredTotal = realFiltered.length;
            const filteredHighFocus = realFiltered.filter(c => c.careLevel === '중점').length;
            const filteredGeneral = realFiltered.filter(c => c.careLevel === '일반').length;
            
            const isFilterActive = search !== '' || searchPhone !== '' || status !== '이용' || level !== '' || economicStatus !== '' || duplicateService !== '' || ictStatus !== '' || region.length > 0 || gender !== '' || targetYear !== '' || targetMonth !== '';

            // [신규] 전체 선택 여부 확인 ('-' 제외된 목록으로 100% 검사)
            const allSelected = realFiltered.length > 0 && realFiltered.every(c => state.ui.selectedClientIds.has(c.id));

            return `
                <div class="flex flex-col animate-fade-in">

                                <!-- [수정] 저장 버튼 통합 (드롭다운) -->
                                <div class="relative z-30">
                                    <button onclick="app.toggleClientExportDropdown()" class="bg-slate-100 text-slate-600 px-3 py-2 rounded-lg text-xs md:text-sm flex items-center gap-1 hover:bg-slate-200 transition-colors font-medium border border-slate-200">
                                        <i data-lucide="download" size="14"></i> 저장 <i data-lucide="chevron-down" size="12" class="ml-0.5 opacity-60"></i>
                                    </button>
                                    ${state.ui.clientExportDropdownOpen ? `
                                        <div class="fixed inset-0 z-30" onclick="app.toggleClientExportDropdown()"></div>
                                        <div class="absolute top-full right-0 mt-1 w-48 bg-white border border-slate-200 rounded-lg shadow-xl z-40 p-1 animate-fade-in flex flex-col">
                                            <button onclick="app.downloadClientListExcel(); app.toggleClientExportDropdown()" class="text-left px-3 py-2.5 text-sm text-slate-700 hover:bg-slate-50 rounded flex items-center gap-2 transition-colors">
                                                <i data-lucide="file-spreadsheet" size="14" class="text-green-600"></i> 
                                                <span>명부 엑셀 저장</span>
                                            </button>
                                            <!-- [신규] PDF 버튼 대신 들어간 일괄 인쇄 버튼 -->
                                            <button onclick="app.openCasePrintSelector(); app.toggleClientExportDropdown()" class="text-left px-3 py-2.5 text-sm text-slate-700 hover:bg-slate-50 rounded flex items-center gap-2 transition-colors border-t border-slate-50">
                                                <i data-lucide="printer" size="14" class="text-blue-500"></i> 
                                                <span>사례관리 서류 인쇄</span>
                                            </button>
                                        </div>
                                    ` : ''}
                                </div>

                                <button onclick="app.downloadTemplate()" class="bg-slate-100 text-slate-600 px-3 py-2 rounded-lg text-xs md:text-sm flex items-center gap-1 flex-1 sm:flex-none justify-center"><i data-lucide="file-text" size="14"></i> 양식</button>
                                <label class="bg-slate-100 text-slate-600 px-3 py-2 rounded-lg text-xs md:text-sm flex items-center gap-1 cursor-pointer flex-1 sm:flex-none justify-center"><i data-lucide="upload" size="14"></i> 업로드<input type="file" class="hidden" onchange="app.uploadExcel(this)"></label>
                                <button onclick="app.openClientModal()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-xs md:text-sm flex items-center gap-1 flex-1 sm:flex-none justify-center"><i data-lucide="plus" size="16"></i> 등록</button>
                            </div>
                        </div>
                        <div class="flex flex-wrap gap-3 justify-start">
                           <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex items-center gap-4 min-w-[240px]">
                              <div><p class="text-sm text-slate-500 font-medium leading-tight">이용 대상자</p><p class="text-2xl font-bold text-slate-800 mt-1">${activeStats.total}<span class="text-sm text-slate-400 font-normal ml-1">명 <span class="text-xs text-slate-500 font-normal tracking-tight ml-1">(이용중 : ${activeStats.using} / 장기부재 : ${activeStats.absent})</span></span></p></div>
                              <div class="p-3 bg-emerald-50 rounded-full text-emerald-500 ml-auto"><i data-lucide="user-check" size="24"></i></div>
                           </div>
                           <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex items-center gap-6">
                              <div class="flex flex-col justify-center"><span class="text-xs text-slate-500 font-bold mb-1">등급별</span><div class="text-sm font-bold flex gap-2"><span class="text-pink-600">중점 ${activeStats.highFocus}</span><span class="text-slate-300">|</span><span class="text-blue-600">일반 ${activeStats.general}</span></div></div>
                              <div class="w-px h-8 bg-slate-100"></div>
                              <div class="flex flex-col justify-center"><span class="text-xs text-slate-500 font-bold mb-1">성별</span><div class="text-sm font-bold flex gap-2"><span class="text-blue-500">남 ${activeStats.male}</span><span class="text-slate-300">|</span><span class="text-red-500">여 ${activeStats.female}</span></div></div>
                           </div>
                           <div onclick="app.showYearStatsModal()" class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex items-center gap-6 cursor-pointer hover:bg-slate-50 transition-colors group">
                              <div class="flex flex-col justify-center"><span class="text-xs text-slate-500 font-bold mb-1 group-hover:text-emerald-600 transition-colors">올해 현황 (${currentYearStr})</span><div class="text-sm font-bold flex gap-2"><span class="text-emerald-600">신규 ${yearStats.new}</span><span class="text-slate-300">|</span><span class="text-slate-500">종결 ${yearStats.end}</span></div></div>
                              <div class="p-3 bg-orange-50 rounded-full text-orange-500 ml-auto group-hover:bg-orange-100 transition-colors"><i data-lucide="activity" size="20"></i></div>
                           </div>
                        <!-- 신규 추가: 사례관리 현황 통계 박스 -->
                           <div onclick="app.showCaseManagementStatsModal()" class="bg-white py-3 px-4 rounded-xl shadow-sm border border-slate-100 flex items-center gap-3 cursor-pointer hover:bg-slate-50 transition-colors group">
                              <div class="flex flex-col justify-center">
                                  <span class="text-sm font-bold text-slate-700 group-hover:text-purple-600 transition-colors">사례관리 현황</span>
                              </div>
                              <div class="p-2.5 bg-purple-50 rounded-full text-purple-500 ml-2 group-hover:bg-purple-100 transition-colors">
                                  <i data-lucide="file-check-2" size="18"></i>
                              </div>
                           </div>
                            ${isFilterActive ? `
                           <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex items-center gap-6 animate-fade-in">
                              <div class="flex flex-col justify-center">
                                  <span class="text-xs text-slate-500 font-bold mb-1">조회된 대상자</span>
                                  <div class="text-sm font-bold flex items-baseline gap-1">
                                      <span class="text-xl text-slate-800">${filteredTotal}</span><span class="text-xs text-slate-500 font-normal">명</span>
                                      <span class="text-slate-300 mx-1">|</span>
                                      <span class="text-xs text-slate-500">(중점 <span class="text-pink-600">${filteredHighFocus}</span> / 일반 <span class="text-blue-600">${filteredGeneral}</span>)</span>
                                  </div>
                              </div>
                              <div class="p-3 bg-indigo-50 rounded-full text-indigo-500 ml-auto"><i data-lucide="search" size="20"></i></div>
                           </div>` : ''}
                        </div>
                        
                        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col gap-2">
                            <div class="flex flex-wrap items-center gap-3 w-full">
                                <div class="flex items-center gap-2 flex-1 min-w-[180px]"><span class="text-sm font-bold text-slate-600 whitespace-nowrap">대상자명</span><input id="client-search-name" enterkeyhint="search" class="input-field py-1.5 px-2 text-sm w-full" placeholder="이름 입력 (Enter)" value="${search}" onkeydown="if(event.key === 'Enter' || event.keyCode === 13) app.setFilter('client','search',this.value)" oninput="if(this.value === '') app.setFilter('client','search','')"></div>
                                <div class="flex items-center gap-2 flex-1 min-w-[180px]"><span class="text-sm font-bold text-slate-600 whitespace-nowrap">연락처</span><input id="client-search-phone" enterkeyhint="search" class="input-field py-1.5 px-2 text-sm w-full" placeholder="번호 입력 (Enter)" value="${searchPhone}" onkeydown="if(event.key === 'Enter' || event.keyCode === 13) app.setFilter('client','searchPhone',this.value)" oninput="if(this.value === '') app.setFilter('client','searchPhone','')"></div>
                                <!-- [수정] 초기화 버튼에 app.render() 추가하여 분할 화면에서 갱신 보장 -->
                                <button onclick="app.resetFilters('client'); app.render()" class="bg-slate-100 text-slate-500 hover:text-slate-700 text-xs flex items-center gap-1 whitespace-nowrap px-3 py-2 rounded-lg font-medium transition-colors ml-auto sm:ml-0"><i data-lucide="refresh-cw" size="14"></i> 초기화</button>
                            </div>
                            <!-- [수정] 스크롤 제거 및 Flex Wrap 적용하여 반응형 배치 -->
                            <div class="pt-2 border-t border-slate-100">
                                <div class="flex flex-wrap items-center gap-2 pb-1">
                                    <select class="input-field py-1.5 px-2 text-sm flex-1 min-w-[110px]" onchange="app.setFilter('client','targetYear',this.value)" title="연도">${yearOptions.join('')}</select>
                                    <select class="input-field py-1.5 px-2 text-sm flex-1 min-w-[90px]" onchange="app.setFilter('client','targetMonth',this.value)" title="월">${monthOptions.join('')}</select>
                                    
                                    <div class="hidden md:block w-px h-4 bg-slate-300 mx-1"></div>
                                    
                                    <select class="input-field py-1.5 px-2 text-sm flex-1 min-w-[110px]" onchange="app.setFilter('client','status',this.value)"><option value="">상태(전체)</option>${CONSTANTS.STATUS_LIST.map(s=>`<option value="${s}" ${status===s?'selected':''}>${s}</option>`).join('')}</select>
                                    <select class="input-field py-1.5 px-2 text-sm flex-1 min-w-[110px]" onchange="app.setFilter('client','level',this.value)"><option value="">등급(전체)</option>${CONSTANTS.CARE_LEVEL_LIST.map(c=>`<option value="${c}" ${level===c?'selected':''}>${c}</option>`).join('')}</select>
                                    
                                    <div class="relative z-30 flex-1 min-w-[120px]">

                                        ${state.ui.regionDropdownOpen ? `<div class="fixed inset-0 z-40" onclick="app.toggleRegionDropdown()"></div><div id="dropdown-region-menu" class="fixed mt-1 w-48 bg-white border border-slate-200 rounded-lg shadow-xl z-50 p-2 max-h-60 overflow-y-auto animate-fade-in">${CONSTANTS.DONG_LIST.map(d => `<label class="flex items-center gap-2 text-sm p-2 hover:bg-slate-50 rounded cursor-pointer select-none"><input type="checkbox" class="rounded text-emerald-600 focus:ring-emerald-500 w-4 h-4 border-slate-300" ${region.includes(d) ? 'checked' : ''} onchange="app.toggleRegionFilter('${d}')"><span class="text-slate-700">${d}</span></label>`).join('')}</div>` : ''}
                                    </div>
                                    
                                    <select class="input-field py-1.5 px-2 text-sm flex-1 min-w-[100px]" onchange="app.setFilter('client','gender',this.value)"><option value="">성별(전체)</option><option value="남성" ${gender==='남성'?'selected':''}>남성</option><option value="여성" ${gender==='여성'?'selected':''}>여성</option></select>
                                    <select class="input-field py-1.5 px-2 text-sm flex-1 min-w-[120px]" onchange="app.setFilter('client','economicStatus',this.value)"><option value="">경제상황(전체)</option>${CONSTANTS.ECONOMIC_LIST.map(e=>`<option value="${e}" ${economicStatus===e?'selected':''}>${e}</option>`).join('')}</select>
                                    <select class="input-field py-1.5 px-2 text-sm flex-1 min-w-[120px]" onchange="app.setFilter('client','duplicateService',this.value)"><option value="">중복서비스(전체)</option>${CONSTANTS.DUPLICATE_SERVICE_LIST.map(d=>`<option value="${d}" ${duplicateService===d?'selected':''}>${d}</option>`).join('')}</select>
                                    <select class="input-field py-1.5 px-2 text-sm flex-1 min-w-[100px]" onchange="app.setFilter('client','ictStatus',this.value)"><option value="">ICT(전체)</option>${CONSTANTS.ICT_STATUS_LIST.map(i=>`<option value="${i}" ${ictStatus===i?'selected':''}>${i}</option>`).join('')}</select>

                    <!-- [신규] 전체 선택 체크박스 및 일괄 작업 버튼 배치 -->
                    <div class="flex items-center justify-between px-1 mb-2 mt-2">
                        <div class="flex items-center gap-3">
                            <label class="flex items-center gap-2 cursor-pointer select-none hover:bg-slate-100 px-2 py-1 rounded transition-colors">
                                <input type="checkbox" id="client-select-all" class="w-4 h-4 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500" onchange="app.toggleAllClients(this.checked)" ${allSelected ? 'checked' : ''} ${filtered.length === 0 ? 'disabled' : ''}>
                                <span class="text-sm font-bold text-slate-600">전체선택 (${filteredTotal}명)</span>
                            </label>
                            <!-- [이동] 일괄수정/선택삭제 버튼을 전체선택 오른쪽으로 이동 -->
                            <div id="client-batch-actions" class="flex gap-2">
                                ${state.ui.selectedClientIds.size > 0 ? `
                                    <button onclick="app.openBatchEditClientModal()" class="bg-blue-50 text-blue-600 px-3 py-1 rounded-lg text-xs font-bold hover:bg-blue-100 transition-colors animate-fade-in">일괄수정(${state.ui.selectedClientIds.size})</button>
                                    <button onclick="app.deleteSelectedClients()" class="bg-red-50 text-red-600 px-3 py-1 rounded-lg text-xs font-bold hover:bg-red-100 transition-colors animate-fade-in">선택삭제</button>
                                ` : ''}
                            </div>
                        </div>
                    </div>

                    <!-- [추가] 대상자 목록 구분 헤더 (PC 화면에서만 보임) -->
                    <div class="hidden md:grid md:grid-cols-[150px_160px_140px_1fr_70px] gap-1 items-center px-3 py-2 bg-slate-100 border border-slate-200 rounded-lg text-xs font-bold text-slate-500 shadow-sm mb-2 mr-1">
                        <div class="pl-6">이름 (생년월일)</div>
                        <div>기본 정보</div>
                        <div>연락처</div>
                        <div>주소</div>
                        <div class="text-right pr-2">관리</div>
                    </div>   

                    <div id="client-list-container" class="overflow-y-auto max-h-[70vh] custom-scrollbar space-y-2 pr-1 pb-4">
                        ${filtered.length === 0 ? `<div class="text-center py-12 bg-white rounded-xl border border-dashed border-slate-200 text-slate-400">검색 결과가 없습니다.</div>` :
                        filtered.map(c => {
                            // [수정] 기타 사업용 더미 데이터('-') 여부 확인
                            const isEtcClient = c.name === '-';

                            const isLogicallyTerminated = c.status === '종결' || (c.endDate && c.endDate <= filterEnd);
                            const displayStatus = isLogicallyTerminated ? '종결' : c.status;
                            const statusColor = displayStatus === '종결' ? 'bg-slate-100 text-slate-500' : (displayStatus === '이용' ? 'bg-green-100 text-green-700' : 'bg-slate-100 text-slate-500');
                            const eDate = c.endDate || '9999-12-31';
                            const wasActiveInPeriod = eDate >= filterStart;
                            const getEconomicDisplay = (status) => {
                                if (status === '일반(저소득)') return '저소득';
                                if (status === '조건부 기초수급' || status === '조건부 수급자') return '조건부';
                                // [수정] 기초수급 관련 값이면 무조건 '수급자'로 표시되도록 조건 단순화
                                if (status === '기초수급' || status === '기초수급자' || status === '수급자') return '수급자';
                                return status || '-';
                            };
                            const birthShort = c.birthDate ? c.birthDate.substring(2).replace(/-/g, '.') : '-';
                            const genderShort = c.gender === '남성' ? '남' : (c.gender === '여성' ? '여' : c.gender);
                            const genderColorClass = c.gender === '남성' ? 'text-blue-600' : 'text-red-600';

                            // [수정] '-' 데이터인 경우 상세 정보(행정동, 경제, 등급, 상태) 숨김 처리
                            const regionBadge = isEtcClient ? '' : `<span class="text-xs px-1.5 py-0.5 rounded bg-slate-100 text-slate-600 font-medium whitespace-nowrap border border-slate-200">${c.region}</span>`;
                            const ecoBadge = isEtcClient ? '' : `<span class="text-xs px-1.5 py-0.5 rounded bg-amber-50 text-amber-700 border border-amber-100 font-medium whitespace-nowrap">${getEconomicDisplay(c.economicStatus)}</span>`;
                            const levelBadge = isEtcClient ? '' : `<span class="text-xs px-1.5 py-0.5 rounded ${c.careLevel==='중점'?'bg-pink-50 text-pink-700 border border-pink-100':'bg-blue-50 text-blue-700 border border-blue-100'} font-medium whitespace-nowrap">${c.careLevel}</span>`;
                            const statusBadge = isEtcClient ? '' : `<span class="text-xs px-1.5 py-0.5 rounded ${statusColor} font-medium whitespace-nowrap border border-slate-200">${displayStatus}</span>`;
                            // 이름 옆 정보도 '-' 데이터면 숨김 (요청: "아무 정보가 없어도 돼")
                            const nameDetail = isEtcClient ? '' : `<span class="text-sm font-bold text-slate-600 whitespace-nowrap overflow-hidden text-ellipsis">(${birthShort}/<span class="${genderColorClass}">${genderShort}</span>)</span>`;
                            const activeDot = (!isEtcClient && targetYear && wasActiveInPeriod) ? `<div class="w-2.5 h-2.5 rounded-full bg-emerald-500 ml-0.5 shadow-sm" title="해당 기간 이용 이력 있음"></div>` : '';

                            return `
                            <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-100 flex flex-col md:grid md:grid-cols-[150px_160px_140px_1fr_70px] gap-1 md:items-center group hover:bg-slate-50 transition-colors">
                                <div class="flex items-center gap-2 w-full overflow-hidden">
                                    <input type="checkbox" class="w-4 h-4 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500 cursor-pointer flex-shrink-0" onchange="app.toggleClientSelection('${c.id}')" ${state.ui.selectedClientIds.has(c.id) ? 'checked' : ''}>
                                    <div class="flex items-center gap-1 overflow-hidden">
                                        <span class="font-bold text-xl text-slate-800 cursor-pointer hover:text-blue-600 truncate flex-shrink-0" onclick="app.openClientModal('${c.id}')" title="상세 정보 보기/수정">${c.name}</span>
                                        ${nameDetail}
                                    </div>
                                </div>
                                <div class="flex items-center gap-1 w-full flex-wrap content-start">
                                    ${regionBadge}
                                    ${ecoBadge}
                                    ${levelBadge}
                                    ${statusBadge}
                                    ${activeDot}
                                </div>
                                <div class="flex items-center gap-2 w-full overflow-hidden" title="${c.phone||''}${c.phone2 ? ' / ' + c.phone2 : ''}"><span class="truncate text-lg text-slate-900">${isEtcClient ? '' : (c.phone||'-')}${!isEtcClient && c.phone2 ? ' / ' + c.phone2 : ''}</span></div>
                                <div class="flex items-center gap-2 w-full overflow-hidden" title="${c.address||''}"><span class="truncate text-lg text-slate-900">${isEtcClient ? '' : (c.address||'-')}</span></div>
                                <div class="flex items-center justify-end gap-1 w-full">
                                    <button onclick="app.openClientModal('${c.id}')" class="text-slate-400 hover:text-blue-500 p-1 rounded" title="수정"><i data-lucide="edit" size="12"></i></button>
                                    <button onclick="app.deleteData('clients','${c.id}')" class="text-slate-400 hover:text-red-500 p-1 rounded" title="삭제"><i data-lucide="trash-2" size="12"></i></button>
                                </div>
                            </div>`;
                        }).join('')}
                    </div>
                </div>`;
        }

        function renderLogManager() {
            const filteredFull = getFilteredLogs(); 
            const totalLogs = filteredFull.length;
            const totalPages = Math.ceil(totalLogs / state.ui.logsPerPage) || 1;

            // 현재 페이지 유효성 검사
            if (state.ui.logPage > totalPages) state.ui.logPage = totalPages;
            if (state.ui.logPage < 1) state.ui.logPage = 1;

            const startIndex = (state.ui.logPage - 1) * state.ui.logsPerPage;
            const endIndex = startIndex + state.ui.logsPerPage;
            const visibleLogs = filteredFull.slice(startIndex, endIndex);

            const categories = [...new Set(state.services.map(s => s.category))];
            // [수정] 다중 정렬 기능 변수 추가
            const { category, service, detailNote, start, end, search, contentSearch, provider, region, sortArray } = state.filters.log; 
            const filteredServices = category ? state.services.filter(s => s.category === category) : state.services;
            const allSelected = visibleLogs.length > 0 && visibleLogs.every(l => state.ui.selectedLogIds.has(l.id));

            // [수정] 연도 선택 옵션 생성 로직 개선 (범위 2015년으로 확장)
            const currentYear = new Date().getFullYear();
            const logYearOptions = [];
            // 과거 데이터 조회를 위해 시작 연도를 2015년으로 확장
            for (let y = 2015; y <= currentYear + 1; y++) {
                const isSelected = start === `${y}-01-01` && end === `${y}-12-31`;
                logYearOptions.push(`<option value="${y}" ${isSelected ? 'selected' : ''}>${y}년</option>`);
            }
            logYearOptions.reverse(); 
            
            // [신규] 전체 연도 옵션 추가
            const isAllSelected = start === '2000-01-01' && end === '9999-12-31';
            logYearOptions.unshift(`<option value="all" ${isAllSelected ? 'selected' : ''}>전체 연도</option>`);
            logYearOptions.unshift(`<option value="">연도 (기본)</option>`); 

            // 페이지네이션 UI 생성
            let paginationHTML = '';
            if (totalPages > 1) {
                paginationHTML = `<div class="flex justify-center items-center gap-1 select-none">`;
                
                // 이전 버튼 [수정: 클릭 시 스크롤 최상단 이동 추가]
                // [분할화면 수정] onmousedown="event.stopPropagation()" 추가하여 창 포커스 이벤트 간섭 방지
                paginationHTML += `<button onmousedown="event.stopPropagation()" onclick="document.getElementById('log-list-container').scrollTop = 0; app.setLogPage(${state.ui.logPage - 1})" class="w-8 h-8 flex items-center justify-center rounded hover:bg-slate-100 text-slate-500 disabled:opacity-30 disabled:cursor-not-allowed transition-colors" ${state.ui.logPage === 1 ? 'disabled' : ''}><i data-lucide="chevron-left" size="16"></i></button>`;
                
                // 페이지 번호 표시 범위 계산
                let startPage = Math.max(1, state.ui.logPage - 2);
                let endPage = Math.min(totalPages, startPage + 4);
                if (endPage - startPage < 4) startPage = Math.max(1, endPage - 4);

                // 첫 페이지
                if (startPage > 1) {
                    paginationHTML += `<button onmousedown="event.stopPropagation()" onclick="document.getElementById('log-list-container').scrollTop = 0; app.setLogPage(1)" class="w-8 h-8 flex items-center justify-center rounded text-sm font-medium hover:bg-slate-100 text-slate-600 transition-colors">1</button>`;
                    if (startPage > 2) paginationHTML += `<span class="text-slate-300 text-xs px-1">...</span>`;
                }

                // 번호 버튼 [수정: 클릭 시 스크롤 최상단 이동 추가]
                for (let i = startPage; i <= endPage; i++) {
                    const activeClass = i === state.ui.logPage ? 'bg-emerald-600 text-white font-bold shadow-sm' : 'hover:bg-slate-100 text-slate-600';
                    paginationHTML += `<button onmousedown="event.stopPropagation()" onclick="document.getElementById('log-list-container').scrollTop = 0; app.setLogPage(${i})" class="w-8 h-8 flex items-center justify-center rounded text-sm transition-colors ${activeClass}">${i}</button>`;
                }

                // 마지막 페이지
                if (endPage < totalPages) {
                    if (endPage < totalPages - 1) paginationHTML += `<span class="text-slate-300 text-xs px-1">...</span>`;
                    paginationHTML += `<button onmousedown="event.stopPropagation()" onclick="document.getElementById('log-list-container').scrollTop = 0; app.setLogPage(${totalPages})" class="w-8 h-8 flex items-center justify-center rounded text-sm font-medium hover:bg-slate-100 text-slate-600 transition-colors">${totalPages}</button>`;
                }

                // 다음 버튼 [수정: 클릭 시 스크롤 최상단 이동 추가]
                paginationHTML += `<button onmousedown="event.stopPropagation()" onclick="document.getElementById('log-list-container').scrollTop = 0; app.setLogPage(${state.ui.logPage + 1})" class="w-8 h-8 flex items-center justify-center rounded hover:bg-slate-100 text-slate-500 disabled:opacity-30 disabled:cursor-not-allowed transition-colors" ${state.ui.logPage === totalPages ? 'disabled' : ''}><i data-lucide="chevron-right" size="16"></i></button>`;
                
                paginationHTML += `</div>`;
            }

            // [변경] 뷰 모드에 따른 스타일 분기 처리
            const isSingleView = state.viewMode === 'single';
            
            // 싱글 뷰일 때는 fixed로 하단 고정, 스플릿 뷰일 때는 sticky 유지
            const footerClass = isSingleView 
                ? "fixed bottom-0 left-0 right-0 z-[55] bg-slate-50 border-t border-slate-200 py-2 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]"
                : "sticky bottom-0 z-50 bg-slate-50 border-t border-slate-200 py-2 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]";
                
            const listClass = isSingleView 
                ? "overflow-y-auto custom-scrollbar space-y-4 pr-1 pb-20" // 하단 패딩 증가 (Fixed Footer 고려)
                : "overflow-y-auto custom-scrollbar space-y-4 pr-1 pb-4";

            // [핵심 변경 사항] 목록 컨테이너에 max-height를 강제 적용하여 내부 스크롤 생성 (70vh)
            // 브라우저 전체 높이가 70vh + 헤더 높이보다 작으면 브라우저 스크롤 발생
            // 목록 내용이 70vh보다 길면 내부 스크롤 발생
            const containerStyle = "max-height: 70vh;"; 

            return `
                <div class="space-y-6 animate-fade-in p-1">
                    <!-- [상단] 필터 영역 (Sticky: 전체 스크롤 시 상단 고정) -->
                    <div class="sticky top-0 z-50 bg-slate-50 pt-2 pb-2 shadow-sm -mx-1 px-1">
                        <div class="space-y-4 pb-2 transition-all">
                            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 pt-1">
                                <!-- [수정] 제목 옆에 로딩 태그 추가 -->
                                <h2 class="text-xl md:text-2xl font-bold text-slate-800 flex items-center">서비스 일지 ${getLoadingTag()}</h2>
                                <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto">
                                    <!-- [분할화면 수정] 상단 버튼들에도 event.stopPropagation 추가 -->
                                    <button onmousedown="event.stopPropagation()" onclick="app.downloadLogTemplate()" class="bg-slate-100 text-slate-600 px-3 py-2 rounded-lg text-sm font-medium flex items-center gap-1 hover:bg-slate-200 transition-colors"><i data-lucide="file-spreadsheet" size="16"></i> 양식</button>
                                    <label class="bg-slate-100 text-slate-600 px-3 py-2 rounded-lg text-sm font-medium flex items-center gap-1 cursor-pointer hover:bg-slate-200 transition-colors" onmousedown="event.stopPropagation()">
                                        <i data-lucide="upload" size="16"></i> 업로드
                                        <input type="file" class="hidden" onchange="app.uploadLogExcel(this)" accept=".xlsx, .xls">
                                    </label>
                                    <button onmousedown="event.stopPropagation()" onclick="app.printLogs()" class="bg-slate-100 text-slate-600 px-3 py-2 rounded-lg text-sm font-medium flex items-center gap-1 hover:bg-slate-200 transition-colors"><i data-lucide="printer" size="16"></i> 인쇄</button>
                                    <button onmousedown="event.stopPropagation()" onclick="app.downloadLogsExcel()" class="bg-slate-100 text-slate-600 px-3 py-2 rounded-lg text-sm font-medium flex items-center gap-1 hover:bg-slate-200 transition-colors"><i data-lucide="download" size="16"></i> 엑셀 저장</button>
                                    <button onmousedown="event.stopPropagation()" onclick="app.openLogModal()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg flex items-center gap-2 text-sm font-medium hover:bg-emerald-700 transition-colors"><i data-lucide="plus" size="16"></i> 작성</button>
                                </div>
                            </div>

                            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap items-center gap-2">
                                <!-- [수정] 모든 필터 요소에 h-9 (36px) 클래스 적용하여 높이 통일 -->
                                <select class="input-field h-9 py-1 px-2 text-sm w-24 font-medium border-slate-200 bg-slate-50 mr-1 focus:ring-0 focus:border-emerald-500" onchange="app.setLogYear(this.value)">
                                    ${logYearOptions.join('')}
                                </select>

                                <div class="flex items-center gap-2 w-full sm:w-auto px-2 bg-slate-50 rounded-lg border border-slate-200 h-9">
                                    <input type="date" id="log-filter-start" class="bg-transparent border-0 text-sm focus:ring-0 p-0 w-[110px] h-full" value="${start}" max="9999-12-31">
                                    <span class="text-slate-400">~</span>
                                    <input type="date" id="log-filter-end" class="bg-transparent border-0 text-sm focus:ring-0 p-0 w-[110px] h-full" value="${end}" max="9999-12-31">
                                    <!-- [수정] 조회 버튼에 새로운 검색 함수 연결 -->
                                    <button onmousedown="event.stopPropagation()" onclick="app.searchLogsByDateRange()" class="bg-slate-800 text-white px-3 py-0.5 rounded text-xs font-medium hover:bg-slate-700 transition-colors whitespace-nowrap ml-1 h-6">조회</button>
                                </div>
                                <input id="log-search-name" enterkeyhint="search" class="input-field h-9 py-1 w-full sm:w-24 text-sm" placeholder="이름 (Enter)" value="${search}" onkeydown="if(event.key === 'Enter' || event.keyCode === 13) app.setFilter('log','search',this.value)" oninput="if(this.value === '') app.setFilter('log','search','')">
                                
                                <!-- [신규] 내용 검색 필터 추가 -->
                                <input id="log-search-content" enterkeyhint="search" class="input-field h-9 py-1 w-full sm:w-32 text-sm" placeholder="내용 검색 (Enter)" value="${contentSearch}" onkeydown="if(event.key === 'Enter' || event.keyCode === 13) app.setFilter('log','contentSearch',this.value)" oninput="if(this.value === '') app.setFilter('log','contentSearch','')">

                                <input id="log-search-provider" enterkeyhint="search" class="input-field h-9 py-1 w-full sm:w-24 text-sm" placeholder="제공자 (Enter)" value="${provider || ''}" onkeydown="if(event.key === 'Enter' || event.keyCode === 13) app.setFilter('log','provider',this.value)" oninput="if(this.value === '') app.setFilter('log','provider','')">
                                <div class="relative z-30 w-full sm:w-auto">
                                    <button onclick="app.toggleLogRegionDropdown()" class="input-field h-9 py-1 px-2 text-sm flex items-center justify-between min-w-[100px] bg-white cursor-pointer text-left w-full sm:w-28"><span class="truncate max-w-[80px] text-slate-700">${region.length > 0 ? (region.length === CONSTANTS.DONG_LIST.length ? '전체 동' : region.join(',')) : '전체 동'}</span><i data-lucide="chevron-down" size="14" class="text-slate-400 ml-2"></i></button>
                                    ${state.ui.logRegionDropdownOpen ? `<div class="fixed inset-0 z-40" onclick="app.toggleLogRegionDropdown()"></div><div class="absolute top-full left-0 mt-1 w-40 bg-white border border-slate-200 rounded-lg shadow-xl z-50 p-2 max-h-60 overflow-y-auto animate-fade-in">${CONSTANTS.DONG_LIST.map(d => `<label class="flex items-center gap-2 text-sm p-2 hover:bg-slate-50 rounded cursor-pointer select-none"><input type="checkbox" class="rounded text-emerald-600 focus:ring-emerald-500 w-4 h-4 border-slate-300" ${region.includes(d) ? 'checked' : ''} onchange="app.toggleLogRegionFilter('${d}')"><span class="text-slate-700">${d}</span></label>`).join('')}</div>` : ''}
                                </div>
                                <div class="flex flex-wrap gap-2 w-full sm:w-auto flex-1 min-w-[200px]">
                                    <select class="input-field h-9 py-1 w-full sm:w-28 text-sm flex-1" onchange="app.setFilter('log','category',this.value); app.setFilter('log','service','');"><option value="">서비스(전체)</option>${categories.map(c=>`<option value="${c}" ${category===c?'selected':''}>${c}</option>`).join('')}</select>
                                    <select class="input-field h-9 py-1 w-full sm:w-32 text-sm flex-1" onchange="app.setFilter('log','service',this.value)"><option value="">상세내용(전체)</option>${filteredServices.map(s=>`<option value="${s.name}" ${service===s.name?'selected':''}>${s.name}</option>`).join('')}</select>
                                    <input id="log-search-detailnote" enterkeyhint="search" class="input-field h-9 py-1 w-full sm:w-28 text-sm flex-1" placeholder="메모 (Enter)" value="${detailNote || ''}" onkeydown="if(event.key === 'Enter' || event.keyCode === 13) app.setFilter('log','detailNote',this.value)" oninput="if(this.value === '') app.setFilter('log','detailNote','')">
                                </div>
                                <!-- [수정] 초기화 버튼에 app.render() 추가하여 분할 화면에서 갱신 보장 -->
                                <button onmousedown="event.stopPropagation()" onclick="app.resetFilters('log'); app.render()" class="ml-auto text-slate-400 hover:text-slate-600 text-xs flex items-center gap-1 flex-shrink-0 h-9 px-2 hover:bg-slate-50 rounded transition-colors" title="초기화"><i data-lucide="refresh-cw" size="14"></i></button>
                            </div>

                            <div class="flex items-center gap-3">
                                        <div class="text-sm text-slate-500">
                                            총 <span class="font-bold text-slate-800">${totalLogs}</span>건
                                            <span class="text-xs text-slate-400 font-normal ml-1">(${state.ui.logPage} / ${totalPages} 페이지)</span>
                                        </div>
                                        <label class="flex items-center gap-2 cursor-pointer select-none hover:bg-slate-100 px-2 py-1 rounded transition-colors" onmousedown="event.stopPropagation()">
                                            <input type="checkbox" id="log-select-all" class="w-4 h-4 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500" onchange="app.toggleAllLogs(this.checked)" ${allSelected ? 'checked' : ''} ${visibleLogs.length === 0 ? 'disabled' : ''}>
                                            <span class="text-sm font-medium text-slate-600">전체선택 (현재 페이지)</span>
                                        </label>
                                        <div class="flex items-center gap-2" id="log-batch-actions">
                                            ${state.ui.selectedLogIds.size > 0 ? `
                                                <button onmousedown="event.stopPropagation()" onclick="app.openBatchEditLogModal()" class="bg-blue-50 text-blue-600 px-3 py-1.5 rounded-lg text-xs font-medium hover:bg-blue-100 transition-colors animate-fade-in">일괄수정(${state.ui.selectedLogIds.size})</button>
                                                <button onmousedown="event.stopPropagation()" onclick="app.deleteSelectedLogs()" class="bg-red-50 text-red-600 px-3 py-1.5 rounded-lg text-xs font-medium hover:bg-red-100 transition-colors animate-fade-in">선택삭제</button>
                                            ` : ''}
                                        </div>
                                    </div>
                                </div>
                                <!-- [신규] 가로형 다중 정렬 버튼 바 -->
                                <div class="flex flex-wrap items-center gap-1 px-1.5 py-0 bg-slate-100/70 border border-slate-200 rounded">
                                    <span class="text-[10px] font-bold text-slate-500 ml-1 mr-1"><i data-lucide="arrow-up-down" size="7" class="inline"></i> 다중 정렬:</span>
                                    ${['date', 'provider', 'clientName', 'provideMethod'].map(key => {
                                        const labels = { date: '날짜', clientName: '대상자명', provideMethod: '제공방법', provider: '제공자' };
                                        
                                        // 현재 다중 정렬 배열에 포함되어 있는지, 몇 번째(순위)인지 확인
