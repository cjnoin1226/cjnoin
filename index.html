                                        const sortIdx = sortArray ? sortArray.findIndex(item => item.key === key) : -1;
                                        const isActive = sortIdx > -1;
                                        const sortOrder = isActive ? sortArray[sortIdx].order : null;
                                        
                                        // 활성화 시 우선순위 번호 뱃지와 화살표 방향 설정
                                        const badge = isActive ? `<span class="bg-emerald-500 text-white rounded-full w-[14px] h-[14px] flex items-center justify-center text-[9px] font-bold -ml-0.5 mr-0.5 shadow-sm">${sortIdx + 1}</span>` : '';
                                        const icon = isActive ? (sortOrder === 'asc' ? '<i data-lucide="arrow-up" size="10"></i>' : '<i data-lucide="arrow-down" size="10"></i>') : '<i data-lucide="minus" size="7" class="opacity-30"></i>';
                                        
                                        const colorClass = isActive ? 'bg-white text-emerald-700 font-bold border-emerald-300 shadow-sm' : 'bg-transparent text-slate-600 border-transparent hover:bg-slate-200 hover:text-slate-800';
                                        
                                        return `
                                        <button onmousedown="event.stopPropagation()" onclick="app.toggleLogSort('${key}')" class="flex items-center gap-1 px-1.5 py-0.5 rounded text-[10px] border transition-all ${colorClass}">
                                            ${badge} ${labels[key]} ${icon}
                                        </button>`;
                                    }).join('')}
                                    
                                    <!-- [신규] 정렬 초기화 버튼 -->
                                    <div class="w-px h-2.5 bg-slate-300 mx-0.5"></div>
                                    <button onmousedown="event.stopPropagation()" onclick="app.setLogSort()" class="flex items-center gap-1 px-1.5 py-0.5 rounded text-[10px] text-slate-400 hover:text-slate-700 hover:bg-slate-200 transition-all">
                                        <i data-lucide="rotate-ccw" size="7"></i> 초기화
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- [중단] 목록 영역 (남은 공간 차지 + 내부 스크롤) -->
                    <!-- [수정] style 속성에 max-height를 부여하여 내용이 길어지면 내부 스크롤이 생기도록 함 -->
                    <div id="log-list-container" class="${listClass}" style="${containerStyle}">
                        ${visibleLogs.length === 0 ? '<div class="text-center py-12 text-slate-400">검색 결과가 없습니다.</div>' : visibleLogs.map(l => {
                            const c = state.clients.find(cl => cl.id === l.clientId);
                            return `
                            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100 flex flex-col md:flex-row items-start gap-6 hover:shadow-md transition-shadow relative">
                                <!-- [수정] 왼쪽 칸 가로 비율 33.3% -> 28%로 변경 (md:w-[28%]) -->
                                <div class="md:w-[28%] border-b md:border-b-0 md:border-r border-slate-100 pb-4 md:pb-0 md:pr-6 flex-shrink-0 w-full">
                                    <div class="mb-4">
                                        <div class="flex flex-wrap items-center gap-x-2 gap-y-1">
                                            <div class="flex items-center gap-2"><input type="checkbox" class="log-checkbox w-4 h-4 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500 cursor-pointer" data-id="${l.id}" onmousedown="event.stopPropagation()" onchange="app.toggleLogSelection('${l.id}')" ${state.ui.selectedLogIds.has(l.id) ? 'checked' : ''}><span class="text-sm text-slate-500 font-medium whitespace-nowrap">${l.date}</span></div>
                                            <span class="text-slate-300">|</span>
                                            <div class="flex items-baseline gap-1"><span class="font-bold text-slate-800 text-base hover:text-blue-600 cursor-pointer" onclick="app.openClientModal('${l.clientId}')">${l.clientName}</span>${c ? `<span class="text-xs text-slate-500">(${calculateAge(c.birthDate)}세/${c.gender})</span>` : ''}</div>
                                            ${c ? `<div class="flex items-center gap-1 text-xs text-slate-500"><span class="text-slate-300">|</span><span>${c.region}</span><span class="text-slate-300">·</span><span class="${c.careLevel==='중점'?'text-pink-600 font-bold':(c.careLevel==='일반'?'text-blue-600 font-bold':'')}">${c.careLevel}</span></div>` : ''}
                                        </div>
                                    </div>
                                    <div class="space-y-2">
                                        ${l.serviceItems ? l.serviceItems.map(i => `
                                            <div class="bg-emerald-50/50 border border-emerald-100 rounded-lg px-2.5 py-2 flex flex-col items-start gap-1 text-xs">
                                                <div class="flex items-center gap-1.5 w-full"><div class="w-1.5 h-1.5 rounded-full bg-emerald-500 flex-shrink-0"></div><span class="font-bold text-emerald-800">${i.category}</span></div>
                                                <div class="pl-3 w-full leading-snug text-slate-700"><span class="font-bold">${i.serviceName}</span>${i.detailNote ? `<span class="text-slate-500 font-normal break-all"> - ${i.detailNote}</span>` : ''}</div>
                                            </div>
                                        `).join('') : ''}
                                    </div>
                                </div>
                                <div class="flex-1 relative min-w-0 flex flex-col justify-start h-full">
                                    <div class="flex justify-between items-center mb-2 pt-1">
                                        <div class="flex flex-wrap items-center gap-3">
                                            <div class="text-sm font-bold text-slate-500 uppercase tracking-wider flex items-center gap-1"><i data-lucide="file-text" size="16"></i> 진행 내용</div>
                                            <div class="w-px h-3 bg-slate-300"></div>
                                            <div class="flex items-center gap-2"><span class="text-sm bg-slate-100 text-slate-900 px-2 py-0.5 rounded whitespace-nowrap border border-slate-200">${l.provideMethod || '방문'}</span><span class="text-sm text-slate-900 bg-slate-50 px-2 py-0.5 rounded border border-slate-200">${l.provider || '미지정'}</span></div>
                                        </div>
                                        <div class="flex gap-1 md:absolute md:top-0 md:right-0">
                                            <!-- [분할화면 수정] 버튼 클릭 시 창 포커스 이벤트와 충돌하지 않도록 onmousedown="event.stopPropagation()" 추가 -->
                                            <button onmousedown="event.stopPropagation()" onclick="app.duplicateLog('${l.id}')" class="p-1.5 text-slate-400 hover:text-emerald-600 hover:bg-emerald-50 rounded transition-colors" title="복사"><i data-lucide="copy" size="14"></i></button>
                                            <button onmousedown="event.stopPropagation()" onclick="app.openLogModal('${l.id}')" class="p-1.5 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded transition-colors" title="수정"><i data-lucide="edit" size="14"></i></button>
                                            <button onmousedown="event.stopPropagation()" onclick="app.deleteData('logs','${l.id}')" class="p-1.5 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded transition-colors" title="삭제"><i data-lucide="trash-2" size="14"></i></button>
                                        </div>
                                    </div>
                                    <div class="flex-1 mt-1"><p class="text-slate-800 text-base leading-relaxed whitespace-pre-wrap cursor-pointer p-2 -ml-2 rounded hover:bg-slate-50 hover:text-blue-800 transition-colors mt-0" title="클릭하여 수정하기" onclick="app.openLogModal('${l.id}')">${l.content}</p></div>
                                </div>
                            </div>`
                        }).join('')}
                    </div>

                    <!-- [하단] 페이지네이션 (Fixed Bottom) -->
                    <div class="${footerClass}">
                        ${paginationHTML}
                    </div>
                </div>`;
        }

        // [복구] 사례회의 관리 렌더링 함수 (누락된 코드 복원)
        function renderMeetingManager() {
            const { start, end, search, type, clientName, writer } = state.filters.meeting;
            
            // 조회 대상 월 설정 (기본값: 현재 월)
            const today = new Date();
            const currentRealMonth = today.getMonth() + 1;
            const currentYear = today.getFullYear();
            const targetMonth = state.ui.meetingTargetMonth || currentRealMonth;
            const candidateType = state.ui.meetingCandidateType || 'regular';
            
            // 이번 달 도래 대상자 필터링
            const targetClients = state.clients.filter(c => {
                if (candidateType === 'regular') {
                    if (c.status === '종결' || !c.serviceStartDate) return false;
                    const startMonth = parseInt(c.serviceStartDate.split('-')[1]);
                    return startMonth === targetMonth;
                } else if (candidateType === 'new') {
                    if (!c.serviceStartDate) return false;
                    const [y, m, d] = c.serviceStartDate.split('-').map(Number);
                    return y === currentYear && m === targetMonth;
                } else if (candidateType === 'end') {
                    if (!c.endDate) return false;
                    const [y, m, d] = c.endDate.split('-').map(Number);
                    return y === currentYear && m === targetMonth;
                }
                return false;
            }).sort((a, b) => {
                if (candidateType === 'end') return (b.endDate || '').localeCompare(a.endDate || '');
                return (a.serviceStartDate || '').localeCompare(b.serviceStartDate || '');
            });

            const filtered = getFilteredMeetings();
            const allSelected = filtered.length > 0 && filtered.every(m => state.ui.selectedMeetingIds.has(m.id));

            const typeLabels = { regular: '재사정', new: '초기상담', end: '종결심사' };
            const defaultMeetingTypeMap = { regular: '재사정', new: '초기', end: '종결' };

            return `
                <div class="flex flex-col animate-fade-in h-[calc(100vh-9rem)]">
                    <div class="space-y-4 pb-2 pr-1 transition-all flex-shrink-0">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 pt-1">
                            <h2 class="text-xl md:text-2xl font-bold text-slate-800 flex items-center">사례회의록 ${getLoadingTag()}</h2>
                            <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto">
                                <button onclick="app.printSelectedMeetings()" class="bg-white border border-slate-300 text-slate-700 px-4 py-2 rounded-lg flex items-center gap-2 text-sm font-bold hover:bg-slate-50 transition-colors shadow-sm"><i data-lucide="printer" size="16"></i> 인쇄</button>
                                <button onclick="app.openMeetingModal()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg flex items-center gap-2 text-sm font-medium hover:bg-emerald-700 transition-colors"><i data-lucide="plus" size="16"></i> 회의록 작성</button>
                            </div>
                        </div>

                        <!-- 이번 달 도래 대상자 섹션 -->
                        <div class="bg-blue-50/50 border border-blue-100 rounded-xl p-3">
                            <div class="flex items-center gap-2 mb-2">
                                <div class="bg-blue-100 text-blue-600 p-1 rounded"><i data-lucide="calendar-clock" size="14"></i></div>
                                <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">
                                    <select class="bg-transparent text-slate-800 font-bold outline-none cursor-pointer hover:text-blue-700 transition-colors" onchange="app.setMeetingCandidateType(this.value)">
                                        <option value="regular" ${candidateType==='regular'?'selected':''}>월 사례회의 대상자</option>
                                        <option value="new" ${candidateType==='new'?'selected':''}>신규(초기) 대상자</option>
                                        <option value="end" ${candidateType==='end'?'selected':''}>종결(심사) 대상자</option>
                                    </select>
                                    
                                    <div class="flex items-center bg-white border border-blue-200 rounded px-2 py-0.5 shadow-sm ml-1">
                                        <select class="text-blue-600 text-xs font-bold focus:outline-none cursor-pointer bg-transparent" onchange="app.setMeetingTargetMonth(this.value)">
                                            ${Array.from({length: 12}, (_, i) => i + 1).map(m => `<option value="${m}" ${m === targetMonth ? 'selected' : ''}>${m}월</option>`).join('')}
                                        </select>
                                    </div>
                                    
                                    <button onclick="app.resetMeetingTargetMonth()" class="bg-white border border-blue-200 text-blue-500 hover:text-blue-700 hover:bg-blue-50 p-1 rounded shadow-sm transition-colors flex items-center justify-center" title="초기화">
                                        <i data-lucide="rotate-ccw" size="12"></i>
                                    </button>

                                    <span class="text-xs font-normal text-slate-500 ml-1">총 ${targetClients.length}명</span>
                                </h3>
                            </div>
                            ${targetClients.length === 0 ? 
                                `<div class="text-center text-slate-400 text-xs py-1">${targetMonth}월에 해당하는 ${typeLabels[candidateType]} 대상자가 없습니다.</div>` : 
                                `<div class="flex gap-2 overflow-x-auto pb-1 custom-scrollbar snap-x">
                                    ${targetClients.map(c => {
                                        const isCompleted = state.meetings.some(m => {
                                            const mDate = new Date(m.date);
                                            const isSameClient = (m.clientId && m.clientId === c.id) || (!m.clientId && m.clientName === c.name);
                                            const isSameMonth = mDate.getFullYear() === currentYear && (mDate.getMonth() + 1) === targetMonth;
                                            
                                            if (!isSameClient || !isSameMonth) return false;
                                            if (candidateType === 'new') return m.type === '초기';
                                            if (candidateType === 'end') return m.type === '종결';
                                            if (candidateType === 'regular') return m.type === '수시' || m.type === '재사정';
                                            return true;
                                        });

                                        const bgClass = isCompleted ? 'bg-slate-200' : 'bg-white';
                                        const textColorClass = isCompleted ? 'text-slate-500' : 'text-slate-800';
                                        const hoverClass = isCompleted ? '' : 'hover:border-blue-400 hover:shadow-md';
                                        const dateLabel = candidateType === 'end' ? '종결일' : '시작일';
                                        const dateValue = candidateType === 'end' ? c.endDate : c.serviceStartDate;

                                        return `
                                        <div class="flex-shrink-0 ${bgClass} border border-slate-200 rounded-lg p-2.5 min-w-[140px] shadow-sm snap-start ${hoverClass} transition-all cursor-pointer group relative"
                                             onclick="app.openMeetingModal(null, { clientName: '${c.name}', clientBirth: '${c.birthDate}', clientLevel: '${c.careLevel}', type: '${defaultMeetingTypeMap[candidateType]}' })"
                                             title="${isCompleted ? '작성된 회의록이 있습니다.' : '클릭하여 회의록 작성'}">
                                            ${isCompleted ? `<div class="absolute top-1.5 right-1.5 text-slate-500"><i data-lucide="check-circle" size="14"></i></div>` : ''}
                                            <div class="flex justify-between items-center mb-1 pr-4">
                                                <span class="font-bold ${textColorClass} truncate group-hover:${isCompleted ? 'text-slate-600' : 'text-blue-600'} transition-colors text-sm">${c.name}</span>
                                                <span class="text-[10px] px-1.5 py-0.5 rounded ${c.careLevel === '중점' ? 'bg-pink-50 text-pink-600' : 'bg-blue-50 text-blue-600'} font-bold">${c.careLevel}</span>
                                            </div>
                                            <div class="flex items-center gap-1 text-[10px] text-slate-500">
                                                <span>${dateValue}</span>
                                                <span class="text-slate-300">|</span>
                                                <span class="truncate max-w-[60px]">${c.region}</span>
                                            </div>
                                        </div>
                                    `}).join('')}
                                </div>`
                            }
                        </div>

                        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap items-center gap-2">
                            <div class="flex items-center gap-2 p-1 bg-slate-50 rounded-lg border border-slate-200">
                                <input type="date" class="bg-transparent border-0 text-sm focus:ring-0 px-1 py-1 w-[110px]" value="${start}" onchange="app.setFilter('meeting','start',this.value, false)" max="9999-12-31">
                                <span class="text-slate-400">~</span>
                                <input type="date" class="bg-transparent border-0 text-sm focus:ring-0 px-1 py-1 w-[110px]" value="${end}" onchange="app.setFilter('meeting','end',this.value, false)" max="9999-12-31">
                                <button onclick="app.render()" class="bg-slate-800 text-white px-3 py-1 rounded-md text-sm font-medium hover:bg-slate-700 transition-colors whitespace-nowrap ml-1">조회</button>
                            </div>

                            <select class="input-field h-9 py-1 px-2 text-sm w-32 font-medium" onchange="app.setFilter('meeting','type',this.value)">
                                <option value="">구분(전체)</option>
                                <option value="수시" ${type==='수시'?'selected':''}>수시 사례회의</option>
                                <option value="초기" ${type==='초기'?'selected':''}>초기 상담 회의</option>
                                <option value="재사정" ${type==='재사정'?'selected':''}>재사정 회의</option>
                                <option value="종결" ${type==='종결'?'selected':''}>종결 심사 회의</option>
                                <option value="기타" ${type==='기타'?'selected':''}>기타</option>
                            </select>

                            <input class="input-field h-9 py-1 w-32 text-sm" enterkeyhint="search" placeholder="대상자 (Enter)" value="${clientName}" onkeydown="if(event.key === 'Enter' || event.keyCode === 13) app.setFilter('meeting','clientName',this.value)" oninput="if(this.value === '') app.setFilter('meeting','clientName','')">
                            
                            <input class="input-field h-9 py-1 w-28 text-sm" enterkeyhint="search" placeholder="작성자 (Enter)" value="${writer}" onkeydown="if(event.key === 'Enter' || event.keyCode === 13) app.setFilter('meeting','writer',this.value)" oninput="if(this.value === '') app.setFilter('meeting','writer','')">

                            <!-- [수정] 초기화 버튼에 app.render() 추가하여 분할 화면에서 갱신 보장 -->
                            <button onclick="app.resetFilters('meeting'); app.render()" class="ml-auto text-slate-400 hover:text-slate-600 text-xs flex items-center gap-1 flex-shrink-0 h-9 px-2 hover:bg-slate-50 rounded transition-colors"><i data-lucide="refresh-cw" size="14"></i></button>
                        </div>

                        <div class="flex items-center justify-between px-1 h-8">
                            <div class="flex items-center gap-2" id="meeting-batch-actions">
                                <span class="text-sm text-slate-500">총 <span class="font-bold text-slate-800">${filtered.length}</span>건</span>
                                ${state.ui.selectedMeetingIds.size > 0 ? `
                                    <div class="h-4 w-px bg-slate-300 mx-1"></div>
                                    <button onclick="app.deleteSelectedMeetings()" class="bg-red-50 text-red-600 px-2 py-1 rounded text-xs font-bold flex items-center gap-1 hover:bg-red-100 transition-colors animate-fade-in">
                                        <i data-lucide="trash-2" size="12"></i> 선택삭제 (${state.ui.selectedMeetingIds.size})
                                    </button>
                                ` : ''}
                            </div>
                        </div>
                    </div>

                    <div id="meeting-list-container" class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col flex-1 min-h-[400px]">
                        <div class="flex items-center bg-slate-50 border-b border-slate-200 font-bold text-xs text-slate-500 sticky top-0 z-10">
                            <!-- [수정] 가로 길이 비율 적용: 5% / 14% / 9% / 13% / 9% / 30% / 8% / 12% -->
                            <div class="w-[5%] text-center py-3 flex-shrink-0 border-r border-slate-100">
                                <input type="checkbox" id="meeting-select-all" class="w-3.5 h-3.5 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500 cursor-pointer" 
                                    ${allSelected ? 'checked' : ''} 
                                    onchange="app.toggleAllMeetings(this.checked)"
                                    ${filtered.length === 0 ? 'disabled' : ''}>
                            </div>
                            <div class="w-[14%] text-center py-3 flex-shrink-0">날짜</div>
                            <div class="w-[9%] text-center py-3 flex-shrink-0">대상자</div>
                            <div class="w-[13%] text-center py-3 flex-shrink-0">생년/등급</div>
                            <div class="w-[9%] text-center py-3 flex-shrink-0">구분</div>
                            <div class="w-[30%] text-center py-3 px-2 flex-shrink-0">안건</div>
                            <div class="w-[8%] text-center py-3 flex-shrink-0">작성자</div>
                            <div class="w-[12%] text-center py-3 flex-shrink-0">관리</div>
                        </div>
                        
                        <div class="overflow-y-auto flex-1 custom-scrollbar">
                            ${filtered.length === 0 ? 
                                '<div class="text-center py-12 text-slate-400">작성된 회의록이 없습니다.</div>' : 
                                '<div class="divide-y divide-slate-100">' + filtered.map(m => {
                                    let clientInfo = '-';
                                    const c = state.clients.find(cl => cl.id === m.clientId || cl.name === m.clientName);
                                    if (c) {
                                        const birth = c.birthDate ? c.birthDate.substring(2).replace(/-/g, '.') : '-';
                                        clientInfo = `${birth}<br><span class="text-slate-400 text-[10px]">(${c.careLevel})</span>`;
                                    } else if (m.clientBirth) {
                                        clientInfo = `${m.clientBirth}<br><span class="text-slate-400 text-[10px]">(${m.clientLevel || '-'})</span>`;
                                    }

                                    return `
                                <div class="flex items-center hover:bg-slate-50 transition-colors py-2 group">
                                    <div class="w-[5%] text-center flex-shrink-0 flex items-center justify-center">
                                        <input type="checkbox" class="meeting-checkbox w-3.5 h-3.5 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500 cursor-pointer"
                                            ${state.ui.selectedMeetingIds.has(m.id) ? 'checked' : ''}
                                            onchange="app.toggleMeetingSelection('${m.id}')">
                                    </div>
                                    <div class="w-[14%] text-center text-xs font-bold text-slate-700 flex-shrink-0 whitespace-nowrap">${m.date}</div>
                                    <div class="w-[9%] text-center text-sm font-bold text-emerald-600 truncate px-1 flex-shrink-0" title="${m.clientName || '미지정'}">${m.clientName || '-'}</div>
                                    <div class="w-[13%] text-center text-xs text-slate-600 flex-shrink-0 leading-tight">${clientInfo}</div>
                                    <div class="w-[9%] text-center flex-shrink-0"><span class="px-1.5 py-0.5 rounded bg-blue-50 text-blue-700 text-xs font-bold border border-blue-100 whitespace-nowrap">${m.type || '수시'}</span></div>
                                    <div class="w-[30%] text-sm text-slate-800 font-medium truncate px-3 cursor-pointer hover:text-blue-600 flex-shrink-0 text-left" onclick="app.openMeetingModal('${m.id}')" title="${m.topic || ''}">${m.topic || '제목 없음'}</div>
                                    <div class="w-[8%] text-center text-sm text-slate-500 truncate px-1 flex-shrink-0" title="${m.writer}">${m.writer || '-'}</div>
                                    <div class="w-[12%] flex justify-center gap-1 flex-shrink-0">
                                        <button onclick="app.printMeeting('${m.id}')" class="p-1.5 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded transition-colors" title="인쇄/PDF"><i data-lucide="printer" size="14"></i></button>
                                        <button onclick="app.openMeetingModal('${m.id}')" class="p-1.5 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded transition-colors" title="수정"><i data-lucide="edit" size="14"></i></button>
                                        <button onclick="app.deleteData('meetings', '${m.id}')" class="p-1.5 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded transition-colors" title="삭제"><i data-lucide="trash-2" size="14"></i></button>
                                    </div>
                                </div>
                            `}).join('') + '</div>'}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderPerformance() {
            // [수정] region 제거, months 필터 사용
            const { year, months, viewMode = 'monthRows' } = state.filters.performance;
            // 월 필터가 비어있으면 데이터가 없는 것으로 처리하거나 전체를 보여줄지 결정 (여기선 전체 선택 유도하지만 로직상 빈 배열 가능)
            const selectedMonths = (months && months.length > 0) ? months.sort((a, b) => a - b) : [];
            
            // [수정] region 필터링 제거 (행정동 필터 삭제 요청 반영)
            // [수정] targetLogs 필터링 시 year가 문자열/숫자 혼용될 수 있으므로 문자열 변환 비교
            const targetLogs = state.logs.filter(l => l.date.startsWith(String(year)));
            
            const stats = {};
            state.services.forEach(s => {
                const key = `${s.category}|${s.name}`;
                if (!stats[key]) {
                    stats[key] = { category: s.category, serviceName: s.name, counts: Array(12).fill(0), total: 0 };
                }
            });
            
            targetLogs.forEach(l => {
                const month = parseInt(l.date.split('-')[1]) - 1; 
                if (month < 0 || month > 11) return;
                if (l.serviceItems && l.serviceItems.length > 0) {
                    l.serviceItems.forEach(item => {
                        let key = `${item.category}|${item.serviceName}`;
                        
                        // [긴급 수정] 과거 데이터 이름 매핑 로직 추가
                        // 설정에서 서비스명을 바꿨을 때, 과거 기록이 집계되지 않는 문제를 해결하기 위해 매핑
                        if (!stats[key]) {
                            // "정서지원서비스(안전안부확인)" -> "정서지원서비스"로 매핑
                            if (item.serviceName === '정서지원서비스(안전안부확인)') {
                                const newKey = `${item.category}|정서지원서비스`;
                                if (stats[newKey]) key = newKey;
                            }
                            // 반대의 경우도 (혹시 몰라) 처리: "정서지원서비스" -> "정서지원서비스(안전안부확인)"
                            else if (item.serviceName === '정서지원서비스') {
                                const oldKey = `${item.category}|정서지원서비스(안전안부확인)`;
                                if (stats[oldKey]) key = oldKey;
                            }
                        }

                        if (stats[key]) { stats[key].counts[month]++; /* 전체 total은 일단 계산하지만, 표시할 때 재계산함 */ }
                    });
                }
            });

            const serviceOrderMap = new Map();
            state.services.forEach((s, idx) => { serviceOrderMap.set(`${s.category}|${s.name}`, idx); });

            const rows = Object.values(stats).sort((a, b) => {
                const indexA = serviceOrderMap.get(`${a.category}|${a.serviceName}`);
                const indexB = serviceOrderMap.get(`${b.category}|${b.serviceName}`);
                if (indexA !== undefined && indexB !== undefined) return indexA - indexB;
                if (indexA !== undefined) return -1;
                if (indexB !== undefined) return 1;
                if (a.category !== b.category) return a.category.localeCompare(b.category);
                return a.serviceName.localeCompare(b.serviceName);
            });

            // [수정] 선택된 월에 대해서만 합계 재계산
            const monthlyTotals = Array(12).fill(0);
            let grandTotal = 0;
            
            rows.forEach(r => {
                let rowSum = 0;
                selectedMonths.forEach(m => {
                    const monthIdx = m - 1;
                    const val = r.counts[monthIdx];
                    rowSum += val;
                    monthlyTotals[monthIdx] += val;
                });
                r.displayTotal = rowSum; // 화면 표시용 합계 저장
                grandTotal += rowSum;
            });

            const yearOptions = [];
            const currentYear = new Date().getFullYear();
            // [수정] 연도 범위 확장 (2015년 ~ 내년)
            for (let y = 2015; y <= currentYear + 1; y++) {
                yearOptions.push(`<option value="${y}" ${parseInt(year) === y ? 'selected' : ''}>${y}년</option>`);
            }
            yearOptions.reverse();

            const stickColStyle = (left, z) => `position: sticky; left: ${left}px; z-index: ${z};`;
            let tableHTML = '';

            // [조건문] 보기 모드에 따른 테이블 생성
            if (viewMode === 'monthRows') {
                // --- 월별 보기 (세로: 월, 가로: 서비스) ---
                const headerGroups = {};
                const orderedCategories = [];
                rows.forEach(r => {
                    if (!headerGroups[r.category]) { headerGroups[r.category] = []; orderedCategories.push(r.category); }
                    headerGroups[r.category].push(r);
                });

                let headerRow1 = `<th class="py-2 px-4 border-b border-r bg-slate-50 text-center font-bold min-w-[60px] whitespace-nowrap" rowspan="2" style="${stickColStyle(0, 30)}">월</th>`;
                let headerRow2 = '';

                orderedCategories.forEach(cat => {
                    const services = headerGroups[cat];
                    headerRow1 += `<th class="py-2 px-2 border-b border-r bg-slate-100 text-center font-bold text-slate-700 whitespace-nowrap" colspan="${services.length}">${cat}</th>`;
                    services.forEach(s => {
                        // [수정] 표시 이름 처리: "정서지원서비스(안전안부확인)" -> "안전안부확인"
                        let displayName = s.serviceName;
                        if (s.serviceName === '정서지원서비스(안전안부확인)') displayName = '안전안부확인';
                        // "정서지원서비스"의 경우도 "안전안부확인"으로 줄여서 보여줄지, 그대로 보여줄지 결정 (여기선 그대로)
                        
                        headerRow2 += `<th class="py-2 px-2 border-b border-r bg-slate-50 text-center text-xs font-medium text-slate-600 min-w-[60px] max-w-[120px] whitespace-nowrap overflow-hidden text-ellipsis cursor-help" title="${s.serviceName}">${displayName}</th>`;
                    });
                });
                headerRow1 += `<th class="py-2 px-4 border-b bg-emerald-50 text-emerald-800 text-center font-bold min-w-[60px] whitespace-nowrap" rowspan="2">합계</th>`;

                let bodyRows = '';
                // [수정] selectedMonths만 순회하여 행 생성
                if (selectedMonths.length === 0) {
                    bodyRows = `<tr><td colspan="${rows.length + 2}" class="py-8 text-center text-slate-400">선택된 월이 없습니다.</td></tr>`;
                } else {
                    selectedMonths.forEach(m => {
                        const monthIdx = m - 1;
                        let rowHTML = `<td class="py-2 px-4 border-r font-bold text-slate-600 bg-white text-center sticky left-0 z-20">${m}월</td>`;
                        rows.forEach(r => {
                            const count = r.counts[monthIdx];
                            rowHTML += `<td class="py-2 px-1 border-r text-center ${count > 0 ? 'text-blue-600 font-bold bg-blue-50/30' : 'text-slate-300'}">${count || '-'}</td>`;
                        });
                        rowHTML += `<td class="py-2 px-4 text-center font-bold text-emerald-600 bg-emerald-50/50">${monthlyTotals[monthIdx]}</td>`;
                        bodyRows += `<tr class="hover:bg-slate-50 group border-b border-slate-100">${rowHTML}</tr>`;
                    });
                }

                let footerRow = `<td class="py-3 px-4 border-r text-center bg-slate-100 font-bold sticky left-0 z-20">총계</td>`;
                rows.forEach(r => { footerRow += `<td class="py-3 px-1 border-r text-center text-slate-800 font-bold bg-slate-50">${r.displayTotal}</td>`; });
                footerRow += `<td class="py-3 px-4 text-center text-emerald-700 bg-emerald-100 font-bold">${grandTotal}</td>`;

                tableHTML = `<thead class="sticky top-0 z-30 shadow-sm"><tr>${headerRow1}</tr><tr>${headerRow2}</tr></thead><tbody class="divide-y divide-slate-100">${bodyRows}<tr class="bg-slate-100 font-bold shadow-sm border-t-2 border-slate-300">${footerRow}</tr></tbody>`;
            } else {
                // --- 서비스별 보기 (세로: 서비스, 가로: 월) ---
                const wCat = 90;
                const wSvc = 150;
                
                // [수정] selectedMonths에 따라 동적으로 컬럼 생성
                const monthHeaders = selectedMonths.map(m => `<th class="py-3 px-2 border-b border-r min-w-[40px] text-center bg-slate-50">${m}월</th>`).join('');
                
                tableHTML = `
                    <thead class="sticky-header bg-slate-50 text-slate-600 font-semibold z-20 shadow-sm">
                        <tr>
                            <th class="py-3 px-2 border-b border-r min-w-[${wCat}px] bg-slate-50 text-center font-bold" style="${stickColStyle(0, 30)}">분류</th>
                            <th class="py-3 px-2 border-b border-r min-w-[${wSvc}px] bg-slate-50 text-center font-bold" style="${stickColStyle(wCat, 30)}">서비스명</th>
                            ${monthHeaders}
                            <th class="py-3 px-2 border-b bg-emerald-50 text-emerald-800 text-center font-bold min-w-[60px]">합계</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                        ${rows.length === 0 ? `<tr><td colspan="${selectedMonths.length + 3}" class="text-center py-4">데이터 없음</td></tr>` : rows.map(r => {
                            const displayName = r.serviceName === '정서지원서비스(안전안부확인)' ? '안전안부확인' : r.serviceName;
                            // 선택된 월 데이터만 렌더링
                            const cells = selectedMonths.map(m => {
                                const count = r.counts[m - 1];
                                return `<td class="py-2 px-2 border-r text-center ${count > 0 ? 'text-blue-600 font-bold bg-blue-50/30' : 'text-slate-300'}">${count || '-'}</td>`;
                            }).join('');
                            
                            return `
                            <tr class="hover:bg-slate-50 group">
                                <td class="py-2 px-2 border-r font-medium text-slate-600 bg-white text-center text-xs whitespace-nowrap" style="${stickColStyle(0, 20)}">${r.category}</td>
                                <td class="py-2 px-2 border-r text-slate-800 bg-white text-sm whitespace-nowrap text-ellipsis overflow-hidden max-w-[${wSvc}px]" title="${r.serviceName}" style="${stickColStyle(wCat, 20)}">${displayName}</td>
                                ${cells}
                                <td class="py-2 px-2 text-center font-bold text-emerald-600 bg-emerald-50/50">${r.displayTotal}</td>
                            </tr>
                        `;}).join('')}
                        <tr class="bg-slate-100 font-bold shadow-sm border-t-2 border-slate-300">
                            <td class="py-3 px-2 border-r text-center bg-slate-100" style="${stickColStyle(0, 20)}">총계</td>
                            <td class="py-3 px-2 border-r bg-slate-100" style="${stickColStyle(wCat, 20)}"></td>
                            ${selectedMonths.map(m => `<td class="py-3 px-2 border-r text-center text-slate-800">${monthlyTotals[m - 1]}</td>`).join('')}
                            <td class="py-3 px-2 text-center text-emerald-700 bg-emerald-100">${grandTotal}</td>
                        </tr>
                    </tbody>
                `;
            }

            return `
                <div class="space-y-6 animate-fade-in p-1">
                    <!-- [수정] 제목 옆에 로딩 태그 추가 -->
                    <h2 class="text-2xl font-bold text-slate-800 flex items-center">월별 서비스 실적 ${getLoadingTag()}</h2>
                    <div class="sticky top-0 z-50 bg-slate-50 pt-2 pb-2 shadow-sm -mx-1 px-1">
                        <div class="flex flex-col sm:flex-row flex-wrap gap-2 items-center bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                             <div class="flex items-center bg-slate-100 rounded-lg p-1 mr-4">
                                <button onclick="app.setFilter('performance', 'viewMode', 'monthRows')" class="px-3 py-1.5 rounded-md text-sm font-bold transition-all ${viewMode === 'monthRows' ? 'bg-white text-emerald-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}">월별 보기 (기본)</button>
                                <button onclick="app.setFilter('performance', 'viewMode', 'serviceRows')" class="px-3 py-1.5 rounded-md text-sm font-bold transition-all ${viewMode === 'serviceRows' ? 'bg-white text-emerald-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}">서비스별 보기</button>
                             </div>
                             <div class="flex items-center gap-2">
                                <label class="text-sm font-bold text-slate-700">연도</label>
                                <!-- [수정] onchange 핸들러 변경: setFilter -> setPerformanceYear (데이터 로딩 지원) -->
                                <select class="input-field py-1 px-3 w-32 font-bold" onchange="app.setPerformanceYear(this.value)">
                                    ${yearOptions.join('')}
                                </select>
                             </div>
                             
                             <!-- [신규] 월 선택 드롭다운 (다중 선택) -->
                             <div class="flex items-center gap-2 ml-0 sm:ml-4 relative">
                                <label class="text-sm font-bold text-slate-700">월 선택</label>
                                <button onclick="app.togglePerfMonthDropdown()" class="input-field py-1 px-3 w-40 text-left flex justify-between items-center text-sm font-medium cursor-pointer">
                                    <span class="truncate">${selectedMonths.length === 12 ? '전체 월' : (selectedMonths.length === 0 ? '선택 없음' : `${selectedMonths.length}개 선택됨`)}</span>
                                    <i data-lucide="chevron-down" size="14" class="text-slate-400"></i>
                                </button>
                                ${state.ui.perfMonthDropdownOpen ? `
                                    <div class="fixed inset-0 z-40" onclick="app.togglePerfMonthDropdown()"></div>
                                    <div class="absolute top-full left-0 mt-1 w-48 bg-white border border-slate-200 rounded-lg shadow-xl z-50 p-2 animate-fade-in">
                                        <div class="flex justify-between items-center px-2 pb-2 mb-2 border-b border-slate-100">
                                            <span class="text-xs font-bold text-slate-500">다중 선택 가능</span>
                                            <button onclick="app.toggleAllPerfMonths()" class="text-xs text-blue-600 hover:text-blue-800 font-medium">전체선택/해제</button>
                                        </div>
                                        <div class="grid grid-cols-2 gap-1 max-h-60 overflow-y-auto">
                                            ${Array.from({length: 12}, (_, i) => i + 1).map(m => `
                                                <label class="flex items-center gap-2 text-sm p-2 hover:bg-slate-50 rounded cursor-pointer select-none">
                                                    <input type="checkbox" class="rounded text-emerald-600 focus:ring-emerald-500 w-4 h-4 border-slate-300" 
                                                        ${selectedMonths.includes(m) ? 'checked' : ''} 
                                                        onchange="app.togglePerfMonth(${m})">
                                                    <span class="text-slate-700 font-medium">${m}월</span>
                                                </label>
                                            `).join('')}
                                        </div>
                                    </div>
                                ` : ''}
                             </div>
                             
                             <!-- [수정] 초기화 버튼에 app.render() 추가하여 분할 화면에서 갱신 보장 -->
                             <button onclick="app.resetFilters('performance'); app.render()" class="ml-auto text-slate-400 hover:text-slate-600 p-2 rounded hover:bg-slate-100 transition-colors flex justify-center items-center flex-shrink-0" title="필터 초기화"><i data-lucide="refresh-cw" size="20"></i></button>

                             <button onclick="app.downloadPerformanceExcel()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg flex items-center gap-2 hover:bg-emerald-700 transition-colors shadow-sm ml-2">
                                <i data-lucide="download" size="18"></i> 엑셀 다운로드
                             </button>
                        </div>
                    </div>

                    <div id="perf-table-container" class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-auto max-h-[600px]">
                        <table class="w-full text-sm text-left border-collapse whitespace-nowrap">
                            ${tableHTML}
                        </table>
                    </div>
                </div>
            `;
        }
        
        function renderStatistics() {
             const { start, end, type, region, name, months } = state.filters.stats;
             const selectedMonths = (months && months.length > 0) ? months.sort((a, b) => a - b) : [];
            // [수정] 날짜 필터가 비어있을 경우를 대비한 방어 코드 추가
            const sYear = start ? start.split('-')[0] : '0000';
            const eYear = end ? end.split('-')[0] : '9999';
            const fullYearStart = `${sYear}-01-01`;
            const fullYearEnd = `${eYear}-12-31`;
            const targetClients = state.clients.filter(c => {
                const matchBasic = (region.length === 0 || region.includes(c.region)) && (!name || c.name.includes(name));
                if (!matchBasic) return false;
                const cS = c.serviceStartDate || '0000-01-01';
                const cE = c.endDate || '9999-12-31';
                return cS <= fullYearEnd && cE >= fullYearStart;
            });
            let serviceHeaders = [];
            let headerGroups = {};
            let orderedCategories = [];
            if (type === 'category') {
                serviceHeaders = [...new Set(state.services.map(s => s.category))].filter(Boolean);
            } else {
                orderedCategories = [...new Set(state.services.map(s => s.category || '기타'))];
                state.services.forEach(s => {
                    const cat = s.category || '기타';
                    if (!headerGroups[cat]) headerGroups[cat] = [];
                    if (!headerGroups[cat].includes(s.name)) headerGroups[cat].push(s.name);
                });
                serviceHeaders = orderedCategories.flatMap(cat => headerGroups[cat]);
            }
            
            const dataMap = {}; 
            targetClients.forEach(c => {
                // [수정] 기타 사업 데이터('-')인 경우 통계 화면에서도 기본정보 필드를 모두 빈 값으로 처리
                const isEtc = c.name === '-';
                dataMap[c.id] = { 
                    id: c.id, 
                    name: c.name, 
                    birthDate: isEtc ? '' : (c.birthDate || '-'), 
                    careLevel: isEtc ? '' : (c.careLevel || '-'), 
                    region: isEtc ? '' : (c.region || '-').replace(/동$/, ''), 
                    endDate: c.endDate || '9999-12-31', 
                    total: 0, 
                    emotionalCount: 0, 
                    counts: {} 
                };
                serviceHeaders.forEach(k => dataMap[c.id].counts[k] = 0);
            });

            // [Debug] 디버깅용: 목록에 없는 서비스 추적을 위한 저장소
            const unknownServices = new Set();

            state.logs.forEach(l => {
                // [수정] start/end가 있을 때만 필터링 (없으면 전체 기간)
                if (start && l.date < start) return;
                if (end && l.date > end) return;

                // [신규 추가] 월 필터링
                if (selectedMonths.length > 0) {
                    const m = parseInt(l.date.split('-')[1], 10);
                    if (!selectedMonths.includes(m)) return;
                }

                let cid = l.clientId;
                if (!dataMap[cid] && l.clientName) { 
                    const found = targetClients.find(c => c.name === l.clientName); 
                    if (found) cid = found.id; 
                }
                if (dataMap[cid]) {
                    const items = l.serviceItems || [{ serviceName: l.serviceName, category: l.serviceCategory }];
                    items.forEach(item => {
                        // [수정] 통계 집계 로직 전면 개선 (상세/분류 모드 간 불일치 해결)
                        
                        // 1. 서비스 이름 매핑 (과거 데이터 호환성 확보)
                        let effectiveName = item.serviceName;
                        
                        // 현재 서비스 목록에 해당 이름이 있는지 확인
                        let exactMatch = state.services.find(s => s.name === effectiveName);
                        
                        if (!exactMatch) {
                            // 목록에 없다면 대체 이름 확인 (과거 <-> 현재 매핑)
                            if (effectiveName === '정서지원서비스(안전안부확인)') {
                                if (state.services.some(s => s.name === '정서지원서비스')) effectiveName = '정서지원서비스';
                            } else if (effectiveName === '정서지원서비스') {
                                if (state.services.some(s => s.name === '정서지원서비스(안전안부확인)')) effectiveName = '정서지원서비스(안전안부확인)';
                            }
                            
                            // 매핑된 이름으로 다시 검색
                            exactMatch = state.services.find(s => s.name === effectiveName);
                        }

                        // [Debug] 매핑 후에도 여전히 목록에 없는 서비스라면 기록
                        if (!exactMatch) {
                            const debugMsg = `[${l.date}] ${item.serviceName} (일지에 기록된 카테고리: ${item.category || '없음'}) - 대상자: ${l.clientName}`;
                            unknownServices.add(debugMsg);
                        }

                        // 2. 집계 키(Key) 결정
                        let key = '';
                        
                        // [중요] 합계 불일치 해결 핵심:
                        // 상세별 보기와 분류별 보기의 기준을 "현재 서비스 목록에 존재하는지"로 통일합니다.
                        // 목록에 없는 서비스(삭제됨 등)는 상세별 보기에서 표시할 방법이 없으므로, 분류별 보기에서도 제외하여 숫자를 맞춥니다.
                        if (exactMatch) {
                            if (type === 'category') {
                                // [분류별 보기]
                                // 매핑된 이름(effectiveName)을 이용해 현재 설정된 '카테고리'를 역추적합니다.
                                key = exactMatch.category; 
                            } else {
                                // [상세별 보기]
                                key = effectiveName; // 매핑된 서비스명 사용
                            }
                        } 
                        // exactMatch가 없으면 key는 빈 문자열이 되어 집계에서 제외됨 (상세/분류 모두 동일하게 제외되어 합계 일치)

                        if (item.serviceName && item.serviceName.includes('정서지원')) dataMap[cid].emotionalCount++;
                        
                        // 3. 카운트 증가 (유효한 컬럼인 경우에만)
                        if (key && dataMap[cid].counts[key] !== undefined) { 
                            dataMap[cid].counts[key]++; 
                            dataMap[cid].total++; 
                        }
                    });
                }
            });

            // [Debug] 콘솔에 미등록 서비스 출력
            if (unknownServices.size > 0) {
                console.warn(`%c======= [통계 집계 누락 서비스 알림 (${unknownServices.size}건)] =======`, 'color: red; font-weight: bold; font-size: 12px;');
                console.warn("아래 서비스들은 '서비스 설정' 메뉴에 등록되지 않아 통계에서 제외되었습니다.");
                console.warn("확인 후 '서비스 설정'에 해당 이름을 추가하거나, 일지 내용을 수정해주세요.");
                // 날짜순 정렬하여 출력
                const sorted = Array.from(unknownServices).sort();
                sorted.forEach(s => console.log(`%c${s}`, 'color: #d97706')); // 오렌지색
                console.warn("============================================================");
            }

            const rows = Object.values(dataMap).filter(r => r.total >= 0).sort((a, b) => {
                // [수정] 이름이 '-'인 데이터(기타 사업)는 항상 맨 뒤로 정렬
                if (a.name === '-' && b.name !== '-') return 1;
                if (a.name !== '-' && b.name === '-') return -1;

                const levelPriority = { '중점': 1, '일반': 2 };
                const pA = levelPriority[a.careLevel] || 3;
                const pB = levelPriority[b.careLevel] || 3;
                if (pA !== pB) return pA - pB;
                return a.name.localeCompare(b.name);
            });
            const colTotals = {};
            serviceHeaders.forEach(k => colTotals[k] = rows.reduce((sum, r) => sum + (r.counts[k]||0), 0));
            const grandTotal = rows.reduce((sum, r) => sum + r.total, 0);
            
            // [수정] 컬럼 순서 변경: No -> 이름 -> 등급(Level) -> 생년월일(Birth) -> 행정동(Region)
            // 너비 상수 정의
            const W_No = 30, W_Name = 60, W_Level = 35, W_Birth = 75, W_Region = 35, W_Total = 40;
            
            // [수정] sticky 위치(left) 계산: "대상자 이름, 관리등급" 열 까지만 고정
            const L_No = 0;
            const L1 = W_No;                // 이름 시작 위치
            const L2 = L1 + W_Name;         // 등급 시작 위치 (이름 너비 더함)
            
            const stickColStyle = (left, z) => `position: sticky; left: ${left}px; z-index: ${z};`;
            let theadHTML = '';
            
            // [수정] 합계 행 순서 변경 (No -> 총계라벨 -> 빈칸(등급) -> 빈칸(생년) -> 빈칸(행정동) -> 합계)
            // 고정되는 컬럼(No, 총계, 등급)에만 sticky 스타일 적용, 나머지는 해제
            const totalRowHTML = `<tr class="bg-slate-100 font-bold shadow-sm border-b border-slate-200"><td class="py-2 px-1 border-r bg-slate-100" style="${stickColStyle(L_No, 50)}"></td><td class="py-2 px-1 border-r text-center text-slate-700 bg-slate-100" style="${stickColStyle(L1, 50)}">총계</td><td class="py-2 px-1 border-r bg-slate-100" style="${stickColStyle(L2, 50)}"></td><td class="py-2 px-1 border-r bg-slate-100"></td><td class="py-2 px-1 border-r bg-slate-100"></td><td class="py-2 px-1 text-center border-r bg-emerald-100 text-emerald-700">${grandTotal}</td>${serviceHeaders.map(k => `<td class="py-2 px-2 text-center border-r text-slate-700">${colTotals[k]}</td>`).join('')}</tr>`;
            
            if (type === 'category') {
                // [수정] 헤더 순서 변경: 대상자 -> 등급 -> 생년월일
                // No, 대상자, 등급 열에만 sticky 적용
                theadHTML = `<tr><th class="py-2 px-1 border-b border-r min-w-[${W_No}px] bg-slate-50 text-xs text-center font-bold text-slate-500" style="${stickColStyle(L_No, 50)}">No</th><th class="py-2 px-1 border-b border-r min-w-[${W_Name}px] bg-slate-50 text-xs text-center font-bold text-slate-700" style="${stickColStyle(L1, 50)}">대상자</th><th class="py-2 px-1 border-b border-r min-w-[${W_Level}px] bg-slate-50 text-xs text-center font-bold text-slate-600" style="${stickColStyle(L2, 50)}">등급</th><th class="py-2 px-1 border-b border-r min-w-[${W_Birth}px] bg-slate-50 text-xs text-center font-bold text-slate-600">생년월일</th><th class="py-2 px-1 border-b border-r min-w-[${W_Region}px] bg-slate-50 text-xs text-center font-bold text-slate-600">행정동</th><th class="py-2 px-1 bg-emerald-50 text-emerald-700 border-b border-r min-w-[${W_Total}px] text-xs text-center font-bold">합계</th>${serviceHeaders.map(k => `<th class="py-2 px-2 border-b border-r text-xs text-center text-slate-600 bg-slate-50 whitespace-nowrap">${k}</th>`).join('')}</tr>${totalRowHTML}`;
            } else {
                // [수정] 헤더 순서 변경: 대상자 -> 등급 -> 생년월일
                // No, 대상자, 등급 열에만 sticky 적용
                theadHTML = `<tr><th rowspan="2" class="py-2 px-1 border-b border-r min-w-[${W_No}px] bg-slate-50 z-30 text-xs text-center font-bold text-slate-500" style="${stickColStyle(L_No, 50)}">No</th><th rowspan="2" class="py-2 px-1 border-b border-r min-w-[${W_Name}px] bg-slate-50 z-30 text-xs text-center font-bold text-slate-700" style="${stickColStyle(L1, 50)}">대상자</th><th rowspan="2" class="py-2 px-1 border-b border-r min-w-[${W_Level}px] bg-slate-50 z-30 text-xs text-center font-bold text-slate-600" style="${stickColStyle(L2, 50)}">등급</th><th rowspan="2" class="py-2 px-1 border-b border-r min-w-[${W_Birth}px] bg-slate-50 z-30 text-xs text-center font-bold text-slate-600">생년월일</th><th rowspan="2" class="py-2 px-1 border-b border-r min-w-[${W_Region}px] bg-slate-50 z-30 text-xs text-center font-bold text-slate-600">행정동</th><th rowspan="2" class="py-2 px-1 bg-emerald-50 text-emerald-700 border-b border-r min-w-[${W_Total}px] z-30 text-xs text-center font-bold">합계</th>${orderedCategories.map(cat => `<th colspan="${headerGroups[cat].length}" class="py-1 border-b border-r bg-slate-100 text-center text-xs text-center font-semibold text-slate-600 whitespace-nowrap">${cat}</th>`).join('')}</tr><tr>${orderedCategories.map(cat => headerGroups[cat].map(svc => `<th class="py-1.5 px-2 border-b border-r font-normal text-xs text-center text-slate-500 bg-slate-50 whitespace-nowrap">${svc === '정서지원서비스(안전안부확인)' ? '안전안부확인' : svc}</th>`).join('')).join('')}</tr>${totalRowHTML}`;
            }

            // [신규] 연도 선택 옵션 생성 (2020년 ~ 내년)
            const currentYear = new Date().getFullYear();
            const statsYearOptions = [];
            for (let y = 2020; y <= currentYear + 1; y++) {
                // [수정] 드롭다운 선택 여부를 날짜가 아닌 targetYear 상태로 판별
                const isSelected = state.filters.stats.targetYear === String(y);
                statsYearOptions.push(`<option value="${y}" ${isSelected ? 'selected' : ''}>${y}년</option>`);
            }
            statsYearOptions.reverse();
            statsYearOptions.unshift(`<option value="">연도</option>`);

            return `
                <div class="space-y-6 animate-fade-in p-1">
                    <!-- [수정] 제목 옆에 로딩 태그 추가 -->
                    <h2 class="text-2xl font-bold text-slate-800 flex items-center">서비스 제공 통계 ${getLoadingTag()}</h2>
                    <div class="sticky top-0 z-50 bg-slate-50 pt-2 pb-2 shadow-sm -mx-1 px-1">
                        <div class="flex flex-col sm:flex-row flex-wrap gap-2 items-center bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                            <div class="flex bg-slate-100 p-1 rounded w-full sm:w-auto justify-center">
                                <button onclick="app.setFilter('stats','type','category')" class="px-3 py-1 rounded text-sm flex-1 sm:flex-none ${type==='category'?'bg-white shadow':''}">분류별</button>
                                <button onclick="app.setFilter('stats','type','detail')" class="px-3 py-1 rounded text-sm flex-1 sm:flex-none ${type==='detail'?'bg-white shadow':''}">상세별</button>
                            </div>
                            
                            <!-- [신규] 통계 연도 선택 필터 추가 -->
                            <select class="input-field h-9 py-1 px-2 text-sm w-24 font-medium border-slate-200 bg-slate-50 focus:ring-0 focus:border-emerald-500" onchange="app.setStatsYear(this.value)">
                                ${statsYearOptions.join('')}
                            </select>

                            <!-- [신규 추가] 통계 월 선택 드롭다운 -->
                            <div class="relative z-30 w-full sm:w-auto ml-0 sm:ml-1">
                                <button onclick="app.toggleStatsMonthDropdown()" class="input-field h-9 py-1 px-2 text-sm flex items-center justify-between min-w-[100px] w-full sm:w-32 bg-white cursor-pointer text-left">
                                    <span class="truncate max-w-[80px] text-slate-700">${selectedMonths.length > 0 ? (selectedMonths.length === 12 ? '전체 월' : `${selectedMonths.length}개 선택`) : '전체 월'}</span>
                                    <i data-lucide="chevron-down" size="14" class="text-slate-400 ml-2"></i>
                                </button>
                                ${state.ui.statsMonthDropdownOpen ? `
                                    <div class="fixed inset-0 z-40" onclick="app.toggleStatsMonthDropdown()"></div>
                                    <div class="absolute top-full left-0 mt-1 w-48 bg-white border border-slate-200 rounded-lg shadow-xl z-50 p-2 animate-fade-in">
                                        <div class="flex justify-between items-center px-2 pb-2 mb-2 border-b border-slate-100">
                                            <span class="text-xs font-bold text-slate-500">다중 선택</span>
                                            <button onclick="app.toggleAllStatsMonths()" class="text-xs text-blue-600 hover:text-blue-800 font-medium">전체선택/해제</button>
                                        </div>
                                        <div class="grid grid-cols-2 gap-1 max-h-60 overflow-y-auto">
                                            ${Array.from({length: 12}, (_, i) => i + 1).map(m => `
                                                <label class="flex items-center gap-2 text-sm p-2 hover:bg-slate-50 rounded cursor-pointer select-none">
                                                    <input type="checkbox" class="rounded text-emerald-600 focus:ring-emerald-500 w-4 h-4 border-slate-300" 
                                                        ${selectedMonths.includes(m) ? 'checked' : ''} 
                                                        onchange="app.toggleStatsMonthFilter(${m})">
                                                    <span class="text-slate-700 font-medium">${m}월</span>
                                                </label>
                                            `).join('')}
                                        </div>
                                    </div>
                                ` : ''}
                            </div>

                            <!-- [수정] 날짜 필터 자동 갱신 방지(false) 및 조회 버튼 추가 -->
                            <div class="flex items-center gap-2 p-1 bg-slate-50 rounded-lg border border-slate-200 w-full sm:w-auto">
                                <input id="stats-start" type="date" class="bg-transparent border-0 text-sm focus:ring-0 px-1 py-1 w-[110px]" value="${start}" onchange="app.setFilter('stats','start',this.value, false)" max="9999-12-31">
                                <span class="text-slate-400">~</span>
                                <input id="stats-end" type="date" class="bg-transparent border-0 text-sm focus:ring-0 px-1 py-1 w-[110px]" value="${end}" onchange="app.setFilter('stats','end',this.value, false)" max="9999-12-31">
                                <button onclick="app.searchStatsByDateRange()" class="bg-slate-800 text-white px-3 py-1 rounded-md text-sm font-medium hover:bg-slate-700 transition-colors whitespace-nowrap ml-1">조회</button>
                            </div>

                            <div class="flex w-full sm:w-auto gap-2 flex-1">
                                <input id="stats-search-name" enterkeyhint="search" class="input-field w-full sm:w-24 py-1 text-sm" placeholder="이름 (Enter)" value="${name}" onkeydown="if(event.key === 'Enter' || event.keyCode === 13) app.setFilter('stats','name',this.value)" oninput="if(this.value === '') app.setFilter('stats','name','')">
                                <div class="relative z-30 w-full sm:w-auto">
                                    <button onclick="app.toggleStatsRegionDropdown()" class="input-field py-1.5 px-2 text-sm flex items-center justify-between min-w-[100px] bg-white cursor-pointer text-left h-[30px] w-full sm:w-24"><span class="truncate max-w-[80px] text-slate-700">${region.length > 0 ? (region.length === CONSTANTS.DONG_LIST.length ? '전체 동' : region.join(',')) : '전체 동'}</span><i data-lucide="chevron-down" size="14" class="text-slate-400 ml-2"></i></button>
                                    ${state.ui.statsRegionDropdownOpen ? `<div class="fixed inset-0 z-40" onclick="app.toggleStatsRegionDropdown()"></div><div class="absolute top-full left-0 mt-1 w-40 bg-white border border-slate-200 rounded-lg shadow-xl z-50 p-2 max-h-60 overflow-y-auto animate-fade-in">${CONSTANTS.DONG_LIST.map(d => `<label class="flex items-center gap-2 text-sm p-2 hover:bg-slate-50 rounded cursor-pointer select-none"><input type="checkbox" class="rounded text-emerald-600 focus:ring-emerald-500 w-4 h-4 border-slate-300" ${region.includes(d) ? 'checked' : ''} onchange="app.toggleStatsRegionFilter('${d}')"><span class="text-slate-700">${d}</span></label>`).join('')}</div>` : ''}
                                </div>
                            </div>
                            <!-- [수정] 초기화 버튼에 app.render() 추가하여 분할 화면에서 갱신 보장 -->
                            <button onclick="app.resetFilters('stats'); app.render()" class="w-full sm:w-auto text-slate-400 hover:text-slate-600 p-2 rounded hover:bg-slate-100 transition-colors flex justify-center items-center flex-shrink-0" title="필터 초기화"><i data-lucide="refresh-cw" size="20"></i></button>
                            <button onclick="app.downloadStatsExcel()" class="w-full sm:w-auto bg-emerald-600 text-white p-2 rounded flex justify-center items-center flex-shrink-0"><i data-lucide="download" size="20"></i></button>
                        </div>
                    </div>
                    <div id="stats-list-container" class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-auto max-h-[600px]">
                        <table class="w-auto text-sm text-left border-collapse whitespace-nowrap">
                            <thead class="sticky-header bg-slate-50 text-slate-600 font-semibold z-20 shadow-sm" style="position: sticky; top: 0; z-index: 40;">${theadHTML}</thead>
                            <tbody class="divide-y divide-slate-100">
                                ${rows.map((r, index) => {
                                    const careLevelClass = r.careLevel === '중점' ? 'text-pink-600 font-bold' : (r.careLevel === '일반' ? 'text-blue-600 font-bold' : 'text-slate-500');
                                    // [수정] 종결 여부 확인 기준 변경: 연말(fullYearEnd) -> 조회 종료일(end)
                                    // 조회 기간 종료 시점보다 종결일이 같거나 빠르면 종결로 처리
                                    const isTerminatedInPeriod = r.endDate !== '9999-12-31' && r.endDate <= end;
                                    
                                    // [신규] 종결 대상자 행 스타일 설정 (연한 회색 배경)
                                    const rowClass = isTerminatedInPeriod ? 'bg-slate-100 hover:bg-slate-200' : 'hover:bg-slate-50';
                                    const cellBg = isTerminatedInPeriod ? 'bg-slate-100' : 'bg-white'; // sticky 컬럼용 배경
                                    const totalBg = isTerminatedInPeriod ? 'bg-slate-200 text-emerald-800' : 'bg-emerald-50 text-emerald-600'; // 합계 컬럼 배경

                                    let isDeficient = false;
                                    if (!isTerminatedInPeriod) {
                                        if (r.careLevel === '중점' && r.emotionalCount < 4) isDeficient = true;
                                        else if (r.careLevel === '일반' && r.emotionalCount < 1) isDeficient = true;
                                    }
                                    return `
                                    <tr class="${rowClass} group transition-colors">
                                        <td class="py-1.5 px-1 border-r text-center text-slate-400 text-xs ${cellBg}" style="${stickColStyle(L_No, 30)}">${index + 1}</td>
                                        <td class="py-1.5 px-1 border-r group-hover:bg-opacity-50 text-center font-medium text-slate-800 ${cellBg} cursor-pointer hover:text-blue-600" style="${stickColStyle(L1, 30)}" onclick="app.showClientStatsDetail('${r.id}', '${r.name}')" title="상세 내역 보기">${r.name}</td>
                                        <!-- [수정] 데이터 표시 순서 변경: 등급이 먼저 옴 -->
                                        <td class="py-1.5 px-1 text-center border-r text-xs ${cellBg} ${careLevelClass}" style="${stickColStyle(L2, 30)}">${r.careLevel}</td>
                                        <td class="py-1.5 px-1 text-center border-r text-slate-500 text-xs">${r.birthDate}</td>
                                        <td class="py-1.5 px-1 text-center border-r text-slate-500 text-xs">${r.region}</td>
                                        <td class="p-1.5 text-center font-bold border-r ${totalBg}">${r.total}</td>
                                        ${serviceHeaders.map(k => {
                                            const count = r.counts[k] || 0;
                                            const isTargetCell = isDeficient && k.includes('정서지원');
                                            let cellClass = "p-1.5 px-2 text-center border-r transition-colors";
                                            let clickAttr = "";
                                            
                                            // [수정] 숫자가 있는 경우 클릭 이벤트 추가 및 스타일 변경
                                            if (count > 0) {
                                                cellClass += " cursor-pointer hover:underline decoration-2 underline-offset-2";
                                                clickAttr = `onclick="app.showClientStatsDetail('${r.id}', '${r.name}', '${k}')"`;
                                            }

                                            if (isTargetCell) { 
                                                cellClass += " text-red-600 font-bold bg-red-50 hover:bg-red-100"; 
                                            } else { 
                                                if (count > 0) { 
                                                    cellClass += " bg-blue-50 font-medium text-blue-600 hover:bg-blue-100"; 
                                                } else {
