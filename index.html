            },

            setClientModalTab: (tabName) => {
                // [신규] 현재 탭과 다른 탭으로 이동하려 할 때, 수정된 내용이 있는지 검사
                if (state.ui.clientModalTab !== tabName && app.hasFormChanged()) {
                    if (!confirm("수정된 내용이 있습니다. 저장하지 않고 다른 탭으로 이동하시겠습니까?")) return;
                    
                    const form = document.getElementById('client-form');
                    if (form) {
                        state.ui.isDirty = false; // 👈 이동하기 전에 기억을 즉시 깨끗하게 세탁!
                        state.ui.clientModalTab = tabName; 
                        app.openClientModal(form.dataset.id || ''); 
                        return; 
                    }
                }

                state.ui.clientModalTab = tabName;
                document.querySelectorAll('.modal-tab-btn').forEach(btn => { if (btn.dataset.tab === tabName) btn.classList.add('active'); else btn.classList.remove('active'); });
                document.querySelectorAll('.modal-tab-content').forEach(content => { if (content.id === `tab-${tabName}`) content.classList.add('active'); else content.classList.remove('active'); });
            // 탭이 열려 화면에 나타날 때 텍스트 박스 높이 자동 재계산
                setTimeout(() => {
                    document.querySelectorAll('.modal-tab-content.active textarea, .sub-tab-content.active textarea').forEach(el => {
                        el.style.height = 'auto';
                        el.style.height = (el.scrollHeight) + 'px';
                    });
                }, 10);
            },
            setCaseSubTab: (tabName) => {
                // [복구 완료!] 탭이 다르고, 실제로 내용이 변경되었을 때만 알림 띄우기
                if (state.ui.caseSubTab !== tabName && app.hasFormChanged()) {
                    if (!confirm("수정된 내용이 있습니다. 저장하지 않고 다른 탭으로 이동하시겠습니까?")) return;
                    
                    const form = document.getElementById('client-form');
                    if (form) {
                        state.ui.isDirty = false; // 👈 이동하기 전에 기억을 즉시 깨끗하게 세탁!
                        state.ui.caseSubTab = tabName; 
                        app.openClientModal(form.dataset.id || ''); 
                        return; 
                    }
                }

                state.ui.caseSubTab = tabName;
                document.querySelectorAll('.sub-tab-btn').forEach(btn => { if (btn.dataset.subtab === tabName) btn.classList.add('active'); else btn.classList.remove('active'); });
                document.querySelectorAll('.sub-tab-content').forEach(content => { if (content.id === `sub-tab-${tabName}`) content.classList.add('active'); else content.classList.remove('active'); });
                
                // [추가] 탭 변경 시 연도 선택 박스 표시 여부 제어
                const yearWrapper = document.getElementById('year-select-wrapper');
                if (yearWrapper) {
                    if (['reassess', 'satisfaction', 'evaluation', 'servicePlan'].includes(tabName)) {
                        yearWrapper.classList.remove('hidden');
                    } else {
                        yearWrapper.classList.add('hidden');
                    }
                }

                // 탭이 열려 화면에 나타날 때 텍스트 박스 높이 자동 재계산
                setTimeout(() => {
                    document.querySelectorAll('.modal-tab-content.active textarea, .sub-tab-content.active textarea').forEach(el => {
                        el.style.height = 'auto';
                        el.style.height = (el.scrollHeight) + 'px';
                    });
                }, 10);

            },
            // [신규] 사례관리 연도 변경 핸들러
            setCmYear: async (year) => { // Changed to async
                state.ui.cmYear = parseInt(year);
                
                // [신규] 선택된 연도의 로그 데이터가 없으면 로드 (만족도 조사의 서비스 내역 자동완성용)
                if (!state.loadedYears.has(parseInt(year))) {
                    await app.loadLogsByYear(parseInt(year));
                }

                // [수정] 스크롤 위치 저장 및 모달 갱신
                const formEl = document.getElementById('client-form');
                let savedScrollTop = 0;
                if (formEl && formEl.parentElement) {
                    savedScrollTop = formEl.parentElement.scrollTop;
                }

                const clientId = formEl ? formEl.dataset.id : null;
                if (clientId) {
                    app.openClientModal(clientId);
                    
                    // [수정] 스크롤 위치 복원
                    setTimeout(() => {
                        const newForm = document.getElementById('client-form');
                        if (newForm && newForm.parentElement) {
                            newForm.parentElement.scrollTop = savedScrollTop;
                        }
                    }, 0);
                }
            },
            openClientModal: (id) => {
                const c = id ? state.clients.find(x => x.id === id) : {};
                const modalId = id || '';
                // [수정] 장기부재 기간 로딩 로직 개선
                let absStart = c.absStart || '', absEnd = c.absEnd || '';
                if (!absStart && c.absencePeriod && c.absencePeriod.includes('~')) { 
                    const parts = c.absencePeriod.split('~'); 
                    if(parts.length === 2) { absStart = parts[0].trim(); absEnd = parts[1].trim(); } 
                }
                const initialAge = c.birthDate ? `만 ${calculateAge(c.birthDate)}세` : '';
                const cm = c.caseManagement || {};
                
                // 탭 상태 유지 로직 (처음 열 때만 초기화)
                const mainModal = document.getElementById('modal-container');
                const subModal = document.getElementById('sub-modal-container');
                const openMainForm = !mainModal.classList.contains('hidden') ? mainModal.querySelector('#client-form') : null;
                const openSubForm = !subModal.classList.contains('hidden') ? subModal.querySelector('#client-form') : null;
                const isRefreshing = (openMainForm && openMainForm.dataset.id === id) || (openSubForm && openSubForm.dataset.id === id);

                if (isRefreshing) {
                    // 이미 열려있고 같은 ID면 탭 유지 (state.ui.clientModalTab 값 사용)
                } else {
                    state.ui.clientModalTab = 'basic'; 
                    state.ui.caseSubTab = 'initial';
                    // 연도 초기화 (데이터가 있는 가장 최근 연도 또는 올해)
                    state.ui.cmYear = new Date().getFullYear();
                }
                
                // [신규] 데이터 가져오기 헬퍼 함수 (연도별 데이터 + 구버전 데이터 호환)
                const targetYear = state.ui.cmYear;
                const getVal = (obj, path) => {
                    // path: "initial.date", "reAssessment.date" 등
                    const parts = path.split('.');
                    const section = parts[0];
                    const fieldPath = parts.slice(1).join('.');
                    
                    // 1. 초기면접(initial), 사정(assessment)은 연도 구분 없이 기존 위치 사용 (1회성 성격)
                    if (section === 'initial' || section === 'assessment') {
                        return path.split('.').reduce((o, i) => (o ? o[i] : undefined), obj) || '';
                    }

                    // 2. 재사정, 만족도, 평가서는 연도별 데이터 우선 확인
                    // 구조: cm.history[2024].reAssessment...
                    let val = undefined;
                    if (obj.history && obj.history[targetYear] && obj.history[targetYear][section]) {
                        val = fieldPath.split('.').reduce((o, i) => (o ? o[i] : undefined), obj.history[targetYear][section]);
                    }

                    // 3. 연도별 데이터가 없으면? -> 기존(구버전) 데이터 확인
                    // 단, 기존 데이터의 날짜가 현재 선택된 연도와 같을 때만 매핑하여 보여줌 (자동 마이그레이션 효과)
                    if ((val === undefined || val === null || val === '') && obj[section]) {
                        const oldDate = obj[section].date;
                        if (oldDate && oldDate.startsWith(String(targetYear))) {
                            val = fieldPath.split('.').reduce((o, i) => (o ? o[i] : undefined), obj[section]);
                        }
                    }

                    return (val === undefined || val === null) ? '' : val;
                };

                // [유지] 서비스 내역 탭 - 연도 선택 및 데이터 로드 기능 준비
                const currentYear = new Date().getFullYear();
                let yearOptionsHTML = '';
                for (let y = 2020; y <= currentYear + 1; y++) {
                    yearOptionsHTML = `<option value="${y}" ${y === currentYear ? 'selected' : ''}>${y}년</option>` + yearOptionsHTML;
                }

                // [신규] 사례관리 관리 연도 옵션 생성
                let cmYearOptionsHTML = '';
                for (let y = 2020; y <= currentYear + 1; y++) {
                    cmYearOptionsHTML = `<option value="${y}" ${y === state.ui.cmYear ? 'selected' : ''}>${y}년</option>` + cmYearOptionsHTML;
                }
                
                // [추가] 현재 활성 탭이 연도 선택이 필요한 탭인지 확인
                const showYearSelect = ['reassess', 'satisfaction', 'evaluation'].includes(state.ui.caseSubTab);
                
                // [신규] 섹션별 초기화 버튼 생성 헬퍼
                const getSectionResetBtn = (targetId) => `
                    <button type="button" onclick="app.resetInputs('${targetId}')" class="text-xs bg-slate-100 text-slate-500 px-2 py-1 rounded hover:bg-red-50 hover:text-red-600 transition-colors flex items-center gap-1 ml-2" title="이 항목의 선택값 초기화">
                        <i data-lucide="rotate-ccw" size="12"></i> 초기화
                    </button>
                `;

                // [신규] 문자열 정규화 헬퍼 (공백 제거하여 비교용 키 생성)
                const normalize = (str) => (str || '').replace(/\s+/g, '');

                // [수정] 해당 대상자가 선택된 연도(targetYear)에 이용한 서비스 카테고리 자동 추출
                const providedLogs = state.logs.filter(l => l.clientId === c.id && l.date.startsWith(String(targetYear)));
                
                // [수정] 공백 무시하고 중복 제거하여 카테고리 수집
                const providedCategoriesMap = new Map();
                providedLogs.forEach(l => {
                    if (l.serviceItems) {
                        l.serviceItems.forEach(item => {
                            if (item.category) {
                                const key = normalize(item.category);
                                if (!providedCategoriesMap.has(key)) {
                                    providedCategoriesMap.set(key, item.category.trim());
                                }
                            }
                        });
                    }
                });

                // [수정] 저장된 데이터와 자동 데이터를 병합 (공백 무시 비교하여 유니크 목록 생성)
                const savedGoalsData = getVal(cm, 'satisfaction.serviceGoals') || [];
                const uniqueGoalsMap = new Map();

                // 1. 저장된 목표 먼저 추가 (사용자가 수정한 띄어쓰기 유지)
                savedGoalsData.forEach(g => {
                    if (g.goal) {
                        const key = normalize(g.goal);
                        uniqueGoalsMap.set(key, g.goal.trim());
                    }
                });

                // [절충안] 삭제된 항목(블랙리스트)을 불러옵니다.
                window.deletedSatGoals = getVal(cm, 'satisfaction.deletedGoals') || [];

                // [스마트 동기화] 1. 일지 내역을 반영하되, 사용자가 삭제했던 항목은 휴지통을 확인하여 제외합니다.
                providedCategoriesMap.forEach((val, key) => {
                    if (!window.deletedSatGoals.includes(key)) {
                        uniqueGoalsMap.set(key, val);
                    }
                });

                // [스마트 동기화] 2. 과거에 저장된 내역 중, 일지에는 없지만 '평가나 만족도를 체크한 항목'만 보호함
                savedGoalsData.forEach(g => {
                    if (g.goal) {
                        const key = normalize(g.goal);
                        // 일지에서 삭제되었더라도, 선생님이 이미 평가를 남긴 항목은 데이터 보호를 위해 살려둠
                        if (!uniqueGoalsMap.has(key) && (g.userSat || g.workerEval)) {
                            uniqueGoalsMap.set(key, g.goal.trim());
                        }
                    }
                });

                // [수정] 정렬 로직 개선: 서비스 설정 탭의 순서(state.services)를 따르도록 변경
                const serviceOrderList = [...new Set(state.services.map(s => s.category))];
                
                const allGoals = Array.from(uniqueGoalsMap.values()).sort((a, b) => {
                    // 서비스 목록 순서 우선 확인 (공백 무시 비교)
                    const normA = normalize(a);
                    const normB = normalize(b);
                    const idxA = serviceOrderList.findIndex(cat => normalize(cat) === normA);
                    const idxB = serviceOrderList.findIndex(cat => normalize(cat) === normB);

                    if (idxA !== -1 && idxB !== -1) return idxA - idxB;
                    if (idxA !== -1) return -1;
                    if (idxB !== -1) return 1;
                    
                    return a.localeCompare(b);
                });

                // 최소 2줄 보장
                while (allGoals.length < 2) allGoals.push('');

                let serviceGoalRowsHTML = '';
                allGoals.forEach((displayGoal, i) => {
                    // [수정] 저장된 데이터 매칭 (공백 무시 비교)
                    const normalizedDisplayGoal = normalize(displayGoal);
                    const savedItem = displayGoal ? (savedGoalsData.find(g => normalize(g.goal) === normalizedDisplayGoal) || {}) : {}; 
                    
                    // 해당 목표(displayGoal)에 해당하는 모든 일지 내용을 모아서 자동 완성 텍스트 생성
                    let autoAction = '';
                    if (displayGoal) {
                        const actionMap = new Map();
                        providedLogs.forEach(log => {
                            if (log.serviceItems) {
                                log.serviceItems.forEach(item => {
                                    // [수정] 공백 무시 비교 적용 (띄어쓰기 달라도 매칭)
                                    if (item.category && normalize(item.category) === normalizedDisplayGoal) {
                                        if (!actionMap.has(item.serviceName)) actionMap.set(item.serviceName, new Set());
                                        if (item.detailNote && item.detailNote.trim() !== '') actionMap.get(item.serviceName).add(item.detailNote.trim());
                                    }
                                });
                            }
                        });
                        const actions = [];
                        actionMap.forEach((notesSet, serviceName) => {
                            let itemText = serviceName;
                            if (notesSet.size > 0) {
                                const notes = [...notesSet].map(note => ` • ${note}`).join('\n');
                                itemText += `\n${notes}`;
                            }
                            actions.push(itemText);
                        });
                        autoAction = actions.join('\n\n');
                    }
                    
                    // [수정] 사용자가 직접 수정한 내용(savedItem.action)이 있으면 무조건 그것을 유지!
                    const displayAction = savedItem.action ? savedItem.action : autoAction;
                    const savedUserSat = savedItem.userSat || '';
                    const savedWorkerEval = savedItem.workerEval || '';

                    const renderSatisfactionOptions = (rowIndex, selectedValue) => {
                        const group1 = ["매우 만족", "만족", "보통"];
                        const group2 = ["불만족", "매우 불만족"];
                        // [수정] 라디오 버튼 -> 체크박스로 변경 및 checkExclusive 적용
                        const renderItem = (opt) => `<label class="flex items-center gap-1.5 cursor-pointer hover:bg-slate-50 rounded px-1 py-0.5 transition-colors"><input type="checkbox" name="service-sat-${rowIndex}" value="${opt}" class="w-3.5 h-3.5 text-emerald-600 focus:ring-emerald-500 border-slate-300 cursor-pointer" ${selectedValue === opt ? 'checked' : ''} onclick="app.checkExclusive(this)"><span class="text-xs text-slate-700 font-medium whitespace-nowrap">${opt}</span></label>`;
                        return `<div class="flex flex-col gap-2 p-3"><div class="flex flex-wrap items-center gap-2">${group1.map(renderItem).join('')}</div><div class="flex flex-wrap items-center gap-2 pt-1 border-t border-dashed border-slate-100">${group2.map(renderItem).join('')}</div></div>`;
                    };

                    serviceGoalRowsHTML += `<tr><td class="p-0 border-r border-slate-200"><textarea id="sat-goal-${i}" class="input-field w-full min-h-[60px] text-xs resize-none border-0 focus:ring-0 focus:bg-blue-50/50 rounded-none p-2 font-bold text-slate-700 overflow-hidden" placeholder="자동 입력됨" oninput="this.style.height = 'auto'; this.style.height = (this.scrollHeight) + 'px'">${displayGoal}</textarea></td><td class="p-0 border-r border-slate-200"><textarea id="sat-action-${i}" class="input-field w-full min-h-[60px] text-xs resize-none border-0 focus:ring-0 focus:bg-blue-50/50 rounded-none p-2 whitespace-pre overflow-hidden" placeholder="자동 입력됨" oninput="this.style.height = 'auto'; this.style.height = (this.scrollHeight) + 'px'">${displayAction}</textarea></td><td class="p-0 border-r border-slate-200 align-top bg-white">${renderSatisfactionOptions(i, savedUserSat)}</td><td class="p-0 relative"><textarea id="sat-worker-${i}" class="input-field w-full min-h-[60px] text-xs resize-none border-0 focus:ring-0 focus:bg-blue-50/50 rounded-none p-2 overflow-hidden pr-8" placeholder="평가 내용" oninput="this.style.height = 'auto'; this.style.height = (this.scrollHeight) + 'px'">${savedWorkerEval}</textarea><button type="button" onclick="app.removeSatGoalRow(this)" class="absolute top-2 right-2 text-slate-300 hover:text-red-500" title="이 항목 삭제"><i data-lucide="x-circle" size="16"></i></button></td></tr>`;
                });

                // [유지] 초기 데이터(현재 연도) 생성
                let historyRows = '';
                if (c.id) {
                    const clientLogs = state.logs.filter(l => l.clientId === c.id && l.date.startsWith(String(currentYear))).sort((a,b) => b.date.localeCompare(a.date));
                    historyRows = app.generateHistoryRows(clientLogs);
                } else {
                    historyRows = `<tr><td colspan="6" class="px-4 py-8 text-center text-slate-400">대상자 등록 후 확인할 수 있습니다.</td></tr>`;
                }

                const isChecked = (q, val) => getVal(cm, `satisfaction.${q}`) === val ? 'checked' : '';

                // [신규] 사례관리 내역 데이터 생성
                const caseHistory = [];
                // 기존 루트 데이터 체크
                if (cm.initial?.date) caseHistory.push({ type: '초기면접지', date: cm.initial.date, writer: cm.initial.interviewer, summary: '초기 상태 및 욕구 파악' });
                if (cm.assessment?.date) caseHistory.push({ type: '사정기록지', date: cm.assessment.date, writer: cm.assessment.writer, summary: '위기도 평가 및 개입 계획' });
                
                // 연도별 히스토리 데이터 체크
                if (cm.history) {
                    Object.keys(cm.history).forEach(year => {
                        const h = cm.history[year];
                        if (h.reAssessment?.date) caseHistory.push({ type: '재사정', date: h.reAssessment.date, writer: '-', summary: `[${year}] 향후계획: ${h.reAssessment.planType || '-'}` });
                        if (h.satisfaction?.date) caseHistory.push({ type: '만족도조사', date: h.satisfaction.date, writer: h.satisfaction.surveyor, summary: `[${year}] 모니터링: ${h.satisfaction.type || '-'}` });
                        if (h.evaluation?.date) caseHistory.push({ type: '사례평가서', date: h.evaluation.date, writer: h.evaluation.writer, summary: `[${year}] 방향: ${h.evaluation.direction || '-'}` });
                    });
                }
                
                if (cm.reAssessment?.date && !caseHistory.some(h => h.date === cm.reAssessment.date && h.type === '재사정')) 
                    caseHistory.push({ type: '재사정', date: cm.reAssessment.date, writer: '-', summary: `향후계획: ${cm.reAssessment.planType || '-'}` });
                if (cm.satisfaction?.date && !caseHistory.some(h => h.date === cm.satisfaction.date && h.type === '만족도조사')) 
                    caseHistory.push({ type: '만족도조사', date: cm.satisfaction.date, writer: cm.satisfaction.surveyor, summary: `모니터링: ${cm.satisfaction.type || '-'}` });
                if (cm.evaluation?.date && !caseHistory.some(h => h.date === cm.evaluation.date && h.type === '사례평가서')) 
                    caseHistory.push({ type: '사례평가서', date: cm.evaluation.date, writer: cm.evaluation.writer, summary: `방향: ${cm.evaluation.direction || '-'}` });

                // 주요 일정 추가
                if (c.serviceStartDate) caseHistory.push({ type: '서비스 시작', date: c.serviceStartDate, writer: '-', summary: '서비스 이용 개시' });
                if (absStart) caseHistory.push({ type: '장기부재', date: absStart, writer: '-', summary: '장기부재 시작' });
                if (absEnd) caseHistory.push({ type: '장기부재', date: absEnd, writer: '-', summary: '장기부재 종료' });
                if (c.endDate) caseHistory.push({ type: '서비스 종결', date: c.endDate, writer: '-', summary: `상태: ${c.status || '종결'}` });

                // [신규] 회의 이력 통합
                const clientMeetings = state.meetings.filter(m => 
                    (m.clientId && m.clientId === c.id) || (!m.clientId && m.clientName === c.name)
                );
                clientMeetings.forEach(m => {
                    caseHistory.push({
                        type: `사례회의`,
                        subType: m.type,
                        date: m.date,
                        writer: m.writer || '-',
                        summary: m.topic || '안건 없음',
                        meetingId: m.id 
                    });
                });

                caseHistory.sort((a, b) => a.date.localeCompare(b.date));

                                                                                    <td class="border-r border-b border-slate-200 p-0"><input type="text" class="fam-note w-full p-1 outline-none bg-transparent" value="${f.note || ''}"></td>

                                                                                    </td>
                                                                                </tr>
                                                                            `).join('');
                                                                        })()}

                                                                </table>
                                                            </td>
                                                        </tr>

                                                        <!-- 6. 생활상태 (신규 추가) -->

                                                                <div class="space-y-3">
                                                                    <!-- 1) 경제상황 -->

                                                                        <!-- [수정] 체크박스와 소득 입력란을 세로로 배치하기 위한 래퍼 추가 -->

                                                                            <!-- 체크박스 영역 -->
                                                                            <div class="flex flex-wrap items-center gap-x-4 gap-y-2 w-full">
                                                                                ${(() => {
                                                                                    const savedEcos = getVal(cm, 'initial.living.economic') || [];
                                                                                    const condDetail = getVal(cm, 'initial.living.economicDetail.conditional');
                                                                                    const otherDetail = getVal(cm, 'initial.living.economicDetail.other');
                                                                                    
                                                                                    const mkCb = (val, label) => `
                                                                                        <label class="flex items-center gap-1.5 cursor-pointer hover:bg-slate-50 rounded px-1 py-0.5 transition-colors">
                                                                                            <input type="checkbox" name="cm-init-live-eco" value="${val}" class="w-3.5 h-3.5 text-emerald-600 focus:ring-emerald-500 border-slate-300 rounded cursor-pointer" ${savedEcos.includes(val) ? 'checked' : ''}>
                                                                                            <span class="text-xs text-slate-600">${label}</span>
                                                                                        </label>`;
                                                                                    
                                                                                    return `
                                                                                        ${mkCb('기초수급(의료/생계/주거)', '기초수급(의료/생계/주거)')}
                                                                                        
                                                                                        <div class="flex items-center gap-1 transition-all">
                                                                                            <label class="flex items-center gap-1.5 cursor-pointer hover:bg-slate-50 rounded px-1 py-0.5 transition-colors">
                                                                                                <input type="checkbox" name="cm-init-live-eco" value="조건부 수급" class="w-3.5 h-3.5 text-emerald-600 focus:ring-emerald-500 border-slate-300 rounded cursor-pointer" ${savedEcos.includes('조건부 수급') ? 'checked' : ''} onchange="app.toggleDisplay(this, 'cm-init-live-eco-cond-detail')">
                                                                                                <span class="text-xs text-slate-600">조건부 수급</span>
                                                                                            </label>
                                                                                            <input type="text" id="cm-init-live-eco-cond-detail" class="input-field py-0.5 px-2 text-xs w-28 border-slate-200 ${savedEcos.includes('조건부 수급') ? '' : 'hidden'}" placeholder="내용 입력" value="${condDetail}">
                                                                                        </div>

                                                                                        ${mkCb('차상위', '차상위')}
                                                                                        ${mkCb('일반(저소득)', '일반(저소득)')}

                                                                                        <div class="flex items-center gap-1 transition-all">
                                                                                            <label class="flex items-center gap-1.5 cursor-pointer hover:bg-slate-50 rounded px-1 py-0.5 transition-colors">
                                                                                                <input type="checkbox" name="cm-init-live-eco" value="기타" class="w-3.5 h-3.5 text-emerald-600 focus:ring-emerald-500 border-slate-300 rounded cursor-pointer" ${savedEcos.includes('기타') ? 'checked' : ''} onchange="app.toggleDisplay(this, 'cm-init-live-eco-other-detail')">
                                                                                                <span class="text-xs text-slate-600">기타</span>
                                                                                            </label>
                                                                                            <input type="text" id="cm-init-live-eco-other-detail" class="input-field py-0.5 px-2 text-xs w-28 border-slate-200 ${savedEcos.includes('기타') ? '' : 'hidden'}" placeholder="내용 입력" value="${otherDetail}">
                                                                                        </div>
                                                                                    `;
                                                                                })()}
                                                                            </div>
                                                                            <!-- [신규] 월소득 및 주소득원 입력란 -->
                                                                            <div class="flex flex-wrap items-center gap-3 pt-2 border-t border-dashed border-slate-100 w-full">
                                                                                <div class="flex items-center gap-1 bg-slate-50 px-2 py-1 rounded border border-slate-200">
                                                                                    <span class="text-xs font-bold text-slate-600">월소득 :</span>
                                                                                    <input type="text" id="cm-init-live-eco-income" class="bg-transparent text-xs w-16 text-right outline-none font-medium text-slate-800" placeholder="0" value="${getVal(cm, 'initial.living.economicDetail.monthlyIncome') || ''}">
                                                                                    <span class="text-xs text-slate-500">만원</span>
                                                                                </div>
                                                                                <div class="w-px h-3 bg-slate-300 hidden sm:block"></div>
                                                                                <div class="flex items-center gap-1 flex-1 min-w-[200px]">
                                                                                    <span class="text-xs font-bold text-slate-600 whitespace-nowrap">주소득원 :</span>
                                                                                    <input type="text" id="cm-init-live-eco-source" class="input-field py-1 px-2 text-xs flex-1 border-slate-200" placeholder="입력 (예: 기초연금, 자녀용돈 등)" value="${getVal(cm, 'initial.living.economicDetail.mainSource') || ''}">
                                                                                </div>
                                                                            </div>
                                                                        </div>
                                                                    </div>
                                                                    <!-- 2) 세대유형 -->
                                                                    <div class="flex items-start gap-2 border-t border-dashed border-slate-100 pt-2">
                                                                        <!-- [수정] 소제목 너비 축소 (w-24 -> w-20), 패딩 축소 (px-1.5 -> px-1) -->
                                                                        <span class="text-xs font-bold text-slate-700 w-20 flex-shrink-0 mt-0.5 bg-slate-100 px-1 py-0.5 rounded text-center border border-slate-200">② 세대유형</span>
                                                                        <div class="flex flex-wrap items-center gap-x-4 gap-y-2 w-full">
                                                                            ${(() => {
                                                                                const savedHouses = getVal(cm, 'initial.living.household') || [];
                                                                                const cohabitationDetail = getVal(cm, 'initial.living.householdDetail.cohabitation');
                                                                                const childDetail = getVal(cm, 'initial.living.householdDetail.childCohabitation');

                                                                                return CONSTANTS.HOUSEHOLD_LIST.map(house => {
                                                                                    const isChecked = savedHouses.includes(house) ? 'checked' : '';
                                                                                    let inputHtml = '';
                                                                                    let targetId = '';

                                                                                    if (house === '동거') {
                                                                                        targetId = 'cm-init-live-house-cohabitation-detail';
                                                                                        inputHtml = `<input type="text" id="${targetId}" class="input-field py-0.5 px-2 text-xs w-28 border-slate-200 ${isChecked ? '' : 'hidden'}" placeholder="내용 입력" value="${cohabitationDetail}">`;
                                                                                    } else if (house === '자녀동거세대') {
                                                                                        targetId = 'cm-init-live-house-child-detail';
                                                                                        inputHtml = `<input type="text" id="${targetId}" class="input-field py-0.5 px-2 text-xs w-28 border-slate-200 ${isChecked ? '' : 'hidden'}" placeholder="내용 입력" value="${childDetail}">`;
                                                                                    }

                                                                                    const onChangeAttr = targetId ? `onchange="app.toggleDisplay(this, '${targetId}')"` : '';

                                                                                    return `
                                                                                        <div class="flex items-center gap-1 transition-all">
                                                                                            <label class="flex items-center gap-1.5 cursor-pointer hover:bg-slate-50 rounded px-1 py-0.5 transition-colors">
                                                                                                <input type="checkbox" name="cm-init-live-house" value="${house}" class="w-3.5 h-3.5 text-emerald-600 focus:ring-emerald-500 border-slate-300 rounded cursor-pointer" ${isChecked} ${onChangeAttr}>
                                                                                                <span class="text-xs text-slate-600">${house}</span>
                                                                                            </label>
                                                                                            ${inputHtml}
                                                                                        </div>`;
                                                                                }).join('');
                                                                            })()}
                                                                        </div>
                                                                    </div>
                                                                    <!-- 3) 주거형태 -->
                                                                    <div class="flex items-start gap-2 border-t border-dashed border-slate-100 pt-2">
                                                                        <!-- [수정] 소제목 너비 축소 (w-24 -> w-20), 패딩 축소 (px-1.5 -> px-1) -->
                                                                        <span class="text-xs font-bold text-slate-700 w-20 flex-shrink-0 mt-0.5 bg-slate-100 px-1 py-0.5 rounded text-center border border-slate-200">③ 주거형태</span>
                                                                        <div class="flex flex-col w-full gap-2">
                                                                            <!-- 점유 형태 -->
                                                                            <div class="flex flex-wrap gap-x-4 gap-y-2 items-center">
                                                                                <span class="text-xs font-bold text-slate-500 mr-1">[점유]</span>
                                                                                ${(() => {
                                                                                    const savedHousings = getVal(cm, 'initial.living.housing') || [];
                                                                                    const jeonseDeposit = getVal(cm, 'initial.living.housingDetail.jeonseDeposit');
                                                                                    const wolseDeposit = getVal(cm, 'initial.living.housingDetail.wolseDeposit');
                                                                                    const wolseRent = getVal(cm, 'initial.living.housingDetail.wolseRent');
                                                                                    const freeHousing = getVal(cm, 'initial.living.housingDetail.freeHousing') || '';

                                                                                    return ['자가', '전세', '월세', '영구임대', '무상거주', '시설', '기타'].map(housing => {
                                                                                        const isChecked = savedHousings.includes(housing) ? 'checked' : '';
                                                                                        
                                                                                        if (housing === '무상거주') {
                                                                                            return `
                                                                                            <div class="flex items-center gap-1 transition-all">
                                                                                                <label class="flex items-center gap-1.5 cursor-pointer hover:bg-slate-50 rounded px-1 py-0.5 transition-colors">
                                                                                                    <input type="checkbox" name="cm-init-live-housing" value="${housing}" class="w-3.5 h-3.5 text-emerald-600 focus:ring-emerald-500 border-slate-300 rounded cursor-pointer" ${isChecked} onchange="app.toggleDisplay(this, 'cm-init-housing-free-detail')">
                                                                                                    <span class="text-xs text-slate-600">${housing}</span>
                                                                                                </label>
                                                                                                <input type="text" id="cm-init-housing-free-detail" class="input-field py-0.5 px-2 text-xs w-28 border-slate-200 ${isChecked ? '' : 'hidden'}" placeholder="관계 등 입력" value="${freeHousing}">
                                                                                            </div>`;
                                                                                        } else if (housing === '전세') {
                                                                                            return `
                                                                                            <div class="flex items-center gap-1 transition-all">
                                                                                                <label class="flex items-center gap-1.5 cursor-pointer hover:bg-slate-50 rounded px-1 py-0.5 transition-colors">
                                                                                                    <input type="checkbox" name="cm-init-live-housing" value="${housing}" class="w-3.5 h-3.5 text-emerald-600 focus:ring-emerald-500 border-slate-300 rounded cursor-pointer" ${isChecked} onchange="app.toggleDisplay(this, 'wrapper-jeonse')">
                                                                                                    <span class="text-xs text-slate-600">${housing}</span>
                                                                                                </label>
                                                                                                <div id="wrapper-jeonse" class="flex items-center gap-1 ${isChecked ? '' : 'hidden'} bg-slate-50 rounded px-1 border border-slate-100">
                                                                                                    <span class="text-[10px] text-slate-500">보증금</span>
                                                                                                    <input type="text" id="cm-init-housing-jeonse-deposit" class="input-field py-0.5 px-1 text-xs w-16 text-right border-slate-200 h-6" placeholder="0" value="${jeonseDeposit}">
                                                                                                    <span class="text-[10px] text-slate-500">만</span>
                                                                                                </div>
                                                                                            </div>`;
                                                                                        } else if (housing === '월세') {
                                                                                            return `
                                                                                            <div class="flex items-center gap-1 transition-all">
                                                                                                <label class="flex items-center gap-1.5 cursor-pointer hover:bg-slate-50 rounded px-1 py-0.5 transition-colors">
                                                                                                    <input type="checkbox" name="cm-init-live-housing" value="${housing}" class="w-3.5 h-3.5 text-emerald-600 focus:ring-emerald-500 border-slate-300 rounded cursor-pointer" ${isChecked} onchange="app.toggleDisplay(this, 'wrapper-wolse')">
                                                                                                    <span class="text-xs text-slate-600">${housing}</span>
                                                                                                </label>
                                                                                                <div id="wrapper-wolse" class="flex items-center gap-1 ${isChecked ? '' : 'hidden'} bg-slate-50 rounded px-1 border border-slate-100">
                                                                                                    <span class="text-[10px] text-slate-500">보</span>
                                                                                                    <input type="text" id="cm-init-housing-wolse-deposit" class="input-field py-0.5 px-1 text-xs w-12 text-right border-slate-200 h-6" placeholder="0" value="${wolseDeposit}">
                                                                                                    <span class="text-[10px] text-slate-500">/ 월</span>
                                                                                                    <input type="text" id="cm-init-housing-wolse-rent" class="input-field py-0.5 px-1 text-xs w-12 text-right border-slate-200 h-6" placeholder="0" value="${wolseRent}">
                                                                                                    <span class="text-[10px] text-slate-500">만</span>
                                                                                                </div>
                                                                                            </div>`;
                                                                                        } else {
                                                                                            return `<label class="flex items-center gap-1.5 cursor-pointer hover:bg-slate-50 rounded px-1 py-0.5 transition-colors"><input type="checkbox" name="cm-init-live-housing" value="${housing}" class="w-3.5 h-3.5 text-emerald-600 focus:ring-emerald-500 border-slate-300 rounded cursor-pointer" ${isChecked}><span class="text-xs text-slate-600">${housing}</span></label>`;
                                                                                        }
                                                                                    }).join('');
                                                                                })()}
                                                                            </div>
                                                                            <!-- 주거 유형 (신규) -->
                                                                            <div class="flex flex-wrap gap-x-4 gap-y-2 items-center border-t border-dashed border-slate-100 pt-2">
                                                                                <span class="text-xs font-bold text-slate-500 mr-1">[유형]</span>
                                                                                ${['단독주택', '아파트', '빌라/연립', '다세대주택', '기타'].map(type => {
                                                                                    const savedTypes = getVal(cm, 'initial.living.dwellingType') || [];
                                                                                    const isChecked = savedTypes.includes(type) ? 'checked' : '';
                                                                                    return `<label class="flex items-center gap-1.5 cursor-pointer hover:bg-slate-50 rounded px-1 py-0.5 transition-colors"><input type="checkbox" name="cm-init-live-dwelling" value="${type}" class="w-3.5 h-3.5 text-emerald-600 focus:ring-emerald-500 border-slate-300 rounded cursor-pointer" ${isChecked}><span class="text-xs text-slate-600">${type}</span></label>`;
                                                                                }).join('')}
                                                                            </div>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </td>
                                                        </tr>
                                                        
                                                        <!-- 7. 신체상태 (신규 추가 및 기존 대체) -->

                                                            <th class="border border-slate-300 bg-slate-100 p-2 text-center font-bold text-slate-700">신체상태</th>
                                                            <td colspan="9" class="border border-slate-300 p-3 bg-white">
                                                                <div class="space-y-3">
                                                                    <!-- 1) 건강상태 -->
                                                                    <div class="flex items-start gap-2">
                                                                        <!-- [수정] 소제목 너비 축소 (w-24 -> w-20), 패딩 축소 (px-1.5 -> px-1) -->
                                                                        <span class="text-xs font-bold text-slate-700 w-20 flex-shrink-0 mt-0.5 bg-slate-100 px-1 py-0.5 rounded text-center border border-slate-200">① 건강상태</span>
                                                                        <!-- [수정] 2x2 그리드 배열, radio -> checkbox 변경 -->
                                                                        <div class="flex-1 grid grid-cols-2 gap-2">
                                                                            ${(() => {
                                                                                const rawHealth = getVal(cm, 'initial.physical.health');
                                                                                // 배열/문자열 호환 처리
                                                                                const savedHealthList = Array.isArray(rawHealth) ? rawHealth : (rawHealth ? [rawHealth] : []);
                                                                                
                                                                                const options = [
                                                                                    '건강하다',
                                                                                    '질환은 있지만 건강한 편이다',
                                                                                    '특별한 질환은 없지만 노환으로 건강하지 못하다',
                                                                                    '질환으로 건강이 나쁘다'
                                                                                ];
                                                                                return options.map(opt => `
                                                                                    <label class="flex items-center gap-1.5 cursor-pointer hover:bg-slate-50 rounded px-1 py-0.5 transition-colors">
                                                                                        <input type="checkbox" name="cm-init-phy-health-option" value="${opt}" class="w-3.5 h-3.5 text-emerald-600 focus:ring-emerald-500 border-slate-300 rounded cursor-pointer" ${savedHealthList.includes(opt) ? 'checked' : ''}>
                                                                                        <span class="text-xs text-slate-600 break-keep">${opt}</span>
                                                                                    </label>
                                                                                `).join('');
                                                                            })()}
                                                                        </div>
                                                                    </div>
                                                                    <!-- 2) 만성질환 (기존 질병 데이터 연동) -->
                                                                    <div class="flex items-start gap-2 border-t border-dashed border-slate-100 pt-2">
                                                                        <!-- [수정] 소제목 너비 축소 (w-24 -> w-20), 패딩 축소 (px-1.5 -> px-1) -->
                                                                        <span class="text-xs font-bold text-slate-700 w-20 flex-shrink-0 mt-0.5 bg-slate-100 px-1 py-0.5 rounded text-center border border-slate-200">② 만성질환</span>
                                                                        <div class="flex-1">
                                                                            <input type="text" id="cm-init-phy-chronic" class="input-field py-0.5 px-2 text-xs w-full border-slate-200" placeholder="내용 입력" value="${getVal(cm, 'initial.physical.chronic') || getVal(cm, 'initial.health.disease')}">
                                                                        </div>
                                                                    </div>
                                                                    <!-- 3) 장애여부 (UI 변경: radio -> checkbox) -->
                                                                    <div class="flex items-start gap-2 border-t border-dashed border-slate-100 pt-2">
                                                                        <!-- [수정] 소제목 너비 축소 (w-24 -> w-20), 패딩 축소 (px-1.5 -> px-1) -->
                                                                        <span class="text-xs font-bold text-slate-700 w-20 flex-shrink-0 mt-0.5 bg-slate-100 px-1 py-0.5 rounded text-center border border-slate-200">③ 장애여부</span>
                                                                        <div class="flex-1 flex flex-wrap items-center gap-4">
                                                                            ${(() => {
                                                                                const oldDisability = getVal(cm, 'initial.physical.disability') || getVal(cm, 'initial.health.disability');
                                                                                const newStatus = getVal(cm, 'initial.physical.disabilityStatus');
                                                                                const newType = getVal(cm, 'initial.physical.disabilityType');
                                                                                
                                                                                let status = newStatus;
                                                                                let typeValue = newType;

                                                                                if (!status && oldDisability) {
                                                                                    if (oldDisability.trim() === '무' || oldDisability.trim() === '없음') {
                                                                                        status = '무';
                                                                                    } else {
                                                                                        status = '유';
                                                                                        typeValue = oldDisability;
                                                                                    }
                                                                                }

                                                                                return `
                                                                                    <div class="flex items-center gap-1 transition-all">
                                                                                        <label class="flex items-center gap-1.5 cursor-pointer hover:bg-slate-50 rounded px-1 py-0.5 transition-colors">
                                                                                            <input type="checkbox" name="cm-init-phy-disability-status" value="유" class="w-3.5 h-3.5 text-emerald-600 focus:ring-emerald-500 border-slate-300 rounded cursor-pointer" ${status === '유' ? 'checked' : ''} onchange="if(this.checked) { document.getElementById('cm-init-phy-disability-type-wrapper').classList.remove('hidden'); document.getElementById('cm-init-phy-disability-type').focus(); } else { document.getElementById('cm-init-phy-disability-type-wrapper').classList.add('hidden'); }">
                                                                                            <span class="text-xs text-slate-600">유</span>
                                                                                        </label>
                                                                                        <div id="cm-init-phy-disability-type-wrapper" class="flex items-center gap-1 ${status === '유' ? '' : 'hidden'}">
                                                                                            <span class="text-[10px] text-slate-500">(장애유형:</span>
                                                                                            <input type="text" id="cm-init-phy-disability-type" class="input-field py-0.5 px-2 text-xs w-32 border-slate-200" placeholder="입력" value="${typeValue || ''}">
                                                                                            <span class="text-[10px] text-slate-500">)</span>
                                                                                        </div>
                                                                                    </div>
                                                                                    <label class="flex items-center gap-1.5 cursor-pointer hover:bg-slate-50 rounded px-1 py-0.5 transition-colors">
                                                                                        <input type="checkbox" name="cm-init-phy-disability-status" value="무" class="w-3.5 h-3.5 text-emerald-600 focus:ring-emerald-500 border-slate-300 rounded cursor-pointer" ${status === '무' ? 'checked' : ''} onchange="if(this.checked) { document.getElementById('cm-init-phy-disability-type-wrapper').classList.add('hidden'); }">
                                                                                        <span class="text-xs text-slate-600">무</span>
                                                                                    </label>
                                                                                `;
                                                                            })()}
                                                                        </div>
                                                                    </div>
                                                                    <!-- 4) 보장구 -->
                                                                    <div class="flex items-start gap-2 border-t border-dashed border-slate-100 pt-2">

                                                        </td>
                                                    </tr>
                                                    <tr>
                                                        <th class="p-2 bg-slate-50 font-bold text-slate-700 border-r border-slate-200 align-top pt-3">
                                                            <div>일상생활<br>및 기타</div>
                                                            <div class="text-[10px] font-normal text-slate-400 mb-1">Life/Etc</div>
                                                            <div class="flex justify-center gap-1 w-full px-1">
                                                                <button type="button" onclick="app.openAssessmentSurveyModal('ADL')" class="flex-1 py-0.5 text-[10px] bg-white border border-slate-300 rounded hover:bg-emerald-50 hover:text-emerald-700 hover:border-emerald-300 font-bold text-slate-500 transition-colors shadow-sm leading-tight">
