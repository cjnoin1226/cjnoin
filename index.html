            flex: 1;

        .modal-tab-btn.active {
            border-bottom-color: #10b981;
            color: #059669;
            font-weight: 800;
            background-color: #fff;
        }
        .modal-tab-content { display: none; }
        .modal-tab-content.active { display: block; animation: fadeIn 0.2s ease-out; }

            font-weight: 700;
        }
        .sub-tab-content { display: none; }
        .sub-tab-content.active { display: block; animation: fadeIn 0.2s ease-out; }

        .tab-content-wrapper {
            height: 100%;
            display: none;
            background-color: #f8fafc;
            position: relative;
            flex-direction: column;
            overflow: hidden; 
        }
        .tab-content-wrapper.active {
            display: flex; 
        }

        /* 윈도우 모드 스타일 */
        .window-pane {
            position: absolute;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid #cbd5e1;
            display: flex;
            flex-direction: column;
            min-width: 300px;
            min-height: 200px;
            will-change: left, top, width, height; 
        }
        
        .window-pane.active {
            z-index: 50 !important;
            border-color: #3b82f6;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05), 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        .window-pane.dragging {
            cursor: grabbing;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
        }

        .window-pane.dragging .window-content {
            pointer-events: none; 
        }

        .window-header {
            padding: 8px 12px;
            background-color: #f1f5f9;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: grab;
            user-select: none;
            flex-shrink: 0;
            border-radius: 8px 8px 0 0;
        }
        .window-header:active {
            cursor: grabbing;
            background-color: #e2e8f0;
        }

        .window-title {
            font-size: 0.85rem;

        }

            display: flex;

        }

        }

        .btn-maximize { background-color: #4ade80; }
        .btn-close { background-color: #f87171; }

        .window-content {
            flex: 1;
            overflow: hidden; 
            background-color: white;
            position: relative;
            border-radius: 0 0 8px 8px;
            display: flex;
            flex-direction: column;
        }

        .resizer { position: absolute; z-index: 100; }
        .resizer-n { top: -3px; left: 6px; right: 6px; height: 6px; cursor: n-resize; }
        .resizer-s { bottom: -3px; left: 6px; right: 6px; height: 6px; cursor: s-resize; }
        .resizer-e { top: 6px; right: -3px; bottom: 6px; width: 6px; cursor: e-resize; }
        .resizer-w { top: 6px; left: -3px; bottom: 6px; width: 6px; cursor: w-resize; }
        .resizer-ne { top: -3px; right: -3px; width: 12px; height: 12px; cursor: ne-resize; z-index: 101; }
        .resizer-nw { top: -3px; left: -3px; width: 12px; height: 12px; cursor: nw-resize; z-index: 101; }
        .resizer-se { bottom: -3px; right: -3px; width: 12px; height: 12px; cursor: se-resize; z-index: 101; }
        .resizer-sw { bottom: -3px; left: -3px; width: 12px; height: 12px; cursor: sw-resize; z-index: 101; }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }

        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .tab-bar-container {

            gap: 2px;
            padding: 2px 8px 0;
            background-color: #f1f5f9;
            border-bottom: 1px solid #e2e8f0;

            flex-shrink: 0;

        .main-tab {
            display: flex;

            gap: 2px;

        .main-tab:hover {

        .main-tab.active {
            background-color: #ffffff;
            color: #059669;
            font-weight: 700;

            box-shadow: 0 -1px 2px rgba(0,0,0,0.02);

        .tab-close-btn {
            padding: 0;

            opacity: 0.5;
            margin-left: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 12px;
            height: 12px;
        }
        .tab-close-btn:hover { background-color: #cbd5e1; color: #ef4444; opacity: 1; }
        
        .nav-link {

        .nav-link.active { color: #ffffff; background-color: #059669; font-weight: 700; }
    </style>

            ECONOMIC_LIST: ['일반(저소득)', '기초수급', '조건부 기초수급', '차상위'],

            PROVIDE_METHOD_LIST: ['전화', '방문', '내방', '기타'],
            DUPLICATE_SERVICE_LIST: ['해당없음', '맞춤돌봄', '노노케어', '보훈재가', '장기요양', '기타'],

        };
        
        const TAB_NAMES = {

            clients: '대상자 관리',
            logs: '서비스 일지',
            meeting: '사례회의',
            performance: '실적 관리',
            statistics: '통계',
            services: '서비스 설정'
        };

        const state = {
            activeTab: 'dashboard',
            openedTabs: ['dashboard'],
            viewMode: 'single',
            focusedPane: 'left',
            paneTabs: { left: 'dashboard', right: 'logs' },
            windows: {
                left: { x: 20, y: 20, w: 600, h: 700, z: 1 },
                right: { x: 640, y: 20, w: 600, h: 700, z: 2 }
            },
            isMobileMenuOpen: false,
            renderedTabs: new Set(),
            clients: [],
            services: [],
            logs: [],
            meetings: [], 
            editingServiceId: null,
            // [신규] 일괄 작업 중 화면 갱신 방지 플래그 (true면 render() 스킵)
            isBatching: false,

            isFullLogLoaded: false,
            ui: {
                regionDropdownOpen: false,
                logRegionDropdownOpen: false,
                statsRegionDropdownOpen: false,
                perfMonthDropdownOpen: false, 
                clientExportDropdownOpen: false, 
                selectedLogIds: new Set(),
                selectedClientIds: new Set(),
                selectedMeetingIds: new Set(), // [신규] 선택된 회의록 ID 관리
                clientModalTab: 'basic',
                caseSubTab: 'initial',
                allowOverlayClose: false,
                cmYear: new Date().getFullYear(), 
                // [수정] 페이지네이션 상태 추가 및 기존 visibleLogLimit 제거 대체
                logPage: 1,
                logsPerPage: 50,
                meetingTargetMonth: new Date().getMonth() + 1,

            },
            pendingClientData: null,

            pendingServiceData: null,
            filters: {
                client: { 
                    status: '이용', level: '', economicStatus: '', duplicateService: '', ictStatus: '', 
                    region: [], gender: '', search: '', searchPhone: '', targetYear: '', targetMonth: '' 
                },
                log: { start: '', end: '', search: '', provider: '', category: '', service: '', region: [] },
                // [수정] 회의록 필터 확장 (구분, 대상자, 작성자 추가)
                meeting: {
                    start: (() => { const d = new Date(); return `${d.getFullYear()}-01-01`; })(),
                    end: (() => { const d = new Date(); return `${d.getFullYear()}-12-31`; })(),
                    search: '',
                    type: '',
                    clientName: '',
                    writer: ''
                },
                stats: {

                    end: (() => { const d = new Date(); const lastDay = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${lastDay}`; })(),

        function calculateAge(birthDate) {
            if (!birthDate) return 0;
            const today = new Date();
            const birth = new Date(birthDate);
            let age = today.getFullYear() - birth.getFullYear();
            const m = today.getMonth() - birth.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) age--;
            return age;
        }

        function getFilteredLogs() {
            const { start, end, search, provider, category, service, region } = state.filters.log;
            
            // [수정] 사용자가 설정한 필터가 하나라도 있는지 확인
            // start, end, search, provider, category, service는 문자열, region은 배열
            const hasActiveFilter = start || end || search || provider || category || service || region.length > 0;
            const currentYearStr = String(new Date().getFullYear());

            const filtered = state.logs.filter(l => {
                const client = state.clients.find(c => c.id === l.clientId);
                const clientRegion = client ? client.region : '미지정';

                // [수정] 아무런 필터도 걸지 않았다면(기본 상태), 현재 연도의 데이터만 보여줌
                if (!hasActiveFilter) {
                    if (!l.date.startsWith(currentYearStr)) return false;
                }

                return (!start || l.date >= start) && 
                       (!end || l.date <= end) && 
                       (!search || l.clientName.includes(search)) && 
                       (!provider || (l.provider && l.provider.includes(provider))) && 
                       (!category || (l.serviceItems && l.serviceItems.some(i => i.category === category))) &&
                       (!service || (l.serviceItems && l.serviceItems.some(i => i.serviceName === service))) &&
                       (region.length === 0 || region.includes(clientRegion));
            });
            return filtered.sort((a, b) => {
                if (a.date !== b.date) return b.date.localeCompare(a.date);
                const providerA = a.provider || '', providerB = b.provider || '';
                if (providerA !== providerB) return providerA.localeCompare(providerB);
                return (a.clientName || '').localeCompare(b.clientName || '');
            });
        }

        // [수정] 회의록 필터링 로직 강화 (구분, 대상자, 작성자 조건 추가)
        function getFilteredMeetings() {
            const { start, end, search, type, clientName, writer } = state.filters.meeting;
            return state.meetings.filter(m => {
                const matchDate = (!start || m.date >= start) && (!end || m.date <= end);
                
                // 기존 통합 검색은 안건(topic)과 참석자(attendees) 검색으로 활용
                const matchSearch = !search || 
                    (m.topic && m.topic.includes(search)) || 
                    (m.attendees && m.attendees.includes(search));
                
                // [추가] 상세 필터 조건
                const matchType = !type || m.type === type;
                const matchClient = !clientName || (m.clientName && m.clientName.includes(clientName));
                const matchWriter = !writer || (m.writer && m.writer.includes(writer));

                return matchDate && matchSearch && matchType && matchClient && matchWriter;
            }).sort((a, b) => b.date.localeCompare(a.date));
        }

        function initDataSync() {
            if (!db) return;
            const handleErr = (e) => { if(e.code === 'permission-denied') console.warn("권한 부족: 규칙을 확인하세요."); };

            // [수정] 모든 리스너에 (!state.isBatching) 조건 추가하여 일괄 작업 중 렌더링 방지

            onSnapshot(query(collection(db, "clients"), orderBy("createdAt", "desc")), (snap) => {
                state.clients = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                if (!state.isBatching) render();
            }, handleErr);
            
            onSnapshot(query(collection(db, "meetings"), orderBy("date", "desc")), (snap) => {
                state.meetings = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                if (!state.isBatching) render();
            }, handleErr);

            onSnapshot(collection(db, "services"), (snap) => {
                let loaded = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                const sortOrder = ['위기관리체계구축', '욕구기반 위기관리', '위기상황관리 및 긴급지원', '기타'];
                const caseManagementOrder = ['사례발굴', '초기상담', '사정 및 계획', '개입', '점검 및 모니터링', '종결 및 사후관리', '월 사례회의', '월사례회의'];
                const counselingOrder = ['정서지원서비스(안전안부확인)', '노인일상생활관련 상담', '노인일상생활관련상담', '복지서비스 종합안내'];

                loaded.sort((a, b) => {
                    const catA = (a.majorCategory || '').replace(/\s+/g, '');
                    const catB = (b.majorCategory || '').replace(/\s+/g, '');
                    const indexA = sortOrder.findIndex(k => k.replace(/\s+/g, '') === catA);
                    const indexB = sortOrder.findIndex(k => k.replace(/\s+/g, '') === catB);
                    if (indexA !== -1 && indexB === -1) return -1;
                    if (indexA === -1 && indexB !== -1) return 1;
                    if (indexA !== -1 && indexB !== -1) { if (indexA !== indexB) return indexA - indexB; } 
                    else {
                        const majorComp = (a.majorCategory || '').localeCompare(b.majorCategory || '');
                        if (majorComp !== 0) return majorComp;
                    }
                    const catComp = (a.category || '').localeCompare(b.category || '');
                    if (catComp !== 0) return catComp;
                    if (a.category === '사례관리' && b.category === '사례관리') {
                        const nameIndexA = caseManagementOrder.indexOf(a.name);
                        const nameIndexB = caseManagementOrder.indexOf(b.name);
                        if (nameIndexA !== -1 && nameIndexB !== -1) return nameIndexA - nameIndexB;
                    }
                    if (a.category === '노인상담 및 정보제공' && b.category === '노인상담 및 정보제공') {
                        const nameIndexA_C = counselingOrder.indexOf(a.name);
                        const nameIndexB_C = counselingOrder.indexOf(b.name);
                        if (nameIndexA_C !== -1 && nameIndexB_C !== -1) return nameIndexA_C - nameIndexB_C;
                        if (nameIndexA_C !== -1) return -1;
                        if (nameIndexB_C !== -1) return 1;
                    }
                    return (a.name || '').localeCompare(b.name || '');
                });
                state.services = loaded;
                if (!state.isBatching) render();
            }, handleErr);
            
            // [수정] 2단계 데이터 로딩 전략 적용 (1단계: 최신 100건 -> 2단계: 전체)
            let initialLogUnsub = null;

            // 1단계: 최신 100건 우선 로딩 (빠른 화면 표시)
            const qInitial = query(collection(db, "logs"), orderBy("date", "desc"), limit(100));
            initialLogUnsub = onSnapshot(qInitial, (snap) => {
                // 이미 전체 데이터가 로드된 상태라면 이 리스너의 데이터는 무시 (덮어쓰기 방지)
                if (state.isFullLogLoaded) return;

                state.logs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                if (!state.isBatching) render();
            }, handleErr);

            // 2단계: 전체 데이터 백그라운드 로딩 (1.5초 지연 후 시작하여 초기 렌더링 방해 최소화)
            setTimeout(() => {
                const qFull = query(collection(db, "logs"), orderBy("date", "desc"));
                onSnapshot(qFull, (snap) => {
                    state.logs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    state.isFullLogLoaded = true; // 전체 로드 완료 플래그 설정

                    // 전체 데이터를 받았으므로 1단계 리스너는 해제하여 리소스 절약
                    if (initialLogUnsub) {
                        initialLogUnsub();
                        initialLogUnsub = null;
                    }

                    if (!state.isBatching) render();
                }, handleErr);
            }, 1500);
        }

        function getTabHTML(tabName) {
            if (tabName === 'dashboard') return renderDashboard();
            if (tabName === 'clients') return renderClientManager();
            if (tabName === 'logs') return renderLogManager();
            if (tabName === 'meeting') return renderMeetingManager(); // [신규] 회의록 화면 연결
            if (tabName === 'performance') return renderPerformance();
            if (tabName === 'statistics') return renderStatistics();
            if (tabName === 'services') return renderServiceManager();
            return '';
        }

        function updateTabContent(tabName) {
            // [포커스 유지 시작]
            const activeEl = document.activeElement;
            const focusedId = activeEl ? activeEl.id : null;
            const cursorStart = activeEl ? activeEl.selectionStart : null;
            const cursorEnd = activeEl ? activeEl.selectionEnd : null;
            // [포커스 유지 끝]

            // [스크롤 유지 시작] - 추가된 로직
            const scrollMap = {
                'clients': 'client-list-container',
                'logs': 'log-list-container',
                'meeting': 'meeting-list-container', // [신규] 회의록 스크롤 유지
                'statistics': 'stats-list-container',
                'performance': 'perf-table-container'
            };
            let lastScrollTop = 0;
            const scrollId = scrollMap[tabName];
            if (scrollId) {
                const el = document.getElementById(scrollId);
                if (el) lastScrollTop = el.scrollTop;
            }
            // [스크롤 유지 끝]

            const containerId = `tab-view-${tabName}`;
            let container = document.getElementById(containerId);
            if (!container) {
                const mainContainer = document.getElementById('main-view-container');
                if (!mainContainer) return; 
                container = document.createElement('div');
                container.id = containerId;
                container.className = 'tab-content-wrapper p-4 md:p-6'; 
                mainContainer.appendChild(container);
            }
            container.innerHTML = getTabHTML(tabName);
            state.renderedTabs.add(tabName);
            if(window.lucide) lucide.createIcons();

            // [스크롤 복구 시작] - 추가된 로직
            if (scrollId && lastScrollTop > 0) {
                const el = document.getElementById(scrollId);
                if (el) el.scrollTop = lastScrollTop;
            }
            // [스크롤 복구 끝]

            // [포커스 복구 시작]
            if (focusedId) {
                const newEl = document.getElementById(focusedId);
                if (newEl) {
                    newEl.focus();
                    if (cursorStart !== null && cursorEnd !== null) {
                        try { newEl.setSelectionRange(cursorStart, cursorEnd); } catch(e) {}
                    }
                }
            }
            // [포커스 복구 끝]
        }

        function renderDashboard() {
            const todayDate = new Date();
            const today = todayDate.toISOString().split('T')[0];
            const currentMonth = todayDate.getMonth() + 1;

            const todayLogs = state.logs.filter(l => l.date === today).length;
            const activeClients = state.clients.filter(c => {
                const isTerminated = c.status === '종결' || (c.endDate && c.endDate < today);
                const isNotStarted = c.serviceStartDate && c.serviceStartDate > today;
                return (c.status === '이용' || c.status === '장기부재') && !isTerminated && !isNotStarted;
            });
            const totalActive = activeClients.length;
            const highFocus = activeClients.filter(c => c.careLevel === '중점').length;
            const general = activeClients.filter(c => c.careLevel === '일반').length;

            // [신규] 이번 달 사례회의 대상자 (정기/재사정 기준) 계산
            const meetingCandidates = state.clients.filter(c => {
                if (c.status === '종결' || !c.serviceStartDate) return false;
                const startMonth = parseInt(c.serviceStartDate.split('-')[1]);
                return startMonth === currentMonth;
            }).length;

            return `
                <div class="space-y-6 animate-fade-in p-1">
                    <div class="flex justify-between items-center">
                        <h2 class="text-xl md:text-2xl font-bold text-slate-800">홈</h2>
                        <div class="text-xs md:text-sm text-emerald-600 flex items-center gap-1"><div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>공유 중</div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 md:gap-6">
                        <div onclick="app.setTab('clients')" class="bg-white p-4 md:p-6 rounded-xl shadow-sm border border-slate-100 flex items-center gap-4 cursor-pointer hover:bg-slate-50 transition-colors">
                            <div class="p-3 bg-blue-100 text-blue-600 rounded-lg"><i data-lucide="users"></i></div>
                            <div>
                                <p class="text-sm text-slate-500">총 대상자 <span class="text-xs text-slate-400">(이용/장기부재)</span></p>
                                <p class="text-2xl font-bold text-slate-800">${totalActive}<span class="text-sm font-normal text-slate-500">명</span></p>
                                <p class="text-xs text-slate-400 mt-1">(중점: <span class="text-pink-600 font-bold">${highFocus}</span> / 일반: <span class="text-blue-600 font-bold">${general}</span>)</p>
                            </div>
                        </div>
                        <div onclick="app.setTab('logs')" class="bg-white p-4 md:p-6 rounded-xl shadow-sm border border-slate-100 flex items-center gap-4 cursor-pointer hover:bg-slate-50 transition-colors">
                            <div class="p-3 bg-emerald-100 text-emerald-600 rounded-lg"><i data-lucide="file-text"></i></div>
                            <div><p class="text-sm text-slate-500">오늘 일지</p><p class="text-2xl font-bold text-slate-800">${todayLogs}<span class="text-sm font-normal text-slate-500">건</span></p></div>
                        </div>
                        <!-- [수정] 제공 서비스 박스 -> 월 사례회의 대상자 박스로 변경 -->
                        <div onclick="app.setTab('meeting')" class="bg-white p-4 md:p-6 rounded-xl shadow-sm border border-slate-100 flex items-center gap-4 cursor-pointer hover:bg-slate-50 transition-colors">
                            <div class="p-3 bg-purple-100 text-purple-600 rounded-lg"><i data-lucide="calendar-clock"></i></div>
                            <div><p class="text-sm text-slate-500">${currentMonth}월 사례회의 대상</p><p class="text-2xl font-bold text-slate-800">${meetingCandidates}<span class="text-sm font-normal text-slate-500">명</span></p></div>
                        </div>
                    </div>
                    <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-4 md:p-6">
                        <h3 class="text-lg font-bold text-slate-800 mb-4">최근 활동</h3>
                        <div class="space-y-3">
                        ${state.logs.length === 0 ? '<p class="text-center text-slate-400 py-4">데이터 없음</p>' : state.logs.slice(0,5).map(log => `
                            <div class="flex flex-col sm:flex-row sm:items-start gap-2 sm:gap-4 pb-3 border-b last:border-0 p-2 hover:bg-slate-50 rounded">
                                <div class="hidden sm:block mt-1 text-slate-500"><i data-lucide="check-circle" size="16"></i></div>
                                <div class="flex-1">
                                    <p class="font-medium text-slate-800 text-sm md:text-base">
                                        <span class="text-emerald-600 font-bold">${log.clientName}</span>님 
                                        <span class="text-xs text-slate-400 mx-1">|</span>
                                        ${log.serviceName}
                                    </p>
                                    <p class="text-xs md:text-sm text-slate-500 mt-1 line-clamp-2">${log.date} | ${log.content}</p>
                                </div>
                            </div>`).join('')}
                        </div>
                    </div>
                </div>`;
        }

        function renderClientManager() {
             const { search, searchPhone, status, level, economicStatus, duplicateService, ictStatus, region, gender, targetYear, targetMonth } = state.filters.client;
            let filterStart = '0000-01-01', filterEnd = '9999-12-31';
            if (targetYear) {
                if (targetMonth) {
                    const m = String(targetMonth).padStart(2, '0');
                    filterStart = `${targetYear}-${m}-01`;
                    const lastDay = new Date(targetYear, targetMonth, 0).getDate();
                    filterEnd = `${targetYear}-${m}-${lastDay}`;
                } else {
                    filterStart = `${targetYear}-01-01`;
                    filterEnd = `${targetYear}-12-31`;
                }
            }
            const filtered = state.clients.filter(c => {
                const matchEconomic = !economicStatus || (c.economicStatus && (
                    c.economicStatus === economicStatus || 
                    (economicStatus === '조건부 기초수급' && c.economicStatus === '조건부 수급자') ||
                    (economicStatus === '기초수급' && (c.economicStatus === '기초수급자' || c.economicStatus === '수급자'))
                ));

                const matchBasic = (!search || c.name.includes(search)) &&
                                   (!searchPhone || (c.phone && c.phone.includes(searchPhone))) && 
                                   (!status || c.status === status) &&
                                   (!level || c.careLevel === level) &&
                                   matchEconomic &&
                                   (!duplicateService || c.duplicateService === duplicateService) &&
                                   (!ictStatus || (c.ictStatus || '부') === ictStatus) &&
                                   (region.length === 0 || region.includes(c.region)) &&
                                   (!gender || c.gender === gender);
                if (!matchBasic) return false;
                const sDate = c.serviceStartDate || '0000-01-01'; 
                const eDate = c.endDate || '9999-12-31'; 
                if (sDate > filterEnd) return false;
                if (status && status !== '종결') { if (eDate < filterStart) return false; }
                return true;
            }).sort((a, b) => {
                if (targetYear) {
                    const eDateA = a.endDate || '9999-12-31';
                    const activeA = eDateA >= filterStart;
                    const eDateB = b.endDate || '9999-12-31';
                    const activeB = eDateB >= filterStart;
                    if (activeA && !activeB) return -1;
                    if (!activeA && activeB) return 1;
                }
                return (a.serviceStartDate || '').localeCompare(b.serviceStartDate || '');
            });

            const currentYearStr = String(new Date().getFullYear());
            let activeStats = { total: 0, using: 0, absent: 0, highFocus: 0, general: 0, male: 0, female: 0 };
            let yearStats = { new: 0, end: 0 };
            const today = new Date().toISOString().split('T')[0];

            state.clients.forEach(c => {
                const isTerminatedToday = c.status === '종결' || (c.endDate && c.endDate < today);
                const isNotStartedYet = c.serviceStartDate && c.serviceStartDate > today;
                if ((c.status === '이용' || c.status === '장기부재') && !isTerminatedToday && !isNotStartedYet) {
                    activeStats.total++;
                    if (c.status === '이용') activeStats.using++;
                    else if (c.status === '장기부재') activeStats.absent++;
                    if (c.careLevel === '중점') activeStats.highFocus++;
                    else if (c.careLevel === '일반') activeStats.general++;
                    if (c.gender === '남성') activeStats.male++;
                    else if (c.gender === '여성') activeStats.female++;
                }
                if (c.serviceStartDate && c.serviceStartDate.startsWith(currentYearStr)) yearStats.new++;
                if (c.endDate && c.endDate.startsWith(currentYearStr)) yearStats.end++;
            });

            const yearOptions = [`<option value="" ${!targetYear ? 'selected' : ''}>전체 기간</option>`];
            for (let y = 2010; y <= 2100; y++) yearOptions.push(`<option value="${y}" ${parseInt(targetYear) === y ? 'selected' : ''}>${y}년</option>`);
            const monthOptions = [`<option value="" ${!targetMonth ? 'selected' : ''}>전체 월</option>`];
            for (let m = 1; m <= 12; m++) monthOptions.push(`<option value="${m}" ${parseInt(targetMonth) === m ? 'selected' : ''}>${m}월</option>`);
            
            const filteredTotal = filtered.length;
            const filteredHighFocus = filtered.filter(c => c.careLevel === '중점').length;
            const filteredGeneral = filtered.filter(c => c.careLevel === '일반').length;
            const isFilterActive = search !== '' || searchPhone !== '' || status !== '이용' || level !== '' || economicStatus !== '' || duplicateService !== '' || ictStatus !== '' || region.length > 0 || gender !== '' || targetYear !== '' || targetMonth !== '';

            return `
                <div class="flex flex-col animate-fade-in">
                    <div class="space-y-6 pb-2 pr-1 transition-all">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 pt-1">
                            <h2 class="text-xl md:text-2xl font-bold text-slate-800">대상자 관리</h2>
                            <div class="flex flex-wrap gap-2 w-full sm:w-auto">
                                <div id="client-batch-actions" class="flex gap-2">
                                    ${state.ui.selectedClientIds.size > 0 ? `
                                        <button onclick="app.openBatchEditClientModal()" class="bg-blue-50 text-blue-600 px-3 py-2 rounded-lg text-xs md:text-sm flex items-center gap-1 flex-1 sm:flex-none justify-center animate-fade-in"><i data-lucide="edit-3" size="14"></i> 일괄수정(${state.ui.selectedClientIds.size})</button>
                                        <button onclick="app.deleteSelectedClients()" class="bg-red-50 text-red-600 px-3 py-2 rounded-lg text-xs md:text-sm flex items-center gap-1 flex-1 sm:flex-none justify-center animate-fade-in"><i data-lucide="trash-2" size="14"></i> 선택삭제(${state.ui.selectedClientIds.size})</button>
                                    ` : ''}
                                </div>
                                
                                <!-- [수정] 저장 버튼 통합 (드롭다운) -->
                                <div class="relative z-30">
                                    <button onclick="app.toggleClientExportDropdown()" class="bg-slate-100 text-slate-600 px-3 py-2 rounded-lg text-xs md:text-sm flex items-center gap-1 hover:bg-slate-200 transition-colors font-medium border border-slate-200">
                                        <i data-lucide="download" size="14"></i> 저장 <i data-lucide="chevron-down" size="12" class="ml-0.5 opacity-60"></i>
                                    </button>
                                    ${state.ui.clientExportDropdownOpen ? `
                                        <div class="fixed inset-0 z-30" onclick="app.toggleClientExportDropdown()"></div>
                                        <div class="absolute top-full right-0 mt-1 w-48 bg-white border border-slate-200 rounded-lg shadow-xl z-40 p-1 animate-fade-in flex flex-col">
                                            <button onclick="app.downloadClientListExcel(); app.toggleClientExportDropdown()" class="text-left px-3 py-2.5 text-sm text-slate-700 hover:bg-slate-50 rounded flex items-center gap-2 transition-colors">
                                                <i data-lucide="file-spreadsheet" size="14" class="text-green-600"></i> 
                                                <span>명부 엑셀 저장</span>
                                            </button>
                                            <button onclick="app.openCasePdfSelector(); app.toggleClientExportDropdown()" class="text-left px-3 py-2.5 text-sm text-slate-700 hover:bg-slate-50 rounded flex items-center gap-2 transition-colors border-t border-slate-50">
                                                <i data-lucide="file-text" size="14" class="text-red-500"></i> 
                                                <span>사례관리 PDF 저장</span>
                                            </button>
                                        </div>
                                    ` : ''}
                                </div>

                            const displayStatus = isLogicallyTerminated ? '종결' : c.status;

                            const eDate = c.endDate || '9999-12-31';

                                if (status === '기초수급' || status === '기초수급자' || status === '수급자') return '수급자';

                            const birthShort = c.birthDate ? c.birthDate.substring(2).replace(/-/g, '.') : '-';

        function renderLogManager() {
            const filteredFull = getFilteredLogs(); 
            const totalLogs = filteredFull.length;
            const totalPages = Math.ceil(totalLogs / state.ui.logsPerPage) || 1;

            // 현재 페이지 유효성 검사
            if (state.ui.logPage > totalPages) state.ui.logPage = totalPages;
            if (state.ui.logPage < 1) state.ui.logPage = 1;

            const startIndex = (state.ui.logPage - 1) * state.ui.logsPerPage;
            const endIndex = startIndex + state.ui.logsPerPage;
            const visibleLogs = filteredFull.slice(startIndex, endIndex);

            const categories = [...new Set(state.services.map(s => s.category))];
            const { category, service, start, end, search, provider, region } = state.filters.log; 
            const filteredServices = category ? state.services.filter(s => s.category === category) : state.services;
            const allSelected = visibleLogs.length > 0 && visibleLogs.every(l => state.ui.selectedLogIds.has(l.id));

            // [신규] 연도 선택 옵션 생성 (2020년 ~ 내년)
            const currentYear = new Date().getFullYear();
            const logYearOptions = [`<option value="">연도선택</option>`];
            for (let y = 2020; y <= currentYear + 1; y++) {
                // start와 end가 해당 연도의 1월 1일 ~ 12월 31일과 일치하면 선택된 것으로 표시
                const isSelected = start === `${y}-01-01` && end === `${y}-12-31`;
                logYearOptions.push(`<option value="${y}" ${isSelected ? 'selected' : ''}>${y}년</option>`);
            }
            logYearOptions.reverse(); // 최신 연도가 위로 오게

            // 페이지네이션 UI 생성
            let paginationHTML = '';
            if (totalPages > 1) {
                paginationHTML = `<div class="flex justify-center items-center gap-1 mt-4 pt-2 select-none">`;
                
                // 이전 버튼
                paginationHTML += `<button onclick="app.setLogPage(${state.ui.logPage - 1})" class="w-8 h-8 flex items-center justify-center rounded hover:bg-slate-100 text-slate-500 disabled:opacity-30 disabled:cursor-not-allowed transition-colors" ${state.ui.logPage === 1 ? 'disabled' : ''}><i data-lucide="chevron-left" size="16"></i></button>`;
                
                // 페이지 번호 표시 범위 계산 (현재 페이지 중심으로 최대 5개)
                let startPage = Math.max(1, state.ui.logPage - 2);
                let endPage = Math.min(totalPages, startPage + 4);
                if (endPage - startPage < 4) startPage = Math.max(1, endPage - 4);

                // 첫 페이지 바로가기
                if (startPage > 1) {
                    paginationHTML += `<button onclick="app.setLogPage(1)" class="w-8 h-8 flex items-center justify-center rounded text-sm font-medium hover:bg-slate-100 text-slate-600 transition-colors">1</button>`;
                    if (startPage > 2) paginationHTML += `<span class="text-slate-300 text-xs px-1">...</span>`;
                }

                // 번호 버튼
                for (let i = startPage; i <= endPage; i++) {
                    const activeClass = i === state.ui.logPage ? 'bg-emerald-600 text-white font-bold shadow-sm' : 'hover:bg-slate-100 text-slate-600';
                    paginationHTML += `<button onclick="app.setLogPage(${i})" class="w-8 h-8 flex items-center justify-center rounded text-sm transition-colors ${activeClass}">${i}</button>`;
                }

                // 마지막 페이지 바로가기
                if (endPage < totalPages) {
                    if (endPage < totalPages - 1) paginationHTML += `<span class="text-slate-300 text-xs px-1">...</span>`;
                    paginationHTML += `<button onclick="app.setLogPage(${totalPages})" class="w-8 h-8 flex items-center justify-center rounded text-sm font-medium hover:bg-slate-100 text-slate-600 transition-colors">${totalPages}</button>`;
                }

                // 다음 버튼
                paginationHTML += `<button onclick="app.setLogPage(${state.ui.logPage + 1})" class="w-8 h-8 flex items-center justify-center rounded hover:bg-slate-100 text-slate-500 disabled:opacity-30 disabled:cursor-not-allowed transition-colors" ${state.ui.logPage === totalPages ? 'disabled' : ''}><i data-lucide="chevron-right" size="16"></i></button>`;
                
                paginationHTML += `</div>`;
            }

            return `
                <div class="flex flex-col animate-fade-in h-full">
                    <div class="space-y-4 pb-2 pr-1 transition-all flex-shrink-0">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 pt-1">
                            <h2 class="text-xl md:text-2xl font-bold text-slate-800">서비스 일지</h2>
                            <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto">
                                <button onclick="app.downloadLogTemplate()" class="bg-slate-100 text-slate-600 px-3 py-2 rounded-lg text-sm font-medium flex items-center gap-1 hover:bg-slate-200 transition-colors"><i data-lucide="file-spreadsheet" size="16"></i> 양식</button>
                                <label class="bg-slate-100 text-slate-600 px-3 py-2 rounded-lg text-sm font-medium flex items-center gap-1 cursor-pointer hover:bg-slate-200 transition-colors">
                                    <i data-lucide="upload" size="16"></i> 업로드
                                    <input type="file" class="hidden" onchange="app.uploadLogExcel(this)" accept=".xlsx, .xls">
                                </label>
                                <button onclick="app.printLogs()" class="bg-slate-100 text-slate-600 px-3 py-2 rounded-lg text-sm font-medium flex items-center gap-1 hover:bg-slate-200 transition-colors"><i data-lucide="printer" size="16"></i> 인쇄</button>
                                <button onclick="app.downloadLogsExcel()" class="bg-slate-100 text-slate-600 px-3 py-2 rounded-lg text-sm font-medium flex items-center gap-1 hover:bg-slate-200 transition-colors"><i data-lucide="download" size="16"></i> 엑셀 저장</button>
                                <button onclick="app.openLogModal()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg flex items-center gap-2 text-sm font-medium hover:bg-emerald-700 transition-colors"><i data-lucide="plus" size="16"></i> 작성</button>
                            </div>
                        </div>

                        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap items-center gap-2">
                            <div class="flex items-center gap-1 text-slate-600 font-bold text-sm mr-2 flex-shrink-0 h-9"><i data-lucide="filter" size="14"></i> 필터</div>
                            
                            <!-- [수정] 모든 필터 요소에 h-9 (36px) 클래스 적용하여 높이 통일 -->
                            <select class="input-field h-9 py-1 px-2 text-sm w-24 font-medium border-slate-200 bg-slate-50 mr-1 focus:ring-0 focus:border-emerald-500" onchange="app.setLogYear(this.value)">
                                ${logYearOptions.join('')}
                            </select>

                            <div class="flex items-center gap-2 w-full sm:w-auto px-2 bg-slate-50 rounded-lg border border-slate-200 h-9">
                                <input type="date" class="bg-transparent border-0 text-sm focus:ring-0 p-0 w-[110px] h-full" value="${start}" onchange="app.setFilter('log','start',this.value, false)" max="9999-12-31">
                                <span class="text-slate-400">~</span>
                                <input type="date" class="bg-transparent border-0 text-sm focus:ring-0 p-0 w-[110px] h-full" value="${end}" onchange="app.setFilter('log','end',this.value, false)" max="9999-12-31">
                                <button onclick="app.render()" class="bg-slate-800 text-white px-3 py-0.5 rounded text-xs font-medium hover:bg-slate-700 transition-colors whitespace-nowrap ml-1 h-6">조회</button>
                            </div>
                            <input id="log-search-name" class="input-field h-9 py-1 w-full sm:w-32 text-sm" placeholder="이름 (Enter)" value="${search}" onkeydown="if(event.key === 'Enter') app.setFilter('log','search',this.value)" oninput="if(this.value === '') app.setFilter('log','search','')">
                            <input id="log-search-provider" class="input-field h-9 py-1 w-full sm:w-32 text-sm" placeholder="제공자 (Enter)" value="${provider || ''}" onkeydown="if(event.key === 'Enter') app.setFilter('log','provider',this.value)" oninput="if(this.value === '') app.setFilter('log','provider','')">

                                <select class="input-field h-9 py-1 w-full sm:w-32 text-sm flex-1" onchange="app.setFilter('log','service',this.value)"><option value="">상세내용(전체)</option>${filteredServices.map(s=>`<option value="${s.name}" ${service===s.name?'selected':''}>${s.name}</option>`).join('')}</select>
                            </div>
                            <button onclick="app.resetFilters('log')" class="ml-auto text-slate-400 hover:text-slate-600 text-xs flex items-center gap-1 flex-shrink-0 h-9 px-2 hover:bg-slate-50 rounded transition-colors" title="초기화"><i data-lucide="refresh-cw" size="14"></i> 초기화</button>
                        </div>

                        <div class="flex items-center justify-between px-1 h-8">
                            <div class="flex items-center gap-3">
                                <div class="text-sm text-slate-500">
                                    총 <span class="font-bold text-slate-800">${totalLogs}</span>건
                                    <span class="text-xs text-slate-400 font-normal ml-1">(${state.ui.logPage} / ${totalPages} 페이지)</span>
                                </div>
                                <label class="flex items-center gap-2 cursor-pointer select-none hover:bg-slate-100 px-2 py-1 rounded transition-colors">
                                    <input type="checkbox" id="log-select-all" class="w-4 h-4 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500" onchange="app.toggleAllLogs(this.checked)" ${allSelected ? 'checked' : ''} ${visibleLogs.length === 0 ? 'disabled' : ''}>
                                    <span class="text-sm font-medium text-slate-600">전체선택 (현재 페이지)</span>
                                </label>
                            </div>
                            <div class="flex items-center gap-2" id="log-batch-actions">
                                ${state.ui.selectedLogIds.size > 0 ? `
                                    <button onclick="app.openBatchEditLogModal()" class="bg-blue-50 text-blue-600 px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1 hover:bg-blue-100 transition-colors animate-fade-in"><i data-lucide="edit-3" size="14"></i> 일괄수정(${state.ui.selectedLogIds.size})</button>
                                    <button onclick="app.deleteSelectedLogs()" class="bg-red-50 text-red-600 px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1 hover:bg-red-100 transition-colors animate-fade-in"><i data-lucide="trash-2" size="14"></i> 선택삭제</button>
                                ` : ''}
                            </div>
                        </div>
                    </div>

                    <div id="log-list-container" class="overflow-y-auto custom-scrollbar space-y-4 pr-1 pb-4 flex-1">
                        ${visibleLogs.length === 0 ? '<div class="text-center py-12 text-slate-400">검색 결과가 없습니다.</div>' : visibleLogs.map(l => {
                            const c = state.clients.find(cl => cl.id === l.clientId);
                            return `
                            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100 flex flex-col md:flex-row items-start gap-6 hover:shadow-md transition-shadow relative">
                                <div class="md:w-1/3 border-b md:border-b-0 md:border-r border-slate-100 pb-4 md:pb-0 md:pr-6 flex-shrink-0 w-full">
                                    <div class="mb-4">
                                        <div class="flex flex-wrap items-center gap-x-2 gap-y-1">
                                            <div class="flex items-center gap-2"><input type="checkbox" class="log-checkbox w-4 h-4 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500 cursor-pointer" data-id="${l.id}" onchange="app.toggleLogSelection('${l.id}')" ${state.ui.selectedLogIds.has(l.id) ? 'checked' : ''}><span class="text-sm text-slate-500 font-medium whitespace-nowrap">${l.date}</span></div>
                                            <span class="text-slate-300">|</span>
                                            <div class="flex items-baseline gap-1"><span class="font-bold text-slate-800 text-base hover:text-blue-600 cursor-pointer" onclick="app.openClientModal('${l.clientId}')">${l.clientName}</span>${c ? `<span class="text-xs text-slate-500">(${calculateAge(c.birthDate)}세/${c.gender})</span>` : ''}</div>
                                            ${c ? `<div class="flex items-center gap-1 text-xs text-slate-500"><span class="text-slate-300">|</span><span>${c.region}</span><span class="text-slate-300">·</span><span class="${c.careLevel==='중점'?'text-pink-600 font-bold':(c.careLevel==='일반'?'text-blue-600 font-bold':'')}">${c.careLevel}</span></div>` : ''}
                                        </div>
                                    </div>
                                    <div class="space-y-2">
                                        ${l.serviceItems ? l.serviceItems.map(i => `
                                            <div class="bg-emerald-50/50 border border-emerald-100 rounded-lg px-2.5 py-2 flex flex-col items-start gap-1 text-xs">
                                                <div class="flex items-center gap-1.5 w-full"><div class="w-1.5 h-1.5 rounded-full bg-emerald-500 flex-shrink-0"></div><span class="font-bold text-emerald-800">${i.category}</span></div>
                                                <div class="pl-3 w-full leading-snug text-slate-700"><span class="font-bold">${i.serviceName}</span>${i.detailNote ? `<span class="text-slate-500 font-normal break-all"> - ${i.detailNote}</span>` : ''}</div>
                                            </div>
                                        `).join('') : ''}
                                    </div>
                                </div>
                                <div class="flex-1 relative min-w-0 flex flex-col justify-start h-full">
                                    <div class="flex justify-between items-center mb-2 pt-1">
                                        <div class="flex flex-wrap items-center gap-3">
                                            <div class="text-sm font-bold text-slate-500 uppercase tracking-wider flex items-center gap-1"><i data-lucide="file-text" size="16"></i> 진행 내용</div>
                                            <div class="w-px h-3 bg-slate-300"></div>
                                            <div class="flex items-center gap-2"><span class="text-sm bg-slate-100 text-slate-900 px-2 py-0.5 rounded whitespace-nowrap border border-slate-200">${l.provideMethod || '방문'}</span><span class="text-sm text-slate-900 bg-slate-50 px-2 py-0.5 rounded border border-slate-200">${l.provider || '미지정'}</span></div>
                                        </div>
                                        <div class="flex gap-1 md:absolute md:top-0 md:right-0">
                                            <button onclick="app.duplicateLog('${l.id}')" class="p-1.5 text-slate-400 hover:text-emerald-600 hover:bg-emerald-50 rounded transition-colors" title="복사"><i data-lucide="copy" size="14"></i></button>
                                            <button onclick="app.openLogModal('${l.id}')" class="p-1.5 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded transition-colors" title="수정"><i data-lucide="edit" size="14"></i></button>
                                            <button onclick="app.deleteData('logs','${l.id}')" class="p-1.5 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded transition-colors" title="삭제"><i data-lucide="trash-2" size="14"></i></button>
                                        </div>
                                    </div>
                                    <div class="flex-1 mt-1"><p class="text-slate-800 text-base leading-relaxed whitespace-pre-wrap cursor-pointer p-2 -ml-2 rounded hover:bg-slate-50 hover:text-blue-800 transition-colors mt-0" title="클릭하여 수정하기" onclick="app.openLogModal('${l.id}')">${l.content}</p></div>
                                </div>
                            </div>`
                        }).join('')}
                    </div>
                    ${paginationHTML}
                </div>`;
        }

        // [신규] 사례회의 관리 렌더링 함수 추가
        function renderMeetingManager() {
            const { start, end, search, type, clientName, writer } = state.filters.meeting;
            
            // [추가] 조회 대상 월 설정 (기본값: 현재 월)
            const today = new Date();
            const currentRealMonth = today.getMonth() + 1;
            const currentYear = today.getFullYear();
            const targetMonth = state.ui.meetingTargetMonth || currentRealMonth;
            const candidateType = state.ui.meetingCandidateType || 'regular';
            
            // 이번 달 도래 대상자 필터링 (선택된 기준에 따름)
            const targetClients = state.clients.filter(c => {
                if (candidateType === 'regular') {
                    // 정기(재사정): 이용 중이며, 서비스 시작 월이 해당 월인 경우 (연도 무관)
                    if (c.status === '종결' || !c.serviceStartDate) return false;
                    const startMonth = parseInt(c.serviceStartDate.split('-')[1]);
                    return startMonth === targetMonth;
                } else if (candidateType === 'new') {
                    // 신규(초기): 금년도 해당 월에 시작한 대상자
                    if (!c.serviceStartDate) return false;
                    const [y, m, d] = c.serviceStartDate.split('-').map(Number);
                    return y === currentYear && m === targetMonth;
                } else if (candidateType === 'end') {
                    // 종결(심사): 금년도 해당 월에 종결한 대상자
                    if (!c.endDate) return false;
                    const [y, m, d] = c.endDate.split('-').map(Number);
                    return y === currentYear && m === targetMonth;
                }
                return false;
            }).sort((a, b) => {
                if (candidateType === 'end') return (b.endDate || '').localeCompare(a.endDate || '');
                return (a.serviceStartDate || '').localeCompare(b.serviceStartDate || '');
            });

            // [수정] 분리된 필터링 함수 사용
            const filtered = getFilteredMeetings();
            const allSelected = filtered.length > 0 && filtered.every(m => state.ui.selectedMeetingIds.has(m.id));

            // 기준별 라벨 매핑
            const typeLabels = { regular: '재사정', new: '초기상담', end: '종결심사' };
            const defaultMeetingTypeMap = { regular: '재사정', new: '초기', end: '종결' };

            return `
                <div class="flex flex-col animate-fade-in h-full">
                    <div class="space-y-4 pb-2 pr-1 transition-all flex-shrink-0">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 pt-1">
                            <h2 class="text-xl md:text-2xl font-bold text-slate-800">사례회의록</h2>
                            <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto">
                                <!-- [삭제됨] 양식 및 불러오기 버튼 제거 -->
                                
                                <!-- [수정] 버튼 텍스트 변경: 선택 인쇄 -> 인쇄 -->
                                <button onclick="app.printSelectedMeetings()" class="bg-white border border-slate-300 text-slate-700 px-4 py-2 rounded-lg flex items-center gap-2 text-sm font-bold hover:bg-slate-50 transition-colors shadow-sm"><i data-lucide="printer" size="16"></i> 인쇄</button>
                                <button onclick="app.openMeetingModal()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg flex items-center gap-2 text-sm font-medium hover:bg-emerald-700 transition-colors"><i data-lucide="plus" size="16"></i> 회의록 작성</button>
                            </div>
                        </div>

                        <!-- 이번 달 도래 대상자 섹션 (슬림 버전) + 월 선택 기능 -->
                        <div class="bg-blue-50/50 border border-blue-100 rounded-xl p-3">
                            <div class="flex items-center gap-2 mb-2">
                                <div class="bg-blue-100 text-blue-600 p-1 rounded"><i data-lucide="calendar-clock" size="14"></i></div>
                                <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">
                                    <select class="bg-transparent text-slate-800 font-bold outline-none cursor-pointer hover:text-blue-700 transition-colors" onchange="app.setMeetingCandidateType(this.value)">
                                        <option value="regular" ${candidateType==='regular'?'selected':''}>월 사례회의 대상자</option>
                                        <option value="new" ${candidateType==='new'?'selected':''}>신규(초기) 대상자</option>
                                        <option value="end" ${candidateType==='end'?'selected':''}>종결(심사) 대상자</option>
                                    </select>
                                    
                                    <!-- [수정] 월 선택 드롭다운 (버튼 분리됨) -->
                                    <div class="flex items-center bg-white border border-blue-200 rounded px-2 py-0.5 shadow-sm ml-1">
                                        <select class="text-blue-600 text-xs font-bold focus:outline-none cursor-pointer bg-transparent" onchange="app.setMeetingTargetMonth(this.value)">
                                            ${Array.from({length: 12}, (_, i) => i + 1).map(m => `<option value="${m}" ${m === targetMonth ? 'selected' : ''}>${m}월</option>`).join('')}
                                        </select>
                                    </div>
                                    
                                    <!-- [수정] 분리된 초기화 버튼 -->
                                    <button onclick="app.resetMeetingTargetMonth()" class="bg-white border border-blue-200 text-blue-500 hover:text-blue-700 hover:bg-blue-50 p-1 rounded shadow-sm transition-colors flex items-center justify-center" title="초기화 (이번 달 & 기본 조회)">
                                        <i data-lucide="rotate-ccw" size="12"></i>
                                    </button>

                                    <span class="text-xs font-normal text-slate-500 ml-1">총 ${targetClients.length}명</span>
                                </h3>
                            </div>
                            ${targetClients.length === 0 ? 
                                `<div class="text-center text-slate-400 text-xs py-1">${targetMonth}월에 해당하는 ${typeLabels[candidateType]} 대상자가 없습니다.</div>` : 
                                `<div class="flex gap-2 overflow-x-auto pb-1 custom-scrollbar snap-x">
                                    ${targetClients.map(c => {
                                        // [신규] 해당 월에 회의 진행 여부 확인 (조회 기준에 따른 타입 체크 적용)
                                        const isCompleted = state.meetings.some(m => {
                                            const mDate = new Date(m.date);
                                            // 대상자 일치 확인 (ID 우선, 없으면 이름)
                                            const isSameClient = (m.clientId && m.clientId === c.id) || (!m.clientId && m.clientName === c.name);
                                            // 날짜(년/월) 일치 확인
                                            const isSameMonth = mDate.getFullYear() === currentYear && (mDate.getMonth() + 1) === targetMonth;
                                            
                                            if (!isSameClient || !isSameMonth) return false;

                                            // 조회 기준에 따른 회의록 구분 체크
                                            if (candidateType === 'new') return m.type === '초기';
                                            if (candidateType === 'end') return m.type === '종결';
                                            
                                            // [수정] 월 사례회의(정기)인 경우 '수시' 또는 '재사정' 회의록만 인정
                                            if (candidateType === 'regular') return m.type === '수시' || m.type === '재사정';
                                            
                                            return true;
                                        });

                                        // [수정] 완료 시 배경색을 더 진한 회색(bg-slate-200)으로 변경
                                        const bgClass = isCompleted ? 'bg-slate-200' : 'bg-white';
                                        const textColorClass = isCompleted ? 'text-slate-500' : 'text-slate-800';
                                        const hoverClass = isCompleted ? '' : 'hover:border-blue-400 hover:shadow-md';
                                        const dateLabel = candidateType === 'end' ? '종결일' : '시작일';
                                        const dateValue = candidateType === 'end' ? c.endDate : c.serviceStartDate;

                                        return `
                                        <div class="flex-shrink-0 ${bgClass} border border-slate-200 rounded-lg p-2.5 min-w-[140px] shadow-sm snap-start ${hoverClass} transition-all cursor-pointer group relative"
                                             onclick="app.openMeetingModal(null, { clientName: '${c.name}', clientBirth: '${c.birthDate}', clientLevel: '${c.careLevel}', type: '${defaultMeetingTypeMap[candidateType]}' })"
                                             title="${isCompleted ? '작성된 회의록이 있습니다.' : '클릭하여 회의록 작성'}">
                                            ${isCompleted ? `<div class="absolute top-1.5 right-1.5 text-slate-500"><i data-lucide="check-circle" size="14"></i></div>` : ''}
                                            <div class="flex justify-between items-center mb-1 pr-4">
                                                <span class="font-bold ${textColorClass} truncate group-hover:${isCompleted ? 'text-slate-600' : 'text-blue-600'} transition-colors text-sm">${c.name}</span>
                                                <span class="text-[10px] px-1.5 py-0.5 rounded ${c.careLevel === '중점' ? 'bg-pink-50 text-pink-600' : 'bg-blue-50 text-blue-600'} font-bold">${c.careLevel}</span>
                                            </div>
                                            <div class="flex items-center gap-1 text-[10px] text-slate-500">
                                                <span>${dateValue}</span>
                                                <span class="text-slate-300">|</span>
                                                <span class="truncate max-w-[60px]">${c.region}</span>
                                            </div>
                                        </div>
                                    `}).join('')}
                                </div>`
                            }
                        </div>

                        <!-- [수정] 필터 UI: 한 줄 배치로 변경 -->
                        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap items-center gap-2">
                            <div class="flex items-center gap-1 text-slate-600 font-bold text-sm mr-2 flex-shrink-0">
                                <i data-lucide="filter" size="14"></i> 필터
                            </div>
                            
                            <!-- [수정] 날짜 필터 자동 갱신 방지(false) 및 조회 버튼 추가 -->
                            <div class="flex items-center gap-2 p-1 bg-slate-50 rounded-lg border border-slate-200">
                                <input type="date" class="bg-transparent border-0 text-sm focus:ring-0 px-1 py-1 w-[110px]" value="${start}" onchange="app.setFilter('meeting','start',this.value, false)" max="9999-12-31">
                                <span class="text-slate-400">~</span>
                                <input type="date" class="bg-transparent border-0 text-sm focus:ring-0 px-1 py-1 w-[110px]" value="${end}" onchange="app.setFilter('meeting','end',this.value, false)" max="9999-12-31">
                                <button onclick="app.render()" class="bg-slate-800 text-white px-3 py-1 rounded-md text-sm font-medium hover:bg-slate-700 transition-colors whitespace-nowrap ml-1">조회</button>
                            </div>

                            <select class="input-field py-1.5 px-2 text-sm w-32 font-medium" onchange="app.setFilter('meeting','type',this.value)">
                                <option value="">구분(전체)</option>
                                <option value="수시" ${type==='수시'?'selected':''}>수시 사례회의</option>
                                <option value="초기" ${type==='초기'?'selected':''}>초기 상담 회의</option>
                                <option value="재사정" ${type==='재사정'?'selected':''}>재사정 회의</option>
                                <option value="종결" ${type==='종결'?'selected':''}>종결 심사 회의</option>
                                <option value="기타" ${type==='기타'?'selected':''}>기타</option>
                            </select>

                            <input class="input-field py-1.5 w-32 text-sm" placeholder="대상자 (Enter)" value="${clientName}" onkeydown="if(event.key === 'Enter') app.setFilter('meeting','clientName',this.value)" oninput="if(this.value === '') app.setFilter('meeting','clientName','')">
                            
                            <input class="input-field py-1.5 w-28 text-sm" placeholder="작성자 (Enter)" value="${writer}" onkeydown="if(event.key === 'Enter') app.setFilter('meeting','writer',this.value)" oninput="if(this.value === '') app.setFilter('meeting','writer','')">

                            <button onclick="app.resetFilters('meeting')" class="ml-auto text-slate-400 hover:text-slate-600 text-xs flex items-center gap-1 flex-shrink-0 px-2 py-1 rounded hover:bg-slate-100 transition-colors"><i data-lucide="refresh-cw" size="14"></i> 초기화</button>
                        </div>

                        <!-- [수정] 일괄 작업 영역에 ID 부여 (부분 업데이트용) -->
                        <div class="flex items-center justify-between px-1 h-8">
                            <div class="flex items-center gap-2" id="meeting-batch-actions">
                                <span class="text-sm text-slate-500">총 <span class="font-bold text-slate-800">${filtered.length}</span>건</span>
                                ${state.ui.selectedMeetingIds.size > 0 ? `
                                    <div class="h-4 w-px bg-slate-300 mx-1"></div>
                                    <button onclick="app.deleteSelectedMeetings()" class="bg-red-50 text-red-600 px-2 py-1 rounded text-xs font-bold flex items-center gap-1 hover:bg-red-100 transition-colors animate-fade-in">
                                        <i data-lucide="trash-2" size="12"></i> 선택삭제 (${state.ui.selectedMeetingIds.size})
                                    </button>
                                ` : ''}
                            </div>
                        </div>
                    </div>

                    <div id="meeting-list-container" class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col flex-1 min-h-[400px]">
                        <!-- 테이블 헤더: 전체선택 체크박스에 ID 부여 -->
                        <div class="flex items-center bg-slate-50 border-b border-slate-200 font-bold text-xs text-slate-500 sticky top-0 z-10">
                            <div class="w-10 text-center py-3 flex-shrink-0 border-r border-slate-100">

                            <div class="w-24 text-center py-3 flex-shrink-0">날짜</div>

                            <!-- [수정] 안건 너비 축소 (w-[400px] -> w-[300px]) -->

                            <div class="w-24 text-center py-3 flex-shrink-0">작성자</div>

                        <!-- 리스트 영역 -->
                        <div class="overflow-y-auto flex-1 custom-scrollbar">

                                '<div class="text-center py-12 text-slate-400">작성된 회의록이 없습니다.</div>' : 
                                '<div class="divide-y divide-slate-100">' + filtered.map(m => {

                                    if (c) {
                                        const birth = c.birthDate ? c.birthDate.substring(2).replace(/-/g, '.') : '-';
                                        clientInfo = `${birth}<br><span class="text-slate-400 text-[10px]">(${c.careLevel})</span>`;
                                    } else if (m.clientBirth) {
                                        clientInfo = `${m.clientBirth}<br><span class="text-slate-400 text-[10px]">(${m.clientLevel || '-'})</span>`;
                                    }

                                    return `
                                <div class="flex items-center hover:bg-slate-50 transition-colors py-2 group">
                                    <div class="w-10 text-center flex-shrink-0 flex items-center justify-center">
                                        <input type="checkbox" class="meeting-checkbox w-3.5 h-3.5 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500 cursor-pointer"
                                            ${state.ui.selectedMeetingIds.has(m.id) ? 'checked' : ''}
                                            onchange="app.toggleMeetingSelection('${m.id}')">
                                    </div>
                                    <div class="w-24 text-center text-xs font-bold text-slate-700 flex-shrink-0 whitespace-nowrap">${m.date}</div>
                                    <div class="w-16 text-center text-sm font-bold text-emerald-600 truncate px-1 flex-shrink-0" title="${m.clientName || '미지정'}">${m.clientName || '-'}</div>
                                    
                                    <!-- [신규] 생년/등급 데이터 표시 -->
                                    <div class="w-24 text-center text-xs text-slate-600 flex-shrink-0 leading-tight">${clientInfo}</div>
                                    
                                    <div class="w-16 text-center flex-shrink-0"><span class="px-1.5 py-0.5 rounded bg-blue-50 text-blue-700 text-xs font-bold border border-blue-100 whitespace-nowrap">${m.type || '수시'}</span></div>
                                    
                                    <!-- [수정] 안건 너비 축소 (w-[400px] -> w-[300px]) -->
                                    <div class="w-[300px] text-sm text-slate-800 font-medium truncate px-3 cursor-pointer hover:text-blue-600 flex-shrink-0 text-left" onclick="app.openMeetingModal('${m.id}')" title="${m.topic || ''}">${m.topic || '제목 없음'}</div>
                                    
                                    <div class="w-24 text-center text-sm text-slate-500 truncate px-1 flex-shrink-0" title="${m.writer}">${m.writer || '-'}</div>
                                    <div class="w-24 flex justify-center gap-1 flex-shrink-0">
                                        <button onclick="app.printMeeting('${m.id}')" class="p-1.5 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded transition-colors" title="인쇄/PDF"><i data-lucide="printer" size="14"></i></button>
                                        <button onclick="app.openMeetingModal('${m.id}')" class="p-1.5 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded transition-colors" title="수정"><i data-lucide="edit" size="14"></i></button>
                                        <button onclick="app.deleteData('meetings', '${m.id}')" class="p-1.5 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded transition-colors" title="삭제"><i data-lucide="trash-2" size="14"></i></button>
