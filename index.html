        }

        window.app = {
            setTab: (t, updateHistory = true) => { 
                if (!state.openedTabs.includes(t)) { state.openedTabs.push(t); }
                if (state.viewMode === 'single') {
                    state.activeTab = t; 
                    if (updateHistory) window.history.pushState({ tab: t }, '', `#${t}`);
                } else {
                    state.paneTabs[state.focusedPane] = t;
                }
                app.closeMobileMenu();
                app.updateTabVisibility(); 
            },
            
            updateTabVisibility: () => {
                const currentTab = state.viewMode === 'single' ? state.activeTab : state.paneTabs[state.focusedPane];
                app.renderTabBar(currentTab);
                
                document.querySelectorAll('.nav-link').forEach(b => { 
                    const tabKey = b.dataset.tab || b.dataset.tabMobile;
                    if(tabKey === currentTab) b.classList.add('active'); 
                    else b.classList.remove('active'); 
                });

                if (state.viewMode === 'single') {
                    const mainContainer = document.getElementById('main-view-container');
                    if(mainContainer) {
                        if (mainContainer.classList.contains('fixed') || (mainContainer.firstChild && mainContainer.firstChild.classList && mainContainer.firstChild.classList.contains('window-pane'))) {
                            mainContainer.className = "flex-1 w-full relative overflow-hidden flex flex-col"; 
                            mainContainer.style.backgroundColor = ""; 
                            mainContainer.innerHTML = ""; 
                            state.renderedTabs.clear();
                        }
                        const loader = document.getElementById('initial-loader');
                        if (loader) loader.remove();

                        state.openedTabs.forEach(t => {
                            let view = document.getElementById(`tab-view-${t}`);
                            if (t === state.activeTab) {
                                if (!view) { updateTabContent(t); view = document.getElementById(`tab-view-${t}`); }
                                if (view) view.classList.add('active');
                            } else {
                                if (view) view.classList.remove('active');
                            }
                        });
                    }
                } else {
                    render(); 
                }
            },

            renderTabBar: (currentTab) => {
                const tabBar = document.getElementById('top-tab-bar');
                if (tabBar) {
                    tabBar.innerHTML = state.openedTabs.map((t, index) => {
                        const isActive = t === currentTab;
                        return `
                        <div class="main-tab ${isActive ? 'active' : ''}" 
                             onclick="app.setTab('${t}')"
                             draggable="true"
                             ondragstart="app.handleTabDragStart(event, ${index})"
                             ondragover="app.handleTabDragOver(event)"
                             ondrop="app.handleTabDrop(event, ${index})"
                             ondragend="app.handleTabDragEnd(event)">
                            <span>${TAB_NAMES[t] || t}</span>
                            <button onclick="app.closeTab('${t}', event)" class="tab-close-btn" title="탭 닫기">
                                <i data-lucide="x" size="8"></i>
                            </button>
                        </div>`;
                    }).join('');
                    if(window.lucide) lucide.createIcons();
                }
            },

            handleTabDragStart: (e, index) => {
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', index);
                e.target.style.opacity = '0.4';
            },
            handleTabDragOver: (e) => {
                e.preventDefault(); 
                e.dataTransfer.dropEffect = 'move';
                return false;
            },
            handleTabDrop: (e, targetIndex) => {
                e.preventDefault();
                e.stopPropagation();
                const sourceIndex = parseInt(e.dataTransfer.getData('text/plain'));
                
                if (sourceIndex !== targetIndex && !isNaN(sourceIndex) && sourceIndex >= 0 && sourceIndex < state.openedTabs.length) {
                    const tabs = [...state.openedTabs];
                    const [movedTab] = tabs.splice(sourceIndex, 1);
                    tabs.splice(targetIndex, 0, movedTab);
                    state.openedTabs = tabs;
                    
                    const currentTab = state.viewMode === 'single' ? state.activeTab : state.paneTabs[state.focusedPane];
                    app.renderTabBar(currentTab);
                }
                return false;
            },
            handleTabDragEnd: (e) => {
                e.target.style.opacity = '';
            },

            closeTab: (t, e) => {
                if (e) e.stopPropagation();
                state.openedTabs = state.openedTabs.filter(tab => tab !== t);
                
                const view = document.getElementById(`tab-view-${t}`);
                if (view) view.remove();
                state.renderedTabs.delete(t);

                if (state.openedTabs.length === 0) state.openedTabs.push('dashboard');

                const fallbackTab = state.openedTabs[state.openedTabs.length - 1]; 
                
                if (state.viewMode === 'single') {
                    if (state.activeTab === t) {
                        state.activeTab = fallbackTab;
                        app.updateTabVisibility(); 
                        window.history.replaceState({ tab: fallbackTab }, '', `#${fallbackTab}`);
                    } else {
                        app.renderTabBar(state.activeTab); 
                    }
                } else {
                    if (state.paneTabs.left === t) state.paneTabs.left = fallbackTab;
                    if (state.paneTabs.right === t) state.paneTabs.right = fallbackTab;
                    render();
                }
            },
            toggleSplitView: () => {
                app.closeMobileMenu(); 
                if (state.viewMode === 'single') {
                    state.viewMode = 'split';
                    state.paneTabs.left = state.activeTab;
                    state.paneTabs.right = (state.activeTab === 'logs' ? 'clients' : 'logs');
                    if (!state.openedTabs.includes(state.paneTabs.right)) state.openedTabs.push(state.paneTabs.right);
                    state.focusedPane = 'left';
                    document.getElementById('split-status-text').textContent = 'ON';
                    document.getElementById('btn-split-toggle').classList.add('bg-slate-700', 'text-emerald-400', 'border-emerald-500');
                    document.body.style.overflow = 'hidden';
                    document.body.style.height = '100vh';

                    const container = document.getElementById('main-content');
                    const w = container ? container.clientWidth : window.innerWidth;
                    const h = container ? container.clientHeight : window.innerHeight;
                    const winW = Math.min(600, w / 2 - 20);
                    const winH = h - 100;
                    
                    state.windows.left = { x: 20, y: 20, w: winW, h: winH, z: 10 };
                    state.windows.right = { x: winW + 40, y: 20, w: winW, h: winH, z: 9 };
                    render();
                } else {
                    state.viewMode = 'single';
                    state.activeTab = state.paneTabs.left;
                    document.getElementById('split-status-text').textContent = 'OFF';
                    document.getElementById('btn-split-toggle').classList.remove('bg-slate-700', 'text-emerald-400', 'border-emerald-500');
                    document.body.style.overflow = '';
                    document.body.style.height = '';

                    const mainContainer = document.getElementById('main-view-container');
                    if(mainContainer) {
                        mainContainer.innerHTML = ''; 
                        state.renderedTabs.clear(); 
                    }
                    app.updateTabVisibility();
                }
            },
            
            startDrag: (e, paneId) => {
                e.preventDefault();
                app.setFocusedPane(paneId);
                const winState = state.windows[paneId];
                const el = document.getElementById(`window-${paneId}`);
                if (!el) return;

                const startX = e.clientX;
                const startY = e.clientY;
                const initialLeft = winState.x;
                const initialTop = winState.y;

                el.classList.add('dragging');
                document.body.style.userSelect = 'none';
                document.body.style.cursor = 'grabbing';

                let currentX = startX;
                let currentY = startY;
                let rafId = null;

                const updatePosition = () => {
                    const dx = currentX - startX;
                    const dy = currentY - startY;
                    winState.x = initialLeft + dx;
                    winState.y = initialTop + dy;
                    el.style.left = `${winState.x}px`;
                    el.style.top = `${winState.y}px`;
                    rafId = null;
                };

                const onMove = (moveEvent) => {
                    currentX = moveEvent.clientX;
                    currentY = moveEvent.clientY;
                    if (!rafId) rafId = requestAnimationFrame(updatePosition);
                };

                const onUp = () => {
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onUp);
                    if (rafId) cancelAnimationFrame(rafId);
                    el.classList.remove('dragging');
                    document.body.style.userSelect = '';
                    document.body.style.cursor = '';
                };
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
            },

            startResize: (e, paneId, direction) => {
                e.preventDefault();
                e.stopPropagation();
                app.setFocusedPane(paneId);
                const winState = state.windows[paneId];
                const el = document.getElementById(`window-${paneId}`);
                if (!el) return;

                const startX = e.clientX;
                const startY = e.clientY;
                const initialX = winState.x;
                const initialY = winState.y;
                const initialW = winState.w;
                const initialH = winState.h;

                el.classList.add('dragging'); 
                document.body.style.userSelect = 'none';
                const cursorMap = { 'n': 'n-resize', 's': 's-resize', 'e': 'e-resize', 'w': 'w-resize', 'ne': 'ne-resize', 'nw': 'nw-resize', 'se': 'se-resize', 'sw': 'sw-resize' };
                document.body.style.cursor = cursorMap[direction];

                let currentX = startX;
                let currentY = startY;
                let rafId = null;

                const updateSize = () => {
                    const dx = currentX - startX;
                    const dy = currentY - startY;
                    let newW = initialW, newH = initialH, newX = initialX, newY = initialY;

                    if (direction.includes('e')) newW = Math.max(300, initialW + dx);
                    if (direction.includes('w')) { const proposedW = initialW - dx; newW = Math.max(300, proposedW); newX = initialX + (initialW - newW); }
                    if (direction.includes('s')) newH = Math.max(200, initialH + dy);
                    if (direction.includes('n')) { const proposedH = initialH - dy; newH = Math.max(200, proposedH); newY = initialY + (initialH - newH); }

                    winState.x = newX; winState.y = newY; winState.w = newW; winState.h = newH;
                    el.style.width = `${newW}px`; el.style.height = `${newH}px`; el.style.left = `${newX}px`; el.style.top = `${newY}px`;
                    rafId = null;
                };

                const onMove = (moveEvent) => {
                    currentX = moveEvent.clientX;
                    currentY = moveEvent.clientY;
                    if (!rafId) rafId = requestAnimationFrame(updateSize);
                };

                const onUp = () => {
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onUp);
                    if (rafId) cancelAnimationFrame(rafId);
                    el.classList.remove('dragging');
                    document.body.style.userSelect = '';
                    document.body.style.cursor = '';
                };
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
            },

            toggleMobileMenu: () => { state.isMobileMenuOpen = !state.isMobileMenuOpen; app.renderMobileMenuState(); },
            closeMobileMenu: () => { state.isMobileMenuOpen = false; app.renderMobileMenuState(); },
            renderMobileMenuState: () => {
                const menu = document.getElementById('mobile-menu');
                if (state.isMobileMenuOpen) menu.classList.remove('-translate-y-[150%]'); else menu.classList.add('-translate-y-[150%]');
            },

            setFocusedPane: (pane) => {
                state.focusedPane = pane;
                state.windows.left.z = pane === 'left' ? 10 : 1;
                state.windows.right.z = pane === 'right' ? 10 : 1;
                const leftEl = document.getElementById('window-left');
                const rightEl = document.getElementById('window-right');
                if (leftEl) { leftEl.style.zIndex = state.windows.left.z; if (pane === 'left') leftEl.classList.add('active'); else leftEl.classList.remove('active'); }
                if (rightEl) { rightEl.style.zIndex = state.windows.right.z; if (pane === 'right') rightEl.classList.add('active'); else rightEl.classList.remove('active'); }
                app.renderTabBar(state.paneTabs[pane]);
            },
            setFilter: (s, k, v, doRender = true) => { 
                state.filters[s][k] = v; 
                if(doRender) { if (state.viewMode === 'single') updateTabContent(state.activeTab); else render(); }
            },
            render: () => render(), 
            toggleRegionDropdown: () => { 
                state.ui.regionDropdownOpen = !state.ui.regionDropdownOpen; 
                if(state.viewMode==='single') updateTabContent('clients'); 
                else render(); 
                
                // [추가] 드롭다운이 짤리지 않도록 버튼 위치를 계산하여 fixed 위치 설정
                if (state.ui.regionDropdownOpen) {
                    setTimeout(() => {
                        const btn = document.getElementById('btn-region-filter');
                        const menu = document.getElementById('dropdown-region-menu');
                        if (btn && menu) {
                            const rect = btn.getBoundingClientRect();
                            menu.style.top = (rect.bottom + 4) + 'px';
                            menu.style.left = rect.left + 'px';
                        }
                    }, 0);
                }
            },
            toggleRegionFilter: (val) => { const r = state.filters.client.region; const idx = r.indexOf(val); if (idx > -1) r.splice(idx, 1); else r.push(val); if(state.viewMode==='single') updateTabContent('clients'); else render(); },
            toggleLogRegionDropdown: () => { state.ui.logRegionDropdownOpen = !state.ui.logRegionDropdownOpen; if(state.viewMode==='single') updateTabContent('logs'); else render(); },
            toggleLogRegionFilter: (val) => { const r = state.filters.log.region; const idx = r.indexOf(val); if (idx > -1) r.splice(idx, 1); else r.push(val); if(state.viewMode==='single') updateTabContent('logs'); else render(); },
            toggleStatsRegionDropdown: () => { state.ui.statsRegionDropdownOpen = !state.ui.statsRegionDropdownOpen; if(state.viewMode==='single') updateTabContent('statistics'); else render(); },
            toggleStatsRegionFilter: (val) => { const r = state.filters.stats.region; const idx = r.indexOf(val); if (idx > -1) r.splice(idx, 1); else r.push(val); if(state.viewMode==='single') updateTabContent('statistics'); else render(); },
            
            // [신규] 실적 월 선택 드롭다운 관련 핸들러
            togglePerfMonthDropdown: () => { 
                state.ui.perfMonthDropdownOpen = !state.ui.perfMonthDropdownOpen; 
                if(state.viewMode==='single') updateTabContent('performance'); else render(); 
            },
            togglePerfMonth: (month) => {
                const months = state.filters.performance.months;
                const idx = months.indexOf(month);
                if (idx > -1) months.splice(idx, 1);
                else months.push(month);
                // 자동 정렬 및 렌더링
                months.sort((a,b) => a-b);
                if(state.viewMode==='single') updateTabContent('performance'); else render();
            },
            toggleAllPerfMonths: () => {
                const currentLen = state.filters.performance.months.length;
                if (currentLen === 12) {
                    state.filters.performance.months = []; // 전체 해제
                } else {
                    state.filters.performance.months = Array.from({length: 12}, (_, i) => i + 1); // 전체 선택
                }
                if(state.viewMode==='single') updateTabContent('performance'); else render();
            },

            resetFilters: (section) => {
                if (section === 'client') {
                    state.filters.client = { status: '이용', level: '', economicStatus: '', duplicateService: '', ictStatus: '', region: [], gender: '', search: '', searchPhone: '', targetYear: '', targetMonth: '' };
                    state.ui.regionDropdownOpen = false;
                    if(state.viewMode==='single') updateTabContent('clients');
                } else if (section === 'performance') {
                    // [수정] performance 초기화 시 months 기본값(전체) 설정
                    state.filters.performance = { year: new Date().getFullYear(), months: Array.from({length: 12}, (_, i) => i + 1), viewMode: 'monthRows' };
                    state.ui.perfMonthDropdownOpen = false;
                    if(state.viewMode==='single') updateTabContent('performance');
                } else if (section === 'log') {
                    state.filters.log = { start: '', end: '', search: '', provider: '', category: '', service: '', region: [] };
                    state.ui.logRegionDropdownOpen = false;
                    if(state.viewMode==='single') updateTabContent('logs');
                } else if (section === 'stats') {
                    const d = new Date(); const s = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-01`; const l = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); const e = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${l}`;
                    state.filters.stats = { start: s, end: e, type: 'detail', region: [], name: '' };
                    state.ui.statsRegionDropdownOpen = false;
                    if(state.viewMode==='single') updateTabContent('statistics');
                }
                if (state.viewMode !== 'single') render();
            },

            toggleLogSelection: (id) => { if (state.ui.selectedLogIds.has(id)) state.ui.selectedLogIds.delete(id); else state.ui.selectedLogIds.add(id); app.updateLogBatchActionsUI(); },
            updateLogBatchActionsUI: () => {

                    container.innerHTML = `<button onclick="app.openBatchEditLogModal()" class="bg-blue-50 text-blue-600 px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1 hover:bg-blue-100 transition-colors animate-fade-in"><i data-lucide="edit-3" size="14"></i> 일괄수정(${count})</button><button onclick="app.deleteSelectedLogs()" class="bg-red-50 text-red-600 px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1 hover:bg-red-100 transition-colors animate-fade-in"><i data-lucide="trash-2" size="14"></i> 선택삭제</button>`;
                    if(window.lucide) lucide.createIcons();
                } else { container.innerHTML = ''; }
                if (selectAllCheckbox) { const filtered = getFilteredLogs(); const allSelected = filtered.length > 0 && filtered.every(l => state.ui.selectedLogIds.has(l.id)); selectAllCheckbox.checked = allSelected; }
            },

                const checkboxes = document.querySelectorAll('.log-checkbox'); checkboxes.forEach(cb => { cb.checked = checked; });

            },

                if(window.lucide) lucide.createIcons();

                // 모달 내용을 리렌더링하여 데이터 갱신
                const clientId = document.getElementById('client-form').dataset.id;
                app.openClientModal(clientId);
            },
            openClientModal: (id) => {
                const c = id ? state.clients.find(x => x.id === id) : {};
                const modalId = id || '';
                // [수정] 장기부재 기간 로딩 로직 개선
                let absStart = c.absStart || '', absEnd = c.absEnd || '';
                if (!absStart && c.absencePeriod && c.absencePeriod.includes('~')) { 
                    const parts = c.absencePeriod.split('~'); 
                    if(parts.length === 2) { absStart = parts[0].trim(); absEnd = parts[1].trim(); } 
                }
                const initialAge = c.birthDate ? `만 ${calculateAge(c.birthDate)}세` : '';
                const cm = c.caseManagement || {};
                
                // [신규] 데이터 가져오기 헬퍼 함수 (연도별 데이터 + 구버전 데이터 호환)
                const targetYear = state.ui.cmYear;
                const getVal = (obj, path) => {
                    // path: "initial.date", "reAssessment.date" 등
                    const parts = path.split('.');
                    const section = parts[0];
                    const fieldPath = parts.slice(1).join('.');
                    
                    // 1. 초기면접(initial), 사정(assessment)은 연도 구분 없이 기존 위치 사용 (1회성 성격)
                    if (section === 'initial' || section === 'assessment') {
                        return path.split('.').reduce((o, i) => (o ? o[i] : undefined), obj) || '';
                    }

                    // 2. 재사정, 만족도, 평가서는 연도별 데이터 우선 확인
                    // 구조: cm.history[2024].reAssessment...
                    let val = undefined;
                    if (obj.history && obj.history[targetYear] && obj.history[targetYear][section]) {
                        val = fieldPath.split('.').reduce((o, i) => (o ? o[i] : undefined), obj.history[targetYear][section]);
                    }

                    // 3. 연도별 데이터가 없으면? -> 기존(구버전) 데이터 확인
                    // 단, 기존 데이터의 날짜가 현재 선택된 연도와 같을 때만 매핑하여 보여줌 (자동 마이그레이션 효과)
                    if ((val === undefined || val === null || val === '') && obj[section]) {
                        const oldDate = obj[section].date;
                        if (oldDate && oldDate.startsWith(String(targetYear))) {
                            val = fieldPath.split('.').reduce((o, i) => (o ? o[i] : undefined), obj[section]);
                        }
                    }

                    return (val === undefined || val === null) ? '' : val;
                };
                
                // 탭 상태 유지 로직 (처음 열 때만 초기화)
                if (!document.getElementById('modal-container').classList.contains('hidden') && document.getElementById('client-form')?.dataset.id === id) {
                    // 이미 열려있고 같은 ID면 탭 유지
                } else {
                    state.ui.clientModalTab = 'basic'; 
                    state.ui.caseSubTab = 'initial';
                    // 연도 초기화 (데이터가 있는 가장 최근 연도 또는 올해)
                    state.ui.cmYear = new Date().getFullYear();
                }

                // [유지] 서비스 내역 탭 - 연도 선택 및 데이터 로드 기능 준비
                const currentYear = new Date().getFullYear();
                let yearOptionsHTML = '';
                for (let y = 2020; y <= currentYear + 1; y++) {
                    yearOptionsHTML = `<option value="${y}" ${y === currentYear ? 'selected' : ''}>${y}년</option>` + yearOptionsHTML;
                }

                // [신규] 사례관리 관리 연도 옵션 생성
                let cmYearOptionsHTML = '';
                for (let y = 2020; y <= currentYear + 1; y++) {
                    cmYearOptionsHTML = `<option value="${y}" ${y === state.ui.cmYear ? 'selected' : ''}>${y}년</option>` + cmYearOptionsHTML;
                }
                
                // [수정] 헤더 생성 함수 (연도 선택만 남김)
                const getCmHeader = () => `
                    <div class="flex items-center justify-end mb-3 pb-2 border-b border-slate-100">
                        <div class="flex items-center">
                            <span class="text-xs font-bold text-slate-500 mr-2"><i data-lucide="calendar-clock" class="inline w-3 h-3 mb-0.5"></i> 관리 연도</span>
                            <select class="input-field w-24 py-1 text-sm bg-white border-slate-300 font-bold text-emerald-600" onchange="app.setCmYear(this.value)">
                                ${cmYearOptionsHTML}
                            </select>
                        </div>
                    </div>
                `;

                // [신규] 섹션별 초기화 버튼 생성 헬퍼
                const getSectionResetBtn = (targetId) => `
                    <button type="button" onclick="app.resetInputs('${targetId}')" class="text-xs bg-slate-100 text-slate-500 px-2 py-1 rounded hover:bg-red-50 hover:text-red-600 transition-colors flex items-center gap-1 ml-2" title="이 항목의 선택값 초기화">
                        <i data-lucide="rotate-ccw" size="12"></i> 초기화
                    </button>
                `;

                // [수정] 해당 대상자가 금년도(currentYear)에 이용한 서비스 카테고리 자동 추출
                const providedLogs = state.logs.filter(l => l.clientId === c.id && l.date.startsWith(String(currentYear)));
                const providedCategoriesSet = new Set();
                providedLogs.forEach(l => {
                    if (l.serviceItems) {
                        l.serviceItems.forEach(item => {
                            if (item.category) providedCategoriesSet.add(item.category);
                        });
                    }
                });
                const providedCategories = [...providedCategoriesSet].sort();

                // [신규] 동적 행 생성 로직 (getVal 사용)
                const savedGoalsLen = (getVal(cm, 'satisfaction.serviceGoals') || []).length;
                let rowCount = Math.max(providedCategories.length, savedGoalsLen, 2); 

                let serviceGoalRowsHTML = '';
                for (let i = 0; i < rowCount; i++) {
                    const autoGoal = providedCategories[i] || '';
                    const savedGoal = getVal(cm, `satisfaction.serviceGoals.${i}.goal`);
                    const savedAction = getVal(cm, `satisfaction.serviceGoals.${i}.action`);
                    const savedUserSat = getVal(cm, `satisfaction.serviceGoals.${i}.userSat`);
                    const savedWorkerEval = getVal(cm, `satisfaction.serviceGoals.${i}.workerEval`);
                    const displayGoal = savedGoal !== '' ? savedGoal : autoGoal;

                    let autoAction = '';
                    if (displayGoal) {
                        const actionMap = new Map();
                        providedLogs.forEach(log => {
                            if (log.serviceItems) {
                                log.serviceItems.forEach(item => {
                                    if (item.category === displayGoal) {
                                        if (!actionMap.has(item.serviceName)) actionMap.set(item.serviceName, new Set());
                                        if (item.detailNote && item.detailNote.trim() !== '') actionMap.get(item.serviceName).add(item.detailNote.trim());
                                    }
                                });
                            }
                        });
                        const actions = [];
                        actionMap.forEach((notesSet, serviceName) => {
                            let itemText = serviceName;
                            if (notesSet.size > 0) {
                                const notes = [...notesSet].map(note => ` • ${note}`).join('\n');
                                itemText += `\n${notes}`;
                            }
                            actions.push(itemText);
                        });
                        autoAction = actions.join('\n\n');
                    }
                    const displayAction = savedAction !== '' ? savedAction : autoAction;

                    const renderSatisfactionOptions = (rowIndex, selectedValue) => {
                        const group1 = ["매우 만족", "만족", "보통"];
                        const group2 = ["불만족", "매우 불만족"];
                        const renderItem = (opt) => `<label class="flex items-center gap-1.5 cursor-pointer hover:bg-slate-50 rounded px-1 py-0.5 transition-colors"><input type="radio" name="service-sat-${rowIndex}" value="${opt}" class="w-3.5 h-3.5 text-emerald-600 focus:ring-emerald-500 border-slate-300 cursor-pointer" ${selectedValue === opt ? 'checked' : ''}><span class="text-xs text-slate-700 font-medium whitespace-nowrap">${opt}</span></label>`;
                        return `<div class="flex flex-col gap-2 p-3"><div class="flex flex-wrap items-center gap-2">${group1.map(renderItem).join('')}</div><div class="flex flex-wrap items-center gap-2 pt-1 border-t border-dashed border-slate-100">${group2.map(renderItem).join('')}</div></div>`;
                    };

                    serviceGoalRowsHTML += `<tr><td class="p-0 border-r border-slate-200"><textarea id="sat-goal-${i}" class="input-field w-full min-h-[60px] text-xs resize-none border-0 focus:ring-0 focus:bg-blue-50/50 rounded-none p-2 font-bold text-slate-700 overflow-hidden" placeholder="자동 입력됨" oninput="this.style.height = 'auto'; this.style.height = (this.scrollHeight) + 'px'">${displayGoal}</textarea></td><td class="p-0 border-r border-slate-200"><textarea id="sat-action-${i}" class="input-field w-full min-h-[60px] text-xs resize-none border-0 focus:ring-0 focus:bg-blue-50/50 rounded-none p-2 whitespace-pre overflow-hidden" placeholder="자동 입력됨" oninput="this.style.height = 'auto'; this.style.height = (this.scrollHeight) + 'px'">${displayAction}</textarea></td><td class="p-0 border-r border-slate-200 align-top bg-white">${renderSatisfactionOptions(i, savedUserSat)}</td><td class="p-0"><textarea id="sat-worker-${i}" class="input-field w-full min-h-[60px] text-xs resize-none border-0 focus:ring-0 focus:bg-blue-50/50 rounded-none p-2 overflow-hidden" placeholder="평가 내용" oninput="this.style.height = 'auto'; this.style.height = (this.scrollHeight) + 'px'">${savedWorkerEval}</textarea></td></tr>`;
                }

                // [유지] 초기 데이터(현재 연도) 생성
                let historyRows = '';
                if (c.id) {
                    const clientLogs = state.logs.filter(l => l.clientId === c.id && l.date.startsWith(String(currentYear))).sort((a,b) => b.date.localeCompare(a.date));
                    historyRows = app.generateHistoryRows(clientLogs);
                } else {
                    historyRows = `<tr><td colspan="6" class="px-4 py-8 text-center text-slate-400">대상자 등록 후 확인할 수 있습니다.</td></tr>`;
                }

                const isChecked = (q, val) => getVal(cm, `satisfaction.${q}`) === val ? 'checked' : '';

                // [신규] 사례관리 내역 데이터 생성 (모든 연도 통합 + 각 탭의 작성일 기준)
                const caseHistory = [];
                // 기존 루트 데이터 체크
                if (cm.initial?.date) caseHistory.push({ type: '초기면접지', date: cm.initial.date, writer: cm.initial.interviewer, summary: '초기 상태 및 욕구 파악' });
                if (cm.assessment?.date) caseHistory.push({ type: '사정기록지', date: cm.assessment.date, writer: cm.assessment.writer, summary: '위기도 평가 및 개입 계획' });
                
                // 연도별 히스토리 데이터 체크
                if (cm.history) {
                    Object.keys(cm.history).forEach(year => {
                        const h = cm.history[year];
                        if (h.reAssessment?.date) caseHistory.push({ type: '재사정', date: h.reAssessment.date, writer: '-', summary: `[${year}] 향후계획: ${h.reAssessment.planType || '-'}` });
                        if (h.satisfaction?.date) caseHistory.push({ type: '만족도조사', date: h.satisfaction.date, writer: h.satisfaction.surveyor, summary: `[${year}] 모니터링: ${h.satisfaction.type || '-'}` });
                        if (h.evaluation?.date) caseHistory.push({ type: '사례평가서', date: h.evaluation.date, writer: h.evaluation.writer, summary: `[${year}] 방향: ${h.evaluation.direction || '-'}` });
                    });
                }
                
                // 구버전(루트) 데이터가 히스토리에 없는 경우 체크 (중복 방지 로직 필요하나 단순화를 위해 날짜 비교는 생략하고 추가하되, 정렬로 해결)
                // (여기서는 복잡성을 피하기 위해 루트에 있는 reAssessment 등은 getVal로 현재 연도에 매핑해서 보여주기만 하고, 리스트에는 명시적으로 있는 것만 표시)
                // 단, 루트에 있는데 history에 없는 경우 리스트에 안 뜰 수 있음. -> 루트 데이터도 추가.
                if (cm.reAssessment?.date && !caseHistory.some(h => h.date === cm.reAssessment.date && h.type === '재사정')) 
                    caseHistory.push({ type: '재사정', date: cm.reAssessment.date, writer: '-', summary: `향후계획: ${cm.reAssessment.planType || '-'}` });
                if (cm.satisfaction?.date && !caseHistory.some(h => h.date === cm.satisfaction.date && h.type === '만족도조사')) 
                    caseHistory.push({ type: '만족도조사', date: cm.satisfaction.date, writer: cm.satisfaction.surveyor, summary: `모니터링: ${cm.satisfaction.type || '-'}` });
                if (cm.evaluation?.date && !caseHistory.some(h => h.date === cm.evaluation.date && h.type === '사례평가서')) 
                    caseHistory.push({ type: '사례평가서', date: cm.evaluation.date, writer: cm.evaluation.writer, summary: `방향: ${cm.evaluation.direction || '-'}` });

                // 주요 일정 추가
                if (c.serviceStartDate) caseHistory.push({ type: '서비스 시작', date: c.serviceStartDate, writer: '-', summary: '서비스 이용 개시' });
                if (absStart) caseHistory.push({ type: '장기부재', date: absStart, writer: '-', summary: '장기부재 시작' });
                if (absEnd) caseHistory.push({ type: '장기부재', date: absEnd, writer: '-', summary: '장기부재 종료' });
                if (c.endDate) caseHistory.push({ type: '서비스 종결', date: c.endDate, writer: '-', summary: `상태: ${c.status || '종결'}` });

                caseHistory.sort((a, b) => a.date.localeCompare(b.date));

                const caseHistoryRows = caseHistory.length > 0 ? caseHistory.map((h, idx) => `
                    <tr class="hover:bg-slate-50 transition-colors">
                        <td class="p-3 text-center text-slate-400 text-xs">${idx + 1}</td>
                        <td class="p-3 text-center font-bold text-slate-700">${h.date}</td>
                        <td class="p-3 text-center"><span class="px-2 py-1 rounded bg-white text-slate-700 text-xs font-bold border border-slate-200 shadow-sm whitespace-nowrap">${h.type}</span></td>
                        <td class="p-3 text-slate-600 text-sm">${h.summary}</td>
                        <td class="p-3 text-center text-slate-600 text-sm">${h.writer || '-'}</td>
                    </tr>
                `).join('') : `<tr><td colspan="5" class="p-8 text-center text-slate-400">작성된 사례관리 내역이 없습니다.<br><span class="text-xs">각 탭에서 작성일자를 입력하면 이곳에 표시됩니다.</span></td></tr>`;

                const html = `
                    <div class="bg-white w-full max-w-4xl p-0 rounded-xl shadow-xl max-h-[90vh] overflow-hidden flex flex-col mx-2">
                        <div class="p-4 sm:p-6 border-b border-slate-100 flex justify-between items-center bg-white z-10 shrink-0">
                            <h3 class="font-bold text-lg">${c.id ? '수정' : '등록'}</h3>
                            <div class="flex items-center gap-2">
                                <button type="button" onclick="app.closeModal()" class="px-3 py-1.5 text-slate-600 border border-slate-300 rounded-lg hover:bg-slate-50 transition-colors text-sm font-medium">취소</button>
                                <button type="button" onclick="document.getElementById('client-form').dispatchEvent(new Event('submit', {cancelable: true, bubbles: true}))" class="bg-emerald-600 text-white px-4 py-1.5 rounded-lg hover:bg-emerald-700 text-sm font-bold shadow-sm transition-colors">저장</button>
                                <div class="w-px h-4 bg-slate-300 mx-1"></div>
                                <button onclick="app.closeModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" size="24"></i></button>
                            </div>
                        </div>
                        <div class="flex border-b border-slate-100 bg-slate-50 sticky top-0 z-10 shrink-0">
                            <button type="button" class="modal-tab-btn active" data-tab="basic" onclick="app.setClientModalTab('basic')">기본 정보</button>
                            <button type="button" class="modal-tab-btn" data-tab="case" onclick="app.setClientModalTab('case')">사례관리</button>
                            <button type="button" class="modal-tab-btn" data-tab="history" onclick="app.setClientModalTab('history')">서비스 내역</button>
                        </div>
                        <div class="p-4 sm:p-6 overflow-y-auto flex-1 bg-white">
                            <form onsubmit="app.saveClient(event, '${c.id || ''}')" id="client-form" data-id="${c.id||''}" class="space-y-4">
                                <div id="tab-basic" class="modal-tab-content active space-y-4">
                                    <div class="grid grid-cols-1 sm:grid-cols-12 gap-3"><div class="sm:col-span-6 md:col-span-3"><label class="text-sm block mb-1">이름</label><input name="name" class="input-field" value="${c.name||''}" required></div><div class="sm:col-span-6 md:col-span-2"><label class="text-sm block mb-1">성별</label><select name="gender" class="input-field" id="gender-select"><option value="남성">남성</option><option value="여성" ${c.gender==='여성'?'selected':''}>여성</option></select></div><div class="sm:col-span-6 md:col-span-3"><label class="text-sm block mb-1">주민등록번호</label><input name="residentNum" class="input-field" placeholder="YYMMDD-1..." value="${c.residentNum||''}" maxlength="14" oninput="app.calcBirthFromRR(this)"></div><div class="sm:col-span-6 md:col-span-4"><label class="text-sm block mb-1">생년월일</label><div class="flex items-center gap-2"><input type="date" name="birthDate" id="birth-date-input" class="input-field flex-1" value="${c.birthDate||''}" max="9999-12-31" oninput="app.updateAgeDisplay(this)"><input id="age-display" class="input-field !w-[25%] min-w-[60px] text-center bg-slate-100 text-slate-600 focus:outline-none cursor-default font-bold" readonly value="${initialAge}" placeholder="나이" tabindex="-1"></div></div></div><div class="grid grid-cols-1 md:grid-cols-3 gap-3"><div><label class="text-sm block mb-1">연락처 1</label><input name="phone" class="input-field" placeholder="본인 연락처" value="${c.phone||''}"></div><div><label class="text-sm block mb-1">연락처 2</label><input name="phone2" class="input-field" placeholder="비상/추가 연락처" value="${c.phone2||''}"></div><div><label class="text-sm block mb-1">보호자 연락처</label><div class="flex gap-2"><input name="guardianRelation" class="input-field w-20" placeholder="관계" value="${c.guardianRelation||''}"><input name="guardianPhone" class="input-field flex-1" placeholder="번호" value="${c.guardianPhone||''}"></div></div></div><div class="grid grid-cols-1 sm:grid-cols-4 gap-3"><div class="sm:col-span-1"><label class="text-sm block mb-1">행정동</label><select name="region" class="input-field">${CONSTANTS.DONG_LIST.map(d=>`<option value="${d}" ${c.region===d?'selected':''}>${d}</option>`).join('')}</select></div><div class="sm:col-span-3"><label class="text-sm block mb-1">주소</label><input name="address" class="input-field" value="${c.address||''}" placeholder="상세 주소 입력"></div></div><div class="grid grid-cols-1 sm:grid-cols-3 md:grid-cols-5 gap-3"><div><label class="text-sm block mb-1">등급</label><select name="careLevel" class="input-field">${CONSTANTS.CARE_LEVEL_LIST.map(v=>`<option value="${v}" ${c.careLevel===v?'selected':''}>${v}</option>`).join('')}</select></div><div><label class="text-sm block mb-1">경제상황</label><select name="economicStatus" class="input-field">${CONSTANTS.ECONOMIC_LIST.map(v=>`<option value="${v}" ${c.economicStatus===v?'selected':''}>${v}</option>`).join('')}</select></div><div><label class="text-sm block mb-1">세대유형</label><select name="householdType" class="input-field">${CONSTANTS.HOUSEHOLD_LIST.map(v=>`<option value="${v}" ${c.householdType===v?'selected':''}>${v}</option>`).join('')}</select></div><div><label class="text-sm block mb-1">중복서비스</label><select name="duplicateService" class="input-field">${CONSTANTS.DUPLICATE_SERVICE_LIST.map(v=>`<option value="${v}" ${c.duplicateService===v?'selected':''}>${v}</option>`).join('')}</select></div><div><label class="text-sm block mb-1">ICT 현황</label><select name="ictStatus" class="input-field">${CONSTANTS.ICT_STATUS_LIST.map(v=>`<option value="${v}" ${c.ictStatus===v?'selected':''}>${v}</option>`).join('')}</select></div></div><div class="grid grid-cols-1 sm:grid-cols-12 gap-3"><div class="sm:col-span-2"><label class="text-sm block mb-1">상태</label><select name="status" class="input-field">${CONSTANTS.STATUS_LIST.map(s=>`<option value="${s}" ${c.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="sm:col-span-3"><label class="text-sm block mb-1">시작일</label><input type="date" name="serviceStartDate" class="input-field" value="${c.serviceStartDate||''}" max="9999-12-31"></div><div class="sm:col-span-4"><label class="text-sm block mb-1">장기부재기간</label><div class="flex items-center gap-1"><input type="date" name="absStart" class="input-field px-1 text-sm text-center" value="${absStart}" max="9999-12-31" style="font-size: 0.8rem;"><span class="text-slate-400">~</span><input type="date" name="absEnd" class="input-field px-1 text-sm text-center" value="${absEnd}" max="9999-12-31" style="font-size: 0.8rem;"></div></div><div class="sm:col-span-3"><label class="text-sm block mb-1">종결일</label><input type="date" name="endDate" class="input-field" value="${c.endDate||''}" max="9999-12-31"></div></div><div><label class="text-sm block mb-1">비고</label><textarea name="note" class="input-field" rows="2">${c.note||''}</textarea></div>

            downloadPerformanceExcel: () => {
                const { year, months } = state.filters.performance; // [수정] months 사용
                const selectedMonths = (months && months.length > 0) ? months.sort((a, b) => a - b) : [];
                
                const targetLogs = state.logs.filter(l => l.date.startsWith(year)); // [수정] region 필터 제거
                
                const stats = {};
                state.services.forEach(s => { const key = `${s.category}|${s.name}`; if (!stats[key]) { stats[key] = { category: s.category, serviceName: s.name, counts: Array(12).fill(0), total: 0 }; } });
                
                targetLogs.forEach(l => { const month = parseInt(l.date.split('-')[1]) - 1; if (month < 0 || month > 11) return; if (l.serviceItems && l.serviceItems.length > 0) { l.serviceItems.forEach(item => { const key = `${item.category}|${item.serviceName}`; if (stats[key]) { stats[key].counts[month]++; /* 전체 합계는 일단 무시 */ } }); } });

                    });
                    serviceHeaders = orderedCategories.flatMap(cat => headerGroups[cat]);
                }

                const dataMap = {};
                targetClients.forEach(c => {
                    dataMap[c.id] = {
                        name: c.name,
                        birthDate: c.birthDate || '-',
                        careLevel: c.careLevel || '-',
                        region: c.region || '-',
                        total: 0,
                        counts: {}
                    };
                    serviceHeaders.forEach(k => dataMap[c.id].counts[k] = 0);
                });

                                            <td class="px-4 py-3 text-slate-500 text-xs text-center whitespace-nowrap">${h.provider || '-'}</td>
                                        </tr>
                                    `).join('') : `<tr><td colspan="6" class="px-4 py-8 text-center text-slate-400">해당 기간 내 서비스 이력이 없습니다.</td></tr>`}
                                </tbody>
                            </table>
                        </div>
                        <div class="mt-4 text-right flex-shrink-0 pt-2 border-t border-slate-100">
                            <button onclick="app.closeModal()" class="px-5 py-2 bg-slate-800 text-white rounded-lg hover:bg-slate-700 text-sm font-medium transition-colors shadow-sm">닫기</button>
                        </div>
                    </div>
                `;
                showModal(html, true);
                if(window.lucide) lucide.createIcons();
            },
            closeDialog: () => closeDialog(),
            updateOpts: (el) => { const svcs = state.services.filter(s => s.category === el.value); el.nextElementSibling.innerHTML = svcs.map(s => `<option value="${s.name}">${s.name}</option>`).join(''); },
            
            // [수정] 체크박스/라디오버튼 초기화 함수 (confirm 제거 및 즉시 실행)
            resetInputs: (containerId) => {
                const container = document.getElementById(containerId);
                if(container) {
                    const inputs = container.querySelectorAll('input[type="radio"], input[type="checkbox"]');
                    let count = 0;
                    inputs.forEach(el => {
                        if (el.checked) {
                            el.checked = false;
                            count++;
                        }
                    });
                    
                    // 선택된 항목이 없었을 경우에만 알림 (선택된게 있으면 시각적으로 바로 보임)
                    if (count === 0) {
                        // 선택된 것이 없으면 조용히 넘어감 (또는 필요시 알림)
                    }
                } else {
                    console.error("초기화할 영역을 찾을 수 없습니다:", containerId);
                }
            }
        };

        document.addEventListener('click', (e) => {
            const menu = document.getElementById('mobile-menu');
            const btn = document.getElementById('mobile-menu-btn');
            if (state.isMobileMenuOpen && menu && !menu.contains(e.target) && !btn.contains(e.target)) { app.closeMobileMenu(); }
        });

        window.addEventListener('popstate', (event) => {
            const modal = document.getElementById('modal-container');
            const dialog = document.getElementById('dialog-container');
            if (modal && !modal.classList.contains('hidden')) app.closeModal();
            if (dialog && !dialog.classList.contains('hidden')) app.closeDialog();
            const tab = event.state && event.state.tab ? event.state.tab : 'dashboard';
            app.setTab(tab, false); 
        });

        window.addEventListener('load', () => {
            const hash = window.location.hash.replace('#', '');
            const initialTab = (hash && TAB_NAMES[hash]) ? hash : 'dashboard';
            window.history.replaceState({ tab: initialTab }, '', `#${initialTab}`);
            if (initialTab !== 'dashboard') app.setTab(initialTab, false);
        });

        function showModal(html, allowOverlayClose = false) { 
            const m = document.getElementById('modal-container'); 
            m.innerHTML = html; 
            m.classList.remove('hidden'); 
            state.ui.allowOverlayClose = allowOverlayClose;
        }
        function closeModal() { document.getElementById('modal-container').classList.add('hidden'); }
        function showDialog(html) { const d = document.getElementById('dialog-container'); d.innerHTML = html; d.classList.remove('hidden'); }
        function closeDialog() { document.getElementById('dialog-container').classList.add('hidden'); }
        
        function renderSvcRow(item) {
            const cats = [...new Set(state.services.map(s => s.category))];
            const div = document.createElement('div');
            div.className = "svc-row flex flex-col sm:flex-row gap-2 mb-2 p-2 border rounded bg-white sm:bg-transparent sm:border-0";
            div.id = `row-${item.id || Date.now()}`;
            div.innerHTML = `
                <select class="cat-sel input-field w-full sm:w-1/4" onchange="app.updateOpts(this)"><option value="">분류</option>${cats.map(c=>`<option value="${c}" ${item.category===c?'selected':''}>${c}</option>`).join('')}</select>
                <select class="svc-sel input-field w-full sm:w-1/3"><option value="${item.serviceName}">${item.serviceName||'선택'}</option></select>
                <div class="flex w-full sm:flex-1 gap-2"><input class="det-inp input-field flex-1" placeholder="메모" value="${item.detailNote||''}"><button type="button" onclick="app.removeSvcRow('${div.id.split('-')[1]}')" class="text-red-400 p-1"><i data-lucide="minus-circle"></i></button></div>
            `;
            document.getElementById('svc-container').appendChild(div);
            if(item.category) { const sel = div.querySelector('.svc-sel'); const svcs = state.services.filter(s => s.category === item.category); sel.innerHTML = svcs.map(s => `<option value="${s.name}" ${s.name===item.serviceName?'selected':''}>${s.name}</option>`).join(''); }
            if(window.lucide) lucide.createIcons();
        }

        function render() {
            // [포커스 유지 시작]
            const activeEl = document.activeElement;
            const focusedId = activeEl ? activeEl.id : null;
            const cursorStart = activeEl ? activeEl.selectionStart : null;
            const cursorEnd = activeEl ? activeEl.selectionEnd : null;
            // [포커스 유지 끝]

            if (state.viewMode === 'single') {
                const loader = document.getElementById('initial-loader');
                if (loader) loader.remove();
                updateTabContent(state.activeTab);
                app.updateTabVisibility(); 
                return;
            }
            let main = document.getElementById('main-view-container'); 
            if (!main) return;
            app.renderTabBar(state.activeTab);
            main.className = "fixed inset-0 top-14 bg-slate-100 z-0 overflow-hidden"; 
            main.innerHTML = ""; 

            const createWindow = (paneId) => {
                const winState = state.windows[paneId];
                const tabKey = state.paneTabs[paneId];
                const isActive = state.focusedPane === paneId;
                
                const winDiv = document.createElement('div');
                winDiv.id = `window-${paneId}`;
                winDiv.className = `window-pane ${isActive ? 'active' : ''}`;
                winDiv.style.left = `${winState.x}px`;
                winDiv.style.top = `${winState.y}px`;
                winDiv.style.width = `${winState.w}px`;
                winDiv.style.height = `${winState.h}px`;
                winDiv.style.zIndex = winState.z;
                winDiv.onmousedown = () => app.setFocusedPane(paneId);

                const handles = ['n', 's', 'e', 'w', 'ne', 'nw', 'se', 'sw'].map(dir => 
                    `<div class="resizer resizer-${dir}" onmousedown="app.startResize(event, '${paneId}', '${dir}')"></div>`
                ).join('');

                winDiv.innerHTML = `
                    <div class="window-header" onmousedown="app.startDrag(event, '${paneId}')">
                        <div class="window-title">
                            <i data-lucide="${isActive ? 'app-window' : 'minus-square'}" size="16"></i>
                            <span>${TAB_NAMES[tabKey] || tabKey}</span>
                        </div>
                        <div class="window-controls">
                            <div class="window-control-btn btn-close" onclick="app.toggleSplitView()" title="창 닫기 (분할 모드 종료)"></div>
                        </div>
                    </div>
                    <div class="window-content p-4 overflow-y-auto h-full flex-1">
                        ${getTabHTML(tabKey)}
                    </div>
                    ${handles}
                `;
                return winDiv;
            };

            main.appendChild(createWindow('left'));
            main.appendChild(createWindow('right'));
            if(window.lucide) lucide.createIcons();

            // [포커스 복구 시작]
            if (focusedId) {
                const newEl = document.getElementById(focusedId);
                if (newEl) {
                    newEl.focus();
                    if (cursorStart !== null && cursorEnd !== null) {
                        try { newEl.setSelectionRange(cursorStart, cursorEnd); } catch(e) {}
                    }
                }
            }
            // [포커스 복구 끝]
        }

        initDataSync();
    </script>
</body>
</html>
