                    }
                    input.value = '';
                };
                reader.readAsArrayBuffer(file);
            },

            // [신규] 통계 엑셀 다운로드 기능 구현
            downloadStatsExcel: () => {
                const { start, end, type, region, name, months } = state.filters.stats;
                const selectedMonths = (months && months.length > 0) ? months.sort((a, b) => a - b) : [];
                const sYear = start.split('-')[0];
                const eYear = end.split('-')[0];
                const fullYearStart = `${sYear}-01-01`;
                const fullYearEnd = `${eYear}-12-31`;

                // 1. 대상자 필터링
                const targetClients = state.clients.filter(c => {
                    const matchBasic = (region.length === 0 || region.includes(c.region)) && (!name || c.name.includes(name));
                    if (!matchBasic) return false;
                    const cS = c.serviceStartDate || '0000-01-01';
                    const cE = c.endDate || '9999-12-31';
                    return cS <= fullYearEnd && cE >= fullYearStart;
                });

                // 2. 헤더 구성
                let serviceHeaders = [];
                if (type === 'category') {
                    serviceHeaders = [...new Set(state.services.map(s => s.category))].filter(Boolean);
                } else {
                    const headerGroups = {};
                    const orderedCategories = [...new Set(state.services.map(s => s.category || '기타'))];
                    state.services.forEach(s => {
                        const cat = s.category || '기타';
                        if (!headerGroups[cat]) headerGroups[cat] = [];
                        if (!headerGroups[cat].includes(s.name)) headerGroups[cat].push(s.name);
                    });
                    serviceHeaders = orderedCategories.flatMap(cat => headerGroups[cat]);
                }

                // 3. 데이터 집계
                const dataMap = {};
                targetClients.forEach(c => {
                    // [수정] 기타 사업 데이터('-')인 경우 엑셀 다운로드 시에도 기본정보 필드를 모두 빈 값으로 처리
                    const isEtc = c.name === '-';
                    dataMap[c.id] = { 
                        name: c.name, 
                        birthDate: isEtc ? '' : (c.birthDate || '-'), 
                        careLevel: isEtc ? '' : (c.careLevel || '-'), 
                        region: isEtc ? '' : (c.region || '-').replace(/동$/, ''), 
                        total: 0, 
                        counts: {} 
                    };
                    serviceHeaders.forEach(k => dataMap[c.id].counts[k] = 0);
                });

                state.logs.forEach(l => {
                    if (l.date < start || l.date > end) return;

                    // [신규 추가] 엑셀 다운로드용 월 필터
                    if (selectedMonths.length > 0) {
                        const m = parseInt(l.date.split('-')[1], 10);
                        if (!selectedMonths.includes(m)) return;
                    }

                    let cid = l.clientId;
                    if (!dataMap[cid] && l.clientName) { 
                        const found = targetClients.find(c => c.name === l.clientName); 
                        if (found) cid = found.id; 
                    }
                    if (dataMap[cid]) {
                        const items = l.serviceItems || [{ serviceName: l.serviceName, category: l.serviceCategory }];
                        items.forEach(item => {
                            // [수정] 엑셀 다운로드에도 화면(renderStatistics)과 동일한 집계 로직 적용 (이름 매핑 및 유효성 검사)
                            
                            // 1. 서비스 이름 매핑 (과거 데이터 호환성 확보)
                            let effectiveName = item.serviceName;
                            
                            // 현재 서비스 목록에 해당 이름이 있는지 확인
                            let exactMatch = state.services.find(s => s.name === effectiveName);
                            
                            if (!exactMatch) {
                                // 목록에 없다면 대체 이름 확인 (과거 <-> 현재 매핑)
                                if (effectiveName === '정서지원서비스(안전안부확인)') {
                                    if (state.services.some(s => s.name === '정서지원서비스')) effectiveName = '정서지원서비스';
                                } else if (effectiveName === '정서지원서비스') {
                                    if (state.services.some(s => s.name === '정서지원서비스(안전안부확인)')) effectiveName = '정서지원서비스(안전안부확인)';
                                }
                                // 매핑된 이름으로 다시 검색
                                exactMatch = state.services.find(s => s.name === effectiveName);
                            }

                            // 2. 집계 키(Key) 결정
                            let key = '';
                            
                            // [중요] 화면과 엑셀의 합계 불일치 해결:
                            // 화면 렌더링 로직과 동일하게 "현재 서비스 목록에 존재하는지"를 기준으로 카운트합니다.
                            if (exactMatch) {
                                if (type === 'category') {
                                    key = exactMatch.category; // 현재 설정된 카테고리 사용
                                } else {
                                    key = effectiveName; // 매핑된 서비스명 사용
                                }
                            }
                            // exactMatch가 없으면 key는 빈 문자열이 되어 집계에서 제외됨

                            if (key && dataMap[cid].counts[key] !== undefined) { 
                                dataMap[cid].counts[key]++; 
                                dataMap[cid].total++; 
                            }
                        });
                    }
                });

                // 4. 엑셀 데이터 변환
                const rows = Object.values(dataMap).filter(r => r.total >= 0).sort((a, b) => {
                    // [수정] 이름이 '-'인 데이터는 항상 맨 뒤로
                    if (a.name === '-' && b.name !== '-') return 1;
                    if (a.name !== '-' && b.name === '-') return -1;

                    const levelPriority = { '중점': 1, '일반': 2 };
                    const pA = levelPriority[a.careLevel] || 3;
                    const pB = levelPriority[b.careLevel] || 3;
                    if (pA !== pB) return pA - pB;
                    return a.name.localeCompare(b.name);
                });

                const sheetData = rows.map((r, idx) => {
                    const row = {
                        'No': idx + 1,
                        '대상자': r.name,
                        '생년월일': r.birthDate,
                        '등급': r.careLevel,
                        '행정동': r.region,
                        '합계': r.total
                    };
                    serviceHeaders.forEach(h => {
                        row[h] = r.counts[h] || 0;
                    });
                    return row;
                });

                if (sheetData.length === 0) {
                    alert("다운로드할 데이터가 없습니다.");
                    return;
                }

                const wb = XLSX.utils.book_new();
                const ws = XLSX.utils.json_to_sheet(sheetData);
                
                // 컬럼 너비 자동 설정
                const colWidths = [{ wch: 5 }, { wch: 10 }, { wch: 12 }, { wch: 8 }, { wch: 8 }, { wch: 8 }];
                serviceHeaders.forEach(h => colWidths.push({ wch: Math.max(h.length * 1.5, 5) }));
                ws['!cols'] = colWidths;

                XLSX.utils.book_append_sheet(wb, ws, "통계");
                XLSX.writeFile(wb, `서비스제공통계(${type === 'category' ? '분류별' : '상세별'})_${start}~${end}.xlsx`);
            },

            // [신규] 통계 상세 내역 보기 함수 추가 (누락된 기능 복구)
            // [수정] filterItem 인자 추가 (특정 서비스 항목 필터링용)
            showClientStatsDetail: (clientId, clientName, filterItem = null) => {
                const { start, end, type } = state.filters.stats;
                
                // [신규] 대상자 서비스 기간 정보 조회 및 배지 생성
                const client = state.clients.find(c => c.id === clientId);
                let servicePeriodBadge = '';
                if (client) {
                    const today = new Date().toISOString().split('T')[0];
                    // 종결 여부 확인 (상태가 '종결'이거나 종료일이 오늘 이전이면 종결로 간주)
                    const isTerminated = client.status === '종결' || (client.endDate && client.endDate <= today);
                    const sDate = client.serviceStartDate || '미지정';
                    const eDate = isTerminated ? (client.endDate || '') : '현재';
                    
                    if (sDate) {
                        servicePeriodBadge = `<span class="ml-2 text-sm font-normal text-slate-500 bg-slate-100 px-2 py-0.5 rounded border border-slate-200 tracking-tight">(${sDate} ~ ${eDate})</span>`;
                    }
                }

                // 해당 기간 내 해당 대상자의 로그 필터링
                const targetLogs = state.logs.filter(l => {
                    const dateMatch = l.clientId === clientId && (!start || l.date >= start) && (!end || l.date <= end);
                    if (!dateMatch) return false;

                    // [수정] 특정 서비스 항목(filterItem)이 지정된 경우 해당 항목 포함 여부 확인
                    if (filterItem) {
                        return l.serviceItems && l.serviceItems.some(item => {
                            if (type === 'category') return item.category === filterItem;
                            // [추가] 정서지원서비스 이름 호환성 처리
                            if (filterItem === '정서지원서비스' && item.serviceName === '정서지원서비스(안전안부확인)') return true;
                            if (filterItem === '정서지원서비스(안전안부확인)' && item.serviceName === '정서지원서비스') return true;
                            
                            return item.serviceName === filterItem;
                        });
                    }
                    return true;
                }).sort((a, b) => b.date.localeCompare(a.date));

                // [수정] 모달 제목 구성
                const titleSuffix = filterItem ? `<span class="text-slate-500 text-sm font-normal ml-2">(${filterItem})</span>` : '';

                const html = `
                    <div class="bg-white w-full max-w-4xl p-6 rounded-xl shadow-xl mx-4 max-h-[90vh] overflow-hidden flex flex-col">
                        <div class="flex justify-between items-center mb-4 flex-shrink-0">
                            <h3 class="font-bold text-xl text-slate-800 flex items-center gap-2">
                                <div class="p-2 bg-blue-100 text-blue-600 rounded-full"><i data-lucide="list" size="20"></i></div>
                                ${clientName}님 서비스 상세 내역 ${titleSuffix} ${servicePeriodBadge}
                            </h3>
                            <button onclick="app.closeModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" size="24"></i></button>
                        </div>
                        
                        <div class="bg-slate-50 px-4 py-2 rounded-lg border border-slate-200 mb-4 flex justify-between items-center flex-shrink-0">
                            <div class="text-sm font-bold text-slate-700">
                                조회 기간: <span class="text-emerald-600">${start || '전체'} ~ ${end || '전체'}</span>
                            </div>
                            <div class="text-sm text-slate-500">
                                총 <span class="font-bold text-slate-800">${targetLogs.length}</span>건 (일지 기준)
                            </div>
                        </div>

                        <div class="flex-1 overflow-y-auto border border-slate-200 rounded-lg custom-scrollbar bg-white">
                            <table class="w-full text-sm text-left border-collapse relative">
                                <thead class="bg-slate-50 text-slate-700 font-bold border-b border-slate-200 sticky top-0 z-10 shadow-sm">
                                    <tr>
                                        <th class="p-3 w-[90px] text-center whitespace-nowrap bg-slate-50 border-r border-slate-200">날짜</th>
                                        <!-- [신규 추가] 제공방법 헤더 -->
                                        <th class="p-3 w-[65px] text-center whitespace-nowrap bg-slate-50 border-r border-slate-200">방법</th>
                                        <th class="p-3 w-[110px] text-center whitespace-nowrap bg-slate-50 border-r border-slate-200">분류</th>
                                        <th class="p-3 w-[130px] whitespace-nowrap bg-slate-50 border-r border-slate-200">서비스명</th>
                                        <th class="p-3 whitespace-nowrap bg-slate-50 border-r border-slate-200">메모</th>
                                        <th class="p-3 w-[70px] text-center whitespace-nowrap bg-slate-50">제공자</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    ${targetLogs.length === 0 ? 
                                        '<tr><td colspan="5" class="p-12 text-center text-slate-400">해당 기간에 제공된 서비스 내역이 없습니다.</td></tr>' : 
                                        targetLogs.flatMap(l => {
                                            // 서비스 항목 필터링 (숫자 클릭 시 해당 항목만 표시)
                                            let items = l.serviceItems && l.serviceItems.length > 0 ? l.serviceItems : [{ category: l.serviceCategory, serviceName: l.serviceName, detailNote: '' }];
                                            
                                            if (filterItem) {
                                                items = items.filter(item => {
                                                    if (type === 'category') return item.category === filterItem;
                                                    // [추가] 정서지원서비스 이름 호환성 처리
                                                    if (filterItem === '정서지원서비스' && item.serviceName === '정서지원서비스(안전안부확인)') return true;
                                                    if (filterItem === '정서지원서비스(안전안부확인)' && item.serviceName === '정서지원서비스') return true;
                                                    
                                                    return item.serviceName === filterItem;
                                                });
                                            }

                                            if (items.length === 0) return []; // 필터링 결과 없으면 생략

                                            return items.map((item, idx) => `
                                                <tr class="hover:bg-slate-50 transition-colors group">
                                                    ${idx === 0 ? `<td class="p-3 text-center text-slate-600 font-medium border-r border-slate-100" rowspan="${items.length}">${l.date}</td>` : ''}
                                                    <!-- [신규 추가] 제공방법 데이터 (병합 처리 포함) -->
                                                    ${idx === 0 ? `<td class="p-3 text-center text-slate-600 text-xs border-r border-slate-100" rowspan="${items.length}">${l.provideMethod || '-'}</td>` : ''}
                                                    <td class="p-3 text-center text-slate-500 text-xs border-r border-slate-100">${item.category || '-'}</td>
                                                    <td class="p-3 font-bold text-slate-700 border-r border-slate-100">${item.serviceName || '-'}</td>
                                                    <!-- [수정] 내용(l.content) 제거하고 메모만 표시 -->
                                                    <td class="p-3 text-slate-600 text-sm border-r border-slate-100 leading-relaxed">
                                                        ${item.detailNote || '-'}
                                                    </td>
                                                    ${idx === 0 ? `<td class="p-3 text-center text-slate-500 text-xs" rowspan="${items.length}">${l.provider || '-'}</td>` : ''}
                                                </tr>
                                            `);
                                        }).join('')
                                    }
                                </tbody>
                            </table>
                        </div>
                        
                        <div class="mt-4 text-right pt-2 border-t border-slate-100 flex-shrink-0">
                            <button onclick="app.closeModal()" class="px-5 py-2 bg-slate-800 text-white rounded-lg hover:bg-slate-700 text-sm font-medium transition-colors shadow-sm">닫기</button>
                        </div>
                    </div>
                `;
                showModal(html, true);
                if(window.lucide) lucide.createIcons();
            },

            // [추가] 대상자 명부 엑셀 다운로드 (HTML에 버튼은 있으나 함수 부재)
            downloadClientListExcel: () => {
                const { search, searchPhone, status, level, economicStatus, duplicateService, ictStatus, region, gender, targetYear, targetMonth } = state.filters.client;
                
                // 날짜 필터 범위 설정
                let filterStart = '0000-01-01', filterEnd = '9999-12-31';
                if (targetYear) {
                    if (targetMonth) {
                        const m = String(targetMonth).padStart(2, '0');
                        filterStart = `${targetYear}-${m}-01`;
                        const lastDay = new Date(targetYear, targetMonth, 0).getDate();
                        filterEnd = `${targetYear}-${m}-${lastDay}`;
                    } else {
                        filterStart = `${targetYear}-01-01`;
                        filterEnd = `${targetYear}-12-31`;
                    }
                }

                // 필터링 수행
                const filtered = state.clients.filter(c => {
                    const matchEconomic = !economicStatus || (c.economicStatus && (
                        c.economicStatus === economicStatus || 
                        (economicStatus === '조건부 기초수급' && c.economicStatus === '조건부 수급자') ||
                        (economicStatus === '기초수급' && (c.economicStatus === '기초수급자' || c.economicStatus === '수급자'))
                    ));

                    const matchBasic = (!search || c.name.includes(search)) &&
                                       (!searchPhone || (c.phone && c.phone.includes(searchPhone))) && 
                                       (!status || c.status === status) &&
                                       (!level || c.careLevel === level) &&
                                       matchEconomic &&
                                       (!duplicateService || c.duplicateService === duplicateService) &&
                                       (!ictStatus || (c.ictStatus || '부') === ictStatus) &&
                                       (region.length === 0 || region.includes(c.region)) &&
                                       (!gender || c.gender === gender);
                    if (!matchBasic) return false;
                    
                    const sDate = c.serviceStartDate || '0000-01-01'; 
                    const eDate = c.endDate || '9999-12-31'; 
                    
                    if (sDate > filterEnd) return false;
                    if (status && status !== '종결') { if (eDate < filterStart) return false; }
                    
                    return true;
                }).sort((a, b) => {
                    if (a.name === '-' && b.name !== '-') return 1;
                    if (a.name !== '-' && b.name === '-') return -1;
                    if (targetYear) {
                        const eDateA = a.endDate || '9999-12-31';
                        const activeA = eDateA >= filterStart;
                        const eDateB = b.endDate || '9999-12-31';
                        const activeB = eDateB >= filterStart;
                        if (activeA && !activeB) return -1;
                        if (!activeA && activeB) return 1;
                    }
                    return (a.serviceStartDate || '').localeCompare(b.serviceStartDate || '');
                });

                if (filtered.length === 0) return alert("다운로드할 데이터가 없습니다.");

                const data = filtered.map(c => {
                    // [수정] 기타 사업 데이터('-')인 경우 기본정보 필드를 모두 빈 값으로 처리
                    const isEtc = c.name === '-';
                    return {
                        '이름': c.name,
                        '생년월일': isEtc ? '' : c.birthDate,
                        '성별': isEtc ? '' : c.gender,
                        '연락처': isEtc ? '' : c.phone,
                        '주소': isEtc ? '' : c.address,
                        '등급': isEtc ? '' : c.careLevel,
                        '경제상황': isEtc ? '' : c.economicStatus,
                        '행정동': isEtc ? '' : c.region,
                        '상태': isEtc ? '' : c.status, // 상태 정보도 제거
                        '시작일': c.serviceStartDate,
                        '종결일': c.endDate
                    };
                });
                
                const wb = XLSX.utils.book_new();
                const ws = XLSX.utils.json_to_sheet(data);
                XLSX.utils.book_append_sheet(wb, ws, "대상자명부");
                XLSX.writeFile(wb, `대상자명부_${new Date().toISOString().slice(0,10)}.xlsx`);
            },

            // [추가] 실적 엑셀 다운로드 (HTML에 버튼은 있으나 함수 부재)
            downloadPerformanceExcel: () => {
                const { year, months } = state.filters.performance;
                const selectedMonths = (months && months.length > 0) ? months.sort((a, b) => a - b) : [];
                
                if (selectedMonths.length === 0) return alert("선택된 월이 없습니다.");

                const targetLogs = state.logs.filter(l => l.date.startsWith(year));
                const stats = {};
                
                // 초기화
                state.services.forEach(s => {
                    const key = `${s.category}|${s.name}`;
                    stats[key] = { category: s.category, serviceName: s.name, counts: Array(12).fill(0) };
                });

                // 집계
                targetLogs.forEach(l => {
                    const month = parseInt(l.date.split('-')[1]) - 1;
                    if (month < 0 || month > 11) return;
                    (l.serviceItems || []).forEach(item => {
                        const key = `${item.category}|${item.serviceName}`;
                        if (stats[key]) stats[key].counts[month]++;
                    });
                });

                // 데이터 변환
                const rows = Object.values(stats).sort((a, b) => {
                    if (a.category !== b.category) return a.category.localeCompare(b.category);
                    return a.serviceName.localeCompare(b.serviceName);
                });

                const sheetData = rows.map(r => {
                    const row = {
                        '분류': r.category,
                        '서비스명': r.serviceName
                    };
                    let total = 0;
                    selectedMonths.forEach(m => {
                        const count = r.counts[m - 1];
                        row[`${m}월`] = count;
                        total += count;
                    });
                    row['합계'] = total;
                    return row;
                });

                const wb = XLSX.utils.book_new();
                const ws = XLSX.utils.json_to_sheet(sheetData);
                XLSX.utils.book_append_sheet(wb, ws, "월별실적");
                XLSX.writeFile(wb, `월별서비스실적_${year}년.xlsx`);
            }
        };

        document.addEventListener('click', (e) => {
            const menu = document.getElementById('mobile-menu');
            const btn = document.getElementById('mobile-menu-btn');
            if (state.isMobileMenuOpen && menu && !menu.contains(e.target) && !btn.contains(e.target)) { app.closeMobileMenu(); }
        });

        // [복구] 사례관리 표 형식 칸 방향키 이동 기능 (엑셀 스타일)
        document.addEventListener('keydown', (e) => {
            const keys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
            if (!keys.includes(e.key)) return;

            const target = e.target;
            
            // 모달창 탭 내부의 요소인지 확인
            if (!target.closest('.sub-tab-content') && !target.closest('.modal-tab-content')) return;
            
            // 텍스트를 입력하는 칸(input text, textarea, select)인지 확인 (체크박스, 라디오 제외)
            if (!['INPUT', 'TEXTAREA', 'SELECT'].includes(target.tagName)) return;
            if (target.type === 'checkbox' || target.type === 'radio' || target.type === 'hidden') return;

            // [핵심] 좌우 이동 시, 커서가 글자 맨 앞이거나 맨 끝일 때만 칸을 이동하도록 처리
            if (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA') {
                if (e.key === 'ArrowLeft' && target.selectionStart !== 0) return; // 커서가 맨 앞이 아니면 일반 이동
                if (e.key === 'ArrowRight' && target.selectionEnd !== target.value.length) return; // 커서가 맨 끝이 아니면 일반 이동
                
                // Textarea(여러 줄 입력칸)의 경우 위아래 방향키는 기본 줄바꿈 이동을 우선하도록 처리
                if (target.tagName === 'TEXTAREA') {
                    if (e.key === 'ArrowUp' && target.selectionStart !== 0) return; // 맨 윗줄이 아니면 일반 이동
                    if (e.key === 'ArrowDown' && target.selectionEnd !== target.value.length) return; // 맨 아랫줄이 아니면 일반 이동
                }
            }

            // 현재 칸이 속한 테이블 셀(td)과 행(tr) 찾기
            const td = target.closest('td');
            if (!td) return;
            const tr = td.closest('tr');
            if (!tr) return;
            const tbody = tr.closest('tbody');
            if (!tbody) return;

            let nextTarget = null;

            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                // 좌우 이동: 같은 행(tr) 내에서 이전/다음 텍스트 입력칸 찾기
                const focusables = Array.from(tr.querySelectorAll('input:not([type="hidden"]):not([type="checkbox"]):not([type="radio"]), select, textarea')).filter(el => !el.disabled && !el.readOnly);
                const currentIndex = focusables.indexOf(target);
                
                if (e.key === 'ArrowLeft' && currentIndex > 0) {
                    nextTarget = focusables[currentIndex - 1];
                } else if (e.key === 'ArrowRight' && currentIndex < focusables.length - 1) {
                    nextTarget = focusables[currentIndex + 1];
                }
            } else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
                // 상하 이동: 위/아래 행(tr)에서 같은 열(td) 위치의 입력칸 찾기
                const tds = Array.from(tr.children);
                const cellIndex = tds.indexOf(td);
                const rows = Array.from(tbody.children);
                const rowIndex = rows.indexOf(tr);
                
                let nextRowIndex = e.key === 'ArrowUp' ? rowIndex - 1 : rowIndex + 1;
                
                if (nextRowIndex >= 0 && nextRowIndex < rows.length) {
                    const nextRow = rows[nextRowIndex];
                    const nextTd = nextRow.children[cellIndex];
                    if (nextTd) {
                        nextTarget = nextTd.querySelector('input:not([type="hidden"]):not([type="checkbox"]):not([type="radio"]), select, textarea');
                    }
                }
            }

            // 다음 이동할 칸이 있다면 포커스 이동
            if (nextTarget) {
                e.preventDefault(); // 페이지 스크롤 등 기본 동작 방지
                nextTarget.focus();
                
                // 이동 후 커서를 자연스럽게 맨 뒤로 보내기
                if (nextTarget.tagName === 'INPUT' || nextTarget.tagName === 'TEXTAREA') {
                    try {
                        nextTarget.setSelectionRange(nextTarget.value.length, nextTarget.value.length);
                    } catch(err) {} // 숫자 타입 input 등 range를 지원하지 않는 경우 예외 처리
                }
            }
        });

        window.addEventListener('popstate', (event) => {
            const modal = document.getElementById('modal-container');
            const dialog = document.getElementById('dialog-container');
            if (modal && !modal.classList.contains('hidden')) app.closeModal();
            if (dialog && !dialog.classList.contains('hidden')) app.closeDialog();
            const tab = event.state && event.state.tab ? event.state.tab : 'dashboard';
            app.setTab(tab, false); 
        });

        window.addEventListener('load', () => {
            const hash = window.location.hash.replace('#', '');
            const initialTab = (hash && TAB_NAMES[hash]) ? hash : 'dashboard';
            window.history.replaceState({ tab: initialTab }, '', `#${initialTab}`);
            if (initialTab !== 'dashboard') app.setTab(initialTab, false);
        });

       function showModal(html, allowOverlayClose = false, targetId = 'modal-container') { 
            const m = document.getElementById(targetId); 
            m.innerHTML = html; 
            m.classList.remove('hidden'); 
            state.ui.allowOverlayClose = allowOverlayClose;
            
            setTimeout(() => {
                // [스마트 감지] 모달이 열리면 무조건 깨끗한 상태로 리셋!
                state.ui.isDirty = false;
                
                const form = m.querySelector('form');
                if (form) {
                    form.addEventListener('submit', () => {
                        state.ui.isDirty = false; 
                    });

                    // [스마트 감지] 사용자가 '진짜로' 키보드를 치거나 마우스를 클릭했을 때만 오염(Dirty) 처리
                    form.addEventListener('input', () => { state.ui.isDirty = true; });
                    form.addEventListener('change', () => { state.ui.isDirty = true; });
                }
            }, 100);
        }

        function closeModal() { 
            const sub = document.getElementById('sub-modal-container');
            if (sub && !sub.classList.contains('hidden')) {
                sub.classList.add('hidden');
                sub.innerHTML = ''; 
            } else {
                const main = document.getElementById('modal-container');
                main.classList.add('hidden'); 
                // [버그 해결 핵심] 모달이 닫힐 때, 엉뚱한 저장을 유발하는 숨겨진 잔해를 완벽히 소각합니다!
                main.innerHTML = ''; 
            }
        }
        
        function showDialog(html) { const d = document.getElementById('dialog-container'); d.innerHTML = html; d.classList.remove('hidden'); }
        function closeDialog() { document.getElementById('dialog-container').classList.add('hidden'); }
        
        function renderSvcRow(item) {
            // [수정] 카테고리 목록 생성 (저장된 카테고리가 현재 목록에 없으면 강제 추가)
            const cats = [...new Set(state.services.map(s => s.category))];
            if (item.category && !cats.includes(item.category)) {
                cats.push(item.category);
            }

            const div = document.createElement('div');
            div.className = "svc-row flex flex-col sm:flex-row gap-2 mb-2 p-2 border rounded bg-white sm:bg-transparent sm:border-0";
            div.id = `row-${item.id || Date.now()}`;
            div.innerHTML = `
                <select class="cat-sel input-field w-full sm:w-1/4" onchange="app.updateOpts(this)">
                    <option value="">분류</option>
                    ${cats.map(c=>`<option value="${c}" ${item.category===c?'selected':''}>${c}</option>`).join('')}
                </select>
                <select class="svc-sel input-field w-full sm:w-1/3"><option value="">선택</option></select>
                <div class="flex w-full sm:flex-1 gap-2"><input class="det-inp input-field flex-1" placeholder="메모" value="${item.detailNote||''}"><button type="button" onclick="app.removeSvcRow('${div.id.split('-')[1]}')" class="text-red-400 p-1"><i data-lucide="minus-circle"></i></button></div>
            `;
            document.getElementById('svc-container').appendChild(div);
            
            // [수정] 서비스명 옵션 처리 (저장된 서비스명이 목록에 없으면 강제 추가)
            if(item.category) { 
                const sel = div.querySelector('.svc-sel'); 
                const svcs = state.services.filter(s => s.category === item.category); 
                
                // 현재 유효한 서비스 목록 옵션 생성
                let opts = svcs.map(s => `<option value="${s.name}" ${s.name===item.serviceName?'selected':''}>${s.name}</option>`).join('');
                
                // 저장된 서비스명이 있고, 유효 목록에 없다면 추가
                const exists = svcs.some(s => s.name === item.serviceName);
                if (item.serviceName && !exists) {
                    opts = `<option value="${item.serviceName}" selected>${item.serviceName} (미등록)</option>` + opts;
                }
                
                sel.innerHTML = opts; 
            }
            if(window.lucide) lucide.createIcons();
        }

        function render() {
            const activeEl = document.activeElement;
            const focusedId = activeEl ? activeEl.id : null;
            const cursorStart = activeEl ? activeEl.selectionStart : null;
            const cursorEnd = activeEl ? activeEl.selectionEnd : null;

            if (state.viewMode === 'single') {
                const loader = document.getElementById('initial-loader');
                if (loader) loader.remove();
                updateTabContent(state.activeTab);
                app.updateTabVisibility(); 
                return;
            }
            
            let main = document.getElementById('main-view-container'); 
            if (!main) return;
            app.renderTabBar(state.activeTab);
            main.className = "fixed inset-0 top-14 bg-slate-100 z-0 overflow-hidden"; 
            
            // [수정] 분할 화면 스마트 업데이트: 창이 이미 존재하면 DOM을 새로 만들지 않고 내용만 갱신하여 상태 유지
            const leftWin = document.getElementById('window-left');
            const rightWin = document.getElementById('window-right');

            if (leftWin && rightWin) {
                ['left', 'right'].forEach(paneId => {
                    const tabKey = state.paneTabs[paneId];
                    const winEl = document.getElementById(`window-${paneId}`);
                    const contentEl = winEl.querySelector('.window-content');
                    
                    if (contentEl) {
                        // 1. 현재 스크롤 위치 저장 (메인 컨테이너 및 각 탭별 리스트 컨테이너)
                        const scrollMap = {
                            'clients': 'client-list-container',
                            'logs': 'log-list-container',
                            'meeting': 'meeting-list-container',
                            'statistics': 'stats-list-container',
                            'performance': 'perf-table-container'
                        };
                        const listId = scrollMap[tabKey];
                        let listScroll = 0;
                        if (listId) {
                            const listEl = contentEl.querySelector(`#${listId}`);
                            if (listEl) listScroll = listEl.scrollTop;
                        }
                        const winScroll = contentEl.scrollTop;

                        // 2. 내용 업데이트 (HTML 교체)
                        contentEl.innerHTML = getTabHTML(tabKey);

                        // 3. 스크롤 위치 복구
                        if (listId && listScroll > 0) {
                            const newListEl = contentEl.querySelector(`#${listId}`);
                            if (newListEl) newListEl.scrollTop = listScroll;
                        }
                        contentEl.scrollTop = winScroll;

                        // 4. 제목 업데이트
                        const titleEl = winEl.querySelector('.window-title span');
                        if (titleEl) titleEl.textContent = TAB_NAMES[tabKey] || tabKey;
                    }
                });
            } else {
                // 윈도우가 없을 때만 초기화 후 생성 (최초 진입 시)
                main.innerHTML = ""; 

                const createWindow = (paneId) => {
                    const winState = state.windows[paneId];
                    const tabKey = state.paneTabs[paneId];
                    const isActive = state.focusedPane === paneId;
                    
                    const winDiv = document.createElement('div');
                    winDiv.id = `window-${paneId}`;
                    winDiv.className = `window-pane ${isActive ? 'active' : ''}`;
                    winDiv.style.left = `${winState.x}px`;
                    winDiv.style.top = `${winState.y}px`;
                    winDiv.style.width = `${winState.w}px`;
                    winDiv.style.height = `${winState.h}px`;
                    winDiv.style.zIndex = winState.z;
                    winDiv.onmousedown = () => app.setFocusedPane(paneId);

                    const handles = ['n', 's', 'e', 'w', 'ne', 'nw', 'se', 'sw'].map(dir => 
                        `<div class="resizer resizer-${dir}" onmousedown="app.startResize(event, '${paneId}', '${dir}')"></div>`
                    ).join('');

                    // [수정] 버튼 클릭 시 드래그 이벤트가 실행되지 않도록 onmousedown="event.stopPropagation()" 추가
                    winDiv.innerHTML = `
                        <div class="window-header" onmousedown="app.startDrag(event, '${paneId}')">
                            <div class="window-title">
                                <i data-lucide="${isActive ? 'app-window' : 'minus-square'}" size="16"></i>
                                <span>${TAB_NAMES[tabKey] || tabKey}</span>
                            </div>
                            <div class="window-controls">
                                <button onmousedown="event.stopPropagation();" onclick="app.toggleSplitView()" class="text-slate-400 hover:text-red-500 transition-colors p-1" title="창 닫기 (분할 모드 종료)">
                                    <i data-lucide="x" size="18"></i>
                                </button>
                            </div>
                        </div>
                        <div class="window-content p-4 overflow-y-auto h-full flex-1">
                            ${getTabHTML(tabKey)}
                        </div>
                        ${handles}
                    `;
                    return winDiv;
                };

                main.appendChild(createWindow('left'));
                main.appendChild(createWindow('right'));
            }
            
            if(window.lucide) lucide.createIcons();

            if (focusedId) {
                const newEl = document.getElementById(focusedId);
                if (newEl) {
                    newEl.focus();
                    if (cursorStart !== null && cursorEnd !== null) {
                        try { newEl.setSelectionRange(cursorStart, cursorEnd); } catch(e) {}
                    }
                }
            }
        }

        initDataSync();
    </script>
</body>
</html>
