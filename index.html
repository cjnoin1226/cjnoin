            padding: 0.3rem 0.6rem;

        .window-pane {

            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);

            DUPLICATE_SERVICE_LIST: ['해당없음', '맞춤돌봄', '노노케어', '보훈재가', '장기요양', '기타'],
            ICT_STATUS_LIST: ['부', '여']
        };
        
        const TAB_NAMES = {
            dashboard: '홈',
            clients: '대상자 관리',
            logs: '서비스 일지',
            meeting: '사례회의',
            performance: '실적 관리',
            statistics: '통계',
            services: '서비스 설정'
        };

        const state = {
            activeTab: 'dashboard',
            openedTabs: ['dashboard'],
            viewMode: 'single',
            focusedPane: 'left',
            paneTabs: { left: 'dashboard', right: 'logs' },
            windows: {
                left: { x: 20, y: 20, w: 600, h: 700, z: 1 },
                right: { x: 640, y: 20, w: 600, h: 700, z: 2 }
            },
            isMobileMenuOpen: false,
            renderedTabs: new Set(),
            clients: [],
            services: [],
            logs: [],
            meetings: [], 
            editingServiceId: null,
            isBatching: false,
            isFullLogLoaded: false,
            loadedYears: new Set(),
            loadingCancelled: false,
            tabScrolls: {}, 
            ui: {
                regionDropdownOpen: false,
                logRegionDropdownOpen: false,
                statsRegionDropdownOpen: false,
                perfMonthDropdownOpen: false, 
                clientExportDropdownOpen: false, 
                selectedLogIds: new Set(),
                selectedClientIds: new Set(),
                selectedMeetingIds: new Set(),
                clientModalTab: 'basic',
                caseSubTab: 'initial',
                allowOverlayClose: false,
                cmYear: new Date().getFullYear(), 
                logPage: 1,
                logsPerPage: 50,
                meetingTargetMonth: new Date().getMonth() + 1,
                meetingCandidateType: 'regular'
            },
            pendingClientData: null,
            pendingLogData: null,
            pendingServiceData: null,
            filters: {
                client: { 
                    status: '이용', level: '', economicStatus: '', duplicateService: '', ictStatus: '', 
                    region: [], gender: '', search: '', searchPhone: '', targetYear: '', targetMonth: '' 
                },
                log: { start: '', end: '', search: '', contentSearch: '', provider: '', category: '', service: '', region: [] },
                meeting: {
                    start: (() => { const d = new Date(); return `${d.getFullYear()}-01-01`; })(),
                    end: (() => { const d = new Date(); return `${d.getFullYear()}-12-31`; })(),
                    search: '',
                    type: '',
                    clientName: '',
                    writer: ''
                },
                stats: { 
                    start: (() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-01`; })(),
                    end: (() => { const d = new Date(); const lastDay = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${lastDay}`; })(),
                    type: 'detail', region: [], name: '' 
                },
                performance: { year: new Date().getFullYear(), months: Array.from({length: 12}, (_, i) => i + 1), viewMode: 'monthRows' }
            }
        };

        function calculateAge(birthDate) {
            if (!birthDate) return 0;
            const today = new Date();
            const birth = new Date(birthDate);
            let age = today.getFullYear() - birth.getFullYear();
            const m = today.getMonth() - birth.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) age--;
            return age;
        }

        function getLoadingTag() {
            if (state.isFullLogLoaded) return '';
            return `<span class="ml-2 text-xs font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded-full border border-blue-100 flex items-center gap-1 shadow-sm transition-all"><span class="animate-spin"><i data-lucide="loader-2" size="12"></i></span><span>데이터 로딩 중...</span></span>`;
        }

        function getFilteredLogs() {
            const { start, end, search, contentSearch, provider, category, service, region } = state.filters.log;
            
            const hasActiveFilter = start || end || search || contentSearch || provider || category || service || region.length > 0;
            const currentYearStr = String(new Date().getFullYear());

            const filtered = state.logs.filter(l => {
                const client = state.clients.find(c => c.id === l.clientId);
                const clientRegion = client ? client.region : '미지정';

                if (!hasActiveFilter) {
                    if (!l.date.startsWith(currentYearStr)) return false;
                }

                return (!start || l.date >= start) && 
                       (!end || l.date <= end) && 
                       (!search || l.clientName.includes(search)) && 
                       (!contentSearch || (l.content && l.content.includes(contentSearch))) &&
                       (!provider || (l.provider && l.provider.includes(provider))) && 
                       (!category || (l.serviceItems && l.serviceItems.some(i => i.category === category))) &&
                       (!service || (l.serviceItems && l.serviceItems.some(i => i.serviceName === service))) &&
                       (region.length === 0 || region.includes(clientRegion));
            });
            return filtered.sort((a, b) => {
                if (a.date !== b.date) return b.date.localeCompare(a.date);
                const providerA = a.provider || '', providerB = b.provider || '';
                if (providerA !== providerB) return providerA.localeCompare(providerB);
                return (a.clientName || '').localeCompare(b.clientName || '');
            });
        }

        function getFilteredMeetings() {
            const { start, end, search, type, clientName, writer } = state.filters.meeting;
            return state.meetings.filter(m => {
                const matchDate = (!start || m.date >= start) && (!end || m.date <= end);
                const matchSearch = !search || 
                    (m.topic && m.topic.includes(search)) || 
                    (m.attendees && m.attendees.includes(search));
                const matchType = !type || m.type === type;
                const matchClient = !clientName || (m.clientName && m.clientName.includes(clientName));
                const matchWriter = !writer || (m.writer && m.writer.includes(writer));

                return matchDate && matchSearch && matchType && matchClient && matchWriter;
            }).sort((a, b) => b.date.localeCompare(a.date));
        }

        function mergeLogs(newLogs) {
            if (!Array.isArray(newLogs) || newLogs.length === 0) return;

            const logMap = new Map();
            if (Array.isArray(state.logs)) {
                state.logs.forEach(l => logMap.set(l.id, l));
            }
            newLogs.forEach(l => logMap.set(l.id, l));
            
            state.logs = Array.from(logMap.values()).sort((a, b) => {
                if (a.date !== b.date) return b.date.localeCompare(a.date);
                const providerA = a.provider || '', providerB = b.provider || '';
                if (providerA !== providerB) return providerA.localeCompare(providerB);
                return (a.clientName || '').localeCompare(b.clientName || '');
            });
        }

        function initDataSync() {
            if (!db) return;
            const handleErr = (e) => { if(e.code === 'permission-denied') console.warn("권한 부족: 규칙을 확인하세요."); };

            onSnapshot(query(collection(db, "clients"), orderBy("createdAt", "desc")), (snap) => {
                state.clients = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                if (!state.isBatching) render();
            }, handleErr);
            
            onSnapshot(query(collection(db, "meetings"), orderBy("date", "desc")), (snap) => {
                state.meetings = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                if (!state.isBatching) render();
            }, handleErr);

            onSnapshot(collection(db, "services"), (snap) => {
                let loaded = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                const sortOrder = ['위기관리체계구축', '욕구기반 위기관리', '위기상황관리 및 긴급지원', '기타'];
                const caseManagementOrder = ['사례발굴', '초기상담', '사정 및 계획', '개입', '점검 및 모니터링', '종결 및 사후관리', '월 사례회의', '월사례회의'];
                const counselingOrder = ['정서지원서비스(안전안부확인)', '노인일상생활관련 상담', '노인일상생활관련상담', '복지서비스 종합안내'];

                loaded.sort((a, b) => {
                    const catA = (a.majorCategory || '').replace(/\s+/g, '');
                    const catB = (b.majorCategory || '').replace(/\s+/g, '');
                    const indexA = sortOrder.findIndex(k => k.replace(/\s+/g, '') === catA);
                    const indexB = sortOrder.findIndex(k => k.replace(/\s+/g, '') === catB);
                    if (indexA !== -1 && indexB === -1) return -1;
                    if (indexA === -1 && indexB !== -1) return 1;
                    if (indexA !== -1 && indexB !== -1) { if (indexA !== indexB) return indexA - indexB; } 
                    else {
                        const majorComp = (a.majorCategory || '').localeCompare(b.majorCategory || '');
                        if (majorComp !== 0) return majorComp;
                    }
                    const catComp = (a.category || '').localeCompare(b.category || '');
                    if (catComp !== 0) return catComp;
                    if (a.category === '사례관리' && b.category === '사례관리') {
                        const nameIndexA = caseManagementOrder.indexOf(a.name);
                        const nameIndexB = caseManagementOrder.indexOf(b.name);
                        if (nameIndexA !== -1 && nameIndexB !== -1) return nameIndexA - nameIndexB;
                    }
                    if (a.category === '노인상담 및 정보제공' && b.category === '노인상담 및 정보제공') {
                        const nameIndexA_C = counselingOrder.indexOf(a.name);
                        const nameIndexB_C = counselingOrder.indexOf(b.name);
                        if (nameIndexA_C !== -1 && nameIndexB_C !== -1) return nameIndexA_C - nameIndexB_C;
                        if (nameIndexA_C !== -1) return -1;
                        if (nameIndexB_C !== -1) return 1;
                    }
                    return (a.name || '').localeCompare(b.name || '');
                });
                state.services = loaded;
                if (!state.isBatching) render();
            }, handleErr);
            
            let initialLogUnsub = null;
            const currentYear = new Date().getFullYear();
            const startOfYear = `${currentYear}-01-01`;
            const endOfYear = `${currentYear}-12-31`;

            const qInitial = query(
                collection(db, "logs"), 
                where("date", ">=", startOfYear), 
                where("date", "<=", endOfYear),
                orderBy("date", "desc"), 
                limit(100)
            );
            
            initialLogUnsub = onSnapshot(qInitial, (snap) => {
                if (state.isFullLogLoaded) return;

                const newLogs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                mergeLogs(newLogs);
                state.loadedYears.add(currentYear); 

                if (!state.isBatching) render();
            }, handleErr);

            setTimeout(() => {
                const qFull = query(
                    collection(db, "logs"), 
                    where("date", ">=", startOfYear), 
                    where("date", "<=", endOfYear),
                    orderBy("date", "desc")
                );
                
                onSnapshot(qFull, (snap) => {
                    const currentYearLogs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    mergeLogs(currentYearLogs);
                    state.isFullLogLoaded = true; 
                    state.loadedYears.add(currentYear);

                    if (initialLogUnsub) {
                        initialLogUnsub();
                        initialLogUnsub = null;
                    }

                    if (!state.isBatching) render();
                }, handleErr);
            }, 1500);
        }

        function getTabHTML(tabName) {
            if (tabName === 'dashboard') return renderDashboard();
            if (tabName === 'clients') return renderClientManager();
            if (tabName === 'logs') return renderLogManager();
            if (tabName === 'meeting') return renderMeetingManager();
            if (tabName === 'performance') return renderPerformance();
            if (tabName === 'statistics') return renderStatistics();
            if (tabName === 'services') return renderServiceManager();
            return '';
        }

        function updateTabContent(tabName) {
            const activeEl = document.activeElement;
            const focusedId = activeEl ? activeEl.id : null;
            const cursorStart = activeEl ? activeEl.selectionStart : null;
            const cursorEnd = activeEl ? activeEl.selectionEnd : null;

            const scrollMap = {
                'clients': 'client-list-container',
                'logs': 'log-list-container',
                'meeting': 'meeting-list-container',
                'statistics': 'stats-list-container',
                'performance': 'perf-table-container'
            };
            let lastScrollTop = 0;
            const scrollId = scrollMap[tabName];
            if (scrollId) {
                const el = document.getElementById(scrollId);
                if (el) lastScrollTop = el.scrollTop;
            }

            const containerId = `tab-view-${tabName}`;
            let container = document.getElementById(containerId);
            if (!container) {
                const mainContainer = document.getElementById('main-view-container');
                if (!mainContainer) return; 
                container = document.createElement('div');
                container.id = containerId;
                container.className = 'tab-content-wrapper p-4 md:p-6'; 
                mainContainer.appendChild(container);
            }
            container.innerHTML = getTabHTML(tabName);
            state.renderedTabs.add(tabName);
            if(window.lucide) lucide.createIcons();

            if (scrollId && lastScrollTop > 0) {
                const el = document.getElementById(scrollId);
                if (el) el.scrollTop = lastScrollTop;
            }

            if (focusedId) {
                const newEl = document.getElementById(focusedId);
                if (newEl) {
                    newEl.focus();
                    if (cursorStart !== null && cursorEnd !== null) {
                        try { newEl.setSelectionRange(cursorStart, cursorEnd); } catch(e) {}
                    }
                }
            }
        }

        function renderDashboard() {

            return `

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 md:gap-6">
                        <div onclick="app.setTab('clients')" class="bg-white p-4 md:p-6 rounded-xl shadow-sm border border-slate-100 flex items-center gap-4 cursor-pointer hover:bg-slate-50 transition-colors">
                            <div class="p-3 bg-blue-100 text-blue-600 rounded-lg"><i data-lucide="users"></i></div>
                            <div>
                                <p class="text-sm text-slate-500">총 대상자 <span class="text-xs text-slate-400">(이용/장기부재)</span></p>
                                <p class="text-2xl font-bold text-slate-800">${totalActive}<span class="text-sm font-normal text-slate-500">명</span></p>
                                <p class="text-xs text-slate-400 mt-1">(중점: <span class="text-pink-600 font-bold">${highFocus}</span> / 일반: <span class="text-blue-600 font-bold">${general}</span>)</p>
                            </div>
                        </div>
                        <div onclick="app.setTab('logs')" class="bg-white p-4 md:p-6 rounded-xl shadow-sm border border-slate-100 flex items-center gap-4 cursor-pointer hover:bg-slate-50 transition-colors">
                            <div class="p-3 bg-emerald-100 text-emerald-600 rounded-lg"><i data-lucide="file-text"></i></div>
                            <div><p class="text-sm text-slate-500">오늘 일지</p><p class="text-2xl font-bold text-slate-800">${todayLogs}<span class="text-sm font-normal text-slate-500">건</span></p></div>
                        </div>
                        <div onclick="app.setTab('meeting')" class="bg-white p-4 md:p-6 rounded-xl shadow-sm border border-slate-100 flex items-center gap-4 cursor-pointer hover:bg-slate-50 transition-colors">
                            <div class="p-3 bg-purple-100 text-purple-600 rounded-lg"><i data-lucide="calendar-clock"></i></div>
                            <div><p class="text-sm text-slate-500">${currentMonth}월 사례회의 대상</p><p class="text-2xl font-bold text-slate-800">${meetingCandidates}<span class="text-sm font-normal text-slate-500">명</span></p></div>
                        </div>
                    </div>

                        <div class="space-y-3">
                        ${state.logs.length === 0 ? '<p class="text-center text-slate-400 py-4">데이터 없음</p>' : state.logs.slice(0,5).map(log => `
                            <div class="flex flex-col sm:flex-row sm:items-start gap-2 sm:gap-4 pb-3 border-b last:border-0 p-2 hover:bg-slate-50 rounded">
                                <div class="hidden sm:block mt-1 text-slate-500"><i data-lucide="check-circle" size="16"></i></div>
                                <div class="flex-1">
                                    <p class="font-medium text-slate-800 text-sm md:text-base">
                                        <span class="text-emerald-600 font-bold">${log.clientName}</span>님 
                                        <span class="text-xs text-slate-400 mx-1">|</span>

                                </div>
                            </div>`).join('')}
                        </div>
                    </div>
                </div>`;
        }

        function renderClientManager() {
             const { search, searchPhone, status, level, economicStatus, duplicateService, ictStatus, region, gender, targetYear, targetMonth } = state.filters.client;
            let filterStart = '0000-01-01', filterEnd = '9999-12-31';
            if (targetYear) {
                if (targetMonth) {
                    const m = String(targetMonth).padStart(2, '0');
                    filterStart = `${targetYear}-${m}-01`;
                    const lastDay = new Date(targetYear, targetMonth, 0).getDate();
                    filterEnd = `${targetYear}-${m}-${lastDay}`;
                } else {
                    filterStart = `${targetYear}-01-01`;
                    filterEnd = `${targetYear}-12-31`;
                }
            }
            const filtered = state.clients.filter(c => {
                const matchEconomic = !economicStatus || (c.economicStatus && (
                    c.economicStatus === economicStatus || 
                    (economicStatus === '조건부 기초수급' && c.economicStatus === '조건부 수급자') ||
                    (economicStatus === '기초수급' && (c.economicStatus === '기초수급자' || c.economicStatus === '수급자'))
                ));

                const matchBasic = (!search || c.name.includes(search)) &&
                                   (!searchPhone || (c.phone && c.phone.includes(searchPhone))) && 
                                   (!status || c.status === status) &&
                                   (!level || c.careLevel === level) &&
                                   matchEconomic &&
                                   (!duplicateService || c.duplicateService === duplicateService) &&
                                   (!ictStatus || (c.ictStatus || '부') === ictStatus) &&
                                   (region.length === 0 || region.includes(c.region)) &&
                                   (!gender || c.gender === gender);
                if (!matchBasic) return false;
                const sDate = c.serviceStartDate || '0000-01-01'; 
                const eDate = c.endDate || '9999-12-31'; 
                if (sDate > filterEnd) return false;
                if (status && status !== '종결') { if (eDate < filterStart) return false; }
                return true;
            }).sort((a, b) => {
                if (a.name === '-' && b.name !== '-') return 1;
                if (a.name !== '-' && b.name === '-') return -1;

                if (targetYear) {
                    const eDateA = a.endDate || '9999-12-31';
                    const activeA = eDateA >= filterStart;
                    const eDateB = b.endDate || '9999-12-31';
                    const activeB = eDateB >= filterStart;
                    if (activeA && !activeB) return -1;
                    if (!activeA && activeB) return 1;
                }
                return (a.serviceStartDate || '').localeCompare(b.serviceStartDate || '');
            });

            const currentYearStr = String(new Date().getFullYear());
            let activeStats = { total: 0, using: 0, absent: 0, highFocus: 0, general: 0, male: 0, female: 0 };
            let yearStats = { new: 0, end: 0 };

                const isTerminatedToday = c.status === '종결' || (c.endDate && c.endDate < today);
                const isNotStartedYet = c.serviceStartDate && c.serviceStartDate > today;
                if ((c.status === '이용' || c.status === '장기부재') && !isTerminatedToday && !isNotStartedYet) {
                    activeStats.total++;
                    if (c.status === '이용') activeStats.using++;
                    else if (c.status === '장기부재') activeStats.absent++;
                    if (c.careLevel === '중점') activeStats.highFocus++;
                    else if (c.careLevel === '일반') activeStats.general++;
                    if (c.gender === '남성') activeStats.male++;
                    else if (c.gender === '여성') activeStats.female++;
                }
                if (c.serviceStartDate && c.serviceStartDate.startsWith(currentYearStr)) yearStats.new++;
                if (c.endDate && c.endDate.startsWith(currentYearStr)) yearStats.end++;
            });

            const yearOptions = [`<option value="" ${!targetYear ? 'selected' : ''}>전체 기간</option>`];
            for (let y = 2010; y <= 2100; y++) yearOptions.push(`<option value="${y}" ${parseInt(targetYear) === y ? 'selected' : ''}>${y}년</option>`);

            for (let m = 1; m <= 12; m++) monthOptions.push(`<option value="${m}" ${parseInt(targetMonth) === m ? 'selected' : ''}>${m}월</option>`);
            
            const filteredTotal = filtered.length;
            const filteredHighFocus = filtered.filter(c => c.careLevel === '중점').length;
            const filteredGeneral = filtered.filter(c => c.careLevel === '일반').length;
            const isFilterActive = search !== '' || searchPhone !== '' || status !== '이용' || level !== '' || economicStatus !== '' || duplicateService !== '' || ictStatus !== '' || region.length > 0 || gender !== '' || targetYear !== '' || targetMonth !== '';

            return `

                              <div><p class="text-sm text-slate-500 font-medium leading-tight">이용 대상자</p><p class="text-2xl font-bold text-slate-800 mt-1">${activeStats.total}<span class="text-sm text-slate-400 font-normal ml-1">명 <span class="text-xs text-slate-500 font-normal tracking-tight ml-1">(이용중 : ${activeStats.using} / 장기부재 : ${activeStats.absent})</span></span></p></div>
                              <div class="p-3 bg-emerald-50 rounded-full text-emerald-500 ml-auto"><i data-lucide="user-check" size="24"></i></div>

                           <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex items-center gap-6">

                              <div class="w-px h-8 bg-slate-100"></div>
                              <div class="flex flex-col justify-center"><span class="text-xs text-slate-500 font-bold mb-1">성별</span><div class="text-sm font-bold flex gap-2"><span class="text-blue-500">남 ${activeStats.male}</span><span class="text-slate-300">|</span><span class="text-red-500">여 ${activeStats.female}</span></div></div>

                                    <select class="input-field py-1.5 px-2 text-sm flex-1 min-w-[110px]" onchange="app.setFilter('client','level',this.value)"><option value="">등급(전체)</option>${CONSTANTS.CARE_LEVEL_LIST.map(c=>`<option value="${c}" ${level===c?'selected':''}>${c}</option>`).join('')}</select>

                                    <select class="input-field py-1.5 px-2 text-sm flex-1 min-w-[120px]" onchange="app.setFilter('client','economicStatus',this.value)"><option value="">경제상황(전체)</option>${CONSTANTS.ECONOMIC_LIST.map(e=>`<option value="${e}" ${economicStatus===e?'selected':''}>${e}</option>`).join('')}</select>
                                    <select class="input-field py-1.5 px-2 text-sm flex-1 min-w-[120px]" onchange="app.setFilter('client','duplicateService',this.value)"><option value="">중복서비스(전체)</option>${CONSTANTS.DUPLICATE_SERVICE_LIST.map(d=>`<option value="${d}" ${duplicateService===d?'selected':''}>${d}</option>`).join('')}</select>
                                    <select class="input-field py-1.5 px-2 text-sm flex-1 min-w-[100px]" onchange="app.setFilter('client','ictStatus',this.value)"><option value="">ICT(전체)</option>${CONSTANTS.ICT_STATUS_LIST.map(i=>`<option value="${i}" ${ictStatus===i?'selected':''}>${i}</option>`).join('')}</select>

                            </div>

                    </div>

                    <div id="client-list-container" class="overflow-y-auto max-h-[70vh] custom-scrollbar space-y-2 pr-1 pb-4">
                        ${filtered.length === 0 ? `<div class="text-center py-12 bg-white rounded-xl border border-dashed border-slate-200 text-slate-400">검색 결과가 없습니다.</div>` :
                        filtered.map(c => {
                            const isEtcClient = c.name === '-';
                            const isLogicallyTerminated = c.status === '종결' || (c.endDate && c.endDate <= filterEnd);
                            const displayStatus = isLogicallyTerminated ? '종결' : c.status;
                            const statusColor = displayStatus === '종결' ? 'bg-slate-100 text-slate-500' : (displayStatus === '이용' ? 'bg-green-100 text-green-700' : 'bg-slate-100 text-slate-500');
                            const eDate = c.endDate || '9999-12-31';
                            const wasActiveInPeriod = eDate >= filterStart;
                            const getEconomicDisplay = (status) => {
                                if (status === '일반(저소득)') return '저소득';
                                if (status === '조건부 기초수급' || status === '조건부 수급자') return '조건부';
                                if (status === '기초수급' || status === '기초수급자' || status === '수급자') return '수급자';
                                return status || '-';
                            };
                            const birthShort = c.birthDate ? c.birthDate.substring(2).replace(/-/g, '.') : '-';
                            const genderShort = c.gender === '남성' ? '남' : (c.gender === '여성' ? '여' : c.gender);
                            const genderColorClass = c.gender === '남성' ? 'text-blue-600' : 'text-red-600';

                            const regionBadge = isEtcClient ? '' : `<span class="text-xs px-1.5 py-0.5 rounded bg-slate-100 text-slate-600 font-medium whitespace-nowrap border border-slate-200">${c.region}</span>`;
                            const ecoBadge = isEtcClient ? '' : `<span class="text-xs px-1.5 py-0.5 rounded bg-amber-50 text-amber-700 border border-amber-100 font-medium whitespace-nowrap">${getEconomicDisplay(c.economicStatus)}</span>`;
                            const levelBadge = isEtcClient ? '' : `<span class="text-xs px-1.5 py-0.5 rounded ${c.careLevel==='중점'?'bg-pink-50 text-pink-700 border border-pink-100':'bg-blue-50 text-blue-700 border border-blue-100'} font-medium whitespace-nowrap">${c.careLevel}</span>`;
                            const statusBadge = isEtcClient ? '' : `<span class="text-xs px-1.5 py-0.5 rounded ${statusColor} font-medium whitespace-nowrap border border-slate-200">${displayStatus}</span>`;
                            const nameDetail = isEtcClient ? '' : `<span class="text-sm font-bold text-slate-600 whitespace-nowrap overflow-hidden text-ellipsis">(${birthShort}/<span class="${genderColorClass}">${genderShort}</span>)</span>`;
                            const activeDot = (!isEtcClient && targetYear && wasActiveInPeriod) ? `<div class="w-2.5 h-2.5 rounded-full bg-emerald-500 ml-0.5 shadow-sm" title="해당 기간 이용 이력 있음"></div>` : '';

                            return `
                            <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-100 flex flex-col md:grid md:grid-cols-[150px_160px_140px_1fr_70px] gap-1 md:items-center group hover:bg-slate-50 transition-colors">
                                <div class="flex items-center gap-2 w-full overflow-hidden">
                                    <input type="checkbox" class="w-4 h-4 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500 cursor-pointer flex-shrink-0" onchange="app.toggleClientSelection('${c.id}')" ${state.ui.selectedClientIds.has(c.id) ? 'checked' : ''}>
                                    <div class="flex items-center gap-1 overflow-hidden">

                                <div class="flex items-center gap-2 w-full overflow-hidden" title="${c.address||''}"><span class="truncate text-lg text-slate-900">${isEtcClient ? '' : (c.address||'-')}</span></div>
                                <div class="flex items-center justify-end gap-1 w-full">
                                    <button onclick="app.openClientModal('${c.id}')" class="text-slate-400 hover:text-blue-500 p-1 rounded" title="수정"><i data-lucide="edit" size="12"></i></button>
                                    <button onclick="app.deleteData('clients','${c.id}')" class="text-slate-400 hover:text-red-500 p-1 rounded" title="삭제"><i data-lucide="trash-2" size="12"></i></button>
                                </div>

                    </div>
                </div>`;
        }

        function renderLogManager() {
            const filteredFull = getFilteredLogs(); 
            const totalLogs = filteredFull.length;
            const totalPages = Math.ceil(totalLogs / state.ui.logsPerPage) || 1;

            if (state.ui.logPage > totalPages) state.ui.logPage = totalPages;
            if (state.ui.logPage < 1) state.ui.logPage = 1;

            const startIndex = (state.ui.logPage - 1) * state.ui.logsPerPage;
            const endIndex = startIndex + state.ui.logsPerPage;
            const visibleLogs = filteredFull.slice(startIndex, endIndex);

            const categories = [...new Set(state.services.map(s => s.category))];
            const { category, service, start, end, search, contentSearch, provider, region } = state.filters.log; 
            const filteredServices = category ? state.services.filter(s => s.category === category) : state.services;
            const allSelected = visibleLogs.length > 0 && visibleLogs.every(l => state.ui.selectedLogIds.has(l.id));

            const currentYear = new Date().getFullYear();
            const logYearOptions = [];
            for (let y = 2015; y <= currentYear + 1; y++) {
                const isSelected = start === `${y}-01-01` && end === `${y}-12-31`;
                logYearOptions.push(`<option value="${y}" ${isSelected ? 'selected' : ''}>${y}년</option>`);
            }
            logYearOptions.reverse(); 
            
            const isAllSelected = start === '2000-01-01' && end === '9999-12-31';
            logYearOptions.unshift(`<option value="all" ${isAllSelected ? 'selected' : ''}>전체 연도</option>`);
            logYearOptions.unshift(`<option value="">연도 (기본)</option>`); 

            let paginationHTML = '';
            if (totalPages > 1) {
                paginationHTML = `<div class="flex justify-center items-center gap-1 select-none">`;
                paginationHTML += `<button onclick="app.setLogPage(${state.ui.logPage - 1})" class="w-8 h-8 flex items-center justify-center rounded hover:bg-slate-100 text-slate-500 disabled:opacity-30 disabled:cursor-not-allowed transition-colors" ${state.ui.logPage === 1 ? 'disabled' : ''}><i data-lucide="chevron-left" size="16"></i></button>`;
                
                let startPage = Math.max(1, state.ui.logPage - 2);
                let endPage = Math.min(totalPages, startPage + 4);
                if (endPage - startPage < 4) startPage = Math.max(1, endPage - 4);

                if (startPage > 1) {
                    paginationHTML += `<button onclick="app.setLogPage(1)" class="w-8 h-8 flex items-center justify-center rounded text-sm font-medium hover:bg-slate-100 text-slate-600 transition-colors">1</button>`;
                    if (startPage > 2) paginationHTML += `<span class="text-slate-300 text-xs px-1">...</span>`;
                }

                for (let i = startPage; i <= endPage; i++) {
                    const activeClass = i === state.ui.logPage ? 'bg-emerald-600 text-white font-bold shadow-sm' : 'hover:bg-slate-100 text-slate-600';
                    paginationHTML += `<button onclick="app.setLogPage(${i})" class="w-8 h-8 flex items-center justify-center rounded text-sm transition-colors ${activeClass}">${i}</button>`;
                }

                if (endPage < totalPages) {
                    if (endPage < totalPages - 1) paginationHTML += `<span class="text-slate-300 text-xs px-1">...</span>`;
                    paginationHTML += `<button onclick="app.setLogPage(${totalPages})" class="w-8 h-8 flex items-center justify-center rounded text-sm font-medium hover:bg-slate-100 text-slate-600 transition-colors">${totalPages}</button>`;
                }

                paginationHTML += `<button onclick="app.setLogPage(${state.ui.logPage + 1})" class="w-8 h-8 flex items-center justify-center rounded hover:bg-slate-100 text-slate-500 disabled:opacity-30 disabled:cursor-not-allowed transition-colors" ${state.ui.logPage === totalPages ? 'disabled' : ''}><i data-lucide="chevron-right" size="16"></i></button>`;
                paginationHTML += `</div>`;

                <div class="flex flex-col animate-fade-in">
                    <div class="space-y-4 pb-2 pr-1 transition-all">

                                <button onclick="app.downloadLogsExcel()" class="bg-slate-100 text-slate-600 px-3 py-2 rounded-lg text-sm font-medium flex items-center gap-1 hover:bg-slate-200 transition-colors"><i data-lucide="download" size="16"></i> 엑셀 저장</button>
                                <button onclick="app.openLogModal()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg flex items-center gap-2 text-sm font-medium hover:bg-emerald-700 transition-colors"><i data-lucide="plus" size="16"></i> 작성</button>
                            </div>
                        </div>

                        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap items-center gap-2">

                                <span class="text-slate-400">~</span>
                                <input type="date" id="log-filter-end" class="bg-transparent border-0 text-sm focus:ring-0 p-0 w-[110px] h-full" value="${end}" max="9999-12-31">
                                <button onclick="app.searchLogsByDateRange()" class="bg-slate-800 text-white px-3 py-0.5 rounded text-xs font-medium hover:bg-slate-700 transition-colors whitespace-nowrap ml-1 h-6">조회</button>
                            </div>
                            <input id="log-search-name" class="input-field h-9 py-1 w-full sm:w-24 text-sm" placeholder="이름 (Enter)" value="${search}" onkeydown="if(event.key === 'Enter') app.setFilter('log','search',this.value)" oninput="if(this.value === '') app.setFilter('log','search','')">
                            
                            <input id="log-search-content" class="input-field h-9 py-1 w-full sm:w-32 text-sm" placeholder="내용 검색 (Enter)" value="${contentSearch}" onkeydown="if(event.key === 'Enter') app.setFilter('log','contentSearch',this.value)" oninput="if(this.value === '') app.setFilter('log','contentSearch','')">

                            <input id="log-search-provider" class="input-field h-9 py-1 w-full sm:w-24 text-sm" placeholder="제공자 (Enter)" value="${provider || ''}" onkeydown="if(event.key === 'Enter') app.setFilter('log','provider',this.value)" oninput="if(this.value === '') app.setFilter('log','provider','')">
                            <div class="relative z-30 w-full sm:w-auto">
                                <button onclick="app.toggleLogRegionDropdown()" class="input-field h-9 py-1 px-2 text-sm flex items-center justify-between min-w-[100px] bg-white cursor-pointer text-left w-full sm:w-28"><span class="truncate max-w-[80px] text-slate-700">${region.length > 0 ? (region.length === CONSTANTS.DONG_LIST.length ? '전체 동' : region.join(',')) : '전체 동'}</span><i data-lucide="chevron-down" size="14" class="text-slate-400 ml-2"></i></button>
                                ${state.ui.logRegionDropdownOpen ? `<div class="fixed inset-0 z-40" onclick="app.toggleLogRegionDropdown()"></div><div class="absolute top-full left-0 mt-1 w-40 bg-white border border-slate-200 rounded-lg shadow-xl z-50 p-2 max-h-60 overflow-y-auto animate-fade-in">${CONSTANTS.DONG_LIST.map(d => `<label class="flex items-center gap-2 text-sm p-2 hover:bg-slate-50 rounded cursor-pointer select-none"><input type="checkbox" class="rounded text-emerald-600 focus:ring-emerald-500 w-4 h-4 border-slate-300" ${region.includes(d) ? 'checked' : ''} onchange="app.toggleLogRegionFilter('${d}')"><span class="text-slate-700">${d}</span></label>`).join('')}</div>` : ''}
                            </div>
                            <div class="flex flex-wrap gap-2 w-full sm:w-auto flex-1 min-w-[200px]">
                                <select class="input-field h-9 py-1 w-full sm:w-28 text-sm flex-1" onchange="app.setFilter('log','category',this.value); app.setFilter('log','service','');"><option value="">서비스(전체)</option>${categories.map(c=>`<option value="${c}" ${category===c?'selected':''}>${c}</option>`).join('')}</select>
                                <select class="input-field h-9 py-1 w-full sm:w-32 text-sm flex-1" onchange="app.setFilter('log','service',this.value)"><option value="">상세내용(전체)</option>${filteredServices.map(s=>`<option value="${s.name}" ${service===s.name?'selected':''}>${s.name}</option>`).join('')}</select>
                            </div>
                            <button onclick="app.resetFilters('log')" class="ml-auto text-slate-400 hover:text-slate-600 text-xs flex items-center gap-1 flex-shrink-0 h-9 px-2 hover:bg-slate-50 rounded transition-colors" title="초기화"><i data-lucide="refresh-cw" size="14"></i></button>
                        </div>

                        <div class="flex items-center justify-between px-1 h-8">
                            <div class="flex items-center gap-3">
                                <div class="text-sm text-slate-500">
                                    총 <span class="font-bold text-slate-800">${totalLogs}</span>건
                                    <span class="text-xs text-slate-400 font-normal ml-1">(${state.ui.logPage} / ${totalPages} 페이지)</span>
                                </div>
                                <label class="flex items-center gap-2 cursor-pointer select-none hover:bg-slate-100 px-2 py-1 rounded transition-colors">
                                    <input type="checkbox" id="log-select-all" class="w-4 h-4 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500" onchange="app.toggleAllLogs(this.checked)" ${allSelected ? 'checked' : ''} ${visibleLogs.length === 0 ? 'disabled' : ''}>
                                    <span class="text-sm font-medium text-slate-600">전체선택 (현재 페이지)</span>
                                </label>
                                <div class="flex items-center gap-2" id="log-batch-actions">

        function renderPerformance() {
            const { year, months, viewMode = 'monthRows' } = state.filters.performance;
            const selectedMonths = (months && months.length > 0) ? months.sort((a, b) => a - b) : [];
            
            const targetLogs = state.logs.filter(l => l.date.startsWith(year));
            
            const stats = {};
            state.services.forEach(s => {
                const key = `${s.category}|${s.name}`;
                if (!stats[key]) {
                    stats[key] = { category: s.category, serviceName: s.name, counts: Array(12).fill(0), total: 0 };
                }
            });
            
            targetLogs.forEach(l => {
                const month = parseInt(l.date.split('-')[1]) - 1; 
                if (month < 0 || month > 11) return;
                if (l.serviceItems && l.serviceItems.length > 0) {
                    l.serviceItems.forEach(item => {
                        const key = `${item.category}|${item.serviceName}`;
                        if (stats[key]) { stats[key].counts[month]++; }
                    });
                }
            });

            const serviceOrderMap = new Map();
            state.services.forEach((s, idx) => { serviceOrderMap.set(`${s.category}|${s.name}`, idx); });

            const rows = Object.values(stats).sort((a, b) => {
                const indexA = serviceOrderMap.get(`${a.category}|${a.serviceName}`);
                const indexB = serviceOrderMap.get(`${b.category}|${b.serviceName}`);
                if (indexA !== undefined && indexB !== undefined) return indexA - indexB;
                if (indexA !== undefined) return -1;
                if (indexB !== undefined) return 1;
                if (a.category !== b.category) return a.category.localeCompare(b.category);
                return a.serviceName.localeCompare(b.serviceName);
            });

            const monthlyTotals = Array(12).fill(0);
            let grandTotal = 0;
            
            rows.forEach(r => {
                let rowSum = 0;
                selectedMonths.forEach(m => {
                    const monthIdx = m - 1;
                    const val = r.counts[monthIdx];
                    rowSum += val;
                    monthlyTotals[monthIdx] += val;
                });
                r.displayTotal = rowSum; 
                grandTotal += rowSum;
            });

            const yearOptions = [];
            const currentYear = new Date().getFullYear();
            for (let y = 2020; y <= currentYear + 1; y++) {
                yearOptions.push(`<option value="${y}" ${parseInt(year) === y ? 'selected' : ''}>${y}년</option>`);
            }
            yearOptions.reverse();

            const stickColStyle = (left, z) => `position: sticky; left: ${left}px; z-index: ${z};`;
            let tableHTML = '';

            if (viewMode === 'monthRows') {
                const headerGroups = {};
                const orderedCategories = [];
                rows.forEach(r => {
                    if (!headerGroups[r.category]) { headerGroups[r.category] = []; orderedCategories.push(r.category); }
                    headerGroups[r.category].push(r);
                });

                let headerRow1 = `<th class="py-2 px-4 border-b border-r bg-slate-50 text-center font-bold min-w-[60px] whitespace-nowrap" rowspan="2" style="${stickColStyle(0, 30)}">월</th>`;
                let headerRow2 = '';

                orderedCategories.forEach(cat => {
                    const services = headerGroups[cat];
                    headerRow1 += `<th class="py-2 px-2 border-b border-r bg-slate-100 text-center font-bold text-slate-700 whitespace-nowrap" colspan="${services.length}">${cat}</th>`;
                    services.forEach(s => {
                        const displayName = s.serviceName === '정서지원서비스(안전안부확인)' ? '안전안부확인' : s.serviceName;
                        headerRow2 += `<th class="py-2 px-2 border-b border-r bg-slate-50 text-center text-xs font-medium text-slate-600 min-w-[60px] max-w-[120px] whitespace-nowrap overflow-hidden text-ellipsis cursor-help" title="${s.serviceName}">${displayName}</th>`;
                    });
                });
                headerRow1 += `<th class="py-2 px-4 border-b bg-emerald-50 text-emerald-800 text-center font-bold min-w-[60px] whitespace-nowrap" rowspan="2">합계</th>`;

                let bodyRows = '';
                if (selectedMonths.length === 0) {
                    bodyRows = `<tr><td colspan="${rows.length + 2}" class="py-8 text-center text-slate-400">선택된 월이 없습니다.</td></tr>`;
                } else {
                    selectedMonths.forEach(m => {
                        const monthIdx = m - 1;
                        let rowHTML = `<td class="py-2 px-4 border-r font-bold text-slate-600 bg-white text-center sticky left-0 z-20">${m}월</td>`;
                        rows.forEach(r => {
                            const count = r.counts[monthIdx];
                            rowHTML += `<td class="py-2 px-1 border-r text-center ${count > 0 ? 'text-blue-600 font-bold bg-blue-50/30' : 'text-slate-300'}">${count || '-'}</td>`;
                        });
                        rowHTML += `<td class="py-2 px-4 text-center font-bold text-emerald-600 bg-emerald-50/50">${monthlyTotals[monthIdx]}</td>`;
                        bodyRows += `<tr class="hover:bg-slate-50 group border-b border-slate-100">${rowHTML}</tr>`;
                    });
                }

                let footerRow = `<td class="py-3 px-4 border-r text-center bg-slate-100 font-bold sticky left-0 z-20">총계</td>`;
                rows.forEach(r => { footerRow += `<td class="py-3 px-1 border-r text-center text-slate-800 font-bold bg-slate-50">${r.displayTotal}</td>`; });
                footerRow += `<td class="py-3 px-4 text-center text-emerald-700 bg-emerald-100 font-bold">${grandTotal}</td>`;

                tableHTML = `<thead class="sticky top-0 z-30 shadow-sm"><tr>${headerRow1}</tr><tr>${headerRow2}</tr></thead><tbody class="divide-y divide-slate-100">${bodyRows}<tr class="bg-slate-100 font-bold shadow-sm border-t-2 border-slate-300">${footerRow}</tr></tbody>`;
            } else {
                const wCat = 90;
                const wSvc = 150;
                
                const monthHeaders = selectedMonths.map(m => `<th class="py-3 px-2 border-b border-r min-w-[40px] text-center bg-slate-50">${m}월</th>`).join('');
                
                tableHTML = `
                    <thead class="sticky-header bg-slate-50 text-slate-600 font-semibold z-20 shadow-sm">
                        <tr>
                            <th class="py-3 px-2 border-b border-r min-w-[${wCat}px] bg-slate-50 text-center font-bold" style="${stickColStyle(0, 30)}">분류</th>
                            <th class="py-3 px-2 border-b border-r min-w-[${wSvc}px] bg-slate-50 text-center font-bold" style="${stickColStyle(wCat, 30)}">서비스명</th>
                            ${monthHeaders}
                            <th class="py-3 px-2 border-b bg-emerald-50 text-emerald-800 text-center font-bold min-w-[60px]">합계</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                        ${rows.length === 0 ? `<tr><td colspan="${selectedMonths.length + 3}" class="text-center py-4">데이터 없음</td></tr>` : rows.map(r => {
                            const displayName = r.serviceName === '정서지원서비스(안전안부확인)' ? '안전안부확인' : r.serviceName;
                            const cells = selectedMonths.map(m => {
                                const count = r.counts[m - 1];
                                return `<td class="py-2 px-2 border-r text-center ${count > 0 ? 'text-blue-600 font-bold bg-blue-50/30' : 'text-slate-300'}">${count || '-'}</td>`;
                            }).join('');
                            
                            return `
                            <tr class="hover:bg-slate-50 group">
                                <td class="py-2 px-2 border-r font-medium text-slate-600 bg-white text-center text-xs whitespace-nowrap" style="${stickColStyle(0, 20)}">${r.category}</td>
                                <td class="py-2 px-2 border-r text-slate-800 bg-white text-sm whitespace-nowrap text-ellipsis overflow-hidden max-w-[${wSvc}px]" title="${r.serviceName}" style="${stickColStyle(wCat, 20)}">${displayName}</td>
                                ${cells}
                                <td class="py-2 px-2 text-center font-bold text-emerald-600 bg-emerald-50/50">${r.displayTotal}</td>
                            </tr>
                        `;}).join('')}
                        <tr class="bg-slate-100 font-bold shadow-sm border-t-2 border-slate-300">
                            <td class="py-3 px-2 border-r text-center bg-slate-100" style="${stickColStyle(0, 20)}">총계</td>
                            <td class="py-3 px-2 border-r bg-slate-100" style="${stickColStyle(wCat, 20)}"></td>
                            ${selectedMonths.map(m => `<td class="py-3 px-2 border-r text-center text-slate-800">${monthlyTotals[m - 1]}</td>`).join('')}
                            <td class="py-3 px-2 text-center text-emerald-700 bg-emerald-100">${grandTotal}</td>
                        </tr>
                    </tbody>
                `;
            }

            return `
                <div class="space-y-6 animate-fade-in p-1">
                    <h2 class="text-2xl font-bold text-slate-800 flex items-center">월별 서비스 실적 ${getLoadingTag()}</h2>
                    <div class="sticky top-0 z-50 bg-slate-50 pt-2 pb-2 shadow-sm -mx-1 px-1">
                        <div class="flex flex-col sm:flex-row flex-wrap gap-2 items-center bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                             <div class="flex items-center bg-slate-100 rounded-lg p-1 mr-4">
                                <button onclick="app.setFilter('performance', 'viewMode', 'monthRows')" class="px-3 py-1.5 rounded-md text-sm font-bold transition-all ${viewMode === 'monthRows' ? 'bg-white text-emerald-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}">월별 보기 (기본)</button>
                                <button onclick="app.setFilter('performance', 'viewMode', 'serviceRows')" class="px-3 py-1.5 rounded-md text-sm font-bold transition-all ${viewMode === 'serviceRows' ? 'bg-white text-emerald-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}">서비스별 보기</button>
                             </div>
                             <div class="flex items-center gap-2">
                                <label class="text-sm font-bold text-slate-700">연도</label>
                                <select class="input-field py-1 px-3 w-32 font-bold" onchange="app.setFilter('performance', 'year', this.value)">
                                    ${yearOptions.join('')}
                                </select>
                             </div>
                             
                             <div class="flex items-center gap-2 ml-0 sm:ml-4 relative">
                                <label class="text-sm font-bold text-slate-700">월 선택</label>
                                <button onclick="app.togglePerfMonthDropdown()" class="input-field py-1 px-3 w-40 text-left flex justify-between items-center text-sm font-medium cursor-pointer">
                                    <span class="truncate">${selectedMonths.length === 12 ? '전체 월' : (selectedMonths.length === 0 ? '선택 없음' : `${selectedMonths.length}개 선택됨`)}</span>
                                    <i data-lucide="chevron-down" size="14" class="text-slate-400"></i>
                                </button>
                                ${state.ui.perfMonthDropdownOpen ? `
                                    <div class="fixed inset-0 z-40" onclick="app.togglePerfMonthDropdown()"></div>
                                    <div class="absolute top-full left-0 mt-1 w-48 bg-white border border-slate-200 rounded-lg shadow-xl z-50 p-2 animate-fade-in">
                                        <div class="flex justify-between items-center px-2 pb-2 mb-2 border-b border-slate-100">
                                            <span class="text-xs font-bold text-slate-500">다중 선택 가능</span>
                                            <button onclick="app.toggleAllPerfMonths()" class="text-xs text-blue-600 hover:text-blue-800 font-medium">전체선택/해제</button>
                                        </div>
                                        <div class="grid grid-cols-2 gap-1 max-h-60 overflow-y-auto">
                                            ${Array.from({length: 12}, (_, i) => i + 1).map(m => `
                                                <label class="flex items-center gap-2 text-sm p-2 hover:bg-slate-50 rounded cursor-pointer select-none">
                                                    <input type="checkbox" class="rounded text-emerald-600 focus:ring-emerald-500 w-4 h-4 border-slate-300" 
                                                        ${selectedMonths.includes(m) ? 'checked' : ''} 
                                                        onchange="app.togglePerfMonth(${m})">
                                                    <span class="text-slate-700 font-medium">${m}월</span>
                                                </label>
                                            `).join('')}
                                        </div>
                                    </div>
                                ` : ''}
                             </div>

                             <div class="flex-1"></div>
                             <button onclick="app.downloadPerformanceExcel()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg flex items-center gap-2 hover:bg-emerald-700 transition-colors shadow-sm">
                                <i data-lucide="download" size="18"></i> 엑셀 다운로드
                             </button>
                        </div>
                    </div>

                    <div id="perf-table-container" class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-auto max-h-[600px]">
                        <table class="w-full text-sm text-left border-collapse whitespace-nowrap">
                            ${tableHTML}
                        </table>
                    </div>
                </div>
            `;
        }
        
        function renderStatistics() {
             const { start, end, type, region, name } = state.filters.stats;
            const sYear = start ? start.split('-')[0] : '0000';
            const eYear = end ? end.split('-')[0] : '9999';
            const fullYearStart = `${sYear}-01-01`;
            const fullYearEnd = `${eYear}-12-31`;
            const targetClients = state.clients.filter(c => {
                const matchBasic = (region.length === 0 || region.includes(c.region)) && (!name || c.name.includes(name));
                if (!matchBasic) return false;
                const cS = c.serviceStartDate || '0000-01-01';
                const cE = c.endDate || '9999-12-31';
                return cS <= fullYearEnd && cE >= fullYearStart;
            });
            let serviceHeaders = [];
            let headerGroups = {};
            let orderedCategories = [];
            if (type === 'category') {
                serviceHeaders = [...new Set(state.services.map(s => s.category))].filter(Boolean);
            } else {
                orderedCategories = [...new Set(state.services.map(s => s.category || '기타'))];
                state.services.forEach(s => {
                    const cat = s.category || '기타';
                    if (!headerGroups[cat]) headerGroups[cat] = [];
                    if (!headerGroups[cat].includes(s.name)) headerGroups[cat].push(s.name);
                });
                serviceHeaders = orderedCategories.flatMap(cat => headerGroups[cat]);
            }
            const dataMap = {}; 
            targetClients.forEach(c => {
                dataMap[c.id] = { id: c.id, name: c.name, birthDate: c.birthDate || '-', careLevel: c.careLevel || '-', region: (c.region || '-').replace(/동$/, ''), endDate: c.endDate || '9999-12-31', total: 0, emotionalCount: 0, counts: {} };
                serviceHeaders.forEach(k => dataMap[c.id].counts[k] = 0);
            });
            state.logs.forEach(l => {
                if (start && l.date < start) return;
                if (end && l.date > end) return;
                
                let cid = l.clientId;
                if (!dataMap[cid] && l.clientName) { const found = targetClients.find(c => c.name === l.clientName); if(found) cid = found.id; }
                if (dataMap[cid]) {
                    const items = l.serviceItems || [{ serviceName: l.serviceName, category: l.serviceCategory }];
                    items.forEach(item => {
                        let key = type === 'category' ? item.category : item.serviceName;
                        if (!key && item.serviceName && type === 'category') { const s = state.services.find(svc => svc.name === item.serviceName); if(s) key = s.category; }
                        if (item.serviceName && item.serviceName.includes('정서지원')) dataMap[cid].emotionalCount++;
                        if (key && dataMap[cid].counts[key] !== undefined) { dataMap[cid].counts[key]++; dataMap[cid].total++; }
                    });
                }
            });
            const rows = Object.values(dataMap).filter(r => r.total >= 0).sort((a, b) => {
                if (a.name === '-' && b.name !== '-') return 1;
                if (a.name !== '-' && b.name === '-') return -1;

                const levelPriority = { '중점': 1, '일반': 2 };
                const pA = levelPriority[a.careLevel] || 3;
                const pB = levelPriority[b.careLevel] || 3;
                if (pA !== pB) return pA - pB;
                return a.name.localeCompare(b.name);
            });
            const colTotals = {};
            serviceHeaders.forEach(k => colTotals[k] = rows.reduce((sum, r) => sum + (r.counts[k]||0), 0));
            const grandTotal = rows.reduce((sum, r) => sum + r.total, 0);
            const W_No = 30, W_Name = 60, W_Birth = 75, W_Level = 35, W_Region = 35, W_Total = 40;
            const L_No = 0, L1 = W_No, L2 = L1 + W_Name, L3 = L2 + W_Birth, L4 = L3 + W_Level, L5 = L4 + W_Region;
            const stickColStyle = (left, z) => `position: sticky; left: ${left}px; z-index: ${z};`;
            let theadHTML = '';
            const totalRowHTML = `<tr class="bg-slate-100 font-bold shadow-sm border-b border-slate-200"><td class="py-2 px-1 border-r bg-slate-100" style="${stickColStyle(L_No, 50)}"></td><td class="py-2 px-1 border-r text-center text-slate-700 bg-slate-100" style="${stickColStyle(L1, 50)}">총계</td><td class="py-2 px-1 border-r bg-slate-100" style="${stickColStyle(L2, 50)}"></td><td class="py-2 px-1 border-r bg-slate-100" style="${stickColStyle(L3, 50)}"></td><td class="py-2 px-1 border-r bg-slate-100" style="${stickColStyle(L4, 50)}"></td><td class="py-2 px-1 text-center border-r bg-emerald-100 text-emerald-700" style="${stickColStyle(L5, 50)}">${grandTotal}</td>${serviceHeaders.map(k => `<td class="py-2 px-2 text-center border-r text-slate-700">${colTotals[k]}</td>`).join('')}</tr>`;
            if (type === 'category') {
                theadHTML = `<tr><th class="py-2 px-1 border-b border-r min-w-[${W_No}px] bg-slate-50 text-xs text-center font-bold text-slate-500" style="${stickColStyle(L_No, 50)}">No</th><th class="py-2 px-1 border-b border-r min-w-[${W_Name}px] bg-slate-50 text-xs text-center font-bold text-slate-700" style="${stickColStyle(L1, 50)}">대상자</th><th class="py-2 px-1 border-b border-r min-w-[${W_Birth}px] bg-slate-50 text-xs text-center font-bold text-slate-600" style="${stickColStyle(L2, 50)}">생년월일</th><th class="py-2 px-1 border-b border-r min-w-[${W_Level}px] bg-slate-50 text-xs text-center font-bold text-slate-600" style="${stickColStyle(L3, 50)}">등급</th><th class="py-2 px-1 border-b border-r min-w-[${W_Region}px] bg-slate-50 text-xs text-center font-bold text-slate-600" style="${stickColStyle(L4, 50)}">행정동</th><th class="py-2 px-1 bg-emerald-50 text-emerald-700 border-b border-r min-w-[${W_Total}px] text-xs text-center font-bold" style="${stickColStyle(L5, 50)}">합계</th>${serviceHeaders.map(k => `<th class="py-2 px-2 border-b border-r text-xs text-center text-slate-600 bg-slate-50 whitespace-nowrap">${k}</th>`).join('')}</tr>${totalRowHTML}`;
            } else {
                theadHTML = `<tr><th rowspan="2" class="py-2 px-1 border-b border-r min-w-[${W_No}px] bg-slate-50 z-30 text-xs text-center font-bold text-slate-500" style="${stickColStyle(L_No, 50)}">No</th><th rowspan="2" class="py-2 px-1 border-b border-r min-w-[${W_Name}px] bg-slate-50 z-30 text-xs text-center font-bold text-slate-700" style="${stickColStyle(L1, 50)}">대상자</th><th rowspan="2" class="py-2 px-1 border-b border-r min-w-[${W_Birth}px] bg-slate-50 z-30 text-xs text-center font-bold text-slate-600" style="${stickColStyle(L2, 50)}">생년월일</th><th rowspan="2" class="py-2 px-1 border-b border-r min-w-[${W_Level}px] bg-slate-50 z-30 text-xs text-center font-bold text-slate-600" style="${stickColStyle(L3, 50)}">등급</th><th rowspan="2" class="py-2 px-1 border-b border-r min-w-[${W_Region}px] bg-slate-50 z-30 text-xs text-center font-bold text-slate-600" style="${stickColStyle(L4, 50)}">행정동</th><th rowspan="2" class="py-2 px-1 bg-emerald-50 text-emerald-700 border-b border-r min-w-[${W_Total}px] z-30 text-xs text-center font-bold" style="${stickColStyle(L5, 50)}">합계</th>${orderedCategories.map(cat => `<th colspan="${headerGroups[cat].length}" class="py-1 border-b border-r bg-slate-100 text-center text-xs text-center font-semibold text-slate-600 whitespace-nowrap">${cat}</th>`).join('')}</tr><tr>${orderedCategories.map(cat => headerGroups[cat].map(svc => `<th class="py-1.5 px-2 border-b border-r font-normal text-xs text-center text-slate-500 bg-slate-50 whitespace-nowrap">${svc === '정서지원서비스(안전안부확인)' ? '안전안부확인' : svc}</th>`).join('')).join('')}</tr>${totalRowHTML}`;
            }

            const currentYear = new Date().getFullYear();
            const statsYearOptions = [];
            for (let y = 2020; y <= currentYear + 1; y++) {
                const isSelected = start === `${y}-01-01` && end === `${y}-12-31`;
                statsYearOptions.push(`<option value="${y}" ${isSelected ? 'selected' : ''}>${y}년</option>`);
            }
            statsYearOptions.reverse();
            statsYearOptions.unshift(`<option value="">연도</option>`);

            return `
                <div class="space-y-6 animate-fade-in p-1">
                    <h2 class="text-2xl font-bold text-slate-800 flex items-center">서비스 제공 통계 ${getLoadingTag()}</h2>
                    <div class="sticky top-0 z-50 bg-slate-50 pt-2 pb-2 shadow-sm -mx-1 px-1">
                        <div class="flex flex-col sm:flex-row flex-wrap gap-2 items-center bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                            <div class="flex bg-slate-100 p-1 rounded w-full sm:w-auto justify-center">
                                <button onclick="app.setFilter('stats','type','category')" class="px-3 py-1 rounded text-sm flex-1 sm:flex-none ${type==='category'?'bg-white shadow':''}">분류별</button>
                                <button onclick="app.setFilter('stats','type','detail')" class="px-3 py-1 rounded text-sm flex-1 sm:flex-none ${type==='detail'?'bg-white shadow':''}">상세별</button>
                            </div>
                            
                            <select class="input-field h-9 py-1 px-2 text-sm w-24 font-medium border-slate-200 bg-slate-50 focus:ring-0 focus:border-emerald-500" onchange="app.setStatsYear(this.value)">
                                ${statsYearOptions.join('')}
                            </select>

                            <div class="flex items-center gap-2 p-1 bg-slate-50 rounded-lg border border-slate-200 w-full sm:w-auto">
                                <input id="stats-start" type="date" class="bg-transparent border-0 text-sm focus:ring-0 px-1 py-1 w-[110px]" value="${start}" onchange="app.setFilter('stats','start',this.value, false)" max="9999-12-31">
                                <span class="text-slate-400">~</span>
                                <input id="stats-end" type="date" class="bg-transparent border-0 text-sm focus:ring-0 px-1 py-1 w-[110px]" value="${end}" onchange="app.setFilter('stats','end',this.value, false)" max="9999-12-31">
                                <button onclick="app.render()" class="bg-slate-800 text-white px-3 py-1 rounded-md text-sm font-medium hover:bg-slate-700 transition-colors whitespace-nowrap ml-1">조회</button>
                            </div>

                            <div class="flex w-full sm:w-auto gap-2 flex-1">
                                <input id="stats-search-name" class="input-field w-full sm:w-24 py-1 text-sm" placeholder="이름 (Enter)" value="${name}" onkeydown="if(event.key === 'Enter') app.setFilter('stats','name',this.value)" oninput="if(this.value === '') app.setFilter('stats','name','')">
                                <div class="relative z-30 w-full sm:w-auto">
                                    <button onclick="app.toggleStatsRegionDropdown()" class="input-field py-1.5 px-2 text-sm flex items-center justify-between min-w-[100px] bg-white cursor-pointer text-left h-[30px] w-full sm:w-24"><span class="truncate max-w-[80px] text-slate-700">${region.length > 0 ? (region.length === CONSTANTS.DONG_LIST.length ? '전체 동' : region.join(',')) : '전체 동'}</span><i data-lucide="chevron-down" size="14" class="text-slate-400 ml-2"></i></button>
                                    ${state.ui.statsRegionDropdownOpen ? `<div class="fixed inset-0 z-40" onclick="app.toggleStatsRegionDropdown()"></div><div class="absolute top-full left-0 mt-1 w-40 bg-white border border-slate-200 rounded-lg shadow-xl z-50 p-2 max-h-60 overflow-y-auto animate-fade-in">${CONSTANTS.DONG_LIST.map(d => `<label class="flex items-center gap-2 text-sm p-2 hover:bg-slate-50 rounded cursor-pointer select-none"><input type="checkbox" class="rounded text-emerald-600 focus:ring-emerald-500 w-4 h-4 border-slate-300" ${region.includes(d) ? 'checked' : ''} onchange="app.toggleStatsRegionFilter('${d}')"><span class="text-slate-700">${d}</span></label>`).join('')}</div>` : ''}
                                </div>
                            </div>
                            <button onclick="app.resetFilters('stats')" class="w-full sm:w-auto text-slate-400 hover:text-slate-600 p-2 rounded hover:bg-slate-100 transition-colors flex justify-center items-center flex-shrink-0" title="필터 초기화"><i data-lucide="refresh-cw" size="20"></i></button>
                            <button onclick="app.downloadStatsExcel()" class="w-full sm:w-auto bg-emerald-600 text-white p-2 rounded flex justify-center items-center flex-shrink-0"><i data-lucide="download" size="20"></i></button>
                        </div>
                    </div>
                    <div id="stats-list-container" class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-auto max-h-[600px]">
                        <table class="w-auto text-sm text-left border-collapse whitespace-nowrap">
                            <thead class="sticky-header bg-slate-50 text-slate-600 font-semibold z-20 shadow-sm" style="position: sticky; top: 0; z-index: 40;">${theadHTML}</thead>
                            <tbody class="divide-y divide-slate-100">
                                ${rows.map((r, index) => {

            updateOpts: (el) => {

                const row = el.closest('.svc-row') || el.closest('.batch-svc-row');
                const svcSel = row.querySelector('.svc-sel') || row.querySelector('.batch-svc-sel');
                const svcs = state.services.filter(s => s.category === cat);
                svcSel.innerHTML = svcs.map(s => `<option value="${s.name}">${s.name}</option>`).join('');

            saveLog: async (e, id) => {
                e.preventDefault();
                if (window.currentLogClients.length === 0) return alert("대상자를 최소 1명 이상 선택해주세요.");
                const fd = new FormData(e.target);
                const commonData = Object.fromEntries(fd.entries());
                const rows = document.querySelectorAll('.svc-row');
                const items = [];
                rows.forEach(row => {
                    const cat = row.querySelector('.cat-sel').value;
                    const svc = row.querySelector('.svc-sel').value;
                    const det = row.querySelector('.det-inp').value;
                    if(svc) items.push({ id: Date.now() + Math.random(), category: cat, serviceName: svc, detailNote: det });
                });
                if(items.length === 0) return alert("최소 1개의 서비스를 입력해주세요.");
                commonData.serviceItems = items;
                commonData.serviceCategory = items[0].category;
                commonData.serviceName = items.map(i => i.serviceName).join(', ');

                const isBatchCreate = !id && window.currentLogClients.length > 1;
                if (isBatchCreate) state.isBatching = true;
                const affectedYears = new Set();
                const getYear = (dateStr) => dateStr ? parseInt(dateStr.split('-')[0]) : null;
                if (commonData.date) affectedYears.add(getYear(commonData.date));

                try {
                    if (id) {
                        const clientName = window.currentLogClients[0];
                        const client = state.clients.find(c => c.name === clientName);
                        if (client) commonData.clientId = client.id;
                        commonData.clientName = clientName;
                        const originalLog = state.logs.find(l => l.id === id);
                        if (originalLog && originalLog.date) affectedYears.add(getYear(originalLog.date));
                        await updateDoc(doc(db, "logs", id), commonData);
                        
                        const existingIndex = state.logs.findIndex(l => l.id === id);
                        if (existingIndex !== -1) { state.logs[existingIndex] = { ...state.logs[existingIndex], ...commonData }; } 
                        else { state.logs.push({ id, ...commonData }); }
                        state.logs.sort((a, b) => b.date.localeCompare(a.date));
                        alert("일지가 수정되었습니다.");
                    } else {
                        const newLogs = [];
                        const batchPromises = window.currentLogClients.map(async (clientName) => {
                            const data = { ...commonData, clientName };
                            const client = state.clients.find(c => c.name === clientName);
                            if (client) data.clientId = client.id;
                            data.createdAt = new Date().toISOString();
                            const docRef = await addDoc(collection(db, "logs"), data);
                            newLogs.push({ id: docRef.id, ...data });
                            return docRef;
                        });
                        await Promise.all(batchPromises);
                        if (newLogs.length > 0) mergeLogs(newLogs);
                        alert(`${window.currentLogClients.length}건의 일지가 저장되었습니다.`);
                    }
                    app.closeModal();
                    app.refreshYears(Array.from(affectedYears));
                } catch (err) { 
                    console.error(err);
                    alert("저장 실패: " + err.message); 
                } finally {
                    if (isBatchCreate) state.isBatching = false;
                    if(state.viewMode==='single') { if(state.activeTab === 'logs') updateTabContent('logs'); } else { render(); }
                }
            },

            executeDeleteSelectedLogs: async () => { 
                state.isBatching = true; 
                try { 
                    const promises = Array.from(state.ui.selectedLogIds).map(id => deleteDoc(doc(db, "logs", id))); 
                    await Promise.all(promises); 
                    const affectedYears = new Set();
                    state.logs = state.logs.filter(l => {
                        if (state.ui.selectedLogIds.has(l.id)) {
                            if (l.date) affectedYears.add(parseInt(l.date.split('-')[0]));
                            return false;
                        }
                        return true;
                    });
                    state.ui.selectedLogIds.clear(); 
                    closeDialog(); 
                    app.refreshYears(Array.from(affectedYears));
                } catch (err) { alert("삭제 중 오류가 발생했습니다: " + err.message); } 
                finally { state.isBatching = false; render(); }
            },

            executeBatchEditLogs: async (e) => {
                e.preventDefault();
                const updateData = {};
                if (document.getElementById('chk-date').checked) updateData.date = document.getElementById('val-date').value;
                if (document.getElementById('chk-method').checked) updateData.provideMethod = document.getElementById('val-method').value;
                if (document.getElementById('chk-provider').checked) updateData.provider = document.getElementById('val-provider').value;
                if (document.getElementById('chk-content').checked) updateData.content = document.getElementById('val-content').value;
                
                if (Object.keys(updateData).length === 0) { alert("변경할 항목을 하나 이상 선택해주세요."); return; }
                
                state.isBatching = true; 
                try {
                    const promises = Array.from(state.ui.selectedLogIds).map(id => updateDoc(doc(db, "logs", id), updateData));
                    await Promise.all(promises);
                    const affectedYears = new Set();
                    state.ui.selectedLogIds.forEach(id => {
                        const idx = state.logs.findIndex(l => l.id === id);
                        if (idx !== -1) {
                            if (state.logs[idx].date) affectedYears.add(parseInt(state.logs[idx].date.split('-')[0]));
                            state.logs[idx] = { ...state.logs[idx], ...updateData };
                            if (state.logs[idx].date) affectedYears.add(parseInt(state.logs[idx].date.split('-')[0]));
                        }
                    });
                    state.logs.sort((a, b) => b.date.localeCompare(a.date)); 
                    alert(`${state.ui.selectedLogIds.size}건의 일지가 수정되었습니다.`);
                    state.ui.selectedLogIds.clear();
                    closeModal();
                    app.refreshYears(Array.from(affectedYears));
                } catch (err) { alert("수정 중 오류가 발생했습니다: " + err.message); } 
                finally { state.isBatching = false; render(); }
            },

            refreshYears: async (years) => {
                const uniqueYears = [...new Set(years)].filter(y => y);
                const currentYear = new Date().getFullYear();
                const promises = uniqueYears.map(y => {
                    const yearInt = parseInt(y);
                    if (yearInt !== currentYear && state.loadedYears.has(yearInt)) {
                        return app.loadLogsByYear(yearInt, false, true);
                    }
                    return Promise.resolve();
                });
                await Promise.all(promises);
            },

            // 기타 필요한 함수들 구현
            cancelLoading: () => { state.loadingCancelled = true; app.hideProgress(); },
            showProgress: (title, total) => {
                state.loadingCancelled = false;
                const modal = document.getElementById('progress-modal');
                if (modal) {
                    document.getElementById('progress-title').textContent = title;
                    document.getElementById('progress-total').textContent = total;
                    document.getElementById('progress-current').textContent = '0';
                    document.getElementById('progress-bar').style.width = '0%';
                    document.getElementById('progress-percent').textContent = '0%';
                    modal.classList.remove('hidden');
                }
            },
            updateProgress: (current) => {
                const totalEl = document.getElementById('progress-total');
                if (totalEl) {
                    const total = parseInt(totalEl.textContent) || 1;
                    const percent = Math.min(100, Math.round((current / total) * 100));
                    document.getElementById('progress-current').textContent = current;
                    document.getElementById('progress-bar').style.width = `${percent}%`;
                    document.getElementById('progress-percent').textContent = `${percent}%`;
                }
            },
